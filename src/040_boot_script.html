  function tile(w, h, n, seed, col, dw, dh) { var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" shape-rendering="crispEdges">'; for (var i = 0; i < n; i++) s += '<rect x="' + Math.floor(rnd(i, seed) * w) + '" y="' + Math.floor(rnd(seed, i) * h) + '" width="' + dw + '" height="' + dh + '" fill="' + col + '"/>'; return "url('data:image/svg+xml;utf8," + encodeURIComponent(s + '</svg>').replace(/'/g, '%27') + "')"; }

  fx.innerHTML = fh;
  // ---- підказки до гри (тап — наступна)
  var TIPS = {
    uk: ['Тапни 5 разів по єноту-злодію, щоб він нічого не вкрав.', 'Золотий покупець дає більше за всіх. Встигни його тапнути!', 'Червоний «!» біля магазину — це цирк. Там можна виграти скін чи кристал.', 'Біля дороги дві скриньки: синя для листів, червона для новин від розробників.', 'Кристали часу дає подорож у часі. Витрачай їх у Магазині часу.', 'Скін коштує 50 кристалів, а в цирку його можна виграти.', 'Осколки часу дає подорож у часі, а витрачаються вони в Магазині часу.', 'Пори року відкриються після другої епохи: сезон, Хелловін і час доби.', 'Щодня крутни Барабан фортуни, поки не охолов.', 'Щоб піти в нову епоху, збудуй торговий центр і дочекайся трьох ночей.', 'Завдання дня дає кристал. Заглядай до нього.', 'Дощ вмикає крапелька біля вивіски магазину.', 'Тапни по звірятку: підстрибне й щось скаже.', 'Люки димлять не від пожежі, а для затишку.', 'Телефон гріється? У налаштуваннях можна вимкнути хмари, пару й анімації.', 'Новий маркет будує Бодя: на старий кладуть біле полотно, а далі глянь сам.', 'Чим більше тапів, тим більше монет. Простіше нікуди.'],

function bootDone() {
