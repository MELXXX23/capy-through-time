(function () {

  function sp(a, p, k) { return svg(pad(a), p, k); }
  function rnd(a, b) { var v = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return v - Math.floor(v); }       // детермінований «шум»
  function grid(w, h, fn) { var out = []; for (var y = 0; y < h; y++) { var r = ''; for (var x = 0; x < w; x++) r += fn(x, y) || '.'; out.push(r); } return out; }
  var P = { O: '#302418', w: '#fff4dc', r: '#ef8fa3', y: '#ffe08a', g: '#4f9a63', G: '#2f6b48', b: '#7a4f35', s: '#9fd8f0', K: '#1b1224', Y: '#ffd98a', o: '#e8863c', u: '#8b6bb0', n: '#3d5a8c', e: '#9c9087', f: '#ff5fa2' };

  // ---- сцена: щоразу інша (не та, що була востаннє); ?boot=night|dawn|rain|snow|time — для перегляду
  var SCENES = ['night', 'dawn', 'rain', 'snow', 'time'], scene = 'night';
  (function () {

    if (m && SCENES.indexOf(m[1]) >= 0) { scene = m[1]; return; }

    scene = pool[Math.floor(Math.random() * pool.length)];

  })();
  var SD = {
    night: { bg: 'linear-gradient(#150b2e 0%, #2f1860 38%, #6b2f90 68%, #c25fb5 92%, #ffb0c8 100%)', gr: '#3a2a55', gb: '#b99be0', rd: '21, 11, 46', puff: '#cbb6ee' },

    time: { bg: 'linear-gradient(#12062a 0%, #371660 34%, #7a3a8f 62%, #e29a62 88%, #ffd88a 100%)', gr: '#2a1a40', gb: '#ffd36a', rd: '12, 6, 30', puff: '#ffe08a' }
  }[scene];

  // ---- Капі: піксельна, шість відтінків хутра, чотири кадри бігу, рюкзак; приладдя залежить від сцени (дощовик, шапка із шарфом, окуляри часу)
  var CP = { O: '#2a1d18', h: '#e2b278', l: '#c68c54', b: '#a8703f', s: '#85562f', S: '#5f3d25', c: '#f0d6a6', C: '#d3b27e', k: '#1b1214', w: '#fff4dc', e: '#8a5434', t: '#41aaa2', T: '#2b7b78', u: '#8be0d6', y: '#ffd36a', Y: '#d9a441', n: '#4a78c9', N: '#2f5090', r: '#d9473d', q: '#9a2f2a', W: '#f2f6ff', Z: '#c9d7ee' };
  /*capy-new*/
  function capyFrame(f, acc) {
    var W = 48, H = 32, g = [], x, y;
    for (y = 0; y < H; y++) { g.push([]); for (x = 0; x < W; x++) g[y].push('.'); }

        var dx = (xx + 0.5 - cx) / rx, dy = (yy + 0.5 - cy) / ry;

      }

    function rect(x0, y0, w, h, c) { for (var yy = y0; yy < y0 + h; yy++) for (var xx = x0; xx < x0 + w; xx++) put(xx, yy, c); }

      for (var yy = top; yy < bot; yy++) {
        var shift = Math.round(dx * Math.max(0, yy - top - 2) / (bot - top)), c = near ? (yy < bot - 3 ? 'b' : 's') : (yy < bot - 3 ? 's' : 'S');

    ell(21, 15.5, 18, 8.8, fur);                                                     // тулуб
    function inBody(xx, yy) { var dx = (xx + 0.5 - 21) / 18, dy = (yy + 0.5 - 15.5) / 8.8; return dx * dx + dy * dy <= 1; }
    for (y = 0; y < H; y++) for (x = 4; x < 38; x++) if (inBody(x, y)) {                  // шерсть: рідкі короткі штрихи
      var c0 = g[y][x];
      if (c0 === 'b' && (x * 3 + y * 5) % 19 === 0) { put(x, y, 's'); put(x + 1, y, 's'); }
      else if (c0 === 'l' && (x * 7 + y * 3) % 23 === 0) { put(x, y, 'h'); put(x + 1, y, 'h'); }
    }
    for (x = 11; x < 32; x++) { var by = 15.5 + 8.8 * Math.sqrt(Math.max(0, 1 - Math.pow((x + 0.5 - 21) / 18, 2))); if (x > 9) { put(x, Math.round(by) - 1, 'c'); put(x, Math.round(by) - 2, x % 3 ? 'c' : 'C'); } }   // світла смуга черева
    if (acc === 'rain') { for (y = 0; y < H; y++) for (x = 3; x < 38; x++) { var d = (y + 0.5 - 15.5) / 8.8; if (inBody(x, y) && d < 0.05 && x > 5 && x < 33) g[y][x] = d < -0.5 ? 'y' : 'Y'; } rect(6, 16, 28, 1, 'q'); }   // жовтий дощовик
    ell(37, 13.5, 9, 8.2, furHead); ell(43.5, 16, 4.6, 6.4, furHead);                // голова й морда

    if (acc === 'time') { rect(30, 7, 9, 1, 'Y'); ell(40.5, 8.5, 3.2, 2.8, 'Y'); ell(40.5, 8.5, 2.1, 1.7, 'u'); put(40, 8, 'w'); rect(33, 21, 2, 3, 'Y'); ell(34, 24, 2.6, 2.6, 'Y'); ell(34, 24, 1.6, 1.6, 'w'); put(34, 23, 'k'); put(35, 24, 'k'); }   // окуляри й кишеньковий годинник
    var px = 11, py = 2;                                                             // рюкзак
    outline(px, py + 1, 11, 11); rect(px + 1, py, 9, 1, 'O');
    rect(px, py + 1, 11, 11, 't'); rect(px + 1, py, 9, 1, 't'); rect(px, py + 10, 11, 2, 'T'); rect(px + 10, py + 2, 1, 9, 'T');
    rect(px + 1, py + 2, 4, 2, 'u'); rect(px + 2, py + 6, 7, 4, 'T'); rect(px + 3, py + 7, 5, 2, 't'); put(px + 5, py + 6, 'y');   // відблиск, кишеня, замок
    for (y = 11; y < 19; y++) { put(22 + Math.round((y - 11) * 0.3), y, 'T'); put(23 + Math.round((y - 11) * 0.3), y, 't'); }  // лямка
    put(24, 15, 'y'); put(25, 15, 'y');
    var o = g.map(function (r) { return r.slice(); });                               // контур: темна рамка навколо силуету
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) if (g[y][x] === '.') {
      if ((y > 0 && g[y - 1][x] !== '.') || (y < H - 1 && g[y + 1][x] !== '.') || (x > 0 && g[y][x - 1] !== '.') || (x < W - 1 && g[y][x + 1] !== '.')) o[y][x] = 'O';
    }
    return o.map(function (r) { return r.join(''); });
  }
  var cacc = { night: 'pack', dawn: 'pack', rain: 'rain', snow: 'winter', time: 'time' }[scene];
  var cp = document.getElementById('bootCapy'), frames = [0, 1, 2, 3].map(function (f) { return capyFrame(f, cacc); }), csc = Math.max(3, Math.min(5, Math.floor(Math.min(VW, VH) / 130)));
  cp.innerHTML = [0, 1, 2, 3].map(function (j) { return '<span class="pf" style="--j:' + j + '">' + svg(frames[(4 - j) % 4], CP, csc) + '</span>'; }).join('');

  pf.innerHTML = '<i></i><i></i><i></i><i></i>';

  // ---- місто: два шари з вікнами, що блимають; параметри залежать від сцени
  function city(o) {

      }

  // «Крізь час»: будинки з різних епох поспіль (Відродження → Неон)
  function eraCity(far) {

      }

    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 100" preserveAspectRatio="xMidYMax slice" shape-rendering="crispEdges">' + b + '</svg>';

  var CITY = {
    night: [city({ far: 1, cols: ['#4a2a78'], winFar: '#8a60c0' }), city({ cols: ['#2a1747', '#35205a'], win: ['#ffd98a', '#ff9ad0'], neon: ['#ff5fa2', '#6ee7ff'] })],
