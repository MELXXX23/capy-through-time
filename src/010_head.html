<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1d1a">
<meta name="color-scheme" content="dark">
<script>
(function () {                                         /* програма з головного екрана: клас standalone + «поштовх» viewport-fit на холодному старті (iOS інакше рахує відступи криво) */
  var d = document.documentElement, st = /[?&]standalone=1/.test(location.search) || navigator.standalone || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  if (!st) return; d.classList.add('standalone');
  function inset() { var p = document.createElement('div'); p.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)'; d.appendChild(p); var v = parseFloat(getComputedStyle(p).paddingTop) || 0; d.removeChild(p); return v; }
  var lastGap = -1, ISLAND = { 393: 54, 402: 62, 420: 62, 430: 54, 440: 62 };
  function iosFit() {                                    /* iOS 26: а) системну смугу зверху малює сама система (вікно коротше за екран, env = 0) → висота = реальне вікно; б) вміст під островом, а env = 0 → запасний відступ для інтерфейсу */
    var por = innerHeight > innerWidth, sw = Math.min(screen.width, screen.height), sh = Math.max(screen.width, screen.height), t = por ? inset() : 0, d0 = sh - innerHeight;
    var bar = por && t === 0 && d0 >= 40 && d0 <= 90, sat = (por && t === 0 && !bar && d0 <= 2 && ISLAND[sw]) || 0;
    d.classList.toggle('sysbar', bar); d.classList.toggle('satfix', !!sat);
    d.style.setProperty('--vhpx', innerHeight + 'px'); d.style.setProperty('--sat', sat + 'px'); window.__fit = bar ? 'sysbar' : sat ? 'sat' + sat : '';
    return window.__fit;
  }
  function setGap() {                                    /* порожній низ = на скільки вікно коротше за екран, але не більше за верхній відступ (інакше це не наш випадок) */
    var g = 0; if (innerHeight > innerWidth) { var t = inset(), raw = Math.max(screen.width, screen.height) - innerHeight; if (t > 0 && raw > 0) g = Math.min(raw, t + 2); }
    var fit = iosFit(); d.style.setProperty('--gap', g + 'px'); window.__gap = g; var key = g + fit; if (key !== lastGap) { lastGap = key; window.dispatchEvent(new Event('resize')); }
  }
  window.addEventListener('resize', setGap); window.addEventListener('orientationchange', function () { setTimeout(setGap, 300); });
  var vm = document.querySelector('meta[name="viewport"]'), orig = vm.getAttribute('content'), poke = function () { setGap(); window.dispatchEvent(new Event('resize')); };
  vm.setAttribute('content', orig.replace('viewport-fit=cover', 'viewport-fit=auto'));
  requestAnimationFrame(function () { vm.setAttribute('content', orig); requestAnimationFrame(poke); });
  [150, 600, 1500, 3000].forEach(function (ms) { setTimeout(poke, ms); }); document.addEventListener('DOMContentLoaded', poke);
})();
</script>
