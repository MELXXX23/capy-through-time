// Сніг на даху: верхні два пікселі кожного стовпчика даху стають білими (тонкі стовпчики — прапори, антени — не чіпаємо)
function snowCap(c, maxY) {
  const g = c.getContext('2d');
  const W = c.width, img = g.getImageData(0, 0, W, maxY), d = img.data;
  const has = (x, y) => x >= 0 && x < W && d[(y * W + x) * 4 + 3] > 0;
  for (let x = 0; x < W; x++) {
    let y0 = -1;
    for (let y = 0; y < maxY; y++) if (has(x, y)) { y0 = y; break; }
    if (y0 < 0 || (!has(x - 1, y0) && !has(x + 1, y0))) continue;
    [[255, 244, 220], [253, 229, 200]].forEach((col, k) => { if (y0 + k < maxY) { const i = ((y0 + k) * W + x) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255; } });
  }
  g.putImageData(img, 0, 0);
}

// Будує спрайт магазину рівня level: back — інтер'єр (поверхи, стелажі, ескалатори), front — фасад зі склом.
// Покупці гуляють між ними. Повертає canvas (back+front разом) і геометрію.
function boxG(g, x, y, c1, c2) { R(g, x, y, 14, 4, 'd'); R(g, x + 1, y + 1, 12, 3, 'b'); for (let k = 0; k < 6; k++) { R(g, x + 1 + k * 2, y - 2 + (k % 2), 1, 2, [c1, c2, 'y'][k % 3]); R(g, x + 2 + k * 2, y - 1, 1, 1, 'g'); } }
function buildShopCanvas(level, tiers) {
  glassRects = [];
  const es = epochShopStyle(), look0 = SHOP_LOOK[level - 1];
  const look = Object.assign({}, look0, { trim: es.trim || look0.trim, roof: es.flat ? FLAT_ROOF[level - 1] : (es.roofs ? es.roofs[level - 1] : look0.roof), inner: es.inner || look0.inner });
  const w = look.w, trim = look.trim, F = look.floors.length, up = F - 1;
  const yB = look.top + 25;          // тут закінчується вивіска
  const yG = yB + FLOOR_H * up;      // тут починається нижній поверх (навіс)
  const h = yG + 39;
  const mk = () => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; };
  const back = mk(), front = mk(), canvas = mk();
  const b = back.getContext('2d'), g = front.getContext('2d');
  const innerX = 8, innerW = w - 16;

  // --- геометрія поверхів: top — стеля, fy — підлога (де стоять ноги)
  const floors = look.floors.map((nb, f) => f === 0
    ? { f, bays: nb, top: yG + 11, fy: h - 6 }
    : { f, bays: nb, top: yG - FLOOR_H * f + 3, fy: yG - FLOOR_H * f + FLOOR_H - 3 });
  // --- ескалатори між поверхами (зигзагом: то ліворуч, то праворуч)
  const escalators = [];
  for (let k = 0; k < F - 1; k++) {
    const lo = floors[k], hi = floors[k + 1];
    const rise = lo.fy - hi.fy, run = Math.round(rise * 1.15), left = k % 2 === 0;
    const xLow = left ? innerX + 6 : innerX + innerW - 6;
    escalators.push({ k, lo: k, hi: k + 1, xLow, xHigh: left ? xLow + run : xLow - run, yLow: lo.fy, yHigh: hi.fy, run, rise });
  }
  const doorW = DOOR_WIDTHS[look.door], doorX = Math.round((w - doorW) / 2);
  const door = { x: doorX, w: doorW, y: yG + 13, h: h - 6 - (yG + 13), type: look.door };

  // --- де стоять стелажі на кожному поверсі (в обхід ескалаторів)
  floors.forEach(fl => {
    const blocked = [];
    escalators.forEach(e => {
      const x0 = Math.min(e.xLow, e.xHigh), x1 = Math.max(e.xLow, e.xHigh);
      if (e.lo === fl.f) blocked.push([x0 - 4, x1 + 4]);
      if (e.hi === fl.f) blocked.push(e.xHigh > e.xLow ? [e.xHigh - 14, e.xHigh + 4] : [e.xHigh - 4, e.xHigh + 14]);
    });
    let segs = [[innerX + 2, innerX + innerW - 2]];
    blocked.forEach(bl => {
      const ns = [];
      segs.forEach(sg => { if (bl[1] <= sg[0] || bl[0] >= sg[1]) ns.push(sg); else { if (bl[0] > sg[0]) ns.push([sg[0], bl[0]]); if (bl[1] < sg[1]) ns.push([bl[1], sg[1]]); } });
      segs = ns;
    });
    segs.sort((p, q) => (q[1] - q[0]) - (p[1] - p[0]));
    const seg = segs[0] || [innerX + 2, innerX + innerW - 2];
    fl.seg = seg;
    fl.xs = placeRow(seg[0], seg[1] - seg[0], Array(fl.bays).fill(34));
    fl.shelves = fl.xs.map(x => x + 17);
  });

  /* ========== ІНТЕР'ЄР (back) ========== */
  let bayNo = 0;
  floors.forEach(fl => {
    const hF = fl.fy - fl.top;
    R(b, innerX, fl.top, innerW, hF, look.inner[fl.f % look.inner.length]);        // стіна (кожен поверх свого кольору)
    b.globalAlpha = 0.12; for (let x = innerX + 3; x < innerX + innerW; x += 6) R(b, x, fl.top, 1, hF, 'e'); b.globalAlpha = 1;
    R(b, innerX, fl.top, innerW, 2, 'E'); R(b, innerX, fl.top + 2, innerW, 1, 'e');   // стеля
    for (let x = innerX + 14; x < innerX + innerW - 8; x += 26) { R(b, x, fl.top + 3, 6, 1, 'd'); R(b, x + 1, fl.top + 4, 4, 1, 'y'); }   // лампи
    R(b, innerX, fl.fy, innerW, 3, 'e'); R(b, innerX, fl.fy, innerW, 1, 'E');                                                              // перекриття
    R(b, innerX + 1, fl.fy - 1, innerW - 2, 1, 'r'); for (let x = innerX + 3; x < innerX + innerW - 3; x += 4) R(b, x, fl.fy - 1, 1, 1, 'h');   // килимова доріжка
    fl.xs.forEach(x => drawShelf(b, x, fl.fy - 20, bayNo++, tiers));
    // плакати й рослини у вільних місцях

// Перебудовує спрайт магазину, якщо змінився рівень або наповненість вітрин
function rebuildShop(force) {
  const tiers = state.depts.map(tierOf);
  const sig = state.shopLevel + '|' + tiers.slice(0, state.shopLevel * 2).join('') + '|' + seasonNow() + '|' + (viewEpoch() % EPOCH_SHOP.length);
  if (!force && shop && shop.sig === sig) return false;
  const levelChanged = !shop || shop.level !== state.shopLevel;
  if (levelChanged && shop) ejectInside();
  const geo = buildShopCanvas(state.shopLevel, tiers);
  shop = Object.assign(geo, {
    sig, level: state.shopLevel, doorOpen: shop ? (shop.doorOpen || 0) : 0,
    x: Math.round(LAYOUT.centerX - geo.w / 2),
    y: LAYOUT.curbY - geo.h
  });
  if (levelChanged) {
    if (layoutReady) { groundLayer = buildGroundLayer(); seedBenches(); }       // ліхтарі зсунулись — вікна будинків, дерева й лавки теж
    propsLayer = buildPropsLayer();
    placeShopOverlay();
    updateSignText();
  }
  return levelChanged;
}

// Розміщує HTML-вивіску поверх спрайта магазину (у відсотках — не залежить від масштабу)
function placeShopOverlay() {
  const o = ui.shopOverlay.style;
  o.left = pctX(shop.x) + '%';
  o.top = pctY(shop.y) + '%';
  o.width = (shop.w / view.w * 100) + '%';
  o.height = (shop.h / view.h * 100) + '%';

  sg.left = (shop.sign.x / shop.w * 100) + '%';

  sg.width = (shop.sign.w / shop.w * 100) + '%';
  sg.height = (shop.sign.h / shop.h * 100) + '%';

function updateSignText() {

}

// Підбирає найбільший цілий множник, щоб пікселі лишалися чіткими.
// ПК: сцена на весь вільний простір — на широкому екрані додаються будинки, ліхтарі й бруківка з боків, а на високому — небо зверху.
// Телефон: сцена «наближена» до магазину (так вивіска читається), а вся вулиця ширша за екран — її можна гортати пальцем.
const cam = { pan: 0, goal: 0 };                // зсув камери на телефоні (пікселів сцени) відносно центру вулиці
let layoutReady = false;
function layoutScene() {
  const W0 = CONFIG.SCENE_W, H0 = CONFIG.SCENE_H;
  const dpr = window.devicePixelRatio || 1;
  const mobile = mobileMQ.matches;
  const cs = getComputedStyle(ui.stage);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const availW = ui.stage.clientWidth - padX;
  // на телефоні з відкритим меню сцена займає не більше ~44% висоти, решту віддаємо панелі
  const availH = ui.stage.clientHeight - padY;
  const EB = (mobile && state.settings.panelOpen) ? 0 : CONFIG.EXTRA_BOTTOM;     // додаткова бруківка знизу
  const needY = shop ? Math.max(0, shop.h + 6 - LAYOUT.curbY) : 0;               // скільки неба над «ядром» потрібно високому магазину
  const H1 = H0 + EB + needY;
  let k, offX, cropW;
  if (mobile) {
    offX = CONFIG.MOBILE_PAD;
    const want = shop ? Math.min(W0, Math.max(176, (shop.w + 40) & ~1)) : W0;      // скільки вулиці хочемо показати
    k = Math.max(1, Math.floor(Math.min(availW * dpr / (want * 0.9), availH * dpr / H1)));   // можна обрізати до 10%, щоб збільшити масштаб
    cropW = availW * dpr / k;                                                      // на всю ширину екрана, без смуг по боках
    offX = Math.max(CONFIG.MOBILE_PAD, Math.ceil((cropW - W0) / 2) + 8);
  } else {
    k = Math.max(1, Math.floor(Math.min(availW * dpr / CONFIG.MIN_VIEW_W, availH * dpr / H1)));
    const visW = Math.min(CONFIG.MAX_VIEW_W, availW * dpr / k);                     // скільки пікселів сцени вміщується в ширину (дробове)
    offX = Math.max(0, Math.ceil((visW - W0) / 2), Math.ceil((CONFIG.WORLD_W - W0) / 2));        // вулиця завжди широка, видно лише її частину
    cropW = Math.min(W0 + 2 * offX, visW);
  }
  // Усю висоту займає сцена: зайві рядки діляться між небом зверху (більшість) і бруківкою знизу
  const unit = k / dpr;
  const E = Math.max(0, Math.ceil(availH / unit) - H1);
  const botExtra = Math.min(Math.round(E * 0.4), 70);
  const offY = Math.min(CONFIG.MAX_OFF_Y, E - botExtra) + needY;
  const extraB = EB + botExtra;
  const changed = !layoutReady || offX !== view.offX || offY !== view.offY || extraB !== view.extraB;
  view.offX = offX; view.offY = offY; view.extraB = extraB; view.w = W0 + 2 * offX; view.h = H0 + extraB + offY;
  if (changed) {
    layoutReady = true;
    ui.view.width = view.w; ui.view.height = view.h;
    ctx.imageSmoothingEnabled = false;
    rebuildAllLayers();
  }
  cropW = Math.min(view.w, availW / unit);
  viewCrop = { x: 0, w: cropW };
  sceneUnit = unit;
  const sceneH = Math.min(view.h * unit, availH);
  ui.scene.style.width = availW + 'px';
  ui.scene.style.height = sceneH + 'px';
  ui.world.style.marginTop = (-(view.h * unit - sceneH)) + 'px';                   // зайве небо зверху обрізається, бруківка знизу видна повністю
  ui.scene.style.setProperty('--u', sceneUnit + 'px');
  ui.scene.classList.toggle('pannable', cropW < view.w);
  ui.world.style.width = (view.w * sceneUnit) + 'px';
  ui.world.style.height = (view.h * sceneUnit) + 'px';
  applyCamera();
  if (shop) placeShopOverlay();

}
// Камера: на телефоні показує частину вулиці (за замовчуванням — середину), на ПК видно все
function applyCamera() {
  const base = view.offX + (CONFIG.SCENE_W - viewCrop.w) / 2;
  const x = Math.max(0, Math.min(view.w - viewCrop.w, base + cam.pan));
  cam.pan = x - base;
  viewCrop.x = x;
  ui.world.style.marginLeft = (-x * sceneUnit) + 'px';
  if (ui.panL) { ui.panL.disabled = x <= 0.5; ui.panR.disabled = x >= view.w - viewCrop.w - 0.5; const can = viewCrop.w < view.w; ui.panL.hidden = ui.panR.hidden = !can; }
}
// Плавний рух камери до цілі (стрілки ◀ ▶, клавіші, перетягування)
function panBy(dx) {
  const base = view.offX + (CONFIG.SCENE_W - viewCrop.w) / 2, lo = -base, hi = view.w - viewCrop.w - base;
  cam.goal = Math.max(lo, Math.min(hi, cam.goal + dx));

function updateCamera(dt) {
  if (Math.abs(cam.goal - cam.pan) < 0.2) { if (cam.goal !== cam.pan && !camDragging) { cam.pan = cam.goal; applyCamera(); } return; }
  if (camDragging) { cam.goal = cam.pan; return; }
  cam.pan += (cam.goal - cam.pan) * Math.min(1, dt * 9);

// Підбирає розмір шрифту, щоб напис вмістився на вивісці (в один або два рядки)
function fitSign() {
  const el = ui.sign, span = ui.signText;
  let size = 9;
  el.style.fontSize = (size * sceneUnit) + 'px';
  while (size > 4 && (span.offsetHeight > el.clientHeight + 1 || span.scrollWidth > el.clientWidth + 1)) {
    size -= 0.5;
    el.style.fontSize = (size * sceneUnit) + 'px';
  }
}

// Текст бонусу звірятка на рівні lvl
function bonusText(i, lvl) {
  const b = TEAM[i].bonus;
  const pct = v => Math.round(v * 100);
  switch (b.type) {
    case 'tap': return t('bonus_tap', fmt(1 + b.per * lvl, 2));
    case 'expandCost': return t('bonus_expandCost', pct(Math.min(b.per * lvl, b.cap)));
    case 'offline': return t('bonus_offline', pct(CONFIG.OFFLINE_RATE + b.rate * lvl), CONFIG.OFFLINE_MAX_HOURS + b.hours * lvl);
    case 'thief': return t('bonus_thief', pct(Math.min(b.per * lvl, b.cap)));
    case 'deptIncome': return t('bonus_deptIncome', b.depts.map(d => deptName(d)).join(', '), fmt(1 + b.per * lvl, 2));
    case 'global': return t('bonus_global', fmt(1 + b.per * lvl, 2));
    case 'event': return t('bonus_event', pct(b.per * lvl));
    case 'fix': return t('bonus_fix', pct(b.per * lvl));
    case 'deptCost': return t('bonus_deptCost', pct(Math.min(b.per * lvl, b.cap)));
  }
  return '';
}

// Чи є зараз що купити (для мигаючої точки на вкладці «Відділи»)
function hasAffordableAction() {
  for (let i = 0; i < DEPARTMENTS.length; i++) {
    if (isDeptUnlocked(i) && state.coins >= deptCost(i, 1)) return true;
  }
  const next = nextLevelDef();
  return !!(next && requirementsMet(next) && state.coins >= expandCost(next));
}
// Чи можна зараз найняти або прокачати когось із команди
function hasTeamAction() {
  return TEAM.some((m, i) => isTeamUnlocked(i) && state.team[i] < CONFIG.TEAM_MAX_LEVEL && state.coins >= teamCost(i, state.team[i] + 1));
}

function updateTeamUI() {
  const alertTab = ui.tabs.querySelector('[data-tab="team"]');

  if (ui.paneTeam.hidden) return;

    setText(el.lvl, lvl === 0 ? '' : t('teamLevel', lvl, CONFIG.TEAM_MAX_LEVEL), 'tl' + i + '_' + lvl);
    if (lvl === 0) {
      setText(el.now, t('teamGives', bonusText(i, 1)), 'tw' + i);
      setText(el.next, '', 'tx' + i);
    } else {
      setText(el.now, t('teamNow', bonusText(i, lvl)), 'tw' + i + '_' + lvl);
      setText(el.next, lvl < CONFIG.TEAM_MAX_LEVEL ? t('teamNext', bonusText(i, lvl + 1)) : '', 'tx' + i + '_' + lvl);

      setText(el.btn, t('teamMax'), 'tb' + i);

      const cost = teamCost(i, lvl + 1);

/* ---------- Тости ---------- */
function showToast(text, kind, icon) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  if (icon) { el.appendChild(icon); const tx = document.createElement('span'); tx.textContent = text; el.appendChild(tx); }   // icon — маленький canvas (значок досягнення)
  else el.textContent = text;
  el.style.setProperty('--life', CONFIG.TOAST_SECONDS + 's');
  el.addEventListener('animationend', e => { if (e.animationName === 'toastOut') el.remove(); });
  ui.toasts.appendChild(el);
  while (ui.toasts.childElementCount > CONFIG.MAX_TOASTS) ui.toasts.firstChild.remove();
}

function buyDept(i) {
  if (!isDeptUnlocked(i)) return;
  const n = plannedBuy(i);
  const cost = deptCost(i, n);
  if (!(state.coins >= cost)) return;
  const before = state.depts[i];
  state.coins -= cost;
  state.depts[i] += n;
  state.stats.deptsBought += n;
  CONFIG.MILESTONES.forEach(m => {
    if (before < m && state.depts[i] >= m) { showToast(t('milestoneToast', deptName(i), m), 'good'); playSfx('milestone'); state.stats.milestones++; }
  });
  recalcIncome();
  rebuildShop();
  playSfx('buy');
  updateUI();
}

function expandShop() {
  const next = nextLevelDef();
  if (!next || !requirementsMet(next) || state.coins < expandCost(next)) return;
  const old = { canvas: shop.canvas, x: shop.x, y: shop.y, w: shop.w, h: shop.h };
  state.coins -= expandCost(next);
  state.shopLevel += 1;
  recalcIncome();
  rebuildShop(true);
  startBuild(old);
  playSfx('build');
  updateMusic();
  layoutScene();
  updateUI();
  saveGame();
}

// Рахує, скільки магазин заробив за seconds секунд відсутності, і кладе в «непозбране»
function addOfflineEarnings(seconds) {
  if (!(seconds >= CONFIG.OFFLINE_MIN_SECONDS) || state.cps <= 0) return;
  const capped = Math.min(seconds, offlineMaxHours() * 3600);
  const earned = state.cps * capped * offlineRate();
  if (earned >= 1) {
    state.pendingOffline += earned;
    showOfflineModal();
  }
}
function refreshOfflineModal() {
  ui.modalBig.textContent = t('offlineCoins', fmt(Math.floor(state.pendingOffline)));
}
function showOfflineModal() {
  if (state.pendingOffline < 1) return;
  ui.modalTitle.textContent = t('offlineTitle');
  ui.modalText.textContent = t('offlineText');
  ui.modalBtn.textContent = t('offlineBtn');
  refreshOfflineModal();
  ui.modal.hidden = false;
  ui.modalBtn.focus({ preventScroll: true });
}
function claimOffline() {
  const gain = state.pendingOffline;
  state.coins += gain;
  state.totalEarned += gain;
  state.pendingOffline = 0;
  playSfx('coins');
  ui.modal.hidden = true;
  updateUI();
  saveGame();
}

   ===================================================================== */

const shopAnim = { squash: 0, vel: 0 };          // пружинка стискання магазину
const capyAnim = { blinkIn: 3, blinkLeft: 0 };   // кліпання
const fx = { coins: [], sparks: [], dust: [] };
const clouds = CLOUDS.map(c => ({ ...c }));
// Хмаринки розсипаються по всій ширині й висоті неба (на великому екрані їх більше)
// Погода: восени йде сильний дощ, навесні — короткі легкі дощики (влітку й узимку дощу нема)
const weather = { rain: 0, target: 0, timer: 30 };
const raindrops = [];
function updateWeather(dt) {
  const season = theme.season;
  if (!animOn() || (season !== 'autumn' && season !== 'spring')) weather.target = 0;
  else {
    weather.timer -= dt;
    if (weather.timer <= 0) {
      if (weather.target > 0) { weather.target = 0; weather.timer = season === 'autumn' ? rand(90, 200) : rand(160, 320); }
      else { weather.target = season === 'autumn' ? 1 : 0.5; weather.timer = rand(30, 70); }
    }
  }
  weather.rain += (weather.target - weather.rain) * Math.min(1, dt * 0.6);
  if (weather.rain < 0.02) { raindrops.length = 0; return; }
  const want = Math.round(weather.rain * 120 * (view.w * view.h) / (320 * 180));
  while (raindrops.length < want) raindrops.push({ x: rand(worldL(), worldR() + 30), y: rand(-view.offY, worldB()), vy: rand(130, 175) });

// Хмара-канвас: купчаста / середня / довга, з світлим верхом, тінню знизу й м'яким краєм
const cloudCache = {};
function cloudCanvas(kind, tint) {
  const key = kind + '|' + tint;
  if (cloudCache[key]) return cloudCache[key];
  const T = { '': ['#ffffff', '#f1f4f8', '#d3dde9', '#b3c3d6'], light: ['#f7f9fc', '#e4eaf1', '#c6d1df', '#a8b7cb'], grey: ['#dde1e8', '#bec5d0', '#9ca5b3', '#7e8898'], dark: ['#928fae', '#706d8e', '#55536f', '#3f3d57'] }[tint] || ['#ffffff', '#f1f4f8', '#d3dde9', '#b3c3d6'];
  const puffs = [[[10, 12, 7], [20, 9, 9], [31, 11, 7], [38, 13, 5], [16, 14, 7], [26, 14, 8]], [[8, 9, 6], [16, 7, 7], [24, 9, 6], [12, 10, 6], [20, 11, 5]], [[8, 6, 5], [16, 5, 6], [26, 6, 6], [36, 6, 5], [44, 7, 4], [20, 7, 6], [32, 7, 5]]][kind % 3];
  const W = [46, 32, 52][kind % 3], H = [22, 16, 13][kind % 3], c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const inCl = (x, y) => puffs.some(p => (x - p[0]) * (x - p[0]) + (y - p[1]) * (y - p[1]) * 1.15 <= p[2] * p[2]) && y <= H - 3;
  let top = H, bot = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (inCl(x, y)) { top = Math.min(top, y); bot = Math.max(bot, y); }
  for (let y = top; y <= bot; y++) for (let x = 0; x < W; x++) {
    if (!inCl(x, y)) continue;
    const v = (y - top) / Math.max(1, bot - top), n = ((x * 7 + y * 13) % 5 === 0) ? 0.08 : 0, lit = ((x * 3 + y * 5) & 1) ? 0.05 : 0;
    const t = v + n - lit * (1 - v) - (inCl(x - 2, y - 2) ? 0 : 0.18);
    g.fillStyle = t < 0.18 ? T[0] : t < 0.52 ? T[1] : t < 0.8 ? T[2] : T[3];
    g.fillRect(x, y, 1, 1);
  }
  for (let x = 0; x < W; x++) { const yb = bot; if (inCl(x, yb) && x % 2) { g.fillStyle = T[3]; g.fillRect(x, yb + 1, 1, 1); } }       // розмитий нижній край
  return (cloudCache[key] = c);
}
// Хмар по сезонах: влітку мало, навесні помірно, восени й узимку багато й сірі, на Хелловін темні
const CLOUD_BY_SEASON = { spring: [1.0, 'white'], summer: [0.35, 'white'], autumn: [1.8, 'grey'], winter: [1.5, 'light'], halloween: [1.4, 'dark'] };

let build = null;                                 // триває будівництво нового рівня

function rand(a, b) { return a + Math.random() * (b - a); }

// Масштаб магазину для поточного стискання (використовується і в canvas, і для вивіски)

/* ---------- Команда на сцені ---------- */
const actors = [];               // звірятка, що працюють на вулиці

// Де стоїть звірятко: Голка — біля дверей, решта — на фіксованих місцях
function actorHome(m) {
  const s = m.spot;
  if (s.x === null) return shop.x + shop.door.x + shop.door.w / 2 + s.dx;
  // решта звіряток розставлені по всій ширині вулиці (f — частка ширини); на широкому екрані відстані більші
  const sc = Math.max(1, Math.min(1.3, (view.w - 36) / 284));

}
// Узгоджує список звіряток на сцені зі станом (хто найнятий — той на вулиці)
function syncActors() {
  TEAM.forEach((m, i) => {
    const has = state.team[i] > 0;
    const idx = actors.findIndex(a => a.i === i);
    if (has && idx < 0) actors.push({ i, x: actorHome(m), y: m.spot.y, dir: 1, t: rand(0, 10), hop: 0, moving: false, rest: 0, restIn: rand(CONFIG.SUMMER_REST_MIN, CONFIG.SUMMER_REST_MAX) });

}
function updateActors(dt) {
  actors.forEach(a => {
    const s = TEAM[a.i].spot;
    a.t += dt;
    a.hop = Math.max(0, a.hop - dt * 4);
    // влітку звірятка час від часу зупиняються перепочити й попити водички
    if (theme.season === 'summer' && animOn()) {
      if (a.rest > 0) { a.rest -= dt; if (a.rest <= 0) a.restIn = rand(CONFIG.SUMMER_REST_MIN, CONFIG.SUMMER_REST_MAX); }
      else {
        a.restIn -= dt;
        if (a.restIn <= 0) {
          a.rest = CONFIG.SUMMER_REST_SECONDS;
          if (Math.random() < 0.6 && Object.keys(bubbleEls).length < 1) showBubble('t' + a.i, t('summerSay_' + Math.floor(Math.random() * 5)), a.x, a.y - 19, () => ({ x: a.x, y: a.y - 19 }));
        }
      }
    } else a.rest = 0;
    if (a.rest > 0) { a.moving = false; return; }
    if (s.x === null) { a.moving = false; a.x = actorHome(TEAM[a.i]); return; }         // касир стоїть біля каси
    if (!a.mode) { a.mode = 'idle'; a.wait = rand(0.3, 3); a.speed = rand(11, 22); }
    const bottom = roadFloor();
    if (a.mode === 'sit') {                            // сидить на лавочці
      a.moving = false;
      a.sitT -= dt;
      if (a.sitT <= 0) { if (a.bench) a.bench.slots[a.slot].who = null; a.bench = null; a.mode = 'idle'; a.wait = rand(1, 3); a.y = Math.min(bottom, a.y + 6); }
      return;
    }
    if (a.y > bottom) a.y = bottom;
    if (a.mode === 'idle') {                           // стоїть і розглядається
      a.moving = false;
      a.wait -= dt;
      if (a.wait > 0) return;
      a.speed = rand(11, 22);
      const slots = [];
      benches.forEach(bn => bn.slots.forEach((sl, k) => { if (sl.who === null) slots.push([bn, k]); }));
      if (slots.length && Math.random() < 0.22) {      // іноді йде посидіти на лавочці
        const pick = slots[Math.floor(Math.random() * slots.length)];
        pick[0].slots[pick[1]].who = a.i; a.bench = pick[0]; a.slot = pick[1];
        a.mode = 'toBench'; a.tx = pick[0].x + pick[0].slots[pick[1]].dx; a.ty = pick[0].y + 3;

        a.mode = 'sit'; a.sitT = rand(9, 16); a.y = a.bench.y - 3; a.dir = a.x < LAYOUT.centerX ? 1 : -1;
        if (Object.keys(bubbleEls).length < 1) showBubble('t' + a.i, t('team_' + TEAM[a.i].id + '_sit_' + Math.floor(Math.random() * 2)), a.x, a.y - 19, () => ({ x: a.x, y: a.y - 19 }));
      } else { a.mode = 'idle'; a.wait = rand(1, 5); }
    } else {

  }
}

// Випадкова точка, куди піти: недалеко від свого місця, але подалі від інших звіряток
function pickWanderTarget(a) {
  const home = actorHome(TEAM[a.i]);
  let best = null, bestD = -1;
  for (let k = 0; k < 6; k++) {
    const tx = Math.max(worldL() + 14, Math.min(worldR() - 14, home + rand(-85, 85)));
    const ty = rand(LAYOUT.streetTop + 8, roadFloor());
    let md = 1e9;
    actors.forEach(o => {
      if (o === a) return;
      const walking = o.mode === 'walk' || o.mode === 'toBench';
      md = Math.min(md, Math.hypot(tx - (walking ? o.tx : o.x), (ty - (walking ? o.ty : o.y)) * 1.6));
    });
    if (md > bestD) { bestD = md; best = [tx, ty]; }
  }
  a.tx = best[0]; a.ty = best[1];
}

// Межі видимої частини сцени для бульбашок (у координатах сцени)
function bubbleBounds() {
  const sceneH = parseFloat(ui.scene.style.height) || (view.h * sceneUnit);
  const top = -view.offY + (view.h * sceneUnit - sceneH) / sceneUnit;
  const tb = document.getElementById("topbar"), tbh = tb ? tb.getBoundingClientRect().bottom : 0;                        // верхню панель з рахунком бульбашки не перекривають
  return { l: visL(), r: visR(), t: top + 2, b: top + sceneH / sceneUnit, il: visL() + 38 / sceneUnit, ir: visR() - 40 / sceneUnit, it: top + (tbh + 6) / sceneUnit };

// Ставить бульбашку так, щоб вона повністю лишалась у кадрі
function placeBubble(el, x, y) {
  const bb = bubbleBounds(), hw = el.offsetWidth / 2 / sceneUnit + 2, hh = el.offsetHeight / sceneUnit + 6;
  const cx = Math.max(bb.il + hw, Math.min(bb.ir - hw, x)), cy = Math.max(bb.it + hh, Math.min(bb.b - 4, y));
  el._cx = cx;
  el.style.left = pctX(cx) + '%';
  el.style.top = pctY(cy) + '%';
}
function dropBubble(key) { const el = bubbleEls[key]; if (el) { clearTimeout(el._timer); el.remove(); delete bubbleEls[key]; } }
// Бульбашка з фразою над головою (key — щоб у одного персонажа була лише одна). Якщо той, хто говорить, поза видимою частиною вулиці — фраза не з'являється
function showBubble(key, text, x, y, follow) {

  if (x < bb.l - 2 || x > bb.r + 2) { dropBubble(key); return; }
  let el = bubbleEls[key];
  if (!el) {
    el = document.createElement('div');
    el.className = 'bubble';
    ui.bubbles.appendChild(el);
    bubbleEls[key] = el;
  }
  el.textContent = text;
  playSfx('pip');
  el._follow = follow || null;                  // follow — функція, що дає поточне місце того, хто говорить
  el._x = x; el._y = Math.max(24, y);
  placeBubble(el, x, el._y);
  Object.keys(bubbleEls).forEach(k => {                  // нова бульбашка прибирає старі поруч, щоб репліки не налазили одна на одну
    const o = bubbleEls[k];
    if (k !== key && Math.abs(o._cx - el._cx) < 58) dropBubble(k);
  });
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';

}
// Бульбашки йдуть слідом за звірятком, яке говорить
function updateBubbles() {
  const bb = bubbleBounds();
  Object.keys(bubbleEls).forEach(k => {
    const el = bubbleEls[k];
    if (!el._follow) { if (el._x < bb.l - 2 || el._x > bb.r + 2) { dropBubble(k); return; } placeBubble(el, el._x, el._y); return; }
    const p = el._follow();
    if (p.x < bb.l - 2 || p.x > bb.r + 2) { dropBubble(k); return; }        // звірятко пішло за межі кадру — репліка зникає
    placeBubble(el, p.x, Math.max(24, p.y));
  });
}

  if (!(state.coins >= cost)) return;

  state.stats.teamMaxLevel = Math.max(state.stats.teamMaxLevel, lvl + 1);

/* ---------- Покупці ---------- */
function customerTarget() {
  if (state.cps <= 0) return 1;
  return Math.min(CONFIG.MAX_CUSTOMERS, 2 + Math.floor(Math.log10(state.cps + 1) * 1.5));
}
function spawnCustomer() {
  const fromLeft = Math.random() < 0.5;
  const lane = rand(LAYOUT.lane.min, Math.max(LAYOUT.lane.min + 4, roadFloor()));
  const goesShopping = Math.random() < 0.7;
  const c = {
    type: CUSTOMER_TYPES[Math.floor(Math.random() * CUSTOMER_TYPES.length)],
    x: fromLeft ? worldL() - 14 : worldR() + 14,
    y: lane, lane,
    dir: fromLeft ? 1 : -1,
    speed: rand(16, 26),
    anim: rand(0, 2),
    mode: goesShopping ? 'toDoor' : 'pass',
    doorX: shop.x + shop.door.x + shop.door.w / 2 + rand(-4, 4),
    passTo: fromLeft ? worldR() + 16 : worldL() - 16,
    alpha: 1, t: 0, stay: 0,
    bag: null
  };
  customers.push(c);
}
function updateCustomers(dt) {
  customerTimer -= dt;
  if (customerTimer <= 0) {
    customerTimer = rand(1.2, 3.2);
    if (customers.length < customerTarget()) spawnCustomer();
  }
  for (let i = customers.length - 1; i >= 0; i--) {
    const c = customers[i];
    c.anim += dt;
    const step = c.speed * dt;
    switch (c.mode) {
      case 'pass':
        c.x += c.dir * step;
        if ((c.dir > 0 && c.x >= c.passTo) || (c.dir < 0 && c.x <= c.passTo)) customers.splice(i, 1);
        break;
      case 'toDoor': {
        const dx = c.doorX - c.x;
        if (Math.abs(dx) <= step) { c.x = c.doorX; c.mode = 'toEntrance'; }
        else { c.dir = Math.sign(dx); c.x += c.dir * step; }
        break;
      }
      case 'toEntrance':
        c.y -= step * 0.8;
        if (c.y <= LAYOUT.curbY + 5) { c.y = LAYOUT.curbY + 5; c.mode = 'entering'; c.t = 0; }
        break;
      case 'entering': {                                  // заходить у відчинені розсувні двері
        const dr = doorWorld();
        c.x += (dr.cx - c.x) * Math.min(1, dt * 4);
        c.y -= step * 0.8;
        if (c.y <= LAYOUT.curbY - 1) c.inside = true;
        if (c.y <= dr.baseY) { c.y = dr.baseY; c.mode = 'inside'; c.f = 0; c.esc = null; c.plan = planVisit(); c.dwell = 0; }
        break;
      }
      case 'inside': updateInside(c, dt); break;
      case 'exiting':
        c.y += step * 0.8;
        if (c.y >= LAYOUT.curbY + 1) c.inside = false;
        if (c.y >= c.lane) { c.y = c.lane; c.mode = c.homeDoor ? 'toHome' : 'pass'; c.alpha = 1; c.inside = false; }
        break;
      case 'toHome': {                                    // несе покупки додому: йде до дверей будиночка
        const dx = c.homeDoor.x - c.x;
        if (Math.abs(dx) <= step) { c.x = c.homeDoor.x; c.mode = 'homeUp'; }
        else { c.dir = Math.sign(dx); c.x += c.dir * step; }
        break;
      }
      case 'homeUp':
        c.y -= step * 0.8;
        if (c.y <= c.homeDoor.y + 1) { c.y = c.homeDoor.y + 1; c.mode = 'homeIn'; c.t = 0; }
        break;
      case 'homeIn':                                      // двері відчиняються, звірятко зникає всередині
        c.t += dt; c.alpha = Math.max(0, 1 - c.t / 0.6);
        if (c.t >= 0.6) { c.mode = 'homeStay'; c.t = 0; c.stay = rand(7, 16); c.inside = true; c.bag = null; }
        break;
      case 'homeStay':
        c.t += dt;
        if (c.t >= c.stay) { c.mode = 'homeOut'; c.t = 0; c.inside = false; c.alpha = 0; }
        break;
      case 'homeOut':
        c.t += dt; c.alpha = Math.min(1, c.t / 0.6);
        if (c.t >= 0.6) { c.mode = 'homeDown'; c.alpha = 1; }
        break;
      case 'homeDown':
        c.y += step * 0.8;
        if (c.y >= c.lane) {
          c.y = c.lane; c.homeDoor = null; c.dir = c.x < shop.x + shop.w / 2 ? 1 : -1;
          if (Math.random() < 0.5) { c.mode = 'toDoor'; c.doorX = shop.x + shop.door.x + shop.door.w / 2 + rand(-4, 4); }
          else { c.mode = 'pass'; c.passTo = c.dir > 0 ? worldR() + 16 : worldL() - 16; }
        }
        break;
    }
  }
  // автоматичні двері роз'їжджаються, коли хтось підходить або виходить
  if (shop && shop.door) {
    const dr = doorWorld();
    const want = customers.some(c => (c.mode === 'toEntrance' || c.mode === 'entering' || c.mode === 'exiting' || (c.mode === 'inside' && c.f === 0 && !c.esc)) &&
      Math.abs(c.x - dr.cx) < 34 && c.y > dr.baseY - 6 && c.y < LAYOUT.curbY + 14);
    shop.doorOpen = (shop.doorOpen || 0) + ((want ? 1 : 0) - (shop.doorOpen || 0)) * Math.min(1, dt * 7);
  }
}
// Де в світі двері магазину (центр) і підлога першого поверху
function doorWorld() { return { cx: shop.x + shop.door.x + shop.door.w / 2, baseY: shop.y + shop.floors[0].fy }; }
// План візиту: 1–3 зупинки біля стелажів (часто на верхніх поверхах), наприкінці — вихід через двері
function planVisit() {
  const F = shop.floors.length, stops = [], dr = doorWorld();
  const n = 1 + Math.floor(Math.random() * Math.min(3, F + 1));
  for (let i = 0; i < n; i++) {
    let f = Math.random() < 0.35 ? 0 : Math.floor(Math.random() * F);
    if (F > 1 && i === 0 && Math.random() < 0.6) f = 1 + Math.floor(Math.random() * (F - 1));
    const sh = shop.floors[f].shelves;
    stops.push({ f, x: shop.x + sh[Math.floor(Math.random() * sh.length)] + rand(-8, 8), t: rand(1.2, 3) });
  }
  stops.push({ f: 0, x: dr.cx + rand(-5, 5), exit: true });
  return stops;
}
// Рух усередині: до стелажа, на інший поверх ескалатором, до виходу
function updateInside(c, dt) {
  const step = c.speed * dt;
  if (c.esc) {                                                  // їде ескалатором
    const e = shop.escalators[c.esc.k], len = Math.hypot(e.run, e.rise);
    c.esc.u += c.esc.dir * (c.speed * 0.9 * dt) / len;
    c.moving = false;
    c.dir = c.esc.dir * (e.xHigh > e.xLow ? 1 : -1);
    if (c.esc.u >= 1) { c.f = e.hi; c.esc = null; c.x = shop.x + e.xHigh; c.y = shop.y + e.yHigh; return; }
    if (c.esc.u <= 0) { c.f = e.lo; c.esc = null; c.x = shop.x + e.xLow; c.y = shop.y + e.yLow; return; }
    c.x = shop.x + e.xLow + (e.xHigh - e.xLow) * c.esc.u;
    c.y = shop.y + e.yLow - e.rise * c.esc.u;
    return;
  }
  const stop = c.plan[0];
  c.y = shop.y + shop.floors[c.f].fy;
  if (!stop) { c.mode = 'exiting'; return; }
  if (c.f !== stop.f) {                                         // треба на інший поверх — іде до ескалатора
    const upDir = stop.f > c.f ? 1 : -1, e = shop.escalators[upDir > 0 ? c.f : c.f - 1];
    const ex = shop.x + (upDir > 0 ? e.xLow : e.xHigh), dx = ex - c.x;
    if (Math.abs(dx) <= step) { c.x = ex; c.esc = { k: e.k, dir: upDir, u: upDir > 0 ? 0 : 1 }; }
    else { c.x += Math.sign(dx) * step; c.dir = Math.sign(dx); c.moving = true; }
    return;
  }
  const dx = stop.x - c.x;
  if (Math.abs(dx) > step) { c.x += Math.sign(dx) * step; c.dir = Math.sign(dx); c.moving = true; return; }
  c.x = stop.x; c.moving = false;
  if (stop.exit) {                                              // виходить із покупками
    c.mode = 'exiting'; c.t = 0;
    c.bag = BAG_COLORS[Math.floor(Math.random() * BAG_COLORS.length)]; c.bagKind = Math.floor(Math.random() * 3);
    c.dir = Math.random() < 0.5 ? 1 : -1;
    c.passTo = c.dir > 0 ? worldR() + 16 : worldL() - 16;
    c.homeDoor = pickHome(c);                                   // частина покупців іде зі своїми пакетами додому
    return;
  }
  c.dwell += dt;
  if (c.dwell >= stop.t) { c.plan.shift(); c.dwell = 0; }
}
// Чи піде покупець додому: обираємо двері будиночка недалеко від магазину (не за самим магазином)
function pickHome(c) {
  if (!houseDoors.length || Math.random() > 0.55) return null;
  const cx = shop.x + shop.w / 2;
  const cand = houseDoors.filter(d => Math.abs(d.x - cx) > shop.w / 2 + 8 && Math.abs(d.x - c.x) < 340);
  return cand.length ? cand[Math.floor(Math.random() * cand.length)] : null;
}
// Коли магазин перебудовується, усі, хто всередині, виходять надвір
function ejectInside() {
  if (!shop || !shop.door) return;
  const dr = doorWorld();
  customers.forEach(c => {
    if (!(c.inside || c.mode === 'inside' || c.mode === 'entering')) return;
    c.inside = false; c.mode = 'exiting'; c.x = dr.cx; c.y = LAYOUT.curbY + 2; c.alpha = 1; c.esc = null;
    c.bag = BAG_COLORS[Math.floor(Math.random() * BAG_COLORS.length)]; c.bagKind = Math.floor(Math.random() * 3);
    c.dir = Math.random() < 0.5 ? 1 : -1;
    c.passTo = c.dir > 0 ? worldR() + 16 : worldL() - 16;
  });
}

function updateAnimations(dt) {
  // пружина: стискання → повернення з легким відскоком
  const steps = Math.max(1, Math.ceil(dt / 0.01));
  const h = dt / steps;
  for (let i = 0; i < steps; i++) {
    shopAnim.vel += (-300 * shopAnim.squash - 17 * shopAnim.vel) * h;
    shopAnim.squash += shopAnim.vel * h;
  }
  if (Math.abs(shopAnim.squash) < 0.001 && Math.abs(shopAnim.vel) < 0.01) { shopAnim.squash = 0; shopAnim.vel = 0; }

  // Капі кліпає
  if (capyAnim.blinkLeft > 0) {
    capyAnim.blinkLeft -= dt;
  } else {
    capyAnim.blinkIn -= dt;
    if (capyAnim.blinkIn <= 0) { capyAnim.blinkLeft = 0.14; capyAnim.blinkIn = rand(2.5, 5.5); }
  }

  // хмаринки пливуть
  clouds.forEach(c => {
    c.x += c.speed * dt;
    if (c.x > worldR() + 4) c.x = worldL() - 28;
  });

  if (build) updateBuild(dt);
  updateCustomers(dt);
  updateActors(dt);
  updateCameos(dt);
  updateGuests(dt);

  // монетки: політ, гравітація, зникання
  for (let i = fx.coins.length - 1; i >= 0; i--) {
    const p = fx.coins[i];
    p.age += dt;
    p.vy += 320 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.age >= p.life) fx.coins.splice(i, 1);
  }
  for (let i = fx.sparks.length - 1; i >= 0; i--) {
    const p = fx.sparks[i];
    p.age += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.age >= p.life) fx.sparks.splice(i, 1);
  }
  for (let i = fx.dust.length - 1; i >= 0; i--) {
    const p = fx.dust[i];
    p.age += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.age >= p.life) fx.dust.splice(i, 1);
  }
}

  }
  for (let i = 0; i < 5; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(30, 70);
    fx.sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, age: 0, life: rand(0.25, 0.4), col: i % 2 ? 'y' : 'w' });
  }
  while (fx.coins.length > CONFIG.MAX_COIN_PARTICLES) fx.coins.shift();
  while (fx.sparks.length > CONFIG.MAX_SPARKS) fx.sparks.shift();
}

// Текст «+1», що піднімається і зникає (HTML-елемент — чіткий піксельний шрифт)

/* =====================================================================
   ЗВУК: 8-бітна музика та ефекти через Web Audio API (без аудіофайлів)
   ===================================================================== */

const audio = {
  ctx: null, master: null, musicGain: null, sfxGain: null, noiseBuf: null,
  track: null, timer: null, lastTick: 0, lastTyping: 0
};
const MUSIC_PARSED = {};      // розібрані мелодії: канали з подіями { step, len, tok }
const NOTE_INDEX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

// «C#5» → частота в герцах
function noteFreq(name) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(name);
  if (!m) return 0;
  let n = NOTE_INDEX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  n += (Number(m[3]) + 1) * 12;               // номер MIDI
  return 440 * Math.pow(2, (n - 69) / 12);
}

// Розбирає мелодії з масивів нот у списки подій
function parseMusic() {
  Object.keys(MUSIC).forEach(id => {
    const def = MUSIC[id];
    const channels = def.channels.map(ch => {
      const text = Array.isArray(ch.pattern) ? ch.pattern.join(' ') : ch.pattern;
      let step = 0;
      const events = text.trim().split(/\s+/).map(tok => {
        const [name, len] = tok.split(':');
        const e = { step, len: parseInt(len, 10) || 1, tok: name };
        step += e.len;
        return e;
      });
      return { wave: ch.wave, vol: ch.vol, events, total: step };
    });
    const total = channels[0].total;
    channels.forEach(c => { if (c.total !== total) console.warn('Музика «' + id + '»: канал має ' + c.total + ' кроків замість ' + total); });
    MUSIC_PARSED[id] = { bpm: def.bpm, channels, total };
  });
}

/* ---------- Запуск і гучність ---------- */
// Браузери дозволяють звук лише після першого дотику — тому створюємо контекст у відповідь на жест
function initAudio() {
  if (audio.ctx) { resumeAudio(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const ac = new AC();
    audio.ctx = ac;
    const comp = ac.createDynamicsCompressor();
    audio.master = ac.createGain();
    audio.musicGain = ac.createGain();
    audio.sfxGain = ac.createGain();
    audio.musicGain.connect(audio.master);
    audio.sfxGain.connect(audio.master);
    audio.master.connect(comp);
    comp.connect(ac.destination);
    // білий шум для ударних (1 секунда, перевикористовується)
    const buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    audio.noiseBuf = buf;
    applyVolumes(true);
    audio.timer = setInterval(tickMusic, 40);
    resumeAudio();
    updateMusic();
  } catch (e) {
    audio.ctx = null;
  }
}
// «Будить» звук на телефонах: iPhone і Android засинають, поки не було дотику; resume() треба викликати прямо в обробнику дотику.
// Тихий порожній звук допомагає iOS остаточно «розблокувати» аудіо.
function unlockSilent() {
  try {
    const ac = audio.ctx, src = ac.createBufferSource();
    src.buffer = ac.createBuffer(1, 1, 22050);
    src.connect(ac.destination);
    src.start(0);
  } catch (e) { /* нічого */ }
}
function resumeAudio() {
  const ac = audio.ctx;
  if (!ac || document.hidden) return;
  if (ac.state !== 'running') {
    const p = ac.resume();
    if (p && p.then) p.then(unlockSilent, () => {});
  }
  unlockSilent();
}
function applyVolumes(instant) {
  if (!audio.ctx) return;
  const s = state.settings;
  const m = s.muted ? 0 : s.musicVol * 0.55, f = s.muted ? 0 : s.sfxVol * 0.9;
  const now = audio.ctx.currentTime;
  if (instant) { audio.musicGain.gain.value = m; audio.sfxGain.gain.value = f; return; }
  audio.musicGain.gain.setTargetAtTime(m, now, 0.05);
  audio.sfxGain.gain.setTargetAtTime(f, now, 0.05);
}

/* ---------- Інструменти ---------- */
// Одна нота з простою обвідною (щоб не клацало)
function tone(dest, wave, f0, t0, dur, vol, f1) {
  const ac = audio.ctx;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = wave;
  osc.frequency.setValueAtTime(f0, t0);
  if (f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.006);
  g.gain.setValueAtTime(vol, t0 + Math.max(0.007, dur * 0.65));
  g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(dest);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}
// Сплеск шуму крізь фільтр — ударні, плюскіт, цокіт молотка
function noiseHit(dest, t0, dur, vol, filterType, freq) {
  const ac = audio.ctx;
  const src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = audio.noiseBuf;
  flt.type = filterType; flt.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(flt); flt.connect(g); g.connect(dest);
  src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.02);
}
function drum(dest, kind, t0, vol) {
  if (kind === 'k') tone(dest, 'triangle', 150, t0, 0.13, vol * 1.6, 45);
  else if (kind === 's') noiseHit(dest, t0, 0.12, vol, 'bandpass', 1800);
  else if (kind === 'h') noiseHit(dest, t0, 0.05, vol * 0.7, 'highpass', 7000);
}

/* ---------- Музика ---------- */
function desiredTrack() {
  if (theme.holiday && theme.holiday.music && MUSIC[theme.holiday.music]) return theme.holiday.music;
  if (theme.season === 'halloween' && MUSIC.halloween) return 'halloween';
  const st = MUSIC_STYLES[state.settings.musicStyle] || MUSIC_STYLES[0];
  return st.levels[Math.min(st.levels.length, state.shopLevel) - 1] + '#' + (viewEpoch() % EPOCH_MUSIC.length);
}
// Перемикає мелодію плавно: стара стихає, нова наростає
function updateMusic() {
  if (!audio.ctx) return;
  const id = desiredTrack();
  if (audio.track && audio.track.id === id) return;
  const ac = audio.ctx, now = ac.currentTime;
  if (audio.track) {
    const old = audio.track;
    old.stopped = true;
    old.gain.gain.cancelScheduledValues(now);
    old.gain.gain.setTargetAtTime(0, now, 0.15);
    setTimeout(() => { try { old.gain.disconnect(); } catch (e) { /* нічого */ } }, 1600);
  }
  const gain = ac.createGain();
  gain.gain.value = 0;
  gain.gain.setTargetAtTime(1, now + 0.1, 0.25);
  gain.connect(audio.musicGain);
  const def = trackDef(id);
  audio.track = { id, def, gain, start: now + 0.15, pos: def.channels.map(() => ({ idx: 0, loop: 0 })), stopped: false };
}
// Планувальник: заздалегідь ставить у чергу ноти, що зазвучать найближчими 0,25 с
function tickMusic() {
  const ac = audio.ctx, tr = audio.track;
  if (!ac || !tr || tr.stopped || ac.state !== 'running') return;
  const stepDur = 60 / tr.def.bpm / 4;
  const horizon = ac.currentTime + 0.25;
  tr.def.channels.forEach((ch, c) => {
    const p = tr.pos[c];
    for (let guard = 0; guard < 64; guard++) {
      const ev = ch.events[p.idx];
      const t = tr.start + (p.loop * ch.total + ev.step) * stepDur;
      if (t > horizon) break;
      if (t > ac.currentTime - 0.05 && ev.tok !== '.') {
        if (ch.wave === 'noise') drum(tr.gain, ev.tok, t, ch.vol);
        else tone(tr.gain, ch.wave, noteFreq(ev.tok), t, ev.len * stepDur * 0.92, ch.vol);
      }
      p.idx++;
      if (p.idx >= ch.events.length) { p.idx = 0; p.loop++; }
    }
  });
}

/* ---------- Звукові ефекти ---------- */
// мелодія з пар [нота, тривалість]
function melody(wave, notes, vol, gap = 0) {
  const ac = audio.ctx;
  let t = ac.currentTime + 0.01;
  notes.forEach(([n, d]) => {
    if (n !== '.') tone(audio.sfxGain, wave, typeof n === 'number' ? n : noteFreq(n), t, d * 0.95, vol);
    t += d + gap;
  });
}
const SFX_TAP_VARIANTS = [['E6', 'B6'], ['G6', 'C7'], ['D6', 'A6'], ['F#6', 'C#7'], ['A5', 'E6']];

  milestone() { melody('triangle', [['G5', 0.07], ['C6', 0.07], ['E6', 0.07], ['G6', 0.25]], 0.4); },
  circusMarch() {   // восьмитактний цирковий марш: мелодія на квадраті, бас «ум-па»

    const MEL = [[['C5', .5], ['E5', .5], ['G5', 1], ['E5', .5], ['C5', .5], ['G4', 1]], [['F5', .5], ['A5', .5], ['C6', 1], ['A5', .5], ['F5', .5], ['C5', 1]], [['G5', .5], ['B5', .5], ['D6', 1], ['B5', .5], ['G5', .5], ['D5', 1]], [['E5', 1], ['C5', 1], ['G4', 1], ['C5', 1]], [['C5', .5], ['E5', .5], ['G5', 1], ['C6', 1], ['G5', 1]], [['A5', .5], ['G5', .5], ['F5', 1], ['A5', .5], ['C6', .5], ['A5', 1]], [['B5', .5], ['A5', .5], ['G5', 1], ['F5', .5], ['D5', .5], ['G5', 1]], [['E5', .5], ['D5', .5], ['C5', 1], ['C5', 2]]];
    const BASS = [['C3', 'G3', 'E3'], ['F2', 'C3', 'A2'], ['G2', 'D3', 'B2'], ['C3', 'G3', 'E3'], ['C3', 'G3', 'E3'], ['F2', 'C3', 'A2'], ['G2', 'D3', 'B2'], ['C3', 'G3', 'E3']];

    });
  },
  sale()      { melody('square', [['G5', 0.07], ['C6', 0.07], ['E6', 0.07], ['G6', 0.07], ['E6', 0.07], ['G6', 0.25]], 0.2); },
  build() {   // стукіт молотків під час будівництва
    const ac = audio.ctx, t0 = ac.currentTime + 0.05;

      const t = t0 + i * 0.27;

    melody('triangle', [['C4', 0.1], ['E4', 0.1], ['G4', 0.1], ['C5', 0.22], ['G4', 0.1], ['C5', 0.1], ['E5', 0.1], ['G5', 0.55]], 0.35);
  },

  },
  raccoon()   { melody('triangle', [['E5', 0.12], ['D#5', 0.12], ['D5', 0.12], ['C#5', 0.12], ['C5', 0.25]], 0.5); },
  hit() {
    tone(audio.sfxGain, 'square', 760, audio.ctx.currentTime, 0.14, 0.25, 280);
    noiseHit(audio.sfxGain, audio.ctx.currentTime, 0.06, 0.3, 'bandpass', 2500);

  caught() {

    for (let i = 0; i < 6; i++) tone(audio.sfxGain, 'square', 1500 + i * 130, audio.ctx.currentTime + 0.5 + i * 0.05, 0.04, 0.12);

  leak() {    // кап-кап

  jackpot() {

  typing(pitch) { tone(audio.sfxGain, 'square', pitch || 500, audio.ctx.currentTime, 0.03, 0.1); },

  warp() {   // годинник цокає назад: тіки з нижчим тоном і довшими паузами, потім дзвін
    const t0 = audio.ctx.currentTime;

};
function playSfx(name, ...args) {
  const ac = audio.ctx;
  if (!ac || ac.state !== 'running' || state.settings.muted || state.settings.sfxVol <= 0) return;

}
// Висота «друкування» залежить від того, хто говорить
function speakerPitch(sp) {
  let h = 0;
  for (let i = 0; i < sp.length; i++) h += sp.charCodeAt(i);
  return sp === 'narr' ? 330 : 360 + (h % 7) * 55;
}

function themesUnlocked() { return state.epoch >= 2; }
function seasonNow() {
  const s = state.settings.season;
  if (s !== 'auto' && SEASONS.includes(s) && themesUnlocked()) return s;
  const forced = forcedHoliday();
  if (forced === 'halloween') return 'halloween';
  if (forced === 'newyear') return 'winter';
  const d = new Date();
  if (inRange(d, [10, 20], [11, 2])) return 'halloween';
  const m = d.getMonth() + 1;
  return m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer' : m >= 9 && m <= 11 ? 'autumn' : 'winter';
}
function isDebug() {
  try { return new URLSearchParams(location.search).get('debug') === '1' || window.__debug === true; } catch (e) { return false; }
}
function currentEpoch() { return EPOCHS[viewEpoch() % EPOCHS.length]; }

function resetEpochFx() {
  stars.length = 0; leaves.length = 0;
  const e = currentEpoch();
  const area = (view.w * view.h) / (320 * 180);        // на великій сцені — більше зірок і листя
  if (e.decor.includes('stars')) for (let i = 0; i < Math.round(26 * area); i++) stars.push({ x: rand(worldL(), worldR()), y: rand(2 - view.offY, 70), ph: rand(0, 6.3) });
  if ((e.decor.includes('leaves') || theme.decor.has('autumnleaves')) && animOn()) for (let i = 0; i < Math.round(24 * area); i++) leaves.push({ x: rand(worldL(), worldR()), y: rand(-view.offY, worldB()), vy: rand(10, 20), ph: rand(0, 6.3), col: ['o', 'r', 'h'][i % 3] });
  if (theme.decor.has('petals') && animOn()) for (let i = 0; i < Math.round(26 * area); i++) leaves.push({ x: rand(worldL(), worldR()), y: rand(-view.offY, worldB()), vy: rand(7, 13), ph: rand(0, 6.3), col: ['p', 'q', 'p'][i % 3], petal: true });
}
function drawEpochBack() {
  stars.forEach(s => { if (Math.sin(animClock * 2 + s.ph) > -0.4) R(ctx, Math.round(s.x), Math.round(s.y), 1, 1, 'w'); });
}
function drawEpochFront() {
  if (!animOn()) return;
  leaves.forEach(l => R(ctx, Math.round(l.x + Math.sin(animClock * 1.5 + l.ph) * 6), Math.round(l.y), l.petal ? 3 : 2, l.petal ? 2 : 1, l.col));

function updateEpochFx(dt) {
  if (!animOn()) return;
  leaves.forEach(l => { l.y += l.vy * dt; l.x += 6 * dt; if (l.y > worldB()) { l.y = -view.offY - 2; l.x = rand(worldL(), worldR()); } if (l.x > worldR()) l.x = worldL(); });
}

const EPOCH_ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'];
// Емблема епохи 32×32 пікселі
function drawEpochEmblem(g, i) {
  g.clearRect(0, 0, 32, 32);
  switch (i) {
    case 0:                                            // лавровий вінок і колона
      for (let a = 0.35; a < 2 * Math.PI - 0.35; a += 0.28) { const x = Math.round(16 + Math.cos(a + 1.57) * 13), y = Math.round(16 + Math.sin(a + 1.57) * 13); R(g, x - 1, y - 1, 3, 2, Math.floor(a * 3.5) % 2 ? 'g' : 'G'); }
      R(g, 14, 27, 5, 3, 'r'); R(g, 10, 8, 12, 3, 'w'); R(g, 9, 9, 2, 3, 'h'); R(g, 21, 9, 2, 3, 'h'); R(g, 12, 11, 8, 14, 'W'); R(g, 14, 11, 1, 14, 'e'); R(g, 17, 11, 1, 14, 'e'); R(g, 10, 25, 12, 2, 'w');
      break;
    case 1:                                            // вінілова платівка
      disc(g, 16, 16, 14, 'k'); disc(g, 16, 16, 11, 'd'); disc(g, 16, 16, 10, 'k'); disc(g, 16, 16, 7, 'd'); disc(g, 16, 16, 6, 'k'); disc(g, 16, 16, 4, 'r'); R(g, 16, 16, 1, 1, 'w');
      R(g, 8, 7, 5, 1, 'w'); R(g, 7, 8, 1, 3, 'w'); lineG(g, 29, 3, 20, 15, 'e'); R(g, 28, 2, 3, 3, 'E');
      break;
    case 2:                                            // дзеркальна куля
      R(g, 16, 0, 1, 3, 'd');
      for (let y = 3; y < 30; y++) for (let x = 3; x < 30; x++) { const dx = x - 16.5, dy = y - 16.5; if (dx * dx + dy * dy <= 182) R(g, x, y, 1, 1, ((Math.floor(x / 3) + Math.floor(y / 3)) % 2) ? 'a' : 'S'); }
      [[8, 9], [20, 8], [12, 20], [22, 21], [16, 14]].forEach((p, k) => { R(g, p[0], p[1], 1, 1, 'w'); R(g, p[0] - 1, p[1], 3, 1, k % 2 ? 'y' : 'f'); R(g, p[0], p[1] - 1, 1, 3, k % 2 ? 'y' : 'f'); });
      break;
    case 3:                                            // прибулець з аркадної гри
      ['..#.....#..', '...#...#...', '..#######..', '.##.###.##.', '###########', '#.#######.#', '#.#.....#.#', '...##.##...'].forEach((row, ry) => { for (let rx = 0; rx < 11; rx++) if (row[rx] === '#') R(g, 5 + rx * 2, 8 + ry * 2, 2, 2, 'T'); });
      R(g, 11, 14, 2, 2, 'k'); R(g, 19, 14, 2, 2, 'k'); R(g, 5, 28, 22, 1, 'f');
      break;
    case 4:                                            // глобус зі стрічкою-орбітою
      disc(g, 16, 16, 12, 's'); disc(g, 12, 12, 5, 'g'); disc(g, 21, 18, 6, 'g'); disc(g, 14, 24, 3, 'g'); R(g, 9, 8, 4, 1, 'S');
      for (let a = 0; a < 6.28; a += 0.12) R(g, Math.round(16 + Math.cos(a) * 15), Math.round(16 + Math.sin(a) * 5 + Math.cos(a) * 3), 1, 1, 'n');
      break;
    case 5:                                            // листок і сонце
      for (let y = 4; y < 29; y++) { const half = Math.round(11 * Math.sin(Math.PI * (y - 4) / 25)); R(g, 16 - half, y, half * 2 + 1, 1, y % 5 < 3 ? 'g' : 'G'); R(g, 16, y, 1, 1, 'G'); }
      R(g, 15, 28, 3, 3, 'b'); disc(g, 26, 6, 4, 'y'); R(g, 24, 4, 2, 1, 'w');
      break;
    case 6:                                            // ракета серед зір
      R(g, 13, 7, 6, 15, 'w'); R(g, 15, 2, 2, 2, 'r'); R(g, 14, 4, 4, 3, 'r'); R(g, 9, 16, 4, 8, 'r'); R(g, 19, 16, 4, 8, 'r'); disc(g, 16, 12, 2, 's');
      R(g, 14, 22, 4, 4, 'o'); R(g, 15, 26, 2, 4, 'y');
      [[4, 5], [27, 8], [6, 24], [26, 22], [24, 2]].forEach(p => { R(g, p[0], p[1], 1, 1, 'y'); R(g, p[0] - 1, p[1], 3, 1, 'w'); R(g, p[0], p[1] - 1, 1, 3, 'w'); });
      break;
    default:                                           // неонова блискавка в колі
      disc(g, 16, 16, 15, 'f'); disc(g, 16, 16, 13, 'z');
      [[5, 17, 20], [6, 16, 19], [7, 15, 18], [8, 14, 17], [9, 13, 16], [10, 12, 15], [11, 11, 14], [12, 10, 19], [13, 16, 19], [14, 15, 18], [15, 14, 17], [16, 13, 16], [17, 12, 15], [18, 11, 14], [19, 10, 13], [20, 9, 12]]
        .forEach(r => { R(g, r[1] + 1, r[0] + 1, r[2] - r[1] + 1, 1, 'T'); R(g, r[1], r[0], r[2] - r[1] + 1, 1, 'y'); });
  }
}
function finishEpochIntro() {
  epochIntro.timers.forEach(clearTimeout); epochIntro.timers = [];
  ui.epochIntro.hidden = true; ui.epochIntro.classList.remove('out');
  epochIntro.active = false;

// Показує анімацію приходу епохи №epochNo (0 — Відродження); done — що зробити після неї
function playEpochIntro(epochNo, done) {
  if (epochIntro.active) return;
  epochIntro.active = true; epochIntro.done = done || null; epochIntro.startedAt = performance.now();
  state.epochIntroSeen = epochNo; saveGame();
  const i = epochNo % EPOCHS.length, ep = EPOCHS[i], box = ui.epochIntro;
  box.style.setProperty('--ei1', PALETTE[ep.sky[0]]); box.style.setProperty('--ei2', PALETTE[ep.sky[1]]); box.style.setProperty('--ei3', PALETTE[ep.sky[2]]);
  drawEpochEmblem(ui.eiEmblem.getContext('2d'), i);
  ui.eiNum.textContent = t('epochLabel', EPOCH_ROMAN[i]);
  ui.eiTitle.textContent = '';
  ui.eiSub.textContent = t('epochSub_' + i);
  ui.eiSparks.innerHTML = '';
  for (let k = 0; k < 30; k++) {                       // іскорки, що злітають угору
    const sp = document.createElement('i');
    sp.className = 'ei-spark';
    sp.style.left = (Math.random() * 100) + '%';
    sp.style.background = PALETTE[['w', 'y', 'f', 'T', 'h'][k % 5]];
    sp.style.animationDuration = (3 + Math.random() * 3) + 's';
    sp.style.animationDelay = (Math.random() * 4) + 's';
    ui.eiSparks.appendChild(sp);
  }
  box.hidden = false; box.classList.remove('out');
  playSfx('levelup');
  const full = t('epochTitle_' + i);
  for (let k = 1; k <= full.length; k++) epochIntro.timers.push(setTimeout(() => { ui.eiTitle.textContent = full.slice(0, k); if (k % 3 === 0) playSfx('pip'); }, 1900 + k * 65));
  epochIntro.timers.push(setTimeout(() => box.classList.add('out'), 6200));
  epochIntro.timers.push(setTimeout(finishEpochIntro, 6900));
}

/* ---------- Кристали і подорож ---------- */
// Кристали за подорож: floor(√(зароблено за цей забіг / X)), плюс бонус майстерні
function prestigeGain() {
  const run = Math.max(0, state.totalEarned - state.runStartEarned);
  return Math.floor(Math.sqrt(run / CONFIG.CRYSTAL_DIVISOR) * (1 + 0.1 * wsLevel('crystalGain')));
}
function startLevel() { return Math.min(LEVELS.length, 1 + wsLevel('headStart')); }

function askTimeTravel() {
  const gain = prestigeGain();
  if (!state.story.finale || gain < 1) return;
  askConfirm(t('warpConfirmTitle'), t('warpConfirmText', gain), t('warpConfirmYes'), startWarp);
}
function startWarp() {
  if (warp) return;
  warp = { t: 0, applied: false };
  ui.timeWarp.hidden = false;
  ui.timeWarp.style.opacity = '0';
  document.body.classList.add('warping');
  closeWheel();
  playSfx('warp');
}
function updateWarp(dt) {
  if (!warp) return;
  warp.t += dt;
  const k = warp.t / CONFIG.WARP_SECONDS;
  ui.timeWarp.style.opacity = String(k < 0.25 ? k / 0.25 : k < 0.75 ? 1 : Math.max(0, (1 - k) / 0.25));
  ui.warpClock.style.transform = 'rotate(' + (-k * 1260) + 'deg) scale(' + (1 + Math.sin(k * Math.PI) * 1.2) + ')';
  if (!warp.applied && k >= 0.5) { warp.applied = true; applyTimeTravel(); }
  if (k >= 1) {
    warp = null;
    ui.timeWarp.hidden = true;
    document.body.classList.remove('warping');
    // новий сюжетний фрагмент епохи
    const storyNo = ((state.epoch - 1) % EPOCHS.length) + 1, label = (state.epoch % EPOCHS.length) + 1;
    playEpochIntro(state.epoch, () => { if (!state.story.guests[storyNo - 1]) startDialogue(storyNo, false, 'ep', label); });      // історія — лише вперше, далі тільки заставка
  }
}
// Власне скидання: лишаються кристали, досягнення, статистика, прочитані глави й покращення майстерні
function applyTimeTravel() {
  syncEpochEarned();
  const gain = prestigeGain();
  state.crystals += gain;
  state.crystalsTotal += gain;
  state.stats.timeTravels++;
  state.stats.maxLevel = Math.max(state.stats.maxLevel, state.shopLevel);
  state.epoch++;
  state.activeEpoch = -1;
  state.team.forEach((lv, i) => { if (lv > 0) state.teamKnown[i] = 1; });      // звірятка лишаються знайомими
  state.coins = CONFIG.START_COINS;
  state.depts = DEPARTMENTS.map(() => 0);
  state.team = TEAM.map(() => 0);
  state.shopLevel = startLevel();
  state.runStartEarned = state.totalEarned;
  state.events.incomeBoostUntil = 0; state.events.tapBoostUntil = 0;
  trouble = null; puddles.length = 0; sackDrop = null;
  build = null; ui.shopOverlay.style.visibility = '';
  actors.length = 0;
  customers.length = 0;
  recalcIncome();
  rebuildEpochLayers();
  resetEpochFx();
  rebuildShop(true);
  syncActors();
  syncGuests();
  layoutScene();
  updateMusic();
  updateUI();
  checkAchievements();
  saveGame();
}

/* ---------- Майстерня часу ---------- */
function wsEffectText(id, L) {
  switch (id) {
    case 'headStart':    return t('wsEff_headStart', t('levelName_' + Math.min(LEVELS.length, 1 + L)));
    case 'autoTap':      return t('wsEff_autoTap', L);
    case 'offlineHours': return t('wsEff_offlineHours', CONFIG.OFFLINE_MAX_HOURS + 4 * L);
    case 'offlineRate':  return t('wsEff_offlineRate', Math.round((CONFIG.OFFLINE_RATE + 0.1 * L) * 100));
    case 'salesFreq':    return t('wsEff_salesFreq', Math.round((1 / (1 - 0.1 * L) - 1) * 100));
    case 'saleLength':   return t('wsEff_saleLength', CONFIG.SALE_SECONDS + 30 * L);
    case 'wheelFast':    return t('wsEff_wheelFast', WHEEL_HOURS_BY_LEVEL[L] || 24);
    case 'thiefLess':    return t('wsEff_thiefLess', Math.round(L * 20));
    case 'cheaperDepts': return t('wsEff_cheaperDepts', Math.round(L * 3));
    case 'cheaperTeam':  return t('wsEff_cheaperTeam', Math.round(L * 5));
    case 'tapPower':     return t('wsEff_tapPower', fmt(1 + 0.5 * L, 2));
    case 'crystalGain':  return t('wsEff_crystalGain', Math.round(L * 10));
  }
  return '';
}
function buildWorkshop() {
  ui.wsList.innerHTML = '';
  WORKSHOP.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'card ws-card';
    card.innerHTML = '<div class="dept-head"><span class="dept-icon"></span><span class="dept-name"></span><span class="dept-count"></span></div>' +
      '<div class="ws-now"></div><div class="ws-next"></div><button type="button" class="btn wide go"></button>';
    card.querySelector('.dept-icon').textContent = w.icon;
    card.querySelector('button').addEventListener('click', () => buyWorkshop(i));
    ui.wsList.appendChild(card);
    wsEls[i] = { name: card.querySelector('.dept-name'), lvl: card.querySelector('.dept-count'), now: card.querySelector('.ws-now'), next: card.querySelector('.ws-next'), btn: card.querySelector('button') };
  });
}
function buyWorkshop(i) {
  const w = WORKSHOP[i], L = state.ws[i];
  if (L >= w.costs.length || state.crystals < w.costs[L]) return;
  state.crystals -= w.costs[L];
  state.ws[i]++;
  recalcIncome();
  playSfx('upgrade');
  showToast(t('ws_' + w.id) + ' ' + state.ws[i] + '/' + w.costs.length, 'good');
  updateUI();
  saveGame();
}
function updateWorkshopUI() {
  if (ui.paneWorkshop.hidden) return;
  setText(ui.wsInfo, t('wsCrystals', fmt(state.crystals)), 'wsInfo');
  setText(ui.wsBonus, t('wsBonus', fmt(state.crystalsTotal), fmt(crystalMult(), 2)), 'wsBonus');

function parseImportCode(text) {
  const m = /^CTT\d+:([A-Za-z0-9+/=]+)$/.exec(text.replace(/\s+/g, ''));
  if (!m) throw new Error('format');
  const data = migrateSave(JSON.parse(decodeURIComponent(escape(atob(m[1])))));
  if (!data.state || typeof data.state !== 'object') throw new Error('state');
  return data;
}

// Поточна тема сцени: яке свято зараз і які прикраси вмикати
const theme = { key: null, season: 'spring', layerSeason: null, holiday: null, blackFriday: false, decor: new Set(), skyTint: null, lights: ['r', 'y', 'g', 'n', 'p'] };
const snow = [];             // сніжинки
const bats = [];             // кажани
const puddles = [];          // калюжі від протікання даху

/* ---------- Свята ---------- */
function inRange(d, from, to) {
  const v = (d.getMonth() + 1) * 100 + d.getDate();
  const a = from[0] * 100 + from[1], b = to[0] * 100 + to[1];
  return a <= b ? (v >= a && v <= b) : (v >= a || v <= b);   // діапазон може перетинати новий рік
}
function isBlackFriday(d) { return d.getMonth() === 10 && d.getDay() === 5 && d.getDate() + 7 > 30; }
function forcedHoliday() {
  try { return new URLSearchParams(location.search).get('holiday'); } catch (e) { return null; }
}
// Оновлює тему за датою пристрою (або за ?holiday=...). Повертає true, якщо тема змінилась
function updateTheme() {
  const now = new Date(), forced = forcedHoliday();
  let holiday = null, bf = false;
  if (forced === 'blackfriday') bf = true;
  else if (forced) holiday = HOLIDAYS.find(h => h.id === forced) || null;
  else { holiday = HOLIDAYS.find(h => inRange(now, h.from, h.to)) || null; bf = isBlackFriday(now); }
  const season = seasonNow();
  const auto = state.settings.season === 'auto';
  const key = (holiday ? holiday.id : '') + '|' + bf + '|' + (viewEpoch() % EPOCHS.length) + '|' + season;
  if (theme.key === key) return false;
  theme.key = key;
  if (holiday) state.stats.holidaysSeen |= (1 << HOLIDAYS.indexOf(holiday));
  if (bf) state.stats.holidaysSeen |= 1 << 15;
  theme.holiday = holiday;
  theme.blackFriday = bf;
  // прикраси свята за датою малюємо лише в режимі «Авто»; якщо пору року обрано вручну — діють її прикраси
  const seasonDecor = { winter: ['snow'], halloween: ['pumpkins', 'bats', 'witchhats'], autumn: ['autumnleaves'], spring: ['petals'], summer: ['heat'] }[season] || [];
  theme.decor = new Set([...(auto && holiday ? holiday.decor : []), ...seasonDecor, ...(bf ? BLACK_FRIDAY.decor : [])]);
  theme.skyTint = bf ? BLACK_FRIDAY.skyTint : (auto && holiday && holiday.skyTint) || (season === 'halloween' ? { color: 'n', alpha: 0.5 } : currentEpoch().tint);
  theme.lights = bf ? BLACK_FRIDAY.lights : ((holiday && auto && holiday.lights) || (season === 'halloween' ? ['o', 'u'] : ['r', 'y', 'g', 'n', 'p']));
  theme.season = season;
  if (theme.layerSeason !== season) {
    theme.layerSeason = season;
    weather.target = 0; weather.timer = rand(12, 35);
    if (layoutReady) { groundLayer = buildGroundLayer(); seedClouds(); seedBirds(); seedBenches(); if (shop) rebuildShop(true); }
  }   // дерева, сніг на дахах, прикраси Хелловіну
  resetEpochFx();
  resetThemeFx();
  return true;
}
// Сніг і кажани розсипаються по всій ширині світу
function resetThemeFx() {
  snow.length = 0; bats.length = 0;
  const area = (view.w * view.h) / (320 * 180);
  if (theme.decor.has('snow') && animOn()) for (let i = 0; i < Math.round(CONFIG.SNOW_FLAKES * area); i++) snow.push({ x: rand(worldL(), worldR()), y: rand(-view.offY, worldB()), vy: rand(10, 26), ph: rand(0, 6.3), big: Math.random() < 0.25 });
  if (theme.decor.has('bats') && animOn()) for (let i = 0; i < Math.round(CONFIG.BATS * Math.max(1, view.w / 320)); i++) bats.push({ x: rand(worldL(), worldR()), y: rand(14 - view.offY, 70), vx: rand(14, 26) * (Math.random() < 0.5 ? -1 : 1), ph: rand(0, 6.3) });
}
function holidayGlobalBonus() { return theme.holiday && theme.holiday.bonus.global ? theme.holiday.bonus.global : 0; }
function holidayDeptBonus(i) { return (theme.holiday && theme.holiday.bonus.depts && theme.holiday.bonus.depts[i]) || 0; }
function secondsToMidnight() {
  const n = new Date();
  return Math.max(0, (new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1) - n) / 1000);
}
function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return h > 0 ? h + ':' + p(m) + ':' + p(s) : m + ':' + p(s);
}

function scheduleSale(now) { state.events.nextSale = now + rand(CONFIG.SALE_MIN_MINUTES, CONFIG.SALE_MAX_MINUTES) * 60000 * (1 - 0.1 * wsLevel('salesFreq')); }

/* ---------- Неприємності ---------- */
function scheduleTrouble(now) { state.events.nextTrouble = now + rand(CONFIG.TROUBLE_MIN_MINUTES, CONFIG.TROUBLE_MAX_MINUTES) * 60000; }
function startTrouble(now) {
  scheduleTrouble(now);
  if (Math.random() < 0.5) {
    // єнот; Тоня може прогнати його ще біля входу
    if (Math.random() > thiefChanceMult()) {
      const a = actors.find(x => TEAM[x.i].id === 'tonya');

}

// --- Протікання даху ---
function startLeak() {
  trouble = { type: 'leak', kriaTimer: 0 };
  puddles.length = 0;
  const minX = visL() + 24, maxX = visR() - 24;
  for (let tries = 0; puddles.length < CONFIG.LEAK_PUDDLES && tries < 100; tries++) {
    const p = { x: Math.round(rand(minX, maxX)), y: Math.round(rand(150, worldB() - 6)), age: rand(0, 3) };
    if (puddles.every(q => Math.abs(q.x - p.x) > 26 || Math.abs(q.y - p.y) > 9)) puddles.push(p);
  }
  recalcIncome();
  playSfx('leak');
  showToast(t('leakStart'), 'bad');
}
function removePuddle(i) {
  const p = puddles.splice(i, 1)[0];
  state.stats.puddlesFixed++;
  playSfx('splash');
  for (let k = 0; k < 6; k++) fx.sparks.push({ x: p.x, y: p.y, vx: rand(-40, 40), vy: rand(-60, -20), age: 0, life: rand(0.3, 0.5), col: k % 2 ? 's' : 'S' });
  if (!puddles.length) {
    trouble = null;
    recalcIncome();
    showToast(t('leakFixed'), 'good');
  }
  updateUI();
}

// --- Єнот Шнирь: міні-гра «Впіймай єнота» ---
function startRaccoon() {
  const minX = visL() + 24, maxX = visR() - 24;
  const side = Math.random() < 0.5 ? minX : maxX;
  trouble = { type: 'thief', state: 'run', t: 0, hits: 0, x: side, y: rand(148, worldB() - 8), vx: 0, vy: 0, dirT: 0, flash: 0, hop: 0, exitDir: 1 };
  showBubble('shnyr', t('shnyrSay_' + Math.floor(Math.random() * 3)), trouble.x, trouble.y - 19);
  playSfx('raccoon');
  showToast(t('raccoonStart'), 'bad');
}
function hitRaccoon() {
  const r = trouble;
  r.hits++; r.flash = 0.35; r.hop = 1;
  playSfx('hit');
  for (let k = 0; k < 6; k++) fx.sparks.push({ x: r.x, y: r.y - 8, vx: rand(-60, 60), vy: rand(-70, 10), age: 0, life: rand(0.25, 0.4), col: k % 2 ? 'y' : 'w' });
  showBubble('shnyr', t('shnyrOuch_' + Math.floor(Math.random() * 3)), r.x, r.y - 19);
  r.dirT = 0;     // одразу змінює напрям
  if (r.hits >= CONFIG.RACCOON_HITS) winRaccoon();
}
function winRaccoon() {
  const r = trouble;
  const reward = Math.floor(Math.max(tapValue() * 10, state.cps * CONFIG.RACCOON_REWARD_MINUTES * 60));
  state.coins += reward; state.totalEarned += reward;
  state.stats.raccoonsCaught++;
  for (let k = 0; k < 12; k++) fx.coins.push({ x: r.x + rand(-8, 8), y: r.y - 10, vx: rand(-60, 60), vy: rand(-140, -60), age: 0, life: rand(0.8, 1.2), spin: rand(0, 4) });
  sackDrop = { x: r.x + 6, y: r.y, t: 0 };
  r.state = 'exit'; r.exitDir = r.x < 160 ? -1 : 1; r.hasSack = false;
  playSfx('caught');
  showToast(t('raccoonWin', fmt(reward)), 'big');
  updateUI();
}
function loseRaccoon() {
  const r = trouble;
  const steal = state.story.shnyrFriend ? 0 : Math.floor(Math.min(state.coins * CONFIG.RACCOON_STEAL_SHARE * (1 - 0.2 * wsLevel('thiefLess')), state.cps * CONFIG.RACCOON_STEAL_MAX_MINUTES * 60));
  if (steal >= 1) {
    state.coins -= steal;
    state.stats.raccoonsLost++;
    playSfx('lose');
    showToast(t('raccoonLose', fmt(steal)), 'bad');
  } else {
    showToast(t('raccoonFriend'), 'good');
  }
  r.state = 'exit'; r.exitDir = r.x < 160 ? -1 : 1; r.hasSack = true;
  updateUI();
}
function updateTrouble(dt) {
  if (sackDrop) { sackDrop.t += dt; if (sackDrop.t > 3) sackDrop = null; }
  if (!trouble) return;
  puddles.forEach(p => { p.age += dt; });
  if (trouble.type === 'leak') {
    // Качка Кря сама прибирає калюжі
    if (teamLevelOf('kria') > 0 && puddles.length) {
      trouble.kriaTimer += dt;
      if (trouble.kriaTimer >= CONFIG.KRIA_CLEAN_SECONDS / fixSpeedMult()) {
        trouble.kriaTimer = 0;
        const a = actors.find(x => TEAM[x.i].id === 'kria');
        if (a) { a.hop = 1; showBubble('t' + a.i, t('kriaMop'), a.x, a.y - 19, () => ({ x: a.x, y: a.y - 19 })); }
        removePuddle(Math.floor(Math.random() * puddles.length));
      }
    }
    return;
  }
  const r = trouble;
  r.t += dt;
  r.flash = Math.max(0, r.flash - dt);
  r.hop = Math.max(0, r.hop - dt * 4);
  if (r.state === 'run') {
    r.dirT -= dt;
    if (r.dirT <= 0) {
      r.dirT = rand(0.5, 1.1);
      const a = rand(0, Math.PI * 2), sp = 55 + r.hits * 16;
      r.vx = Math.cos(a) * sp; r.vy = Math.sin(a) * sp * 0.5;
    }
    r.x += r.vx * dt; r.y += r.vy * dt;
    const minX = visL() + 14, maxX = visR() - 14;
    if (r.x < minX) { r.x = minX; r.vx = Math.abs(r.vx); }
    if (r.x > maxX) { r.x = maxX; r.vx = -Math.abs(r.vx); }
    if (r.y < 146) { r.y = 146; r.vy = Math.abs(r.vy); }
    if (r.y > worldB() - 6) { r.y = worldB() - 6; r.vy = -Math.abs(r.vy); }
    if (r.hits < CONFIG.RACCOON_HITS && r.t >= CONFIG.RACCOON_SECONDS) loseRaccoon();
  } else {   // тікає за межі екрана
    r.x += r.exitDir * 120 * dt;
    r.vx = r.exitDir * 120;
    if (r.x < worldL() - 24 || r.x > worldR() + 24) { trouble = null; }
  }
}
// Тап по калюжі чи єнотові; true — тап «з'їдено» і по магазину не рахується
function handleEventTap(p) {
  if (!trouble) return false;
  if (trouble.type === 'thief' && trouble.state === 'run') {
    if (Math.abs(p.x - trouble.x) <= 13 && p.y >= trouble.y - 20 && p.y <= trouble.y + 5) { hitRaccoon(); return true; }
  } else if (trouble.type === 'leak') {
    for (let i = 0; i < puddles.length; i++) {
      if (Math.abs(p.x - puddles[i].x) <= 13 && Math.abs(p.y - puddles[i].y) <= 9) { removePuddle(i); return true; }
    }
  }
  return false;
}

/* ---------- День і ніч ---------- */

function buildSkyStars() {

function updateSkyState() {

  sky.dusk = Math.max(0, 1 - Math.abs(h - 0.05) / 0.3);          // сутінки: схід і захід

}
function updateShootingStar(dt) {

    const q = shootingStar;
    q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.t >= q.life) { shootingStar = null; shootTimer = rand(8, 22); }
  } else {

    if (shootTimer <= 0) shootingStar = { x: rand(view.w * 0.1, view.w * 0.8), y: rand(4, view.offY + 40), vx: rand(110, 160), vy: rand(40, 70), t: 0, life: 0.7 };

// Небо цілком (координати полотна, до зсуву сцени): шар неба, сутінки, зорі, сонце й місяць
function drawSkyScreen(time) {
  ctx.drawImage(skyLayer, 0, 0);

// Затемнення всієї сцени вночі й тепле світло в сутінки (координати «ядра»)

const BULB_SETS = [['y', 'h', 'p', 'm', 's'], ['p', 'T', 'w', 'y', 'q'], ['f', 'y', 'j', 'w', 'J'], ['v', 'T', 'f', 'y', 'w'], ['a', 'S', 'w', 's', 'T'], ['g', 'm', 'y', 'h', 'w'], ['S', 'w', 'u', 's', 'y'], ['f', 'T', 'v', 'f', 'T']];

/* ---------- Хелловін: привиди ---------- */
let ghostHunt = null;            // триває полювання: { t, dur, caught, total, ghosts }
let nextGhostAt = 0;             // коли почнеться наступне полювання (мс); 0 — ще не заплановано
const windowGhosts = [];         // привиди, що на мить блимають у вікнах будинків
let windowGhostTimer = 3;

function startGhostHunt() {
  const l = visL() + 16, r = visR() - 16;
  ghostHunt = { t: 0, dur: CONFIG.GHOST_SECONDS, caught: 0, total: CONFIG.GHOST_COUNT, ghosts: [] };
  for (let i = 0; i < CONFIG.GHOST_COUNT; i++) {
    ghostHunt.ghosts.push({ x: rand(l, r), y: rand(132, worldB() - 8), vx: rand(12, 26) * (Math.random() < 0.5 ? -1 : 1), ph: rand(0, 6.3), alive: true, born: i * 0.9 });
  }
  playSfx('raccoon');
  showToast(t('ghostStart'), 'big');
}
function endGhostHunt() {
  const h = ghostHunt;
  ghostHunt = null;
  nextGhostAt = Date.now() + rand(CONFIG.GHOST_HUNT_MIN_SECONDS, CONFIG.GHOST_HUNT_MAX_SECONDS) * 1000;
  showToast(h.caught ? t('ghostEnd', h.caught, state.ghosts) : t('ghostEndNone'), h.caught ? 'good' : 'bad');
  saveGame();
  updateUI();
}
function updateGhostHunt(dt) {
  // привиди, що блимають у вікнах (лише на Хелловін)
  if (theme.season !== 'halloween' || !houseGlass || !houseGlass.length || !animOn()) windowGhosts.length = 0;
  else {
    windowGhostTimer -= dt;
    if (windowGhostTimer <= 0) {
      windowGhostTimer = rand(2.5, 6);
      const seen = houseGlass.filter(r => r[0] > visL() && r[0] < visR());
      if (seen.length) { const r = seen[Math.floor(Math.random() * seen.length)]; windowGhosts.push({ x: r[0], y: r[1], t: 0, dur: rand(0.6, 1.1) }); }
    }
    for (let i = windowGhosts.length - 1; i >= 0; i--) { windowGhosts[i].t += dt; if (windowGhosts[i].t >= windowGhosts[i].dur) windowGhosts.splice(i, 1); }
  }
  if (!ghostHunt) return;
  const h = ghostHunt;
  h.t += dt;
  const l = visL() + 10, r = visR() - 10;
  h.ghosts.forEach(g => {
    if (!g.alive || h.t < g.born) return;
    g.x += g.vx * dt; g.ph += dt * 2.2;
    if (g.x < l) { g.x = l; g.vx = Math.abs(g.vx); } else if (g.x > r) { g.x = r; g.vx = -Math.abs(g.vx); }

}

// Тап по привидові: ловимо його (повертає true, якщо влучили)
function hitGhost(p) {
  if (!ghostHunt) return false;
  const h = ghostHunt;
  for (const g of h.ghosts) {
    if (!g.alive || h.t < g.born) continue;
    const gy = ghostY(g);
    if (Math.abs(p.x - g.x) <= 9 && p.y >= gy - 16 && p.y <= gy + 4) {
      g.alive = false;
      h.caught++;
      state.ghosts = Math.min(CONFIG.GHOST_MAX, state.ghosts + 1);
      state.stats.ghostsCaught++;
      for (let i = 0; i < 8; i++) { const a = rand(0, Math.PI * 2), sp = rand(30, 70); fx.sparks.push({ x: g.x, y: gy - 6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, age: 0, life: rand(0.3, 0.5), col: i % 2 ? 'w' : 'S' }); }
      spawnFloater(g.x, gy - 14, '+1');
      playSfx('upgrade');
      updateUI();
      return true;
    }
  }
  return false;
}
function drawGhostHunt() {
  if (ghostHunt) {
    const h = ghostHunt, fade = Math.min(1, (h.dur - h.t) / 2);     // в кінці полювання привиди тануть
    h.ghosts.forEach(g => {

      const x = Math.round(g.x), y = Math.round(ghostY(g));
      ctx.globalAlpha = 0.18 * fade; R(ctx, x - 5, y + 4, 11, 2, 'd');

    });

    ctx.globalAlpha = a; drawSprite(ctx, 'ghost_s', w.x, w.y);
  });
  ctx.globalAlpha = 1;
}

function buildWheelTexture() {

  const cx = 64, cy = 64, step = Math.PI / 4;

    for (let x = 0; x < S; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy, r = Math.sqrt(dx * dx + dy * dy);
      if (r > 62) continue;

      else {
        let a = Math.atan2(dx, -dy); if (a < 0) a += Math.PI * 2;
        const sec = Math.floor(a / step), frac = a / step - sec;
        const edge = Math.min(frac, 1 - frac) * step * r;

  WHEEL_SECTORS.forEach((s, i) => {
    const a = (i + 0.5) * step;

}
