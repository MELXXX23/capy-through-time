<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1d1a">
<title>Capy Through Time</title>
<!-- Піксельний шрифт з чіткою кирилицею (Pixelify Sans малює українські літери криво, тому Press Start 2P). Без інтернету спрацює запасний моноширинний -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ===== Змінні та база ===== */
:root {
  --darker: #2a1d1a;
  --dark: #4a3228;
  --brown: #7a4f35;
  --tan: #dba46a;
  --honey: #f2b84b;
  --yellow: #ffe08a;
  --cream: #fff4dc;
  --pink: #ef8fa3;
  --mint: #8ed4a6;
  --green: #4f9a63;
  --red: #c4553d;
  --panel: #f3d9a8;
  --panel-dark: #e2bf86;
  --u: 3px; /* скільки css-пікселів займає один піксель сцени (ставить скрипт) */
  --font: 'Press Start 2P', 'Courier New', monospace;
  --notch: 4px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  background: var(--darker);
  color: var(--dark);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

/* Піксельна рамка зі «сходинками» по кутах */
.frame, .card, .btn {
  clip-path: polygon(
    0 var(--notch), var(--notch) var(--notch), var(--notch) 0,
    calc(100% - var(--notch)) 0, calc(100% - var(--notch)) var(--notch), 100% var(--notch),
    100% calc(100% - var(--notch)), calc(100% - var(--notch)) calc(100% - var(--notch)), calc(100% - var(--notch)) 100%,
    var(--notch) 100%, var(--notch) calc(100% - var(--notch)), 0 calc(100% - var(--notch)));
}
.frame {
  background: var(--panel);
  box-shadow: inset 0 0 0 4px var(--dark), inset 0 0 0 6px var(--cream), inset 0 -10px 0 6px rgba(74,50,40,.12);
}
.card {
  --notch: 3px;
  background: var(--cream);
  box-shadow: inset 0 0 0 3px var(--brown);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.btn {
  --notch: 3px;
  background: var(--panel-dark);
  box-shadow: inset 0 0 0 3px var(--dark), inset 0 -4px 0 3px rgba(74,50,40,.18);
}
.btn:disabled { opacity: .5; }

/* ===== Каркас сторінки ===== */
#app {
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(340px, 38vw, 470px);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top" "stage panel";
}
#topbar {
  grid-area: top;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 12px;
  background: var(--darker);
  border-bottom: 4px solid var(--brown);
}
#stage {
  grid-area: stage;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  padding: 0;
  overflow: hidden;
  background: repeating-conic-gradient(#3b2a22 0 25%, #33241d 0 50%) 0 0 / 16px 16px;
}
/* Меню справа можна згорнути стрілкою — тоді вся гра на весь екран */
#app.panel-closed { grid-template-columns: minmax(0, 1fr) 0; }
#app.panel-closed #panel { display: none; }
#panelToggle {
  position: absolute;
  z-index: 12;
  top: 50%;
  right: 0;
  width: 34px;
  height: 78px;
  margin-top: -39px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--honey);
  box-shadow: inset 0 0 0 3px var(--dark), inset 0 -4px 0 3px rgba(74,50,40,.2);
  cursor: pointer;
  touch-action: manipulation;
}
#panelToggle svg { width: 16px; height: 28px; shape-rendering: crispEdges; fill: var(--dark); }
#panelToggle.alert::after { content: ''; position: absolute; top: 4px; left: 4px; width: 8px; height: 8px; background: var(--red); box-shadow: 0 0 0 2px var(--cream); animation: blink 1s steps(2, jump-none) infinite; }
#app.panel-closed #panelToggle svg { transform: scaleX(-1); }   /* меню відкрите — стрілка вправо (сховати), згорнуте — вліво (показати) */
#panel {
  grid-area: panel;
  display: flex;
  flex-direction: column;
  min-height: 0;
  margin: 12px 12px 12px 0;
  padding: 14px;
}

/* ===== Лічильник ===== */
#hud {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 18px 8px 14px;
  min-width: 0;
}
#coinIcon { width: 32px; height: 32px; image-rendering: pixelated; image-rendering: crisp-edges; flex: none; }
#coinCount { font-size: 26px; line-height: 1; white-space: nowrap; }
#cps { font-size: 12px; color: var(--brown); margin-top: 6px; white-space: nowrap; }

#hudWrap { display: flex; flex-direction: column; gap: 8px; min-width: 0; align-items: flex-start; }
#boosts { display: flex; flex-wrap: wrap; gap: 6px; }
#boosts:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; font-size: 11px; line-height: 1.2; color: var(--dark); background: var(--cream); box-shadow: 0 0 0 2px var(--honey); white-space: nowrap; }
.chip.bad { background: #cfe6f5; box-shadow: 0 0 0 2px #3d5a8c; }
.chip.dark { background: var(--darker); color: var(--yellow); box-shadow: 0 0 0 2px var(--honey); }
.chip .ico { font-size: 11px; }
#topRight { display: flex; align-items: center; gap: 8px; flex: none; }
#wheelOpen { position: relative; padding: 5px 10px; font-size: 18px; line-height: 1.3; background: var(--panel); }
#wheelOpen.ready { background: var(--honey); animation: wheelPulse 1.1s steps(2, jump-none) infinite; }
@keyframes wheelPulse { 50% { transform: translateY(-2px); } }
#wheelOpen.ready::after { content: ''; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; background: var(--red); box-shadow: 0 0 0 2px var(--cream); }

/* Банер подій над сценою (розпродаж, чорна п'ятниця, протікання, міні-гра) */
#eventBanner { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 8; max-width: 94%; padding: 6px 12px; font-size: 12px; line-height: 1.5; text-align: center; color: var(--dark); background: var(--yellow); box-shadow: 0 0 0 3px var(--dark); pointer-events: none; white-space: nowrap; }
#eventBanner.bf { background: var(--darker); color: var(--yellow); box-shadow: 0 0 0 3px var(--honey); }
#eventBanner.leak { background: #cfe6f5; box-shadow: 0 0 0 3px #3d5a8c; }
#eventBanner.game { background: #ffd3c9; box-shadow: 0 0 0 3px var(--red); }
#eventBanner[hidden] { display: none; }

/* ===== Перемикач мови ===== */
#langSwitch { display: flex; gap: 6px; flex: none; }
.lang-btn { padding: 10px 12px; min-width: 52px; font-size: 14px; color: var(--cream); background: var(--brown); box-shadow: inset 0 0 0 3px var(--cream), inset 0 -4px 0 3px rgba(0,0,0,.2); }
.lang-btn[aria-pressed="true"] { background: var(--honey); color: var(--dark); box-shadow: inset 0 0 0 3px var(--dark), inset 0 -4px 0 3px rgba(74,50,40,.2); }

/* ===== Сцена ===== */
/* #scene — «вікно» (на телефоні показує лише середину вулиці), #world — вся вулиця 320×180 */
#scene {
  position: relative;
  flex: none;
  width: 960px;
  height: 540px;
  overflow: hidden;
  cursor: pointer;
  touch-action: manipulation;
}
#scene.pannable { touch-action: none; }
#world {
  position: relative;
  width: 960px;
  height: 540px;
}
#world canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
}
#scene:focus-visible { outline: 4px solid var(--pink); outline-offset: 10px; }
#shopOverlay {
  position: absolute;
  pointer-events: none;
  transform-origin: 50% 100%;
}
#sign {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  text-align: center;
  color: var(--cream);
  line-height: 1.05;
}
#signText { display: block; max-width: 100%; text-wrap: balance; text-shadow: 0 calc(var(--u) * 0.5) 0 var(--darker); }
#floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater {
  position: absolute;
  font-size: max(15px, calc(var(--u) * 8));
  color: var(--yellow);
  white-space: nowrap;
  text-shadow: 2px 0 var(--darker), -2px 0 var(--darker), 0 2px var(--darker), 0 -2px var(--darker), 2px 2px var(--darker), -2px -2px var(--darker), 2px -2px var(--darker), -2px 2px var(--darker);
  animation: floatUp 0.95s steps(14, end) forwards;
}
@keyframes floatUp {
  0%   { opacity: 0; transform: translate(-50%, -30%) scale(.6); }
  12%  { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, calc(-60% - 3.4em)) scale(1); }
}

/* ===== Панель і вкладки ===== */
#tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.tabmore { display: none; }
#musicStyleRow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
#musicStyleRow .btn { flex: 1 1 28%; font-size: 11px; padding: 9px 4px; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 9px 2px 8px; font-size: 9px; line-height: 1.1; min-width: 0; }
.tab .tab-icon { font-size: 18px; line-height: 1; }
.tab .tab-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--honey); }
.tab.soon:not([aria-selected="true"]) { opacity: .6; }
.tab.alert::after { content: ''; position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; background: var(--red); box-shadow: 0 0 0 2px var(--cream); animation: blink 1s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: .25; } }
#tabContent { flex: 1; min-height: 0; overflow-y: auto; padding: 2px; }
.pane[hidden] { display: none; }
.card h2 { font-size: 16px; margin-bottom: 8px; line-height: 1.3; }
.card .sub { color: var(--brown); font-size: 12px; }
.capi-card { display: flex; gap: 12px; align-items: center; }
#capiPortrait { width: 72px; height: 72px; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; background: var(--mint); box-shadow: 0 0 0 3px var(--brown); }
.capi-card .who { margin-bottom: 6px; color: var(--red); }
.capi-card p { font-size: 12px; line-height: 1.7; }
.stat { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 2px dotted var(--tan); font-size: 12px; line-height: 1.5; }
.stat:last-child { border-bottom: 0; }
.stat b { font-weight: 400; white-space: nowrap; color: var(--red); }
.hint { text-align: center; color: var(--brown); font-size: 12px; line-height: 1.6; }
#saveWarn { margin-top: 8px; padding: 8px 10px; font-size: 11px; line-height: 1.6; color: var(--cream); background: var(--red); }
#saveWarn[hidden] { display: none; }

/* ===== Відділи ===== */
.buy-modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.buy-mode { padding: 9px 2px; font-size: 12px; }
.buy-mode[aria-pressed="true"] { background: var(--honey); }
.expand-card { background: #e6f5e9; }
.expand-card h2 { font-size: 14px; }
.expand-card p { font-size: 11px; line-height: 1.7; color: var(--brown); margin-bottom: 6px; }
.req { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; line-height: 1.6; padding: 2px 0; }
.req.ok b { color: var(--green); }
.req b { font-weight: 400; color: var(--red); white-space: nowrap; }
.btn.wide { display: block; width: 100%; padding: 11px 8px; margin-top: 8px; font-size: 12px; line-height: 1.4; }
.btn.go { background: var(--mint); }
.dept-head { display: flex; align-items: center; gap: 8px; }
.dept-icon { font-size: 20px; line-height: 1; flex: none; }
.dept-name { flex: 1; min-width: 0; font-size: 12px; line-height: 1.4; }
.dept-count { font-size: 17px; color: var(--red); flex: none; }
.dept-income { font-size: 11px; line-height: 1.7; color: var(--brown); margin: 6px 0 4px; }
.ms { display: flex; align-items: center; gap: 8px; margin: 4px 0 2px; }
.ms-bar { flex: 1; height: 8px; background: var(--tan); box-shadow: 0 0 0 2px var(--brown); position: relative; }
.ms-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--honey); box-shadow: inset 0 -2px 0 rgba(74,50,40,.25); }
.ms-text { font-size: 10px; color: var(--brown); white-space: nowrap; }
.dept.locked { opacity: .65; text-align: center; font-size: 11px; line-height: 1.7; color: var(--brown); }

/* ===== Команда ===== */
.team-note { font-size: 11px; line-height: 1.8; color: var(--brown); margin: 0 2px 10px; text-align: center; }
.team-card { display: flex; gap: 10px; align-items: flex-start; }
.team-card .portrait { width: 64px; height: 64px; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; background: var(--mint); box-shadow: 0 0 0 3px var(--brown); }
.team-card .info { flex: 1; min-width: 0; }
.team-card .t-name { font-size: 13px; line-height: 1.4; color: var(--dark); }
.team-card .t-role { font-size: 11px; line-height: 1.5; color: var(--red); margin-top: 2px; }
.team-card .t-trait { font-size: 10px; line-height: 1.7; color: var(--brown); margin-top: 4px; }
.team-card .t-lvl { font-size: 11px; margin-top: 6px; color: var(--dark); }
.team-card .t-now { font-size: 11px; line-height: 1.6; margin-top: 4px; color: var(--green); }
.team-card .t-next { font-size: 10px; line-height: 1.6; margin-top: 2px; color: var(--brown); }
.team-card.unhired .portrait { filter: grayscale(.8) brightness(.8); }
.team-card .btn.wide { margin-top: 8px; }

/* ===== Майстерня часу, досягнення, налаштування ===== */
.ws-line { font-size: 11px; line-height: 1.8; color: var(--brown); margin-bottom: 6px; }
.ws-gain { font-size: 13px; line-height: 1.7; color: var(--red); margin: 6px 0 4px; }
.warp-card { background: #efe4ff; }
.ws-card .ws-now { font-size: 11px; line-height: 1.7; color: var(--green); margin-top: 6px; }
.ws-card .ws-next { font-size: 10px; line-height: 1.7; color: var(--brown); }
.row { display: flex; gap: 8px; margin: 6px 0; }
.row .btn { flex: 1; padding: 10px 6px; font-size: 12px; }
.row .btn[aria-pressed="true"] { background: var(--honey); }
#setSeason { display: grid; grid-template-columns: repeat(3, 1fr); }
#setSeason .btn { padding: 10px 2px; font-size: 11px; }
#setTime { display: grid; grid-template-columns: repeat(2, 1fr); }
#setTime .btn { padding: 9px 2px; font-size: 11px; }
#pane-settings .btn.wide { margin-top: 6px; }
#pane-settings textarea { width: 100%; font-family: var(--font); font-size: 10px; line-height: 1.5; padding: 8px; margin: 6px 0; background: #fff; color: var(--dark); border: 3px solid var(--brown); resize: vertical; -webkit-user-select: text; user-select: text; }
.btn.danger { background: #f3b0a2; }
.ach-row { display: flex; gap: 10px; align-items: center; padding-top: 8px; padding-bottom: 8px; }
.ach-row .badge { width: 48px; height: 48px; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; }
.ach-row .info { flex: 1; min-width: 0; }
.ach-row .a-name { font-size: 12px; line-height: 1.4; }
.ach-row .a-desc { font-size: 10px; line-height: 1.6; color: var(--brown); margin: 2px 0 4px; }
.ach-row.locked-ach .a-name { color: #8a7a6c; }
.toast { white-space: pre-line; display: flex; align-items: center; justify-content: center; gap: 10px; }
.toast canvas { width: 40px; height: 40px; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; }

/* Подорож у часі */
#confirmModal { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(42,29,26,.78); }
#confirmModal[hidden] { display: none; }
#timeWarp { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #fff4dc 0%, #f2b84b 25%, #7a4f35 60%, #2a1d1a 100%); overflow: hidden; }
#timeWarp::before { content: ''; position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, rgba(42,29,26,.55) 0 8deg, rgba(255,224,138,.25) 8deg 16deg); animation: warpSpin 1.2s linear infinite reverse; }
#timeWarp[hidden] { display: none; }
#warpClock { position: relative; width: 128px; height: 128px; image-rendering: pixelated; image-rendering: crisp-edges; }
@keyframes warpSpin { to { transform: rotate(360deg); } }
body.warping #app { filter: sepia(1) saturate(1.5) contrast(1.05); transition: filter .6s; }
body.no-anim .floater { display: none; }

/* Заставка нової епохи на весь екран */
#epochIntro { position: fixed; inset: 0; z-index: 90; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; }
#epochIntro[hidden] { display: none; }
#eiBg { position: absolute; inset: 0; background: linear-gradient(rgba(26,16,36,.5), rgba(26,16,36,.58)), linear-gradient(var(--ei1), var(--ei2) 55%, var(--ei3)); animation: eiIris 1.1s steps(14, end) forwards; }
@keyframes eiIris { from { clip-path: circle(0% at 50% 50%); } to { clip-path: circle(85% at 50% 50%); } }
#epochIntro.out #eiBg { animation: eiIrisOut .7s steps(10, end) forwards; }
@keyframes eiIrisOut { from { clip-path: circle(85% at 50% 50%); } to { clip-path: circle(0% at 50% 50%); } }
#eiRays { position: absolute; left: 50%; top: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax; opacity: 0; background: repeating-conic-gradient(rgba(255,255,255,.13) 0 7deg, transparent 7deg 14deg); animation: eiSpin 24s steps(120) infinite, eiFade .8s steps(8, end) .8s forwards; }
@keyframes eiSpin { to { transform: rotate(360deg); } }
#eiBox { position: relative; text-align: center; padding: 0 5vw; color: #fff4dc; text-shadow: 0 3px 0 rgba(20,12,28,.85), 0 0 14px rgba(20,12,28,.7); }
#eiEmblem { width: clamp(128px, 26vmin, 256px); height: clamp(128px, 26vmin, 256px); image-rendering: pixelated; image-rendering: crisp-edges; opacity: 0; animation: eiPop .9s steps(9, end) .9s forwards; filter: drop-shadow(0 0 14px rgba(255,255,255,.6)); }
@keyframes eiPop { 0% { opacity: 0; transform: scale(.2) rotate(-25deg); } 70% { opacity: 1; transform: scale(1.25) rotate(6deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
#eiNum { font-size: clamp(12px, 2.2vmin, 20px); letter-spacing: .3em; margin-top: 18px; opacity: 0; color: #ffe08a; animation: eiFade .5s steps(5, end) 1.7s forwards; }
#eiTitle { font-size: clamp(20px, 5.2vmin, 54px); line-height: 1.3; margin-top: 12px; min-height: 1.3em; }
#eiSub { font-size: clamp(10px, 1.9vmin, 17px); line-height: 1.9; max-width: 38em; margin: 14px auto 0; opacity: 0; animation: eiFade .6s steps(6, end) 3.3s forwards; }
@keyframes eiFade { to { opacity: 1; } }
#epochIntro.out #eiBox { animation: eiFadeOut .5s steps(5, end) forwards; }
@keyframes eiFadeOut { to { opacity: 0; } }
.ei-spark { position: absolute; bottom: -14px; width: 8px; height: 8px; opacity: .9; animation: eiRise 4s linear infinite; }
@keyframes eiRise { to { transform: translateY(-110vh) rotate(200deg); opacity: 0; } }

/* Епохи: вивіска змінює вигляд */
body[data-epoch="1"] #sign { color: #ffe08a; text-shadow: 0 0 calc(var(--u) * 2) #ef8fa3, 0 calc(var(--u) * 0.5) 0 #4a3228; }
body[data-epoch="2"] #sign { color: #fff0a0; text-shadow: 0 0 calc(var(--u) * 2) #ff5fa2, 0 0 calc(var(--u) * 4) #ff9e5e; }
body[data-epoch="3"] #sign { color: #7ffcff; text-shadow: 0 0 calc(var(--u) * 2) #ff5fa2, 0 0 calc(var(--u) * 4) #7a5cc9; }
body[data-epoch="6"] #sign { color: #e8f4ff; text-shadow: 0 0 calc(var(--u) * 2) #86cfe8; }
body[data-epoch="7"] #sign { color: #aaffff; text-shadow: 0 0 calc(var(--u) * 2) #33ddff, 0 0 calc(var(--u) * 4) #3399ff; }

/* ===== Історія ===== */
.story-note { font-size: 11px; line-height: 1.8; color: var(--brown); margin: 0 2px 10px; text-align: center; }
.chapter-card { display: flex; align-items: center; gap: 10px; }
.chapter-card .num { font-size: 18px; color: var(--red); flex: none; min-width: 26px; text-align: center; }
.chapter-card .title { flex: 1; min-width: 0; font-size: 13px; line-height: 1.5; }
.chapter-card .btn { flex: none; padding: 10px 12px; font-size: 11px; }

/* ===== Діалоги ===== */
#dialog { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; padding: 14px; background: rgba(42,29,26,.45); cursor: pointer; }
#dialog[hidden] { display: none; }
#dialogWrap { position: relative; width: min(100%, 800px); margin-top: 48px; }
#dialogBox { position: relative; width: 100%; min-height: 156px; padding: 20px 22px 22px; display: flex; gap: 18px; align-items: flex-start; cursor: pointer; }
#dlgPortraitWrap { flex: none; width: 88px; height: 88px; background: var(--mint); box-shadow: 0 0 0 3px var(--brown); display: flex; align-items: center; justify-content: center; }
#dlgPortraitWrap.none { display: none; }
#dlgPortrait { width: 88px; height: 88px; image-rendering: pixelated; image-rendering: crisp-edges; }
.dlg-main { flex: 1; min-width: 0; align-self: stretch; display: flex; flex-direction: column; }
#dlgName { font-size: 15px; color: var(--red); min-height: 18px; margin-bottom: 8px; }
#dlgText { font-size: 14px; line-height: 1.9; min-height: calc(1.9em * 4); white-space: pre-line; flex: 1; }
#dlgText.title { font-size: 17px; text-align: center; padding-top: 14px; color: var(--red); }
.dlg-choices { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 10px; }
.dlg-choices[hidden] { display: none; }
.dlg-choices .btn { text-align: left; font-size: 13px; line-height: 1.6; padding: 10px 12px; display: block; width: 100%; }
.dlg-choices .btn small { display: block; margin-top: 4px; font-size: 10px; color: var(--brown); }
#dlgNext { align-self: flex-end; font-size: 15px; color: var(--brown); animation: blink 0.8s steps(2, jump-none) infinite; visibility: hidden; }
#dlgNext.on { visibility: visible; }
#dlgSkip { position: absolute; right: 6px; top: -42px; padding: 10px 12px; font-size: 11px; background: var(--panel); color: var(--dark); }
@media (max-width: 560px) {
  #dialog { padding: 8px; }
  #dialogBox { padding: 16px 14px 16px; gap: 12px; min-height: 150px; }
  #dlgPortraitWrap, #dlgPortrait { width: 64px; height: 64px; }
  #dlgName { font-size: 13px; }
  #dlgText { font-size: 12px; }
}

/* ===== Бульбашки з фразами ===== */
#bubbles { position: absolute; inset: 0; pointer-events: none; }
.bubble {
  position: absolute;
  transform: translate(-50%, -100%);
  max-width: calc(var(--u) * 44);
  width: max-content;
  padding: calc(var(--u) * 1.3) calc(var(--u) * 2.2);
  font-size: max(9px, calc(var(--u) * 3.5));
  line-height: 1.5;
  text-align: center;
  color: var(--dark);
  background: var(--cream);
  box-shadow: 0 0 0 2px var(--dark);
  animation: bubbleIn .18s steps(3, end);
  z-index: 5;
}
.bubble::after { content: ''; position: absolute; left: 50%; top: 100%; width: 6px; height: 6px; margin-left: -3px; background: var(--cream); box-shadow: 2px 2px 0 0 var(--dark); transform: translateY(-3px) rotate(45deg); }
@keyframes bubbleIn { from { opacity: 0; transform: translate(-50%, -80%); } }

/* ===== Сповіщення (тости) ===== */
#toasts { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 420px); }
.toast { --notch: 3px; width: 100%; padding: 10px 14px; font-size: 12px; line-height: 1.6; text-align: center; background: var(--cream); box-shadow: inset 0 0 0 3px var(--dark), inset 0 0 0 5px var(--honey); clip-path: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px)); animation: toastIn .25s steps(5, end), toastOut .3s steps(3, end) forwards; animation-delay: 0s, var(--life, 3s); }
.toast.good { background: #e6f5e9; }
.toast.big { background: var(--yellow); }
.toast.bad { background: #ffd3c9; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-16px); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }

/* ===== Вікно (офлайн-заробіток) ===== */
#soundModal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(42,29,26,.72); }
#soundModal[hidden] { display: none; }
.vol { display: block; text-align: left; font-size: 12px; margin: 14px 0 4px; }
.vol span { display: block; margin-bottom: 8px; }
.vol input[type="range"] { width: 100%; height: 26px; accent-color: var(--green); cursor: pointer; }
#soundBtn { padding: 5px 10px; font-size: 18px; line-height: 1.3; background: var(--panel); }
#soundBtn.muted { opacity: .6; }
#modal, #wheelModal, #letterModal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(42,29,26,.72); }
#modal[hidden], #wheelModal[hidden], #letterModal[hidden] { display: none; }
.wheel-box { max-height: 96vh; overflow-y: auto; padding-top: 22px; }
.wheel-wrap { display: flex; justify-content: center; margin: 4px 0 8px; }
#wheelCanvas { width: min(64vw, 256px); height: auto; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
#wheelLegend { font-size: 11px !important; color: var(--brown); }
#wheelStreak { font-size: 11px !important; color: var(--dark); }
#wheelResult { min-height: 22px; font-size: 15px !important; }
#wheelClose { margin-top: 6px; }
.modal-box { width: min(92vw, 360px); padding: 26px 22px 22px; text-align: center; }
.modal-box h2 { font-size: 16px; line-height: 1.4; margin-bottom: 14px; }
.modal-box p { font-size: 13px; line-height: 1.8; margin-bottom: 6px; white-space: pre-line; }
.modal-box .big { font-size: 22px; color: var(--red); display: block; margin: 8px 0; word-break: break-word; }

/* ===== Телефон / вузький екран: сцена вгорі, панель і вкладки внизу ===== */
@media (max-width: 820px) and (orientation: portrait), (max-width: 560px) {
  #app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top" "stage";
  }
  #topbar { padding: 6px 8px; gap: 8px; }
  #hud { padding: 6px 12px 6px 10px; gap: 8px; }
  #coinIcon { width: 24px; height: 24px; }
  #coinCount { font-size: 20px; }
  #cps { font-size: 11px; margin-top: 5px; }
  .lang-btn { padding: 9px 8px; min-width: 44px; font-size: 13px; }
  #stage { padding: 14px 12px 78px; }
  #scene { box-shadow: 0 0 0 3px var(--darker), 0 0 0 6px var(--honey), 0 0 0 9px var(--darker); }
  #app.panel-closed { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  #panelToggle { display: none; }
  /* Мінімалістичне меню: внизу тонка смужка з іконками; торкнувся — вміст виїжджає над нею, торкнувся ще раз чи сцени — ховається */
  #panel, #app.panel-closed #panel { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; margin: 0 6px calc(6px + env(safe-area-inset-bottom)); padding: 8px; flex-direction: column-reverse; max-height: 82dvh; }
  #tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
  .tab, .tabmore { flex: 1 1 18%; padding: 7px 2px; }
  .tab .tab-icon { font-size: 22px; }
  .tab .tab-name { display: none; }
  .tab.secondary { display: none; flex: 1 1 22%; order: 0; padding: 6px 2px 5px; gap: 4px; }
  .tab.secondary .tab-icon { font-size: 18px; }
  .tab.secondary .tab-name { display: block; }
  #app.more-open .tab.secondary:not([hidden]) { display: flex; }
  .tab.primary, .tabmore { order: 1; }
  .tabmore { display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1; }
  #app.more-open .tabmore { background: var(--honey); }
  #tabContent { display: none; max-height: 46dvh; margin-bottom: 8px; padding: 2px 2px 4px; }
  #app.sheet-open #tabContent { display: block; }
  .card { padding: 10px 12px; margin-bottom: 8px; }
  #toasts { top: 58px; }
  .chip { font-size: 10px; padding: 3px 5px; }
  #hudWrap { gap: 5px; }
  #topRight { gap: 6px; }
  #wheelOpen, #soundBtn { padding: 3px 8px; font-size: 16px; }
  #eventBanner { font-size: 11px; padding: 5px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .floater { animation-duration: 0.01s; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="hudWrap">
      <div id="hud" class="frame" role="status" aria-live="off">
        <canvas id="coinIcon" width="8" height="8" aria-hidden="true"></canvas>

    </button>

        <div class="card capi-card">
          <canvas id="capiPortrait" width="28" height="28" aria-hidden="true"></canvas>

            <div class="who" data-i18n="capiName"></div>
            <p data-i18n="capiHello"></p>
          </div>
        </div>
        <div class="card">
          <h2 id="shopName"></h2>
          <div class="sub" id="shopLevelLabel"></div>

          <div class="stat"><span data-i18n="statTapPower"></span><b id="statTapPower"></b></div>
          <div class="stat"><span data-i18n="statLevelMult"></span><b id="statLevelMult"></b></div>
          <div class="stat"><span data-i18n="statEpoch"></span><b id="statEpoch"></b></div>
          <div class="stat"><span data-i18n="statTaps"></span><b id="statTaps"></b></div>
          <div class="stat"><span data-i18n="statEarned"></span><b id="statEarned"></b></div>
        </div>

      </div>

      <div class="pane" id="pane-departments" role="tabpanel" hidden>

          <h2 id="expandTitle"></h2>

          <div id="expandReqs"></div>
          <button type="button" class="btn wide go" id="expandBtn"></button>
        </div>
        <div class="buy-modes" id="buyModes" role="group" data-i18n-aria="buyModeLabel"></div>
        <div id="deptList"></div>
      </div>

      <div class="pane" id="pane-team" role="tabpanel" hidden>
        <p class="team-note" data-i18n="teamNote"></p>
        <div id="teamList"></div>
      </div>

      <div class="pane" id="pane-story" role="tabpanel" hidden>
        <p class="story-note" data-i18n="storyNote"></p>

      </div>

      <div class="pane" id="pane-workshop" role="tabpanel" hidden>

      <div class="pane" id="pane-achievements" role="tabpanel" hidden>

<script>
'use strict';

/* =====================================================================
   КОНФІГИ (усі ігрові дані — тут, на початку скрипту)
   ===================================================================== */

const CONFIG = {
  SCENE_W: 320,               // внутрішня ширина сцени (пікселів)
  SCENE_H: 180,               // внутрішня висота сцени
  EXTRA_BOTTOM: 36,           // скільки рядків бруківки додається знизу, щоб було більше видно й де гуляти
  MAX_VIEW_W: 720,            // найширша сцена на великому екрані (пікселів сцени)
  MIN_VIEW_W: 296,            // на вузькому вікні масштаб збільшується, а краї «ядра» (до 12 пікселів) можуть не поміститися
  MAX_OFF_Y: 400,             // скільки додаткового неба можна додати зверху на високому екрані
  MOBILE_PAD: 96,             // на телефоні вулиця ширша за екран на стільки пікселів з кожного боку (гортається пальцем)
  DAY_SECONDS: 300,           // скільки секунд триває повна доба (день + ніч)
  MAIL_MINUTES: 40,           // поштова машина приїздить раз на 40 хвилин
  MAIL_FIRST_SECONDS: 90,     // перша — через 90 секунд після початку гри
  SUMMER_REST_MIN: 20,        // влітку звірятка раз на 20–38 секунд зупиняються перепочити й попити водички
  SUMMER_REST_MAX: 38,
  SUMMER_REST_SECONDS: 6,     // скільки триває перепочинок
  GHOST_HUNT_MIN_SECONDS: 240, // «Полювання на привидів» на Хелловін: раз на 4–6 хвилин
  GHOST_HUNT_MAX_SECONDS: 360,
  GHOST_COUNT: 6,             // скільки привидів вилітає
  GHOST_SECONDS: 16,          // скільки секунд їх можна ловити
  GHOST_MAX: 99,              // найбільше кристалів привидів у скарбничці
  GHOST_RESPIN_COST: 12,      // скільки кристалів привидів коштує додатковий оберт колеса фортуни
  SAVE_KEY: 'capyThroughTime_save',
  SAVE_VERSION: 8,            // номер версії збереження (збільшуємо, коли змінюється формат)
  AUTOSAVE_SECONDS: 10,
  START_COINS: 1,             // Капі приїздить з однією монеткою
  START_TAP_POWER: 1,
  MAX_DT: 0.25,               // найбільший крок часу за кадр (секунд)
  MAX_COIN_PARTICLES: 40,
  MAX_SPARKS: 40,
  MAX_DUST: 60,
  MAX_FLOATERS: 14,

];
const WAVE_GAIN = { square: 1, triangle: 1, sine: 1.45, sawtooth: 0.55 };
const SHARP_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
function shiftNote(tok, semis) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(tok);
  if (!m || !semis) return tok;
  const midi = NOTE_INDEX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) + 1) * 12 + semis;
  return SHARP_NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
}
function parseTokens(text) {
  let step = 0;
  const events = text.trim().split(/\s+/).map(tok => {
    const [name, len] = tok.split(':');
    const e = { step, len: parseInt(len, 10) || 1, tok: name };
    step += e.len;
    return e;
  });
  return { events, total: step };
}
// Мелодія для пари (базова мелодія, епоха): темп, тональність, тембри й ударні змінюються (результат кешується)
function trackDef(key) {
  const [baseId, epStr] = key.split('#');
  if (epStr === undefined) return MUSIC_PARSED[baseId];
  const ep = Number(epStr), prof = EPOCH_MUSIC[ep], base = MUSIC_PARSED[baseId];
  if (!prof) return base;
  if (MUSIC_PARSED[key]) return MUSIC_PARSED[key];
  const channels = base.channels.map((ch, ci) => {
    if (ch.wave === 'noise') {
      if (!prof.drums) return { wave: 'noise', vol: 0, events: [{ step: 0, len: ch.total, tok: '.' }], total: ch.total };
      const bar = parseTokens(prof.drums).total;
      const text = Array(Math.max(1, Math.round(ch.total / bar))).fill(prof.drums).join(' ');
      const parsed = parseTokens(text);
      return { wave: 'noise', vol: ch.vol, events: parsed.events, total: parsed.total };
    }
    const role = ci === 0 ? 'lead' : ch.wave === 'triangle' ? 'bass' : 'arp';
    const wave = prof[role] || ch.wave;
    const events = ch.events.map(e => ({ step: e.step, len: e.len, tok: e.tok === '.' ? '.' : shiftNote(e.tok, prof.shift) }));
    return { wave, vol: ch.vol * (WAVE_GAIN[wave] || 1) / (WAVE_GAIN[ch.wave] || 1), events, total: ch.total };
  });
  return (MUSIC_PARSED[key] = { bpm: base.bpm * prof.bpm, channels, total: base.total });
}

    ch1_title: 'One Coin',
    ch1_0: 'A tiny pixel town. Morning sun, fresh cobblestones, and somewhere nearby the smell of warm buns.',
    ch1_1: 'An old cart rolls onto the street, and a capybara with a flower on her head peeks out carefully.',
    ch1_2: "Hello, town! I'm Capy. I came a long way... with exactly one coin in my pocket.",
    ch1_3: 'But I have a dream: my very own little shop. And there it is — an old booth on the corner!',
    ch1_4: 'A bit shabby, but it has an awning. I will call it "Everything for a Penny". We already have a penny. Almost.',
    ch1_5: 'And so the big story of a little shop began. Tap it to earn your first coins!',

    ch2_title: 'First Friends',
    ch2_0: 'In a few days business picked up. Customers kept coming, and Capy could barely sell and count at the same time.',
    ch2_1: "Excuse me, do you have a job opening? I'm Spike the Hedgehog.",
    ch2_2: 'Ouch! You are prickly!',
    ch2_3: "That's just politeness. Protection from suspicious customers. Also, I am great with money.",
    ch2_4: "Great with money? You're hired! Here is the till — it's yours.",
    ch2_5: 'Thank you! I promise not a penny gets lost. Unless it gets stuck in my spikes.',
    ch2_6: 'Tip: open the "Team" tab and hire Spike — he boosts your tap power.',

    ch3_title: 'Someone Is Stealing!',
    ch3_0: 'The shop grew, and the whole town started talking about it. But along with customers, someone else showed up.',
    ch3_1: 'Capy! A pack of cookies vanished from the counter. All I saw was a striped tail!',
    ch3_2: 'A striped tail? That looks like...',
    ch3_3: "Hehe! Nothing personal, just business. I'm Shnyr, the sneakiest raccoon in town!",
    ch3_4: 'You took my cookies! Give them back right now!',
    ch3_5: "Oh, they're almost... um... eaten. Tag, you can't catch me!",
    ch3_6: "He's gone! Oh well, next time we'll be ready.",
    ch3_7: "Shnyr is sly, but doesn't seem mean. He'll be back, so keep your eyes open!",

    ch4_title: 'The Strange Watch',
    ch4_0: 'While sorting old junk in the storeroom, Capy found something strange.',
    ch4_1: 'A pocket watch! Old, but pretty. The gold is dark and the glass is a bit cracked.',
    ch4_2: 'Oh, it ticks... but the hands go... backwards?',
    ch4_3: 'Must be broken. My grandpa said: a watch that ticks backwards is either broken or magic.',
    ch4_4: "Magic? Ha-ha! Still, I'll keep it. It's so pretty.",
    ch4_5: "The watch gave a soft tick in Capy's pocket, as if it were smiling.",

    ch5_title: 'Supermarket',
    ch5_0: 'The shop grew into a real supermarket. The whole town talked about Capy and her "Everything for a Penny", and new friends came to join the team.',
    ch5_1: "Capy! I'm Bodie, a beaver builder. Heard you're expanding. Need help with planks?",
    ch5_2: "And I'm Zoe! A shop assistant! Oh, what windows... I could sell snow in winter!",
    ch5_3: "Hoo. I'm Sonia, the accountant. Someone has to count these piles of coins before they roll away.",
    ch5_4: "And I'm Tonya. Security. Slow, but reliable.",
    ch5_5: "Friends, come in! I don't even know how to thank you!",
    ch5_6: "Thank me? I'm first in line for a bonus.",
    ch5_7: 'The team is growing. Hire new animals in the "Team" tab!',

    ch6_title: 'Shnyr in Trouble',
    ch6_0: 'One rainy evening Capy heard a strange sound by the back door.',
    ch6_1: 'Is someone crying? Shnyr, is that you?',
    ch6_2: "I... I'm not crying. It's just rain. On my face. Only on my face.",
    ch6_3: "Why do you steal, Shnyr? Don't you have a home?",
    ch6_4: "Home? I live in an old crate behind the bakery. And I have no friends. None.",
    ch6_5: 'If someone just said "hi" to me for no reason... But everyone shouts: "Catch the raccoon!"',
    ch6_6: "Hi, Shnyr. For no reason. Come in, we have hot tea and buns.",
    ch6_7: "Really? I... um... won't steal anymore. Well, only very rarely. Kidding!",
    ch6_8: 'From then on Shnyr was no longer a thief. He was a friend.',

    ch7_title: 'The Shopping Mall',
    ch7_0: 'Time passed. The little stall became a shop, then a supermarket, and now...',
    ch7_1: 'A real shopping mall rose on the street, with a glass roof, a cinema and the smell of fresh pastry.',
    ch7_2: 'I did it... "Capy\'s Shopping Mall". From a single coin!',
    ch7_3: 'You did it, we did it, and I got a bonus. A good day.',
    ch7_4: 'It is more fun with you than stealing. Although stealing was fun too.',
    ch7_5: "Thank you all. I couldn't have done it without you.",
    ch7_6: "Suddenly something ticked loudly in Capy's pocket.",
    ch7_7: 'My watch?.. It came alive!',

    ch8_title: 'Finale: The Watch Ticks',
    ch8_0: 'The golden watch slowly rose from the pocket and floated in the air. Its hands began to spin backwards.',
    ch8_1: "Hello, Capy. I have waited a long time. A very long time.",
    ch8_2: 'You can talk?!',
    ch8_3: 'I am the Watch of Time. The one who can turn back minutes.',
    ch8_4: 'You built a wonderful mall. But think: what if you knew everything you know now?',
    ch8_5: 'Start over? But I already...',
    ch8_6: 'Not to lose, but to build wiser. Friends will stay. Knowledge will stay. Coins will not.',
    ch8_7: 'Wiser... That sounds nice. I will think about it.',
    ch8_8: 'When you are ready, wind me up. I am here, ticking.',
    ch8_9: 'Time travel awaits Capy. (It will open in one of the next updates.)',

    ep1_title: 'Retro Age',
    ep1_0: 'The watch ticked and the town turned pastel. An airship floated into the sky, and a sign lit up on the corner: "Milk Bar".',
    ep1_1: 'Welcome to my bar! I am Pip. My jukebox plays only one song, and it has been like that for a whole week!',
    ep1_2: 'Just one song? That must be the longest hit in the world.',
    ep1_3: 'Latest sensation! The "Eternal Record with All the Hits". Warranty valid while the customer stands at the counter!',
    ep1_4: 'It is him! He sold me a jukebox "with all the hits" for a whole sack of coins.',
    ep1_5: 'Shnyr? Did you really follow us through time?',
    ep1_6: 'Thank you! The jukebox sings, the milkshakes whirl, life is good!',
    ep1_7: 'Retro is when the past has become fashionable.',
    ep1_8: 'Tick-tock. Time never disappears. It just changes style.',
    ep1_o1: 'Does the warranty cover the past?',
    ep1_o2: 'Return the money and we will forget this story.',
    ep1_r1: 'The past? Well... hit the jukebox on the side and it will play something new!',
    ep1_r2: 'Fine, fine. Here are the coins. But the record did play!',
    ep2_title: 'Disco Age',
    ep2_0: 'The watch ticked and music poured down the street. Colourful beams swirled above the shop, and a mirror ball scattered a thousand sparkles over the pavement.',
    ep2_1: 'Hi! I am Zina, DJ of this block. But my records vanished right before the party!',
    ep2_2: 'All of them? That is a disaster for a dance night.',
    ep2_3: 'All of them? Never saw them. I merely prepared a surprise: "DJ Shnyr" will play the best set ever!',
    ep2_4: 'So that is it! He has my records and my console!',
    ep2_5: 'Shnyr, the party needs saving. What do you suggest?',
    ep2_6: 'Thanks! The party is saved, and Shnyr even has his own track. Not bad at all!',
    ep2_7: 'Disco is when the past learns to dance.',
    ep2_8: 'Tick-tock, tick-tock... See? Even I keep the beat!',
    ep2_o1: 'Let us have a dance battle!',
    ep2_o2: 'Give the records back, then play together with Zina.',
    ep2_r1: 'A battle? Fine! But I can only dance off the beat.',
    ep2_r2: 'Together? How does that work?.. Fine, here are the records. But I will play at least one track!',
    ep3_title: 'Arcade Age',
    ep3_0: 'The watch ticked and the street flooded with purple glow. "Ping-ping-ping" came from the arcade doorway, and a striped sun rose in the sky.',
    ep3_1: 'I am Max, owner of this arcade. Somebody broke my record, and the table shows the name "SHN"!',
    ep3_2: 'SHN... Could it be that raccoon?',
    ep3_3: 'Fair play! I just found a secret code in the game. A small one. For infinite lives.',
    ep3_4: 'Fair? He never put a single token into the machine!',
    ep3_5: 'Shnyr, tokens do not drop into the machine by themselves.',
    ep3_6: 'The arcade is fair again, and the table has an honest "SHN". Twenty points, but ours!',
    ep3_7: 'A token is a coin that has become a game.',
    ep3_8: 'Game over? No. One more level, one more circle.',
    ep3_o1: 'Let us play: the loser sweeps the arcade.',
    ep3_o2: 'Remove the code and say honestly how much you scored.',
    ep3_r1: 'Sweep? Fine! But I will not lose, I have a secret code... Oops.',
    ep3_r2: 'All right, all right. Without the code I scored only... twenty points. And those were accidental.',
    ep4_title: 'Internet Age',
    ep4_0: 'The watch ticked and an invisible network flashed over the town. Wi-Fi icons appeared on the signs, and screens and likes in the windows.',
    ep4_1: 'Beep! I am Bitik, a consultant robot. Somebody changed all the prices on the shop website to "one coin".',
    ep4_2: 'To one? That is not a sale, that is the end of the business.',
    ep4_3: 'Ha! That is not hacking, that is "creative price setting". I only wanted to buy everything at once.',
    ep4_4: 'He guessed my password! And the password was "12345"...',
    ep4_5: 'Shnyr, Bitik needs protection and the prices need peace. What do we do?',
    ep4_6: 'Thank you! Everything is online now, even yesterday is stored in the cloud.',
    ep4_7: 'Yesterday in the cloud is even handier than a watch.',
    ep4_8: 'Tick-tock. Saved. Though I am a cloud of time myself.',
    ep4_o1: 'Change the password to "Shnyr_dont_hack".',
    ep4_o2: 'Restore the prices and set up real protection.',
    ep4_r1: 'Wow, now it is harder than my tricks. Fine, I will not hack any more... until the next update.',
    ep4_r2: 'Prices are back, protection is on. Beep-beep! And Shnyr gets a discount for honest behaviour.',
    ep5_title: 'Eco Age',
    ep5_0: 'The watch ticked, the roofs turned green, and windmills began to spin on the hills. The air smells of flowers and fresh grass.',
    ep5_1: 'Hello, I am Lesyk, the city gardener. Somebody walks around town collecting an "eco fee" for every little tree!',
    ep5_2: 'An eco fee? What kind of fee is that?',
    ep5_3: 'A legal payment "for breathing city air". Here is the receipt. Written out to myself.',
    ep5_4: 'He said it was for a "green future", and bought himself another sack!',
    ep5_5: 'Shnyr, the future is green only when it is honest.',
    ep5_6: 'Thank you! Trees are planted, the fee is returned, and Shnyr even watered the cabbages!',
    ep5_7: 'Green ideas never grow old: you can always plant them again.',
    ep5_8: 'Tick-tock. Even I breathe easier in such times.',
    ep5_o1: 'Let us compete: who plants more trees!',
    ep5_o2: 'Return the fee and help replant the garden beds.',
    ep5_r1: 'A contest? I will plant a whole forest! True, I have just one seed... but what a seed!',
    ep5_r2: 'All right. I return the fee and take the shovel. Not used to honest work, but I will try.',
    ep6_title: 'Space Age',
    ep6_0: 'The watch ticked and the sky over the town turned dark. A rocket took off from the hill, and antennas lit up on the roofs. Welcome to the space age.',
    ep6_1: 'Call sign Orbit, astronaut! The cosmic cookies vanished from my ship!',
    ep6_2: 'Cosmic cookies? What is special about them?',
    ep6_3: 'They... fly through time. I only helped them reach my pocket. For safety.',
    ep6_4: 'For safety? You stuffed them into a pocket of my spacesuit!',
    ep6_5: 'Shnyr, space is big and cookies are few. What shall we do?',
    ep6_6: 'Thanks, crew! The rocket will fly without a hitch. Cookies on board, friends on Earth.',
    ep6_7: 'In space time flows slowly, and cookies vanish quickly.',
    ep6_8: 'Here I agree with you. Tick... tock...',
    ep6_o1: 'Let us share the cookies with everyone, space style!',
    ep6_o2: 'Return the cookies, then fix the rocket together.',
    ep6_r1: 'Share? Well... I ate only... hm... half. Share the rest!',
    ep6_r2: 'Fine, I will return them. But I like the rocket too. May I steer?',
    ep7_title: 'Neon Age',
    ep7_0: 'The watch ticked and the town lit up in neon. Signs glowed pink and blue, and little drones swirled above the roofs.',
    ep7_1: 'I am Lumi, neon sign maker. But my tubes go out the moment I switch them on! The brightest one was stolen!',
    ep7_2: 'The brightest one? We will find it.',
    ep7_3: 'I... took it for a test. I wanted to shine over the whole block. But it only flickers when I am near.',
    ep7_4: 'Because it runs on good deeds! Not on stealing!',
    ep7_5: 'Shnyr, tired of running? Light works when friends are close.',
    ep7_6: 'Look, the sign is glowing! It really runs on good deeds.',
    ep7_7: 'All right, I give up. I want in the team! I promise: from now on I am sly only in good deeds.',
    ep7_8: 'Welcome, Shnyr! The shop can only win.',
    ep7_9: 'Tick-tock. At last Shnyr is on the right side of time.',
    ep7_o1: 'Drop the loot and join us, you will shine over the whole block!',
    ep7_o2: 'Return the sign, and we will find you honest work.',
    ep7_r1: 'Join you? For a real job? Sounds like my best plan in all of history.',
    ep7_r2: 'Honest work... Do they pay in cookies? Then I agree.',
    ep8_title: 'A New Circle',
    ep8_0: 'The circle closed: the square again, the pennants over the street again, one single coin again. But now familiar faces are everywhere.',
    ep8_1: 'I am Bruno, painter. I was commissioned a picture, "All Friends Across All Epochs", but the models ran away!',
    ep8_2: 'All of them? We travel through time together. Let us invite everyone.',
    ep8_3: 'I am ready to pose! Just make me look fearsome, but kind.',
    ep8_4: 'Fearsome but kind... How do I paint that?',
    ep8_5: 'Just smile, Shnyr. You do that best of all.',
    ep8_6: 'The painting is ready: in every epoch we have friends. And the second Renaissance turned out better than the first.',
    ep8_7: 'Renaissance 2 is like a sequel, only better.',
    ep8_8: 'Tick-tock. Every new circle makes history brighter.',
    ep8_o1: 'And paint a clock that winks!',
    ep8_o2: 'Paint all of us, the whole team from the first epoch.',
    ep8_r1: 'A winking clock? That takes skill. But it worked: tick-tock, and it winked!',
    ep8_r2: 'The whole team? Now that is a masterpiece! Come closer, everybody in the frame!',
    speaker_pip: 'Pip the Penguin',
    guestSay_pip_0: 'A milkshake? Friends only!',
    guestSay_pip_1: 'The jukebox plays lots of songs now!',
    guestSay_pip_2: 'Retro is always cool.',
    speaker_zina: 'Zina the Zebra',
    guestSay_zina_0: 'One-two-three, in rhythm!',
    guestSay_zina_1: 'Shall we dance?',
    guestSay_zina_2: 'What a night for a party!',
    speaker_maks: 'Max the Monkey',
    guestSay_maks_0: 'Another game? Fair play only!',
    guestSay_maks_1: 'My record is mine again.',
    guestSay_maks_2: 'Ping-ping-ping!',
    speaker_bitik: 'Bitik the Robot',
    guestSay_bitik_0: 'Beep-boop! Password changed.',
    guestSay_bitik_1: 'I am online. Are you?',
    guestSay_bitik_2: 'Everything is saved in the cloud.',
    speaker_lesyk: 'Lesyk the Deer',
    guestSay_lesyk_0: 'Trees love attention.',
    guestSay_lesyk_1: 'A weed is just a plant in the wrong place.',
    guestSay_lesyk_2: 'Breathe deeper!',
    speaker_orbit: 'Orbit the Dog',
    guestSay_orbit_0: 'Earth, this is Orbit, come in!',
    guestSay_orbit_1: 'Cookies on board.',
    guestSay_orbit_2: 'Space is quiet beauty.',
    speaker_lumi: 'Lumi the Firefly',
    guestSay_lumi_0: 'Light runs on good deeds.',
    guestSay_lumi_1: 'Blink-blink!',
    guestSay_lumi_2: 'I am a firefly, I am allowed.',
    speaker_bruno: 'Bruno the Badger',
    guestSay_bruno_0: 'Everything is a painting if you look right.',
    guestSay_bruno_1: 'A stroke here, a stroke there.',
    guestSay_bruno_2: 'My masterpiece is still ahead.',

    shnyrJoined: 'Shnyr is now on the team! Check the "Team" tab.',
    team_shnyr: 'Shnyr the Raccoon', team_shnyr_role: 'Sly consultant', team_shnyr_trait: 'Knows every loophole. Now uses them for good.',
    team_shnyr_say_0: 'Sly? No, thrifty!', team_shnyr_say_1: 'I know a discount loophole.', team_shnyr_say_2: 'I am reformed... almost.', team_shnyr_say_3: 'Cookies are my currency.', team_shnyr_say_4: 'I work honestly now!', team_shnyr_say_5: 'Just do not ask about the accounting.',
    team_shnyr_sit_0: 'Sit, I will tell you how I used to take cookies. Oh, I did not.', team_shnyr_sit_1: 'My day beats yesterday\'s me!',
    ep9_title: 'Renaissance Age',
    ep9_0: 'A travelling rooster with a lute and a feather in his beret stopped on the square. The town was just waking up: the Renaissance, a time of masters, singers and bold ideas.',
    ep9_1: 'Greetings! I am Pietro, a minstrel. I play at every fair, but my lute went silent: somebody replaced the strings with spaghetti!',
    ep9_2: 'Spaghetti? That may be tasty, but it does not make much melody.',
    ep9_3: 'It was not me! I merely decided that minstrels must dine. A lot. Right during the concert.',
    ep9_4: 'Aha, so that is who sent the strings to dinner! No strings, no music, and no music, no fair!',
    ep9_5: 'Shnyr, tell the truth: where are the real strings?',
    ep9_6: 'Thank you! The lute sings, the fair buzzes, and the spaghetti is finally on a plate.',
    ep9_7: 'Renaissance is when old things suddenly sound new.',
    ep9_8: 'Tick-tock. Even I sometimes think the past tastes better than the present.',
    ep9_o1: 'Then let us play an orchestra of spaghetti: it is a new fashion!', ep9_o2: 'Give back the strings and I will help you with lunch.', ep9_r1: 'An orchestra of spaghetti? Count me in! Just let nobody eat the instruments.', ep9_r2: 'Mm-hm... The strings are in my pocket. Lunch is on you and we are even!',
    speaker_pietro: 'Pietro the Rooster',
    guestSay_pietro_0: 'The lute sings, the fair buzzes!',
    guestSay_pietro_1: 'Follow the song, follow me!',
    guestSay_pietro_2: 'Renaissance is when everything sounds again.',

    team_sonia_say_3: 'Debit and credit are friends. Mostly.', team_sonia_say_4: 'I count at night, when everyone sleeps. Hoo.', team_sonia_say_5: 'A penny saved, a balance earned.',
    team_kria_say_3: 'Quack! There was a puddle, now there isn\'t.', team_kria_say_4: 'It\'s clean where the duck cleans.', team_kria_say_5: 'Sweep with the tail, wipe with the paws!',

    team_leo_say_3: 'Let\'s sync up. And then sync again.', team_leo_say_4: 'I have a plan. And a plan for the plan.', team_leo_say_5: 'Cunning is just efficiency in a fur coat.',

// Пори року (налаштування «Пора року»): auto — за датою на пристрої
const SEASONS = ['auto', 'spring', 'summer', 'autumn', 'winter', 'halloween'];

/* =====================================================================
   СТАН ГРИ (весь стан — в одному об'єкті state)
   ===================================================================== */

function createDefaultState() {
  return {
    lang: null,                        // 'uk' | 'en'; null — ще не обрано

    totalEarned: CONFIG.START_COINS,

    shopLevel: 1,                      // 1 = крамничка ... 6 = торговий центр
    depts: DEPARTMENTS.map(() => 0),   // скільки штук кожного відділу куплено
    team: TEAM.map(() => 0),           // рівень кожного звірятка: 0 — не найняте, 1…10
    story: { done: 0, shnyrFriend: false, finale: false, nights: 0, guests: [0, 0, 0, 0, 0, 0, 0, 0, 0], choices: [0, 0, 0, 0, 0, 0, 0, 0, 0], shnyrJoined: false },   // done — скільки глав прочитано; nights — скільки ночей минуло після торгового центру (потрібно 3)
    // Події: час (мс від 1970 р.) наступного розпродажу / неприємності та активні бусти
    events: { nextSale: 0, saleUntil: 0, nextTrouble: 0, incomeBoostUntil: 0, incomeBoostMult: 1, tapBoostUntil: 0, tapBoostMult: 1, nextMail: 0, mailPending: 0 },
    wheel: { lastSpin: 0, streak: 0 },                       // колесо фортуни
    stats: { ghostsCaught: 0, raccoonsCaught: 0, raccoonsLost: 0, wheelSpins: 0, timeTravels: 0, puddlesFixed: 0, deptsBought: 0, milestones: 0, teamMaxLevel: 0, maxLevel: 1, holidaysSeen: 0, jackpots: 0 },
    // звук 0…1; анімації; формат чисел; стать гравця ('f' / 'm'); день і ніч; чи відкрите меню; чи бачив підказку про гортання
    settings: { musicVol: 0.6, sfxVol: 0.8, musicStyle: 0, muted: false, animations: true, numFmt: 'short', gender: 'f', dayNight: true, panelOpen: true, panHintSeen: false, season: 'auto' },
    dayPhase: 0.3,                     // час доби 0…1: 0.25 — схід сонця, 0.5 — полудень, 0.75 — захід, 0 — північ
    epochIntroSeen: -1,                // для якої епохи вже показали заставку-анімацію
    ghosts: 0,                         // кристали привидів (їх дають за ловлю привидів на Хелловін; 12 штук = ще один оберт колеса)
    // Подорож у часі: кристали, епоха, покращення майстерні, знайомі звірята
    crystals: 0, crystalsTotal: 0, epoch: 0, runStartEarned: 0,
    ws: WORKSHOP.map(() => 0),
    teamKnown: TEAM.map(() => 0),
    ach: ACHIEVEMENTS.map(() => 0),     // 1 — досягнення отримано
    tutorialDone: false,
    buyMode: 1,                        // 1 | 10 | 100 | 'max'
    pendingOffline: 0,                 // офлайн-заробіток, який ще не забрали

const state = createDefaultState();

/* ---------- Відділи й дохід ---------- */

// Скільки віх уже пройдено при такій кількості
function milestonesReached(count) {
  return CONFIG.MILESTONES.filter(m => count >= m).length;
}
function nextMilestone(count) {
  const m = CONFIG.MILESTONES.find(x => count < x);
  return m === undefined ? null : m;
}
function levelMult(level = state.shopLevel) {
  return Math.pow(CONFIG.LEVEL_MULT, level - 1);
}
/* ---------- Бонуси команди ---------- */
function teamLevelOf(id) {
  const i = TEAM.findIndex(m => m.id === id);
  return i < 0 ? 0 : state.team[i];
}
// Сума бонусів одного типу від усіх найнятих звіряток (значення × рівень), з обмеженням cap
function teamBonus(type, field = 'per') {
  let sum = 0;
  TEAM.forEach((m, i) => {
    if (m.bonus.type !== type || state.team[i] <= 0) return;
    let v = m.bonus[field] * state.team[i];
    if (field === 'per' && m.bonus.cap !== undefined) v = Math.min(v, m.bonus.cap);
    sum += v;
  });
  return sum;
}
// Множник доходу відділу i від звіряток (Зоя, Михась, Мурзик, Жужа)
function teamDeptMult(i) {
  let mult = 1;
  TEAM.forEach((m, k) => {
    if (m.bonus.type === 'deptIncome' && state.team[k] > 0 && m.bonus.depts.includes(i)) mult *= 1 + m.bonus.per * state.team[k];
  });
  return mult;
}
function teamGlobalMult() { return 1 + teamBonus('global'); }
// Рівень покращення майстерні (за кристали)
function wsLevel(id) { const i = WORKSHOP.findIndex(w => w.id === id); return i < 0 ? 0 : state.ws[i]; }
function crystalMult() { return 1 + CONFIG.CRYSTAL_INCOME_BONUS * state.crystalsTotal; }
function costMult() { return (1 - teamBonus('deptCost')) * (1 - 0.03 * wsLevel('cheaperDepts')); }              // Тома: відділи дешевші
function expandCostMult() { return 1 - teamBonus('expandCost'); }       // Бодя: розширення дешевші
function offlineRate() { return Math.min(1, CONFIG.OFFLINE_RATE + teamBonus('offline', 'rate') + 0.1 * wsLevel('offlineRate')); }          // Соня
function offlineMaxHours() { return CONFIG.OFFLINE_MAX_HOURS + teamBonus('offline', 'hours') + 4 * wsLevel('offlineHours'); }
// Для наступних етапів: шанс появи єнота (Тоня), сила свят (Пао), швидкість ремонту (Кря)
function thiefChanceMult() { return (1 - teamBonus('thief')) * (1 - 0.1 * wsLevel('thiefLess')); }
function eventPowerMult() { return 1 + teamBonus('event'); }
function fixSpeedMult() { return 1 + teamBonus('fix'); }

// Дохід одної штуки відділу (з віхами, рівнем магазину й бонусом звіряток)
function deptIncomeEach(i) {
  const d = DEPARTMENTS[i];
  return d.baseIncome * Math.pow(CONFIG.MILESTONE_MULT, milestonesReached(state.depts[i])) * levelMult() * teamDeptMult(i) *
    (1 + holidayDeptBonus(i) * eventPowerMult());
}
// Тимчасові множники: розпродаж, чорна п'ятниця, свято, бусти з колеса, протікання даху (Пао підсилює свята й розпродажі)
function tempIncomeMult() {
  const now = Date.now(), power = eventPowerMult();
  let m = 1;
  if (theme.blackFriday) m *= 1 + (CONFIG.BLACK_FRIDAY_MULT - 1) * power;
  else if (state.events.saleUntil > now) m *= 1 + (CONFIG.SALE_MULT - 1) * power;
  m *= 1 + holidayGlobalBonus() * power;
  if (state.events.incomeBoostUntil > now) m *= state.events.incomeBoostMult;
  if (trouble && trouble.type === 'leak') m *= 1 - CONFIG.LEAK_INCOME_PENALTY;
  return m;
}
function tapBoostMult() { return state.events.tapBoostUntil > Date.now() ? state.events.tapBoostMult : 1; }
// Перерахунок похідних величин
function recalcIncome() {
  let sum = 0;
  DEPARTMENTS.forEach((d, i) => { sum += state.depts[i] * deptIncomeEach(i); });
  state.cps = sum * teamGlobalMult() * tempIncomeMult() * crystalMult();
}
// Скільки монеток дає один тап: база × рівень магазину + частка доходу за секунду, ще × бонус Голки.
// Тож тап росте разом з доходом: 1 → десятки → сотні → тисячі → мільйони…
function tapValue() {
  const base = state.tapPower * levelMult() + state.cps * CONFIG.TAP_CPS_SHARE;
  return base * (1 + teamBonus('tap')) * (1 + 0.5 * wsLevel('tapPower')) * tapBoostMult();
}
function isDeptUnlocked(i) {
  return DEPARTMENTS[i].level <= state.shopLevel;
}

// Ціна n штук відділу i, якщо вже куплено count
function deptCost(i, n, count = state.depts[i]) {
  const r = CONFIG.COST_GROWTH;
  return DEPARTMENTS[i].baseCost * costMult() * Math.pow(r, count) * (Math.pow(r, n) - 1) / (r - 1);
}
// Скільки штук можна купити на всі наявні монетки
function maxAffordable(i, coins = state.coins) {
  const r = CONFIG.COST_GROWTH;
  const first = DEPARTMENTS[i].baseCost * costMult() * Math.pow(r, state.depts[i]);
  if (!(coins >= first)) return 0;
  let n = Math.floor(Math.log(1 + coins * (r - 1) / first) / Math.log(r));
  if (!isFinite(n)) return 0;
  n = Math.min(n, 100000);
  while (n > 0 && deptCost(i, n) > coins) n--;
  while (n < 100000 && deptCost(i, n + 1) <= coins) n++;
  return n;
}
// Скільки штук покаже кнопка зараз (для МАКС — скільки реально можна купити, мінімум 1)
function plannedBuy(i) {
  if (state.buyMode === 'max') return Math.max(1, maxAffordable(i));
  return state.buyMode;
}

/* ---------- Розширення магазину ---------- */
function nextLevelDef() {
  return state.shopLevel < LEVELS.length ? LEVELS[state.shopLevel] : null;
}
function requirementsMet(def) {
  return def.requires.every(r => state.depts[r.dept] >= r.count);
}
function expandCost(def) { return def.cost * expandCostMult(); }

/* ---------- Команда: найм і прокачка ---------- */
function isTeamUnlocked(i) { return TEAM[i].level <= state.shopLevel && (!TEAM[i].needs || !!state.story[TEAM[i].needs]); }
// Ціна переходу звірятка на рівень lvl (lvl = 1 — найм)
function teamCost(i, lvl) {
  const known = lvl === 1 && state.teamKnown[i] ? CONFIG.TEAM_KNOWN_DISCOUNT : 1;   // знайоме звірятко наймати дешевше
  return TEAM[i].baseCost * Math.pow(CONFIG.TEAM_LEVEL_COST_GROWTH, lvl - 1) * known * (1 - 0.05 * wsLevel('cheaperTeam'));
}

/* =====================================================================
   ЗБЕРЕЖЕННЯ
   ===================================================================== */

let storageOk = true;

// Міграції старих збережень: ключ N — функція, що перетворює версію N у N+1.
// Додаючи нові поля в state, нічого ламати не треба: відсутні поля беруться зі значень за замовчуванням.
const SAVE_MIGRATIONS = {
  // версія 1 (етап 1) → 2 (етап 2): з'явилися відділи, офлайн-заробіток та режим покупки
  1: (data) => {
    if (data.state && !Array.isArray(data.state.depts)) data.state.depts = DEPARTMENTS.map(() => 0);
    return data;
  },
  // версія 2 (етап 2) → 3 (етап 3): з'явилася команда звіряток
  2: (data) => {
    if (data.state && !Array.isArray(data.state.team)) data.state.team = TEAM.map(() => 0);
    return data;
  },
  // версія 3 (етап 3) → 4 (етап 4): з'явився сюжет. Глави, умови яких гравець уже виконав,
  // вважаємо прочитаними — щоб вони не посипалися всі одразу (їх можна перечитати у вкладці «Історія»)
  // версія 4 (етап 4) → 5 (етап 5): з'явилися події, колесо й статистика — нові поля беруться зі значень за замовчуванням
  4: (data) => data,
  // версія 5 (етап 5) → 6 (етап 6): з'явилися налаштування звуку — беруться зі значень за замовчуванням
  5: (data) => data,
  // версія 6 (етап 6) → 7 (етап 7): гравець, що вже грає, туторіал не бачить; уже найнятих звіряток вважаємо знайомими
  // версія 7 → 8: день і ніч вмикаємо знову (раніше його можна було вимкнути випадково й не помітити)
  7: (data) => {
    if (data.state && data.state.settings) data.state.settings.dayNight = true;
    return data;
  },
  6: (data) => {
    const s = data.state;
    if (s) {
      s.tutorialDone = true;
      if (Array.isArray(s.team)) s.teamKnown = s.team.map(v => (v > 0 ? 1 : 0));
    }
    return data;
  },
  3: (data) => {
    const s = data.state;
    if (s && !s.story) {
      let done = 0;
      while (done < CHAPTERS.length && triggerMet(CHAPTERS[done].trigger, s)) done++;
      s.story = { done, shnyrFriend: done >= 6, finale: done >= 8 };
    }
    return data;
  }
};

function migrateSave(data) {
  let v = Number(data.v) || 1;
  while (v < CONFIG.SAVE_VERSION) {
    const step = SAVE_MIGRATIONS[v];
    if (step) data = step(data);
    v++;
  }
  data.v = CONFIG.SAVE_VERSION;
  return data;
}

// Переносимо в target лише ті поля з src, що існують у target і мають той самий тип
function mergeInto(target, src) {
  if (!src || typeof src !== 'object') return;
  for (const key of Object.keys(target)) {
    if (!(key in src)) continue;
    const a = target[key], b = src[key];
    if (key === 'buyMode') {
      if (CONFIG.BUY_MODES.includes(b)) target[key] = b;
    } else if (a && typeof a === 'object' && !Array.isArray(a)) {
      mergeInto(a, b);
    } else if (Array.isArray(a)) {
      if (Array.isArray(b)) {
        // довжину масиву лишаємо за новим станом, значення беремо зі збереження
        for (let i = 0; i < a.length; i++) if (typeof b[i] === 'number' && isFinite(b[i]) && b[i] >= 0) a[i] = Math.floor(b[i]);
      }
    } else if (typeof a === 'number') {
      if (typeof b === 'number' && isFinite(b)) target[key] = b;
    } else if (a === null) {
      if (typeof b === 'string') target[key] = b;
    } else if (typeof a === typeof b) {
      target[key] = b;
    }
  }
}

function saveGame() {
  if (savingDisabled) return;
  try {
    state.savedAt = Date.now();
    localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify({ v: CONFIG.SAVE_VERSION, state }));
    if (!storageOk) { storageOk = true; updateSaveWarning(); }
  } catch (e) {
    if (storageOk) { storageOk = false; updateSaveWarning(); }
  }
}

function loadGame() {
  let raw = null;
  try {
    raw = localStorage.getItem(CONFIG.SAVE_KEY);
  } catch (e) {
    storageOk = false;
    return false;
  }
  if (!raw) return false;
  try {
    const data = migrateSave(JSON.parse(raw));
    mergeInto(state, data.state);
    state.shopLevel = Math.max(1, Math.min(LEVELS.length, Math.floor(state.shopLevel)));
    if (state.settings.gender !== 'm') state.settings.gender = 'f';
    if (!SEASONS.includes(state.settings.season)) state.settings.season = 'auto';
    state.ghosts = Math.max(0, Math.min(CONFIG.GHOST_MAX, Math.floor(state.ghosts)));
    if (!(state.dayPhase >= 0 && state.dayPhase < 1)) state.dayPhase = 0.3;
    return true;
  } catch (e) {
    // Пошкоджене збереження: відкладаємо копію вбік і починаємо з нуля
    try { localStorage.setItem(CONFIG.SAVE_KEY + '_broken', raw); } catch (e2) { /* нічого */ }
    return false;
  }
}

/* =====================================================================
   ТЕКСТИ І ФОРМАТУВАННЯ ЧИСЕЛ
   ===================================================================== */

function t(key, ...args) {
  const dict = translations[state.lang] || translations.en;
  const male = state.settings.gender === 'm' ? GENDER_TEXTS.m[state.lang] : null;   // чоловічі варіанти, якщо є
  let str = male && male[key] !== undefined ? male[key] : dict[key];
  if (str === undefined) str = translations.en[key];
  if (str === undefined) return key;
  if (str.includes('💎')) str = str.replace(/💎/g, EPOCH_GEM_EMOJI[state.epoch % EPOCH_GEM_EMOJI.length]);      // кристал виглядає за стилем епохи
  return str.replace(/\{(\d+)\}/g, (_, i) => (args[i] !== undefined ? args[i] : ''));
}

// Суфікс розряду: 0..4 — зі словника мови, далі aa, ab, ac, ... az, ba ...
function tierSuffix(tier, fmt) {
  if (tier < fmt.suffixes.length) return fmt.suffixes[tier];
  const idx = tier - fmt.suffixes.length;
  const first = Math.floor(idx / 26);
  if (first >= 26) return null;
  return String.fromCharCode(97 + first) + String.fromCharCode(97 + (idx % 26));
}

// 1500 → «1,5 тис.» / «1.5K». maxDecimals — скільки знаків після коми показувати для чисел < 1000
function formatNumber(value, lang, maxDecimals = 0) {
  const fmt = NUMBER_FORMAT[lang] || NUMBER_FORMAT.en;
  if (!isFinite(value)) return '∞';
  const sign = value < 0 ? '-' : '';
  let n = Math.abs(value);
  const mode = (state.settings && state.settings.numFmt) || 'short';
  if (n >= 1000 && mode === 'sci') {            // 1.5e6
    const e = Math.floor(Math.log10(n));
    return sign + String(parseFloat((n / Math.pow(10, e)).toFixed(2))).replace('.', fmt.decimal) + 'e' + e;
  }
  if (n >= 1000 && n < 1e15 && mode === 'full') {   // 1 500 000
    return sign + Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, lang === 'uk' ? ' ' : ',');
  }

  if (n < 1000) {
    const s = String(parseFloat(n.toFixed(maxDecimals)));
    if (parseFloat(s) < 1000) return sign + s.replace('.', fmt.decimal);
  }

  let tier = 0;
  while (n >= 1000) { n /= 1000; tier++; }
  const decimalsFor = x => (x < 10 ? 2 : x < 100 ? 1 : 0);
  let rounded = parseFloat(n.toFixed(decimalsFor(n)));
  if (rounded >= 1000) { rounded = 1; tier++; }   // 999,96 тис. → 1 млн
  const suffix = tierSuffix(tier, fmt);

const spriteCache = new Map();

// Перетворює спрайт-масив рядків на маленький canvas (кешується)
function getSpriteCanvas(name, variant) {
  const key = name + '|' + (variant || '');
  if (spriteCache.has(key)) return spriteCache.get(key);
  const spr = SPRITES[name];
  const over = (variant && spr.variants && spr.variants[variant]) || {};
  const rows = spr.rows;
  const w = rows[0].length, h = rows.length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    if (row.length !== w) console.warn('Спрайт «' + name + '»: рядок ' + y + ' має довжину ' + row.length + ', а має бути ' + w);
    for (let x = 0; x < w; x++) {
      const ch = row[x];
      if (ch === '.' || ch === ' ' || ch === undefined) continue;
      const color = over[ch] || PALETTE[ch];
      if (!color) { console.warn('Спрайт «' + name + '»: невідомий колір «' + ch + '»'); continue; }
      g.fillStyle = color;
      g.fillRect(x, y, 1, 1);
    }
  });
  spriteCache.set(key, c);
  return c;
}

// Контур для звіряток: тіні-силуети, зсунуті на піксель у чотири боки, роблять спрайт чітким на будь-якому тлі

const outlineCache = new Map();
function getOutlinedCanvas(name, variant) {
  const key = name + '|' + (variant || '');
  if (outlineCache.has(key)) return outlineCache.get(key);
  const s = getSpriteCanvas(name, variant);
  const c = document.createElement('canvas');
  c.width = s.width + 2; c.height = s.height + 2;
  const g = c.getContext('2d');
  const sil = document.createElement('canvas');
  sil.width = s.width; sil.height = s.height;
  const sg = sil.getContext('2d');
  sg.drawImage(s, 0, 0);
  sg.globalCompositeOperation = 'source-in';
  sg.fillStyle = PALETTE.k;
  sg.fillRect(0, 0, s.width, s.height);

// Малює canvas із масштабуванням відносно нижнього центру.
// opts: flip (дзеркало), sx / sy (розтяг), alpha
function drawCanvasSprite(ctx, c, x, y, opts = {}) {
  const sx = opts.sx || 1, sy = opts.sy || 1;
  const w = c.width, h = c.height;
  const dw = Math.max(1, Math.round(w * sx));
  const dh = Math.max(1, Math.round(h * sy));
  const dx = Math.round(x + (w - dw) / 2);
  const dy = Math.round(y + (h - dh));
  if (opts.alpha !== undefined && opts.alpha < 1) ctx.globalAlpha = Math.max(0, opts.alpha);
  if (opts.flip) {
    ctx.save();
    ctx.translate(dx + dw, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(c, 0, dy, dw, dh);
    ctx.restore();
  } else {
    ctx.drawImage(c, dx, dy, dw, dh);
  }

}

// Головна функція малювання спрайта за назвою (x, y — лівий верхній кут)
function drawSprite(ctx, name, x, y, opts = {}) {
  if (OUTLINED.test(name)) drawCanvasSprite(ctx, getOutlinedCanvas(name, opts.variant), x - 1, y - 1, opts);

  const my = Math.min(H - 48, 188);                                   // люки: один ряд уздовж дороги, не часто
  for (let mx = Math.floor(x0 / 120) * 120 + 60; mx < x0 + W - 8; mx += 120) manholeG(g, mx + (hash2(mx, 3) % 21) - 10, my + (hash2(3, mx) % 5) - 2);

  houseLit = buildLitLayer(houseGlass);
  return c;
}
// Смуга дороги знизу сцени: асфальт, пунктир, острівець із поштоматом і затока для поштової машини з розміткою
function drawRoadG(g, x0, W, H) {

  for (let x = Math.floor(x0 / 14) * 14; x < x0 + W; x += 14) if (x < bx - 42 || x > bx + 26) R(g, x, top + 18, 8, 1, 'y');

  g.globalAlpha = 0.3; R(g, bx - 21, top + 9, 46, 24, 'e'); g.globalAlpha = 1;

  for (let y = top + 9; y < top + 33; y += 4) { R(g, bx + 24, y, 1, 2, 'y'); }

  for (let y = top + 9; y < top + 33; y++) for (let x = bx - 39; x < bx - 21; x++) if ((x + y) % 7 < 2) R(g, x, y, 1, 1, 'y');

function manholeG(g, x, y) {                  // люк у перспективі (приплюснутий овал)
  const hw = [4, 6, 7, 7, 7, 6, 4];
  R(g, x - 4, y - 4, 9, 1, 'd'); R(g, x - 4, y + 4, 9, 1, 'd');
  for (let i = 0; i < 7; i++) { R(g, x - hw[i] - 1, y + i - 3, hw[i] * 2 + 3, 1, 'd'); R(g, x - hw[i], y + i - 3, hw[i] * 2 + 1, 1, 'e'); }
  g.globalAlpha = 0.55; R(g, x - 5, y - 1, 11, 1, 'd'); R(g, x - 5, y + 1, 11, 1, 'd'); R(g, x, y - 3, 1, 7, 'd'); g.globalAlpha = 1;
