}
function actorSay(a) {
  const m = TEAM[a.i];
  showBubble('t' + a.i, t('team_' + m.id + '_say_' + Math.floor(Math.random() * TEAM_PHRASES)), a.x, a.y - 19);
}
function capySay() {
  const c = LAYOUT.capy;
  showBubble('capy', t('capy_say_' + Math.floor(Math.random() * CAPY_PHRASES)), c.x + 12, c.footY - 26);
}

// Найняти або прокачати звірятко
function hireOrUpgrade(i) {
  const lvl = state.team[i];
  if (!isTeamUnlocked(i) || lvl >= CONFIG.TEAM_MAX_LEVEL) return;
  const cost = teamCost(i, lvl + 1);
  if (!(state.coins >= cost)) return;
  state.coins -= cost;
  state.team[i] = lvl + 1;
  state.teamKnown[i] = 1;
  state.stats.teamMaxLevel = Math.max(state.stats.teamMaxLevel, lvl + 1);
  recalcIncome();
  const name = t('team_' + TEAM[i].id);
  if (lvl === 0) {
    syncActors();
    const a = actors.find(x => x.i === i);
    a.hop = 1;
    spawnDust(a.x, a.y - 2, 6);
    showToast(t('teamHired', name), 'big');
    playSfx('hire');
    actorSay(a);
  } else {
    showToast(t('teamUpgraded', name, lvl + 1), 'good');
    playSfx('upgrade');
  }
  updateUI();
}

/* ---------- Покупці ---------- */
function customerTarget() {
  if (state.cps <= 0) return 1;
  return Math.min(CONFIG.MAX_CUSTOMERS, 2 + Math.floor(Math.log10(state.cps + 1) * 1.5));
}
function spawnCustomer() {
  const fromLeft = Math.random() < 0.5;
  const lane = rand(LAYOUT.lane.min, LAYOUT.lane.max);
  const goesShopping = Math.random() < 0.7;
  const c = {
    type: CUSTOMER_TYPES[Math.floor(Math.random() * CUSTOMER_TYPES.length)],
    x: fromLeft ? -14 : CONFIG.SCENE_W + 14,
    y: lane, lane,
    dir: fromLeft ? 1 : -1,
    speed: rand(16, 26),
    anim: rand(0, 2),
    mode: goesShopping ? 'toDoor' : 'pass',
    doorX: shop.x + shop.door.x + shop.door.w / 2 + rand(-4, 4),
    passTo: fromLeft ? CONFIG.SCENE_W + 16 : -16,
    alpha: 1, t: 0, stay: 0,
    bag: null
  };
  customers.push(c);
}
function updateCustomers(dt) {
  customerTimer -= dt;
  if (customerTimer <= 0) {
    customerTimer = rand(1.2, 3.2);
    if (customers.length < customerTarget()) spawnCustomer();
  }
  for (let i = customers.length - 1; i >= 0; i--) {
    const c = customers[i];
    c.anim += dt;
    const step = c.speed * dt;
    switch (c.mode) {
      case 'pass':
        c.x += c.dir * step;
        if ((c.dir > 0 && c.x >= c.passTo) || (c.dir < 0 && c.x <= c.passTo)) customers.splice(i, 1);
        break;
      case 'toDoor': {
        const dx = c.doorX - c.x;
        if (Math.abs(dx) <= step) { c.x = c.doorX; c.mode = 'toEntrance'; }
        else { c.dir = Math.sign(dx); c.x += c.dir * step; }
        break;
      }
      case 'toEntrance':
        c.y -= step * 0.8;
        if (c.y <= LAYOUT.curbY + 5) { c.y = LAYOUT.curbY + 5; c.mode = 'entering'; c.t = 0; }
        break;
      case 'entering':
        c.t += dt;
        c.alpha = Math.max(0, 1 - c.t / 0.3);
        if (c.t >= 0.3) { c.mode = 'inside'; c.t = 0; c.stay = rand(2, 4.5); }
        break;
      case 'inside':
        c.t += dt;
        if (c.t >= c.stay) {
          c.mode = 'exiting'; c.t = 0;
          c.bag = BAG_COLORS[Math.floor(Math.random() * BAG_COLORS.length)];
          c.dir = Math.random() < 0.5 ? 1 : -1;
          c.passTo = c.dir > 0 ? CONFIG.SCENE_W + 16 : -16;
        }
        break;
      case 'exiting':
        c.t += dt;
        c.alpha = Math.min(1, c.t / 0.25);
        c.y += step * 0.8;
        if (c.y >= c.lane) { c.y = c.lane; c.mode = 'pass'; c.alpha = 1; }
        break;
    }
  }
}
function drawCustomer(c) {
  if (c.mode === 'inside') return;
  const moving = c.mode !== 'entering';
  const frame = moving ? Math.floor(c.anim * 6) % 2 : 0;
  const bob = frame ? -1 : 0;
  const x = Math.round(c.x - 8), y = Math.round(c.y - 16) + bob;
  ctx.globalAlpha = 0.2 * c.alpha; R(ctx, x + 2, Math.round(c.y), 12, 1, 'd'); ctx.globalAlpha = 1;
  drawSprite(ctx, c.type + '_' + frame, x, y, { flip: c.dir < 0, alpha: c.alpha });
  if (hasHats() && c.alpha > 0.9) drawHat(c.dir > 0 ? x + 12 : x + 3, y + 3);
  if (c.bag) {   // пакет з покупками
    const bx = c.dir > 0 ? x + 13 : x + 1;
    R(ctx, bx, y + 9, 1, 1, 'd');
    R(ctx, bx - 1, y + 10, 4, 5, c.bag);
    R(ctx, bx - 1, y + 10, 4, 1, 'w');
  }
}

function updateAnimations(dt) {
  // пружина: стискання → повернення з легким відскоком
  const steps = Math.max(1, Math.ceil(dt / 0.01));
  const h = dt / steps;
  for (let i = 0; i < steps; i++) {
    shopAnim.vel += (-420 * shopAnim.squash - 16 * shopAnim.vel) * h;
    shopAnim.squash += shopAnim.vel * h;
  }
  if (Math.abs(shopAnim.squash) < 0.001 && Math.abs(shopAnim.vel) < 0.01) { shopAnim.squash = 0; shopAnim.vel = 0; }

  // Капі кліпає
  if (capyAnim.blinkLeft > 0) {
    capyAnim.blinkLeft -= dt;
  } else {
    capyAnim.blinkIn -= dt;
    if (capyAnim.blinkIn <= 0) { capyAnim.blinkLeft = 0.14; capyAnim.blinkIn = rand(2.5, 5.5); }
  }

  // хмаринки пливуть
  clouds.forEach(c => {
    c.x += c.speed * dt;
    if (c.x > CONFIG.SCENE_W + 4) c.x = -28;
  });

  if (build) updateBuild(dt);
  updateCustomers(dt);
  updateActors(dt);
  updateCameos(dt);

  // монетки: політ, гравітація, зникання
  for (let i = fx.coins.length - 1; i >= 0; i--) {
    const p = fx.coins[i];
    p.age += dt;
    p.vy += 320 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.age >= p.life) fx.coins.splice(i, 1);
  }
  for (let i = fx.sparks.length - 1; i >= 0; i--) {
    const p = fx.sparks[i];
    p.age += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.age >= p.life) fx.sparks.splice(i, 1);
  }
  for (let i = fx.dust.length - 1; i >= 0; i--) {
    const p = fx.dust[i];
    p.age += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.age >= p.life) fx.dust.splice(i, 1);
  }
}

/* =====================================================================
   ЗВУК: 8-бітна музика та ефекти через Web Audio API (без аудіофайлів)
   ===================================================================== */

const audio = {
  ctx: null, master: null, musicGain: null, sfxGain: null, noiseBuf: null,
  track: null, timer: null, lastTick: 0, lastTyping: 0
};
const MUSIC_PARSED = {};      // розібрані мелодії: канали з подіями { step, len, tok }
const NOTE_INDEX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

// «C#5» → частота в герцах
function noteFreq(name) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(name);
  if (!m) return 0;
  let n = NOTE_INDEX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  n += (Number(m[3]) + 1) * 12;               // номер MIDI
  return 440 * Math.pow(2, (n - 69) / 12);
}

// Розбирає мелодії з масивів нот у списки подій
function parseMusic() {
  Object.keys(MUSIC).forEach(id => {
    const def = MUSIC[id];
    const channels = def.channels.map(ch => {
      const text = Array.isArray(ch.pattern) ? ch.pattern.join(' ') : ch.pattern;
      let step = 0;
      const events = text.trim().split(/\s+/).map(tok => {
        const [name, len] = tok.split(':');
        const e = { step, len: parseInt(len, 10) || 1, tok: name };
        step += e.len;
        return e;
      });
      return { wave: ch.wave, vol: ch.vol, events, total: step };
    });
    const total = channels[0].total;
    channels.forEach(c => { if (c.total !== total) console.warn('Музика «' + id + '»: канал має ' + c.total + ' кроків замість ' + total); });
    MUSIC_PARSED[id] = { bpm: def.bpm, channels, total };
  });
}

/* ---------- Запуск і гучність ---------- */
// Браузери дозволяють звук лише після першого дотику — тому створюємо контекст у відповідь на жест
function initAudio() {
  if (audio.ctx) { resumeAudio(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const ac = new AC();
    audio.ctx = ac;
    const comp = ac.createDynamicsCompressor();
    audio.master = ac.createGain();
    audio.musicGain = ac.createGain();
    audio.sfxGain = ac.createGain();
    audio.musicGain.connect(audio.master);
    audio.sfxGain.connect(audio.master);
    audio.master.connect(comp);
    comp.connect(ac.destination);
    // білий шум для ударних (1 секунда, перевикористовується)
    const buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    audio.noiseBuf = buf;
    applyVolumes(true);
    audio.timer = setInterval(tickMusic, 40);
    resumeAudio();
    updateMusic();
  } catch (e) {
    audio.ctx = null;
  }
}
// «Будить» звук на телефонах: iPhone і Android засинають, поки не було дотику; resume() треба викликати прямо в обробнику дотику.
// Тихий порожній звук допомагає iOS остаточно «розблокувати» аудіо.
function unlockSilent() {
  try {
    const ac = audio.ctx, src = ac.createBufferSource();
    src.buffer = ac.createBuffer(1, 1, 22050);
    src.connect(ac.destination);
    src.start(0);
  } catch (e) { /* нічого */ }
}
function resumeAudio() {
  const ac = audio.ctx;
  if (!ac || document.hidden) return;
  if (ac.state !== 'running') {
    const p = ac.resume();
    if (p && p.then) p.then(unlockSilent, () => {});
  }
  unlockSilent();
}
function applyVolumes(instant) {
  if (!audio.ctx) return;
  const s = state.settings;
  const m = s.muted ? 0 : s.musicVol * 0.55, f = s.muted ? 0 : s.sfxVol * 0.9;
  const now = audio.ctx.currentTime;
  if (instant) { audio.musicGain.gain.value = m; audio.sfxGain.gain.value = f; return; }
  audio.musicGain.gain.setTargetAtTime(m, now, 0.05);
  audio.sfxGain.gain.setTargetAtTime(f, now, 0.05);
}

/* ---------- Інструменти ---------- */
// Одна нота з простою обвідною (щоб не клацало)
function tone(dest, wave, f0, t0, dur, vol, f1) {
  const ac = audio.ctx;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = wave;
  osc.frequency.setValueAtTime(f0, t0);
  if (f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.006);
  g.gain.setValueAtTime(vol, t0 + Math.max(0.007, dur * 0.65));
  g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(dest);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}
// Сплеск шуму крізь фільтр — ударні, плюскіт, цокіт молотка
function noiseHit(dest, t0, dur, vol, filterType, freq) {
  const ac = audio.ctx;
  const src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = audio.noiseBuf;
  flt.type = filterType; flt.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(flt); flt.connect(g); g.connect(dest);
  src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.02);
}
function drum(dest, kind, t0, vol) {
  if (kind === 'k') tone(dest, 'triangle', 150, t0, 0.13, vol * 1.6, 45);
  else if (kind === 's') noiseHit(dest, t0, 0.12, vol, 'bandpass', 1800);
  else if (kind === 'h') noiseHit(dest, t0, 0.05, vol * 0.7, 'highpass', 7000);
}

/* ---------- Музика ---------- */
function desiredTrack() {
  if (theme.holiday && theme.holiday.music && MUSIC[theme.holiday.music]) return theme.holiday.music;
  return MUSIC_BY_LEVEL[Math.min(MUSIC_BY_LEVEL.length, state.shopLevel) - 1];
}
// Перемикає мелодію плавно: стара стихає, нова наростає
function updateMusic() {
  if (!audio.ctx) return;
  const id = desiredTrack();
  if (audio.track && audio.track.id === id) return;
  const ac = audio.ctx, now = ac.currentTime;
  if (audio.track) {
    const old = audio.track;
    old.stopped = true;
    old.gain.gain.cancelScheduledValues(now);
    old.gain.gain.setTargetAtTime(0, now, 0.15);
    setTimeout(() => { try { old.gain.disconnect(); } catch (e) { /* нічого */ } }, 1600);
  }
  const gain = ac.createGain();
  gain.gain.value = 0;
  gain.gain.setTargetAtTime(1, now + 0.1, 0.25);
  gain.connect(audio.musicGain);
  const def = MUSIC_PARSED[id];
  audio.track = { id, def, gain, start: now + 0.15, pos: def.channels.map(() => ({ idx: 0, loop: 0 })), stopped: false };
}
// Планувальник: заздалегідь ставить у чергу ноти, що зазвучать найближчими 0,25 с
function tickMusic() {
  const ac = audio.ctx, tr = audio.track;
  if (!ac || !tr || tr.stopped || ac.state !== 'running') return;
  const stepDur = 60 / tr.def.bpm / 4;
  const horizon = ac.currentTime + 0.25;
  tr.def.channels.forEach((ch, c) => {
    const p = tr.pos[c];
    for (let guard = 0; guard < 64; guard++) {
      const ev = ch.events[p.idx];
      const t = tr.start + (p.loop * ch.total + ev.step) * stepDur;
      if (t > horizon) break;
      if (t > ac.currentTime - 0.05 && ev.tok !== '.') {
        if (ch.wave === 'noise') drum(tr.gain, ev.tok, t, ch.vol);
        else tone(tr.gain, ch.wave, noteFreq(ev.tok), t, ev.len * stepDur * 0.92, ch.vol);
      }
      p.idx++;
      if (p.idx >= ch.events.length) { p.idx = 0; p.loop++; }
    }
  });
}

/* ---------- Звукові ефекти ---------- */
// мелодія з пар [нота, тривалість]
function melody(wave, notes, vol, gap = 0) {
  const ac = audio.ctx;
  let t = ac.currentTime + 0.01;
  notes.forEach(([n, d]) => {
    if (n !== '.') tone(audio.sfxGain, wave, typeof n === 'number' ? n : noteFreq(n), t, d * 0.95, vol);
    t += d + gap;
  });
}
const SFX_TAP_VARIANTS = [['E6', 'B6'], ['G6', 'C7'], ['D6', 'A6'], ['F#6', 'C#7'], ['A5', 'E6']];

    melody('triangle', [['C4', 0.1], ['E4', 0.1], ['G4', 0.1], ['C5', 0.22], ['G4', 0.1], ['C5', 0.1], ['E5', 0.1], ['G5', 0.55]], 0.35);

  },

  },

    for (let i = 0; i < 6; i++) tone(audio.sfxGain, 'square', 1500 + i * 130, audio.ctx.currentTime + 0.5 + i * 0.05, 0.04, 0.12);
  },
  lose()      { melody('triangle', [['G4', 0.15], ['F4', 0.15], ['D#4', 0.15], ['C4', 0.45]], 0.5); },

function playSfx(name, ...args) {
  const ac = audio.ctx;
  if (!ac || ac.state !== 'running' || state.settings.muted || state.settings.sfxVol <= 0) return;
  try { SFX[name](...args); } catch (e) { /* звук ніколи не має ламати гру */ }
}
// Висота «друкування» залежить від того, хто говорить
function speakerPitch(sp) {
  let h = 0;
  for (let i = 0; i < sp.length; i++) h += sp.charCodeAt(i);
  return sp === 'narr' ? 330 : 360 + (h % 7) * 55;
}

// Кристали за подорож: floor(√(зароблено за цей забіг / X)), плюс бонус майстерні
function prestigeGain() {

function startLevel() { return Math.min(LEVELS.length, 1 + wsLevel('headStart')); }

function askTimeTravel() {
  const gain = prestigeGain();
  if (!state.story.finale || gain < 1) return;
  askConfirm(t('warpConfirmTitle'), t('warpConfirmText', gain), t('warpConfirmYes'), startWarp);
}
function startWarp() {
  if (warp) return;
  warp = { t: 0, applied: false };
  ui.timeWarp.hidden = false;
  ui.timeWarp.style.opacity = '0';
  document.body.classList.add('warping');
  closeWheel();
  playSfx('warp');
}
function updateWarp(dt) {
  if (!warp) return;
  warp.t += dt;
  const k = warp.t / CONFIG.WARP_SECONDS;
  ui.timeWarp.style.opacity = String(k < 0.25 ? k / 0.25 : k < 0.75 ? 1 : Math.max(0, (1 - k) / 0.25));
  ui.warpClock.style.transform = 'rotate(' + (-k * 1260) + 'deg) scale(' + (1 + Math.sin(k * Math.PI) * 1.2) + ')';
  if (!warp.applied && k >= 0.5) { warp.applied = true; applyTimeTravel(); }
  if (k >= 1) {
    warp = null;
    ui.timeWarp.hidden = true;
    document.body.classList.remove('warping');
    // новий сюжетний фрагмент епохи
    startDialogue(((state.epoch - 1) % EPOCH_STORIES.length) + 1, false, 'ep', state.epoch);
  }
}
// Власне скидання: лишаються кристали, досягнення, статистика, прочитані глави й покращення майстерні
function applyTimeTravel() {
  const gain = prestigeGain();
  state.crystals += gain;
  state.crystalsTotal += gain;
  state.stats.timeTravels++;
  state.stats.maxLevel = Math.max(state.stats.maxLevel, state.shopLevel);
  state.epoch++;
  state.team.forEach((lv, i) => { if (lv > 0) state.teamKnown[i] = 1; });      // звірятка лишаються знайомими
  state.coins = CONFIG.START_COINS;
  state.depts = DEPARTMENTS.map(() => 0);
  state.team = TEAM.map(() => 0);
  state.shopLevel = startLevel();
  state.runStartEarned = state.totalEarned;
  state.events.incomeBoostUntil = 0; state.events.tapBoostUntil = 0;
  trouble = null; puddles.length = 0; sackDrop = null;
  build = null; ui.shopOverlay.style.visibility = '';
  actors.length = 0;
  customers.length = 0;
  recalcIncome();
  rebuildEpochLayers();
  resetEpochFx();
  rebuildShop(true);
  syncActors();
  layoutScene();
  updateMusic();
  updateUI();
  checkAchievements();
  saveGame();
}

/* ---------- Майстерня часу ---------- */
function wsEffectText(id, L) {
  switch (id) {
    case 'headStart':    return t('wsEff_headStart', t('levelName_' + Math.min(LEVELS.length, 1 + L)));
    case 'autoTap':      return t('wsEff_autoTap', L);
    case 'offlineHours': return t('wsEff_offlineHours', CONFIG.OFFLINE_MAX_HOURS + 4 * L);
    case 'offlineRate':  return t('wsEff_offlineRate', Math.round((CONFIG.OFFLINE_RATE + 0.1 * L) * 100));
    case 'salesFreq':    return t('wsEff_salesFreq', Math.round((1 / (1 - 0.1 * L) - 1) * 100));
    case 'saleLength':   return t('wsEff_saleLength', CONFIG.SALE_SECONDS + 30 * L);
    case 'wheelFast':    return t('wsEff_wheelFast', WHEEL_HOURS_BY_LEVEL[L] || 24);
    case 'thiefLess':    return t('wsEff_thiefLess', Math.round(L * 20));
    case 'cheaperDepts': return t('wsEff_cheaperDepts', Math.round(L * 3));
    case 'cheaperTeam':  return t('wsEff_cheaperTeam', Math.round(L * 5));
    case 'tapPower':     return t('wsEff_tapPower', fmt(1 + 0.5 * L, 2));
    case 'crystalGain':  return t('wsEff_crystalGain', Math.round(L * 10));
  }
  return '';
}
function buildWorkshop() {
  ui.wsList.innerHTML = '';
  WORKSHOP.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'card ws-card';
    card.innerHTML = '<div class="dept-head"><span class="dept-icon"></span><span class="dept-name"></span><span class="dept-count"></span></div>' +
      '<div class="ws-now"></div><div class="ws-next"></div><button type="button" class="btn wide go"></button>';
    card.querySelector('.dept-icon').textContent = w.icon;
    card.querySelector('button').addEventListener('click', () => buyWorkshop(i));
    ui.wsList.appendChild(card);
    wsEls[i] = { name: card.querySelector('.dept-name'), lvl: card.querySelector('.dept-count'), now: card.querySelector('.ws-now'), next: card.querySelector('.ws-next'), btn: card.querySelector('button') };
  });
}
function buyWorkshop(i) {
  const w = WORKSHOP[i], L = state.ws[i];
  if (L >= w.costs.length || state.crystals < w.costs[L]) return;
  state.crystals -= w.costs[L];
  state.ws[i]++;
  recalcIncome();
  playSfx('upgrade');
  showToast(t('ws_' + w.id) + ' ' + state.ws[i] + '/' + w.costs.length, 'good');
  updateUI();
  saveGame();
}
function updateWorkshopUI() {
  if (ui.paneWorkshop.hidden) return;
  setText(ui.wsInfo, t('wsCrystals', fmt(state.crystals)), 'wsInfo');
  setText(ui.wsBonus, t('wsBonus', fmt(state.crystalsTotal), fmt(crystalMult(), 2)), 'wsBonus');
  const gain = prestigeGain();
  setText(ui.warpPreview, gain >= 1 ? t('warpGain', gain) : t('warpNone', fmt(CONFIG.CRYSTAL_DIVISOR)), 'warpPrev');
  ui.warpBtn.disabled = gain < 1;
  setText(ui.warpBtn, t('warpBtn'), 'warpBtn');
  WORKSHOP.forEach((w, i) => {
    const e = wsEls[i], L = state.ws[i], max = w.costs.length;
    setText(e.name, t('ws_' + w.id), 'wn' + i);
    setText(e.lvl, L + '/' + max, 'wl' + i);
    setText(e.now, t('teamNow', wsEffectText(w.id, L)), 'wnow' + i + '_' + L);
    setText(e.next, L < max ? t('teamNext', wsEffectText(w.id, L + 1)) : '', 'wnext' + i + '_' + L);
    if (L >= max) { setText(e.btn, t('teamMax'), 'wb' + i); e.btn.disabled = true; }
    else { setText(e.btn, t('wsBuy', w.costs[L]), 'wb' + i + '_' + L); e.btn.disabled = state.crystals < w.costs[L]; }
  });
}

function achName(a) {

// Піксельна медаль 16×16 з символом усередині; закрита — сіра
function makeBadge(a, unlocked) {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const g = c.getContext('2d');
  disc(g, 8, 8, 7, 'd');
  disc(g, 8, 8, 6, unlocked ? ACH_TIER_COLORS[a.tier % ACH_TIER_COLORS.length] : 'E');
  if (unlocked) { R(g, 4, 3, 3, 1, 'w'); R(g, 3, 4, 1, 2, 'w'); }
  g.globalAlpha = unlocked ? 1 : 0.3;
  g.drawImage(getSpriteCanvas('glyph_' + a.glyph), 4, 4);
  return c;
}

// Код збереження: «CTT7:» + текст у base64 — його можна скопіювати на інший пристрій
function makeExportCode() {
  const json = JSON.stringify({ v: CONFIG.SAVE_VERSION, state });
  return 'CTT' + CONFIG.SAVE_VERSION + ':' + btoa(unescape(encodeURIComponent(json)));
}
function parseImportCode(text) {
  const m = /^CTT\d+:([A-Za-z0-9+/=]+)$/.exec(text.replace(/\s+/g, ''));
  if (!m) throw new Error('format');
  const data = migrateSave(JSON.parse(decodeURIComponent(escape(atob(m[1])))));
  if (!data.state || typeof data.state !== 'object') throw new Error('state');
  return data;
}
function importSave() {
  let data;
  try { data = parseImportCode(ui.importBox.value); } catch (e) { showToast(t('importFail'), 'bad'); return; }
  askConfirm(t('importTitle'), t('importText'), t('importYes'), () => {
    const fresh = createDefaultState();
    mergeInto(fresh, data.state);
    Object.assign(state, fresh);
    saveGame();
    if (!storageOk) { showToast(t('importNoStorage'), 'bad'); return; }
    savingDisabled = true;
    location.reload();
  });
}
function hardReset() {
  savingDisabled = true;
  try { localStorage.removeItem(CONFIG.SAVE_KEY); } catch (e) { /* нічого */ }
  location.reload();
}
function copyExport() {
  ui.exportBox.value = makeExportCode();
  ui.exportBox.focus(); ui.exportBox.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { /* нічого */ }
  if (!ok && navigator.clipboard) navigator.clipboard.writeText(ui.exportBox.value).then(() => showToast(t('exportCopied'), 'good'), () => {});
  else if (ok) showToast(t('exportCopied'), 'good');
}

// Поточна тема сцени: яке свято зараз і які прикраси вмикати
const theme = { key: null, holiday: null, blackFriday: false, decor: new Set(), skyTint: null, lights: ['r', 'y', 'g', 'n', 'p'] };
const snow = [];             // сніжинки
const bats = [];             // кажани
const puddles = [];          // калюжі від протікання даху
let trouble = null;          // неприємність, що триває: { type: 'leak' | 'thief', ... }
let sackDrop = null;         // мішок, який кинув Шнирь після поразки
let eventTimer = 0;
let wheelAnim = null;        // обертання колеса: { t, dur, from, to }
let wheelAngle = 0;
let wheelTexture = null;
let wheelWasReady = null;

/* ---------- Свята ---------- */
function inRange(d, from, to) {
  const v = (d.getMonth() + 1) * 100 + d.getDate();
  const a = from[0] * 100 + from[1], b = to[0] * 100 + to[1];
  return a <= b ? (v >= a && v <= b) : (v >= a || v <= b);   // діапазон може перетинати новий рік
}
function isBlackFriday(d) { return d.getMonth() === 10 && d.getDay() === 5 && d.getDate() + 7 > 30; }
function forcedHoliday() {
  try { return new URLSearchParams(location.search).get('holiday'); } catch (e) { return null; }
}
// Оновлює тему за датою пристрою (або за ?holiday=...). Повертає true, якщо тема змінилась
function updateTheme() {
  const now = new Date(), forced = forcedHoliday();
  let holiday = null, bf = false;
  if (forced === 'blackfriday') bf = true;
  else if (forced) holiday = HOLIDAYS.find(h => h.id === forced) || null;
  else { holiday = HOLIDAYS.find(h => inRange(now, h.from, h.to)) || null; bf = isBlackFriday(now); }
  const key = (holiday ? holiday.id : '') + '|' + bf + '|' + (state.epoch % EPOCHS.length);
  if (theme.key === key) return false;
  theme.key = key;
  if (holiday) state.stats.holidaysSeen |= (1 << HOLIDAYS.indexOf(holiday));
  if (bf) state.stats.holidaysSeen |= 1 << 15;
  theme.holiday = holiday;
  theme.blackFriday = bf;
  theme.decor = new Set([...(holiday ? holiday.decor : []), ...(bf ? BLACK_FRIDAY.decor : [])]);
  theme.skyTint = bf ? BLACK_FRIDAY.skyTint : (holiday && holiday.skyTint) || currentEpoch().tint;
  theme.lights = bf ? BLACK_FRIDAY.lights : ((holiday && holiday.lights) || ['r', 'y', 'g', 'n', 'p']);
  snow.length = 0; bats.length = 0;
  resetEpochFx();
  if (theme.decor.has('snow') && animOn()) for (let i = 0; i < CONFIG.SNOW_FLAKES; i++) snow.push({ x: rand(0, 320), y: rand(0, 180), vy: rand(10, 26), ph: rand(0, 6.3), big: Math.random() < 0.25 });
  if (theme.decor.has('bats') && animOn()) for (let i = 0; i < CONFIG.BATS; i++) bats.push({ x: rand(0, 320), y: rand(14, 70), vx: rand(14, 26) * (Math.random() < 0.5 ? -1 : 1), ph: rand(0, 6.3) });
  return true;
}
function holidayGlobalBonus() { return theme.holiday && theme.holiday.bonus.global ? theme.holiday.bonus.global : 0; }
function holidayDeptBonus(i) { return (theme.holiday && theme.holiday.bonus.depts && theme.holiday.bonus.depts[i]) || 0; }
function secondsToMidnight() {
  const n = new Date();
  return Math.max(0, (new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1) - n) / 1000);
}
function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return h > 0 ? h + ':' + p(m) + ':' + p(s) : m + ':' + p(s);
}

/* ---------- Активні бусти (іконки з таймерами) і банер ---------- */
function updateBoostsUI() {
  const now = Date.now(), power = eventPowerMult(), items = [];
  const ev = state.events;
  if (theme.blackFriday) items.push({ cls: 'dark', icon: BLACK_FRIDAY.icon, text: t('boost_bf', fmt(1 + (CONFIG.BLACK_FRIDAY_MULT - 1) * power, 2)) });
  else if (ev.saleUntil > now) items.push({ icon: '🏷️', text: t('boost_sale', fmt(1 + (CONFIG.SALE_MULT - 1) * power, 2)) + ' ' + fmtTime((ev.saleUntil - now) / 1000) });
  if (theme.holiday) {
    const h = theme.holiday;
    let bonus = '';
    if (h.bonus.global) bonus = t('hb_global', Math.round(h.bonus.global * power * 100));
    else if (h.bonus.depts) bonus = Object.keys(h.bonus.depts).map(i => t('hb_dept', t('dept_' + DEPARTMENTS[i].id), fmt(1 + h.bonus.depts[i] * power, 2))).join(', ');
    items.push({ icon: h.icon, text: t('holiday_' + h.id) + ': ' + bonus });
  }
  if (ev.incomeBoostUntil > now) items.push({ icon: '⚡', text: t('boost_income', ev.incomeBoostMult) + ' ' + fmtTime((ev.incomeBoostUntil - now) / 1000) });

// --- Протікання даху ---
function startLeak() {

// --- Єнот Шнирь: міні-гра «Впіймай єнота» ---
function startRaccoon() {
  const minX = viewCrop.x + 24, maxX = viewCrop.x + viewCrop.w - 24;
  const side = Math.random() < 0.5 ? minX : maxX;
  trouble = { type: 'thief', state: 'run', t: 0, hits: 0, x: side, y: rand(148, 172), vx: 0, vy: 0, dirT: 0, flash: 0, hop: 0, exitDir: 1 };

}
function hitRaccoon() {
  const r = trouble;
  r.hits++; r.flash = 0.35; r.hop = 1;
  playSfx('hit');
  for (let k = 0; k < 6; k++) fx.sparks.push({ x: r.x, y: r.y - 8, vx: rand(-60, 60), vy: rand(-70, 10), age: 0, life: rand(0.25, 0.4), col: k % 2 ? 'y' : 'w' });
  showBubble('shnyr', t('shnyrOuch_' + Math.floor(Math.random() * 3)), r.x, r.y - 19);
  r.dirT = 0;     // одразу змінює напрям

}
function winRaccoon() {
  const r = trouble;
  const reward = Math.floor(Math.max(tapValue() * 10, state.cps * CONFIG.RACCOON_REWARD_MINUTES * 60));
  state.coins += reward; state.totalEarned += reward;
  state.stats.raccoonsCaught++;
  for (let k = 0; k < 12; k++) fx.coins.push({ x: r.x + rand(-8, 8), y: r.y - 10, vx: rand(-60, 60), vy: rand(-140, -60), age: 0, life: rand(0.8, 1.2), spin: rand(0, 4) });

  r.state = 'exit'; r.exitDir = r.x < 160 ? -1 : 1; r.hasSack = false;
  playSfx('caught');

}
function loseRaccoon() {
  const r = trouble;
  const steal = state.story.shnyrFriend ? 0 : Math.floor(Math.min(state.coins * CONFIG.RACCOON_STEAL_SHARE * (1 - 0.2 * wsLevel('thiefLess')), state.cps * CONFIG.RACCOON_STEAL_MAX_MINUTES * 60));
  if (steal >= 1) {
    state.coins -= steal;

  } else {
    showToast(t('raccoonFriend'), 'good');
  }
  r.state = 'exit'; r.exitDir = r.x < 160 ? -1 : 1; r.hasSack = true;

}
function updateTrouble(dt) {
  if (sackDrop) { sackDrop.t += dt; if (sackDrop.t > 3) sackDrop = null; }
  if (!trouble) return;
  puddles.forEach(p => { p.age += dt; });
  if (trouble.type === 'leak') {
    // Качка Кря сама прибирає калюжі
    if (teamLevelOf('kria') > 0 && puddles.length) {
      trouble.kriaTimer += dt;
      if (trouble.kriaTimer >= CONFIG.KRIA_CLEAN_SECONDS / fixSpeedMult()) {
        trouble.kriaTimer = 0;
        const a = actors.find(x => TEAM[x.i].id === 'kria');
        if (a) { a.hop = 1; showBubble('t' + a.i, t('kriaMop'), a.x, a.y - 19); }
        removePuddle(Math.floor(Math.random() * puddles.length));
      }
    }
    return;
  }
  const r = trouble;
  r.t += dt;
  r.flash = Math.max(0, r.flash - dt);
  r.hop = Math.max(0, r.hop - dt * 4);
  if (r.state === 'run') {
    r.dirT -= dt;
    if (r.dirT <= 0) {
      r.dirT = rand(0.5, 1.1);
      const a = rand(0, Math.PI * 2), sp = 55 + r.hits * 16;
      r.vx = Math.cos(a) * sp; r.vy = Math.sin(a) * sp * 0.5;
    }
    r.x += r.vx * dt; r.y += r.vy * dt;
    const minX = viewCrop.x + 14, maxX = viewCrop.x + viewCrop.w - 14;
    if (r.x < minX) { r.x = minX; r.vx = Math.abs(r.vx); }
    if (r.x > maxX) { r.x = maxX; r.vx = -Math.abs(r.vx); }
    if (r.y < 146) { r.y = 146; r.vy = Math.abs(r.vy); }
    if (r.y > 176) { r.y = 176; r.vy = -Math.abs(r.vy); }
    if (r.hits < CONFIG.RACCOON_HITS && r.t >= CONFIG.RACCOON_SECONDS) loseRaccoon();
  } else {   // тікає за межі екрана
    r.x += r.exitDir * 120 * dt;
    r.vx = r.exitDir * 120;
    if (r.x < -24 || r.x > CONFIG.SCENE_W + 24) { trouble = null; }
  }
}
// Тап по калюжі чи єнотові; true — тап «з'їдено» і по магазину не рахується
function handleEventTap(p) {
  if (!trouble) return false;
  if (trouble.type === 'thief' && trouble.state === 'run') {
    if (Math.abs(p.x - trouble.x) <= 13 && p.y >= trouble.y - 20 && p.y <= trouble.y + 5) { hitRaccoon(); return true; }
  } else if (trouble.type === 'leak') {
    for (let i = 0; i < puddles.length; i++) {
      if (Math.abs(p.x - puddles[i].x) <= 13 && Math.abs(p.y - puddles[i].y) <= 9) { removePuddle(i); return true; }
    }
  }
  return false;
}

  const S = 128, c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');
  const cx = 64, cy = 64, step = Math.PI / 4;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy, r = Math.sqrt(dx * dx + dy * dy);
      if (r > 62) continue;
      let col;
      if (r >= 59) col = 'd';
      else if (r < 9) col = r >= 7 ? 'd' : 'h';
      else {
        let a = Math.atan2(dx, -dy); if (a < 0) a += Math.PI * 2;
        const sec = Math.floor(a / step), frac = a / step - sec;
        const edge = Math.min(frac, 1 - frac) * step * r;
        col = edge < 0.9 ? 'd' : (r >= 55.5 && r < 57 ? ((Math.floor(a / step * 3) % 2) ? 'w' : 'y') : WHEEL_SECTORS[sec].color);
      }
      R(g, x, y, 1, 1, col);
    }
  }
  WHEEL_SECTORS.forEach((s, i) => {
    const a = (i + 0.5) * step;
    drawWheelIcon(g, s.icon, Math.round(cx + Math.sin(a) * 36), Math.round(cy - Math.cos(a) * 36));
  });
  return c;
}
function drawWheel() {
  const g = ui.wheelCanvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, 128, 140);
  g.save();
  g.translate(64, 76);
  g.rotate(wheelAngle);
  g.drawImage(wheelTexture, -64, -64);
  g.restore();
  // стрілка-вказівник зверху
  for (let i = 0; i < 12; i++) { R(g, 64 - (12 - i) , 2 + i, (12 - i) * 2, 1, 'd'); if (i > 1) R(g, 64 - (12 - i) + 2, 2 + i, (12 - i) * 2 - 4, 1, 'r'); }
}
function updateWheelUI() {
  if (ui.wheelModal.hidden) return;
  const now = Date.now(), ready = wheelReady(now);
  const streak = wheelAnim ? state.wheel.streak : projectedStreak(now);
  setText(ui.wheelStreak, t('wheelStreak', streak, fmt(streakMult(streak), 2)), 'wStreak');
  if (wheelAnim) { setText(ui.wheelBtn, t('wheelSpin'), 'wBtn'); ui.wheelBtn.disabled = true; }
  else if (ready) { setText(ui.wheelBtn, t('wheelSpin'), 'wBtn'); ui.wheelBtn.disabled = false; }
  else { setText(ui.wheelBtn, t('wheelWait', fmtTime((state.wheel.lastSpin + wheelCooldownMs() - now) / 1000)), 'wBtn'); ui.wheelBtn.disabled = true; }
}
function openWheel() {
  if (dialog.active) return;
  ui.wheelModal.hidden = false;
  if (!wheelAnim) ui.wheelResult.textContent = '';
  drawWheel();
  updateWheelUI();
}
function closeWheel() { ui.wheelModal.hidden = true; }
function spinWheel() {
  const now = Date.now();
  if (wheelAnim || !wheelReady(now)) return;
  // вибір сектора за вагами
  const weight = x => (x.kind === 'crystal' && !state.story.finale ? 0 : x.weight);   // кристали випадають лише після фіналу
  const total = WHEEL_SECTORS.reduce((s, x) => s + weight(x), 0);
  let roll = Math.random() * total, idx = 0;
  for (; idx < WHEEL_SECTORS.length - 1; idx++) { roll -= weight(WHEEL_SECTORS[idx]); if (roll < 0) break; }
  const s = WHEEL_SECTORS[idx];
  state.wheel.streak = projectedStreak(now);
  state.wheel.lastSpin = now;
  state.stats.wheelSpins++;
  const mult = streakMult(state.wheel.streak);
  let text;
  if (s.kind === 'coins' || s.kind === 'jackpot') {
    const gain = Math.floor((state.cps * s.seconds + s.flat * levelMult()) * mult);
    state.coins += gain; state.totalEarned += gain;
    text = t(s.kind === 'jackpot' ? 'prize_jackpot' : 'prize_coins', fmt(gain));
    if (s.kind === 'jackpot') state.stats.jackpots++;
  } else if (s.kind === 'crystal') {
    const gem = Math.max(1, Math.floor(mult));
    state.crystals += gem; state.crystalsTotal += gem;
    text = t('prize_crystal', gem);
  } else if (s.kind === 'income') {
    state.events.incomeBoostUntil = now + s.minutes * 60000; state.events.incomeBoostMult = s.mult;
    text = t('prize_income', s.mult, s.minutes);
  } else {
    state.events.tapBoostUntil = now + s.minutes * 60000; state.events.tapBoostMult = s.mult;
    text = t('prize_tap', s.mult, s.minutes);
  }
  recalcIncome();
  const step = Math.PI / 4;
  const jitter = rand(-0.35, 0.35) * step;
  const from = wheelAngle % (Math.PI * 2);
  const to = Math.PI * 2 * 5 + (Math.PI * 2 - (idx + 0.5) * step) + jitter;
  wheelAnim = { t: 0, dur: CONFIG.WHEEL_SPIN_SECONDS, from, to, text, jackpot: s.kind === 'jackpot' };
  ui.wheelResult.textContent = '…';
  updateWheelUI();
  updateUI();
  saveGame();
}
function updateWheel(dt) {
  if (!wheelAnim) return;
  wheelAnim.t += dt;
  const k = Math.min(1, wheelAnim.t / wheelAnim.dur), e = 1 - Math.pow(1 - k, 3);
  const prevSector = Math.floor(wheelAngle / (Math.PI / 4));
  wheelAngle = wheelAnim.from + (wheelAnim.to - wheelAnim.from) * e;
  if (Math.floor(wheelAngle / (Math.PI / 4)) !== prevSector && performance.now() - audio.lastTick > 40) { audio.lastTick = performance.now(); playSfx('wheelTick'); }
  if (!ui.wheelModal.hidden) drawWheel();
  if (k >= 1) {
    const done = wheelAnim;
    wheelAnim = null;
    wheelAngle = done.to % (Math.PI * 2);
    ui.wheelResult.textContent = done.text;
    playSfx(done.jackpot ? 'jackpot' : 'wheelWin');
    showToast(done.text, done.jackpot ? 'big' : 'good');
    updateWheelUI();
    updateUI();
  }
}

/* ---------- Головний цикл подій ---------- */
function updateEvents(dt) {
  updateWheel(dt);
  updateTrouble(dt);
  updateDecorFx(dt);
  updateEpochFx(dt);
  eventTimer -= dt;
  if (eventTimer > 0) return;
  eventTimer = 0.25;
  const now = Date.now();
  let changed = false;
  if (updateTheme()) changed = true;
  updateMusic();
  // зміна активних бустів → перерахунок доходу
  const sig = [state.events.saleUntil > now, state.events.incomeBoostUntil > now, state.events.tapBoostUntil > now].join();
  if (sig !== uiCache.eventSig) { uiCache.eventSig = sig; changed = true; }
  if (changed) recalcIncome();
  if (!theme.blackFriday && now >= state.events.nextSale) startSale(now);
  const quiet = !trouble && !dialog.active && !build && ui.modal.hidden && ui.wheelModal.hidden;
  if (quiet && state.story.done >= 3 && now >= state.events.nextTrouble) startTrouble(now);
  // колесо стало готовим
  const ready = wheelReady(now);
  if (wheelWasReady === false && ready) showToast(t('wheelReady'), 'big');
  wheelWasReady = ready;
  ui.wheelOpen.classList.toggle('ready', ready);
  updateBoostsUI();
  updateBanner();
  updateWheelUI();
  achTimer += 0.25;
  if (achTimer >= 1) { achTimer = 0; checkAchievements(); }
}

// Початок гри: розклад подій, тема, колесо
function initEvents() {
  const now = Date.now();
  if (!state.events.nextSale) scheduleSale(now);
  else if (state.events.nextSale <= now) state.events.nextSale = now + rand(1, 5) * 60000;   // розпродаж «проґавили» — буде скоро
  if (!state.events.nextTrouble) scheduleTrouble(now);
  else if (state.events.nextTrouble <= now) state.events.nextTrouble = now + rand(1, 5) * 60000;
  updateTheme();
  wheelTexture = buildWheelTexture();
  ui.wheelOpen.addEventListener('click', openWheel);
  ui.wheelClose.addEventListener('click', closeWheel);
  ui.wheelBtn.addEventListener('click', spinWheel);
  ui.wheelModal.addEventListener('click', e => { if (e.target === ui.wheelModal) closeWheel(); });
  if (theme.holiday) {
    const h = theme.holiday;
    const bonus = h.bonus.global ? t('hb_global', Math.round(h.bonus.global * 100)) : Object.keys(h.bonus.depts || {}).map(i => t('hb_dept', t('dept_' + DEPARTMENTS[i].id), fmt(1 + h.bonus.depts[i], 2))).join(', ');
    showToast(t('holidayToast', h.icon + ' ' + t('holiday_' + h.id), bonus), 'big');
  }
}

const dialog = { active: false, kind: 'ch', chapter: 0, labelNo: 0, replay: false, pages: [], page: 0, shown: 0, text: '' };
let storyTimer = 1;           // перша перевірка через секунду після старту
const cameos = [];            // гості-камео на вулиці (Шнирь, що тікає з печивом)

// Який спрайт показувати як портрет (null — оповідач, без портрета)
function speakerSprite(sp) {
  if (sp === 'narr' || sp === 'title') return null;
  if (sp === 'capy') return 'capy';
  if (sp === 'shnyr') return 'npc_shnyr';
  if (sp === 'clock') return 'npc_clock';
  return 'team_' + sp;
}
function speakerName(sp) {
  if (sp === 'narr' || sp === 'title') return '';
  if (sp === 'capy' || sp === 'shnyr' || sp === 'clock') return t('speaker_' + sp);
  return t('team_' + sp);
}
function pageText(p) {
  if (p.speaker === 'title') return t(dialog.kind === 'ep' ? 'epochLabel' : 'chapterLabel', dialog.labelNo) + '\n' + t(dialog.kind + dialog.chapter + '_title');
  return t(p.key);
}

function renderDialogText() {
  ui.dlgText.textContent = dialog.text.slice(0, Math.floor(dialog.shown));
  ui.dlgNext.classList.toggle('on', dialog.shown >= dialog.text.length);
}
function showDialogPage() {
  const p = dialog.pages[dialog.page];
  dialog.text = pageText(p);
  dialog.shown = 0;
  ui.dlgText.classList.toggle('title', p.speaker === 'title');
  ui.dlgName.textContent = speakerName(p.speaker);
  const spr = speakerSprite(p.speaker);
  ui.dlgWrap.classList.toggle('none', !spr);
  if (spr) {
    const c = getSpriteCanvas(spr);
    ui.dlgPortrait.width = c.width; ui.dlgPortrait.height = c.height;
    const g = ui.dlgPortrait.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(c, 0, 0);
  }
  renderDialogText();
}

// Запускає главу n (kind 'ch'), фрагмент епохи (kind 'ep') або туторіал (kind 'tut').
// replay — перечитування з вкладки «Історія» (без наслідків для гри); labelNo — номер, що пишеться в заголовку
function startDialogue(n, replay = false, kind = 'ch', labelNo = n) {
  const def = kind === 'ch' ? CHAPTERS[n - 1] : kind === 'ep' ? EPOCH_STORIES[n - 1] : TUTORIAL;
  if (!def || dialog.active) return;
  dialog.active = true;
  dialog.kind = kind;
  dialog.chapter = n;
  dialog.labelNo = labelNo;
  dialog.replay = replay;
  dialog.page = 0;
  const prefix = kind === 'tut' ? 'tut' + n : kind + n;
  dialog.pages = [...(kind === 'tut' ? [] : [{ speaker: 'title' }]), ...def.lines.map((sp, k) => ({ speaker: sp, key: prefix + '_' + k }))];
  ui.dlgSkip.textContent = t('storySkip');
  ui.dialog.hidden = false;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  showDialogPage();
}

// Тап / клік: показати весь текст одразу, а якщо він уже повний — перейти далі
function advanceDialog() {
  if (!dialog.active) return;
  if (dialog.shown < dialog.text.length) { dialog.shown = dialog.text.length; renderDialogText(); return; }
  dialog.page++;
  if (dialog.page >= dialog.pages.length) endDialogue(); else showDialogPage();
}

function endDialogue() {
  if (!dialog.active) return;
  const n = dialog.chapter, replay = dialog.replay, kind = dialog.kind;
  dialog.active = false;
  ui.dialog.hidden = true;
  if (replay) return;
  if (kind === 'tut') { state.tutorialDone = true; storyTimer = 1; saveGame(); return; }
  if (kind === 'ep') { storyTimer = 1; saveGame(); return; }
  state.story.done = Math.max(state.story.done, n);
  if (n === 3) spawnCameo('npc_shnyr');          // Шнирь тікає з печивом
  if (n === 6) state.story.shnyrFriend = true;
  if (n === 8) state.story.finale = true;         // відкриває подорож у часі (етап 7)
  storyTimer = 1.5;
  updateUI();
  saveGame();
}

// «Друкарська машинка»
function updateDialog(dt) {
  if (!dialog.active || dialog.shown >= dialog.text.length) return;
  const before = Math.floor(dialog.shown);
  dialog.shown = Math.min(dialog.text.length, dialog.shown + dt * CONFIG.DIALOG_CHARS_PER_SEC);
  const after = Math.floor(dialog.shown);
  if (after > before && dialog.text[after - 1] && dialog.text[after - 1].trim() && after % 2 === 0) playSfx('typing', speakerPitch(dialog.pages[dialog.page].speaker));
  renderDialogText();
}

// Мова змінилась посеред діалогу — оновлюємо поточну репліку
function refreshDialogLanguage() {
  if (!dialog.active) return;
  const ratio = dialog.text.length ? dialog.shown / dialog.text.length : 0;
  const p = dialog.pages[dialog.page];
  dialog.text = pageText(p);
  dialog.shown = ratio >= 1 ? dialog.text.length : Math.floor(ratio * dialog.text.length);
  ui.dlgName.textContent = speakerName(p.speaker);
  ui.dlgSkip.textContent = t('storySkip');
  renderDialogText();
}

// Чи настав час для наступної глави
function checkStory(dt) {
  storyTimer -= dt;
  if (storyTimer > 0) return;
  storyTimer = CONFIG.STORY_CHECK_SECONDS;
  if (dialog.active || build || !ui.modal.hidden || warp) return;
  if (state.story.done >= 1 && !state.tutorialDone) { startDialogue(1, false, 'tut'); return; }   // коротке навчання після першої глави
  const next = state.story.done;
  if (next >= CHAPTERS.length) return;
  if (triggerMet(CHAPTERS[next].trigger, state)) startDialogue(next + 1);
}

// Вкладка «Історія»: відкриті глави з кнопкою «Читати»
function updateStoryUI() {
  if (ui.paneStory.hidden) return;
  const sig = state.story.done + '|' + state.lang + '|' + state.stats.timeTravels;
  if (uiCache.storySig === sig) return;
  uiCache.storySig = sig;
  ui.storyList.innerHTML = '';
  for (let n = 1; n <= state.story.done; n++) {
    const card = document.createElement('div');
    card.className = 'card chapter-card';
    const num = document.createElement('div'); num.className = 'num'; num.textContent = n;
    const title = document.createElement('div'); title.className = 'title'; title.textContent = t('ch' + n + '_title');
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn'; btn.textContent = t('storyRead');
    btn.addEventListener('click', () => startDialogue(n, true));
    card.append(num, title, btn);
    ui.storyList.appendChild(card);
  }
  // фрагменти епох (відкриваються подорожами в часі)
  for (let k = 1; k <= Math.min(EPOCH_STORIES.length, state.stats.timeTravels); k++) {
    const card = document.createElement('div');
    card.className = 'card chapter-card';
    const num = document.createElement('div'); num.className = 'num'; num.textContent = '⏳';
    const title = document.createElement('div'); title.className = 'title'; title.textContent = t('epochLabel', k) + ': ' + t('ep' + k + '_title');
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn'; btn.textContent = t('storyRead');
    btn.addEventListener('click', () => startDialogue(k, true, 'ep', k));
    card.append(num, title, btn);
    ui.storyList.appendChild(card);
  }
  if (state.story.done < CHAPTERS.length) {
    const lock = document.createElement('div');
    lock.className = 'card dept locked';
    lock.textContent = t('storyLocked');
    ui.storyList.appendChild(lock);
  }
}

/* ---------- Камео: гість пробігає вулицею ---------- */
function spawnCameo(sprite) {
  cameos.push({ sprite, x: -12, y: 168, vx: 62, t: 0 });
}
function updateCameos(dt) {
  for (let i = cameos.length - 1; i >= 0; i--) {
    const c = cameos[i];
    c.t += dt;
    c.x += c.vx * dt;
    if (c.x > CONFIG.SCENE_W + 16) cameos.splice(i, 1);
  }
}
function drawCameo(c) {
  const step = Math.floor(c.t * 8) % 2;
  const x = Math.round(c.x), y = c.y;
  ctx.globalAlpha = 0.22; R(ctx, x - 6, y, 12, 2, 'd'); ctx.globalAlpha = 1;
  drawSprite(ctx, c.sprite, x - 8, y - 16 - step, { flip: step === 1 });
  R(ctx, x + 6, y - 9 - step, 4, 4, 'c'); R(ctx, x + 7, y - 8 - step, 1, 1, 'd'); R(ctx, x + 8, y - 7 - step, 1, 1, 'd');   // печиво
}

function doTap(x, y) {
  const gain = tapValue();
  state.coins += gain;
  state.totalEarned += gain;
  state.taps += 1;
  if (animOn()) shopAnim.vel = 7;        // поштовх пружині — магазин сплющується
  playSfx('tap');
  spawnTapEffects(x, y);
  spawnFloater(x + rand(-8, 8), y - 6, '+' + fmt(gain, 1));
  updateUI();
}

// Координати події → координати сцени (320×180)
function toScenePoint(clientX, clientY) {
  const r = ui.world.getBoundingClientRect();
  return { x: (clientX - r.left) / r.width * CONFIG.SCENE_W, y: (clientY - r.top) / r.height * CONFIG.SCENE_H };
}

function hitShop(p) {
  const pad = 4;
  return p.x >= shop.x - pad && p.x <= shop.x + shop.w + pad && p.y >= shop.y - pad && p.y <= shop.y + shop.h + pad;
}

function setupInput() {
  ui.scene.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const p = toScenePoint(e.clientX, e.clientY);
    if (handleEventTap(p)) return;              // калюжа або єнот
    const actor = hitActor(p);                  // звірятка стоять попереду магазину — тап по ним каже фразу
    if (actor) { actor.hop = 1; actorSay(actor); return; }
    if (hitCapy(p)) { capySay(); return; }
    if (hitShop(p)) doTap(p.x, p.y);
  });
  // з клавіатури: Enter або пробіл тапають по магазину
  ui.scene.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) {
      e.preventDefault();
      doTap(shop.x + shop.w / 2 + rand(-12, 12), shop.y + shop.h * 0.55);
    }
  });
  ui.scene.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());   // без pinch-зуму в Safari
  // діалог: клік/тап — далі; Enter, пробіл, → теж; кнопка «Пропустити главу»
  ui.dialog.addEventListener('click', advanceDialog);
  ui.dlgSkip.addEventListener('click', e => { e.stopPropagation(); endDialogue(); });
  document.addEventListener('keydown', e => {
    if (!dialog.active || e.target === ui.dlgSkip) return;
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); advanceDialog(); }
  });
  ui.expandBtn.addEventListener('click', expandShop);
  ui.modalBtn.addEventListener('click', claimOffline);
}

function render(time) {
  ctx.drawImage(skyLayer, 0, 0);
  drawEpochBack();
  drawDecorBack();
  clouds.forEach(c => drawSprite(ctx, 'cloud', c.x, c.y));
  ctx.drawImage(groundLayer, 0, 0);
  drawDecorDusk();
  ctx.drawImage(propsLayer, 0, 0);

  // магазин: тінь + спрайт зі стисканням (або будівництво)
  ctx.globalAlpha = 0.22; R(ctx, shop.x - 2, LAYOUT.curbY + 1, shop.w + 4, 3, 'd'); ctx.globalAlpha = 1;
  if (build) {
    renderBuild();
  } else {
    const sc = getShopScale();
    drawCanvasSprite(ctx, shop.canvas, shop.x, shop.y, { sx: sc.sx, sy: sc.sy });
    // вивіска слідує за стисканням
    ui.shopOverlay.style.transform = (sc.sx === 1 && sc.sy === 1) ? 'none' : 'scale(' + sc.sx + ',' + sc.sy + ')';
  }

  drawDecorGround();
  puddles.forEach(drawPuddle);
  if (sackDrop) drawSackDrop();

  // Капі та покупці — від дальніх до ближніх (за положенням ніг)
  const cp = LAYOUT.capy;
  const items = customers.map(c => ({ y: c.y, draw: () => drawCustomer(c) }));
  actors.forEach(a => items.push({ y: a.y, draw: () => drawActor(a) }));
  cameos.forEach(c => items.push({ y: c.y, draw: () => drawCameo(c) }));
  if (trouble && trouble.type === 'thief') items.push({ y: trouble.y, draw: drawRaccoon });
  items.push({
    y: cp.footY,
    draw: () => {
      const breath = (Math.sin(time * 2.2) + 1) / 2;
      ctx.globalAlpha = 0.22; R(ctx, cp.x + 2, cp.footY, 20, 2, 'd'); ctx.globalAlpha = 1;
      drawSprite(ctx, 'capy', cp.x, cp.footY - 24, {
        flip: cp.flip,
        sy: 1 + 0.045 * breath,
        variant: capyAnim.blinkLeft > 0 ? 'blink' : ''
      });
      if (hasHats()) drawHat(cp.x + 6, cp.footY - 17);
    }
  });
  items.sort((a, b) => a.y - b.y).forEach(it => it.draw());

  // пил від будівництва
  fx.dust.forEach(p => {
    const k = p.age / p.life;
    ctx.globalAlpha = 0.7 * (1 - k);
    disc(ctx, Math.round(p.x), Math.round(p.y), Math.round(p.r * (0.6 + k)), k < 0.5 ? 'w' : 'E');
  });
  ctx.globalAlpha = 1;

  // монетки
  fx.coins.forEach(p => {
    const fade = 1 - Math.max(0, (p.age - p.life * 0.6) / (p.life * 0.4));
    const spin = [1, 0.6, 0.25, 0.6][Math.floor(p.age * 12 + p.spin) % 4];
    drawSprite(ctx, 'coin', p.x - 4, p.y - 4, { sx: spin, alpha: fade });
  });
  // іскорки
  fx.sparks.forEach(p => {
    ctx.globalAlpha = 1 - p.age / p.life;
    R(ctx, Math.round(p.x), Math.round(p.y), 2, 2, p.col);
  });
  ctx.globalAlpha = 1;
  drawSnow();
  drawEpochFront();
}

// Будівництво: спершу старий магазин у риштуванні, потім новий «виростає» знизу вгору
function renderBuild() {
  const p = build.t / build.dur;
  const r = buildReveal(p);
  const shake = p < 0.2 ? Math.round(Math.sin(build.t * 60)) : 0;
  if (p < 0.2) {
    const o = build.old;
    drawCanvasSprite(ctx, o.canvas, o.x + shake, o.y, {});
    drawScaffold(o.x, o.y, o.w, o.h, Math.min(1, p / 0.12));
  } else {
    const shownH = Math.max(1, Math.round(shop.h * r));
    ctx.save();
    ctx.beginPath();
    ctx.rect(shop.x, shop.y + shop.h - shownH, shop.w, shownH);
    ctx.clip();
    ctx.drawImage(shop.canvas, shop.x, shop.y);
    ctx.restore();
    const scAlpha = p < 0.85 ? 1 : Math.max(0, 1 - (p - 0.85) / 0.15);
    if (scAlpha > 0) drawScaffold(shop.x, shop.y + shop.h - shownH, shop.w, shownH, scAlpha);
  }
}

/* =====================================================================
   ІГРОВИЙ ЦИКЛ
   ===================================================================== */

let lastFrame = performance.now();
let saveTimer = 0;
let uiTimer = 0;
let animClock = 0;

function frame(now) {
  const dt = Math.min(CONFIG.MAX_DT, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  animClock += dt;

  // дохід
  if (state.cps > 0) {
    const gain = state.cps * dt;
    state.coins += gain;
    state.totalEarned += gain;
  }
  // автотапи з майстерні часу: тапають по магазину самі
  const autoTaps = wsLevel('autoTap');
  if (autoTaps > 0) {
    const gain = tapValue() * autoTaps * dt;
    state.coins += gain;
    state.totalEarned += gain;
    autoTapAcc += dt * autoTaps;
    if (autoTapAcc >= 1) { autoTapAcc = 0; if (animOn()) shopAnim.vel = Math.max(shopAnim.vel, 3); }
  }
  state.playTime += dt;

  updateAnimations(dt);
  updateDialog(dt);
  checkStory(dt);
  updateEvents(dt);
  updateWarp(dt);
  render(animClock);

  uiTimer += dt;
  if (uiTimer >= CONFIG.UI_REFRESH_SECONDS) { uiTimer = 0; updateUI(); }

  saveTimer += dt;
  if (saveTimer >= CONFIG.AUTOSAVE_SECONDS) { saveTimer = 0; saveGame(); }

  requestAnimationFrame(frame);
}

/* =====================================================================
   ЗАПУСК
   ===================================================================== */

let hiddenAt = 0;

function init() {
  const hadSave = loadGame();
  const awaySeconds = hadSave && state.savedAt > 0 ? (Date.now() - state.savedAt) / 1000 : 0;
  if (!translations[state.lang]) state.lang = detectLanguage();
  if (!TABS.some(x => x.id === state.tab)) state.tab = 'shop';
  recalcIncome();

  // графіка
  skyLayer = buildSkyLayer();
  groundLayer = buildGroundLayer();
  rebuildShop(true);
  const iconCtx = ui.coinIcon.getContext('2d');
  iconCtx.imageSmoothingEnabled = false;
  iconCtx.drawImage(getSpriteCanvas('coin'), 0, 0);
  const portraitCtx = ui.capiPortrait.getContext('2d');
  portraitCtx.imageSmoothingEnabled = false;
  portraitCtx.drawImage(getSpriteCanvas('capy'), 0, 0);

  // інтерфейс
  buildLangSwitch();
  buildTabs();
  buildBuyModes();
  buildDeptCards();
  buildTeamCards();
  setupProgression();
  syncActors();
  showTab(state.tab);
  applyTranslations();
  updateSaveWarning();
  layoutScene();
  setupInput();

  // масштаб і шрифт
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(layoutScene).observe(ui.stage);
  window.addEventListener('resize', layoutScene);
  if (mobileMQ.addEventListener) mobileMQ.addEventListener('change', layoutScene);
  if (document.fonts) {
    document.fonts.ready.then(fitSign);
    document.fonts.addEventListener('loadingdone', fitSign);
  }

  // збереження при закритті / згортанні сторінки; повернення на вкладку = офлайн-заробіток
  window.addEventListener('beforeunload', saveGame);
  window.addEventListener('pagehide', saveGame);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      hiddenAt = Date.now();
      saveGame();
    } else {
      lastFrame = performance.now();
      if (hiddenAt) { addOfflineEarnings((Date.now() - hiddenAt) / 1000); hiddenAt = 0; }
    }
  });

  setupSound();
  initEvents();
  recalcIncome();
  addOfflineEarnings(awaySeconds);
  showOfflineModal();     // якщо з минулого разу лишилися незабрані монетки
  if (!hadSave) saveGame();
  requestAnimationFrame(t0 => { lastFrame = t0; requestAnimationFrame(frame); });
}

init();
</script>
