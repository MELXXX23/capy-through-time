<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1d1a">
<title>Capy Through Time</title>
<!-- Піксельний шрифт з чіткою кирилицею (Pixelify Sans малює українські літери криво, тому Press Start 2P). Без інтернету спрацює запасний моноширинний -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ===== Змінні та база ===== */
:root {
  --darker: #2a1d1a;
  --dark: #4a3228;
  --brown: #7a4f35;
  --tan: #dba46a;
  --honey: #f2b84b;
  --yellow: #ffe08a;
  --cream: #fff4dc;
  --pink: #ef8fa3;
  --mint: #8ed4a6;
  --green: #4f9a63;
  --red: #c4553d;
  --panel: #f3d9a8;
  --panel-dark: #e2bf86;
  --u: 3px; /* скільки css-пікселів займає один піксель сцени (ставить скрипт) */
  --font: 'Press Start 2P', 'Courier New', monospace;
  --notch: 4px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  background: var(--darker);
  color: var(--dark);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

/* Піксельна рамка зі «сходинками» по кутах */
.frame, .card, .btn {
  clip-path: polygon(
    0 var(--notch), var(--notch) var(--notch), var(--notch) 0,
    calc(100% - var(--notch)) 0, calc(100% - var(--notch)) var(--notch), 100% var(--notch),
    100% calc(100% - var(--notch)), calc(100% - var(--notch)) calc(100% - var(--notch)), calc(100% - var(--notch)) 100%,
    var(--notch) 100%, var(--notch) calc(100% - var(--notch)), 0 calc(100% - var(--notch)));
}
.frame {
  background: var(--panel);
  box-shadow: inset 0 0 0 4px var(--dark), inset 0 0 0 6px var(--cream), inset 0 -10px 0 6px rgba(74,50,40,.12);
}
.card {
  --notch: 3px;
  background: var(--cream);
  box-shadow: inset 0 0 0 3px var(--brown);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.btn {
  --notch: 3px;
  background: var(--panel-dark);
  box-shadow: inset 0 0 0 3px var(--dark), inset 0 -4px 0 3px rgba(74,50,40,.18);
}
.btn:disabled { opacity: .5; }

/* ===== Каркас сторінки ===== */
#app {
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(340px, 38vw, 470px);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top" "stage panel";
}
#topbar {
  grid-area: top;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 12px;
  background: var(--darker);
  border-bottom: 4px solid var(--brown);
}
#stage {
  grid-area: stage;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  padding: 16px;
  background: repeating-conic-gradient(#3b2a22 0 25%, #33241d 0 50%) 0 0 / 16px 16px;
}
#panel {
  grid-area: panel;
  display: flex;
  flex-direction: column;
  min-height: 0;
  margin: 12px 12px 12px 0;
  padding: 14px;
}

/* ===== Лічильник ===== */
#hud {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 18px 8px 14px;
  min-width: 0;
}
#coinIcon { width: 32px; height: 32px; image-rendering: pixelated; image-rendering: crisp-edges; flex: none; }
#coinCount { font-size: 26px; line-height: 1; white-space: nowrap; }
#cps { font-size: 12px; color: var(--brown); margin-top: 6px; white-space: nowrap; }

#hudWrap { display: flex; flex-direction: column; gap: 8px; min-width: 0; align-items: flex-start; }
#boosts { display: flex; flex-wrap: wrap; gap: 6px; }
#boosts:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; font-size: 11px; line-height: 1.2; color: var(--dark); background: var(--cream); box-shadow: 0 0 0 2px var(--honey); white-space: nowrap; }
.chip.bad { background: #cfe6f5; box-shadow: 0 0 0 2px #3d5a8c; }
.chip.dark { background: var(--darker); color: var(--yellow); box-shadow: 0 0 0 2px var(--honey); }
.chip .ico { font-size: 11px; }
#topRight { display: flex; align-items: center; gap: 8px; flex: none; }
#wheelOpen { position: relative; padding: 5px 10px; font-size: 18px; line-height: 1.3; background: var(--panel); }
#wheelOpen.ready { background: var(--honey); animation: wheelPulse 1.1s steps(2, jump-none) infinite; }
@keyframes wheelPulse { 50% { transform: translateY(-2px); } }
#wheelOpen.ready::after { content: ''; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; background: var(--red); box-shadow: 0 0 0 2px var(--cream); }

/* Банер подій над сценою (розпродаж, чорна п'ятниця, протікання, міні-гра) */
#eventBanner { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 8; max-width: 94%; padding: 6px 12px; font-size: 12px; line-height: 1.5; text-align: center; color: var(--dark); background: var(--yellow); box-shadow: 0 0 0 3px var(--dark); pointer-events: none; white-space: nowrap; }
#eventBanner.bf { background: var(--darker); color: var(--yellow); box-shadow: 0 0 0 3px var(--honey); }
#eventBanner.leak { background: #cfe6f5; box-shadow: 0 0 0 3px #3d5a8c; }
#eventBanner.game { background: #ffd3c9; box-shadow: 0 0 0 3px var(--red); }
#eventBanner[hidden] { display: none; }

/* ===== Перемикач мови ===== */
#langSwitch { display: flex; gap: 6px; flex: none; }
.lang-btn { padding: 10px 12px; min-width: 52px; font-size: 14px; color: var(--cream); background: var(--brown); box-shadow: inset 0 0 0 3px var(--cream), inset 0 -4px 0 3px rgba(0,0,0,.2); }
.lang-btn[aria-pressed="true"] { background: var(--honey); color: var(--dark); box-shadow: inset 0 0 0 3px var(--dark), inset 0 -4px 0 3px rgba(74,50,40,.2); }

/* ===== Сцена ===== */
/* #scene — «вікно» (на телефоні показує лише середину вулиці), #world — вся вулиця 320×180 */
#scene {
  position: relative;
  flex: none;
  width: 960px;
  height: 540px;
  overflow: hidden;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 0 0 4px var(--darker), 0 0 0 8px var(--honey), 0 0 0 12px var(--darker);
}
#world {
  position: relative;
  width: 960px;
  height: 540px;
}
#world canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
}
#scene:focus-visible { outline: 4px solid var(--pink); outline-offset: 10px; }
#shopOverlay {
  position: absolute;
  pointer-events: none;
  transform-origin: 50% 100%;
}
#sign {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  text-align: center;
  color: var(--cream);
  line-height: 1.05;
}
#signText { display: block; max-width: 100%; text-wrap: balance; text-shadow: 0 calc(var(--u) * 0.5) 0 var(--darker); }
#floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater {
  position: absolute;
  font-size: max(15px, calc(var(--u) * 8));
  color: var(--yellow);
  white-space: nowrap;
  text-shadow: 2px 0 var(--darker), -2px 0 var(--darker), 0 2px var(--darker), 0 -2px var(--darker), 2px 2px var(--darker), -2px -2px var(--darker), 2px -2px var(--darker), -2px 2px var(--darker);
  animation: floatUp 0.95s steps(14, end) forwards;
}
@keyframes floatUp {
  0%   { opacity: 0; transform: translate(-50%, -30%) scale(.6); }
  12%  { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, calc(-60% - 3.4em)) scale(1); }
}

/* ===== Панель і вкладки ===== */
#tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 9px 2px 8px; font-size: 9px; line-height: 1.1; min-width: 0; }
.tab .tab-icon { font-size: 18px; line-height: 1; }
.tab .tab-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--honey); }
.tab.soon:not([aria-selected="true"]) { opacity: .6; }
.tab.alert::after { content: ''; position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; background: var(--red); box-shadow: 0 0 0 2px var(--cream); animation: blink 1s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: .25; } }
#tabContent { flex: 1; min-height: 0; overflow-y: auto; padding: 2px; }
.pane[hidden] { display: none; }
.card h2 { font-size: 16px; margin-bottom: 8px; line-height: 1.3; }
.card .sub { color: var(--brown); font-size: 12px; }
.capi-card { display: flex; gap: 12px; align-items: center; }
#capiPortrait { width: 72px; height: 72px; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; background: var(--mint); box-shadow: 0 0 0 3px var(--brown); }
.capi-card .who { margin-bottom: 6px; color: var(--red); }
.capi-card p { font-size: 12px; line-height: 1.7; }
.stat { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 2px dotted var(--tan); font-size: 12px; line-height: 1.5; }
.stat:last-child { border-bottom: 0; }
.stat b { font-weight: 400; white-space: nowrap; color: var(--red); }
.hint { text-align: center; color: var(--brown); font-size: 12px; line-height: 1.6; }
#saveWarn { margin-top: 8px; padding: 8px 10px; font-size: 11px; line-height: 1.6; color: var(--cream); background: var(--red); }
#saveWarn[hidden] { display: none; }

/* ===== Відділи ===== */
.buy-modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.buy-mode { padding: 9px 2px; font-size: 12px; }
.buy-mode[aria-pressed="true"] { background: var(--honey); }
.expand-card { background: #e6f5e9; }
.expand-card h2 { font-size: 14px; }
.expand-card p { font-size: 11px; line-height: 1.7; color: var(--brown); margin-bottom: 6px; }
.req { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; line-height: 1.6; padding: 2px 0; }
.req.ok b { color: var(--green); }
.req b { font-weight: 400; color: var(--red); white-space: nowrap; }
.btn.wide { display: block; width: 100%; padding: 11px 8px; margin-top: 8px; font-size: 12px; line-height: 1.4; }
.btn.go { background: var(--mint); }
.dept-head { display: flex; align-items: center; gap: 8px; }
.dept-icon { font-size: 20px; line-height: 1; flex: none; }
.dept-name { flex: 1; min-width: 0; font-size: 12px; line-height: 1.4; }
.dept-count { font-size: 17px; color: var(--red); flex: none; }
.dept-income { font-size: 11px; line-height: 1.7; color: var(--brown); margin: 6px 0 4px; }
.ms { display: flex; align-items: center; gap: 8px; margin: 4px 0 2px; }
.ms-bar { flex: 1; height: 8px; background: var(--tan); box-shadow: 0 0 0 2px var(--brown); position: relative; }
.ms-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--honey); box-shadow: inset 0 -2px 0 rgba(74,50,40,.25); }
.ms-text { font-size: 10px; color: var(--brown); white-space: nowrap; }
.dept.locked { opacity: .65; text-align: center; font-size: 11px; line-height: 1.7; color: var(--brown); }

/* ===== Команда ===== */
.team-note { font-size: 11px; line-height: 1.8; color: var(--brown); margin: 0 2px 10px; text-align: center; }
.team-card { display: flex; gap: 10px; align-items: flex-start; }
.team-card .portrait { width: 64px; height: 64px; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; background: var(--mint); box-shadow: 0 0 0 3px var(--brown); }
.team-card .info { flex: 1; min-width: 0; }
.team-card .t-name { font-size: 13px; line-height: 1.4; color: var(--dark); }
.team-card .t-role { font-size: 11px; line-height: 1.5; color: var(--red); margin-top: 2px; }
.team-card .t-trait { font-size: 10px; line-height: 1.7; color: var(--brown); margin-top: 4px; }
.team-card .t-lvl { font-size: 11px; margin-top: 6px; color: var(--dark); }
.team-card .t-now { font-size: 11px; line-height: 1.6; margin-top: 4px; color: var(--green); }
.team-card .t-next { font-size: 10px; line-height: 1.6; margin-top: 2px; color: var(--brown); }
.team-card.unhired .portrait { filter: grayscale(.8) brightness(.8); }
.team-card .btn.wide { margin-top: 8px; }

/* ===== Майстерня часу, досягнення, налаштування ===== */
.ws-line { font-size: 11px; line-height: 1.8; color: var(--brown); margin-bottom: 6px; }
.ws-gain { font-size: 13px; line-height: 1.7; color: var(--red); margin: 6px 0 4px; }
.warp-card { background: #efe4ff; }
.ws-card .ws-now { font-size: 11px; line-height: 1.7; color: var(--green); margin-top: 6px; }
.ws-card .ws-next { font-size: 10px; line-height: 1.7; color: var(--brown); }
.row { display: flex; gap: 8px; margin: 6px 0; }
.row .btn { flex: 1; padding: 10px 6px; font-size: 12px; }
.row .btn[aria-pressed="true"] { background: var(--honey); }
#pane-settings .btn.wide { margin-top: 6px; }
#pane-settings textarea { width: 100%; font-family: var(--font); font-size: 10px; line-height: 1.5; padding: 8px; margin: 6px 0; background: #fff; color: var(--dark); border: 3px solid var(--brown); resize: vertical; -webkit-user-select: text; user-select: text; }
.btn.danger { background: #f3b0a2; }
.ach-row { display: flex; gap: 10px; align-items: center; padding-top: 8px; padding-bottom: 8px; }
.ach-row .badge { width: 48px; height: 48px; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; }
.ach-row .info { flex: 1; min-width: 0; }
.ach-row .a-name { font-size: 12px; line-height: 1.4; }
.ach-row .a-desc { font-size: 10px; line-height: 1.6; color: var(--brown); margin: 2px 0 4px; }
.ach-row.locked-ach .a-name { color: #8a7a6c; }
.toast { white-space: pre-line; display: flex; align-items: center; justify-content: center; gap: 10px; }
.toast canvas { width: 40px; height: 40px; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; }

/* Подорож у часі */
#confirmModal { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(42,29,26,.78); }
#confirmModal[hidden] { display: none; }
#timeWarp { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #fff4dc 0%, #f2b84b 25%, #7a4f35 60%, #2a1d1a 100%); overflow: hidden; }
#timeWarp::before { content: ''; position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, rgba(42,29,26,.55) 0 8deg, rgba(255,224,138,.25) 8deg 16deg); animation: warpSpin 1.2s linear infinite reverse; }
#timeWarp[hidden] { display: none; }
#warpClock { position: relative; width: 128px; height: 128px; image-rendering: pixelated; image-rendering: crisp-edges; }
@keyframes warpSpin { to { transform: rotate(360deg); } }
body.warping #app { filter: sepia(1) saturate(1.5) contrast(1.05); transition: filter .6s; }
body.no-anim .floater { display: none; }

/* Епохи: вивіска змінює вигляд */
body[data-epoch="2"] #sign { color: #ffe08a; text-shadow: 0 0 calc(var(--u) * 2) #ef8fa3, 0 calc(var(--u) * 0.5) 0 #4a3228; }
body[data-epoch="3"] #sign { color: #aaffff; text-shadow: 0 0 calc(var(--u) * 2) #33ddff, 0 0 calc(var(--u) * 4) #3399ff; }

/* ===== Історія ===== */
.story-note { font-size: 11px; line-height: 1.8; color: var(--brown); margin: 0 2px 10px; text-align: center; }
.chapter-card { display: flex; align-items: center; gap: 10px; }
.chapter-card .num { font-size: 18px; color: var(--red); flex: none; min-width: 26px; text-align: center; }
.chapter-card .title { flex: 1; min-width: 0; font-size: 13px; line-height: 1.5; }
.chapter-card .btn { flex: none; padding: 10px 12px; font-size: 11px; }

/* ===== Діалоги ===== */
#dialog { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; padding: 14px; background: rgba(42,29,26,.45); cursor: pointer; }
#dialog[hidden] { display: none; }
#dialogWrap { position: relative; width: min(100%, 800px); margin-top: 48px; }
#dialogBox { position: relative; width: 100%; min-height: 156px; padding: 20px 22px 22px; display: flex; gap: 18px; align-items: flex-start; cursor: pointer; }
#dlgPortraitWrap { flex: none; width: 88px; height: 88px; background: var(--mint); box-shadow: 0 0 0 3px var(--brown); display: flex; align-items: center; justify-content: center; }
#dlgPortraitWrap.none { display: none; }
#dlgPortrait { width: 88px; height: 88px; image-rendering: pixelated; image-rendering: crisp-edges; }
.dlg-main { flex: 1; min-width: 0; align-self: stretch; display: flex; flex-direction: column; }
#dlgName { font-size: 15px; color: var(--red); min-height: 18px; margin-bottom: 8px; }
#dlgText { font-size: 14px; line-height: 1.9; min-height: calc(1.9em * 4); white-space: pre-line; flex: 1; }
#dlgText.title { font-size: 17px; text-align: center; padding-top: 14px; color: var(--red); }
#dlgNext { align-self: flex-end; font-size: 15px; color: var(--brown); animation: blink 0.8s steps(2, jump-none) infinite; visibility: hidden; }
#dlgNext.on { visibility: visible; }
#dlgSkip { position: absolute; right: 6px; top: -42px; padding: 10px 12px; font-size: 11px; background: var(--panel); color: var(--dark); }
@media (max-width: 560px) {
  #dialog { padding: 8px; }
  #dialogBox { padding: 16px 14px 16px; gap: 12px; min-height: 150px; }
  #dlgPortraitWrap, #dlgPortrait { width: 64px; height: 64px; }
  #dlgName { font-size: 13px; }
  #dlgText { font-size: 12px; }
}

/* ===== Бульбашки з фразами ===== */
#bubbles { position: absolute; inset: 0; pointer-events: none; }
.bubble {
  position: absolute;
  transform: translate(-50%, -100%);
  max-width: calc(var(--u) * 72);
  width: max-content;
  padding: calc(var(--u) * 2) calc(var(--u) * 3);
  font-size: max(11px, calc(var(--u) * 5));
  line-height: 1.5;
  text-align: center;
  color: var(--dark);
  background: var(--cream);
  box-shadow: 0 0 0 2px var(--dark);
  animation: bubbleIn .18s steps(3, end);
  z-index: 5;
}
.bubble::after { content: ''; position: absolute; left: 50%; top: 100%; width: 6px; height: 6px; margin-left: -3px; background: var(--cream); box-shadow: 2px 2px 0 0 var(--dark); transform: translateY(-3px) rotate(45deg); }
@keyframes bubbleIn { from { opacity: 0; transform: translate(-50%, -80%); } }

/* ===== Сповіщення (тости) ===== */
#toasts { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 420px); }
.toast { --notch: 3px; width: 100%; padding: 10px 14px; font-size: 12px; line-height: 1.6; text-align: center; background: var(--cream); box-shadow: inset 0 0 0 3px var(--dark), inset 0 0 0 5px var(--honey); clip-path: polygon(0 3px, 3px 3px, 3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px)); animation: toastIn .25s steps(5, end), toastOut .3s steps(3, end) forwards; animation-delay: 0s, var(--life, 3s); }
.toast.good { background: #e6f5e9; }
.toast.big { background: var(--yellow); }
.toast.bad { background: #ffd3c9; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-16px); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }

/* ===== Вікно (офлайн-заробіток) ===== */
#soundModal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(42,29,26,.72); }
#soundModal[hidden] { display: none; }
.vol { display: block; text-align: left; font-size: 12px; margin: 14px 0 4px; }
.vol span { display: block; margin-bottom: 8px; }
.vol input[type="range"] { width: 100%; height: 26px; accent-color: var(--green); cursor: pointer; }

// Умова відкриття глави для стану s (використовується і в грі, і при міграції старих збережень)
function triggerMet(trig, s) {
  if (trig.earned !== undefined && !(s.totalEarned >= trig.earned)) return false;
  if (trig.level !== undefined && !(s.shopLevel >= trig.level)) return false;
  if (trig.depts && !trig.depts.every(([i, n]) => s.depts && s.depts[i] >= n)) return false;
  return true;
}

const CHIBI_LOWER = ['...d1111', '...d1122', '...d1222', '...d1222', '...d1111', '...333..'];
function composeChibi(p) {
  const lower = CHIBI_LOWER.map(r => r.replace(/1/g, p.body).replace(/2/g, p.belly).replace(/3/g, p.feet));
  return [...p.top, ...lower].map(r => r + r.split('').reverse().join(''));
}

    ch1_title: 'One Coin',
    ch1_0: 'A tiny pixel town. Morning sun, fresh cobblestones, and somewhere nearby the smell of warm buns.',
    ch1_1: 'An old cart rolls onto the street, and a capybara with a flower on her head peeks out carefully.',
    ch1_2: "Hello, town! I'm Capy. I came a long way... with exactly one coin in my pocket.",
    ch1_3: 'But I have a dream: my very own little shop. And there it is — an old booth on the corner!',
    ch1_4: 'A bit shabby, but it has an awning. I will call it "Everything for a Penny". We already have a penny. Almost.',
    ch1_5: 'And so the big story of a little shop began. Tap it to earn your first coins!',

    ch2_title: 'First Friends',
    ch2_0: 'In a few days business picked up. Customers kept coming, and Capy could barely sell and count at the same time.',
    ch2_1: "Excuse me, do you have a job opening? I'm Spike the Hedgehog.",
    ch2_2: 'Ouch! You are prickly!',
    ch2_3: "That's just politeness. Protection from suspicious customers. Also, I am great with money.",
    ch2_4: "Great with money? You're hired! Here is the till — it's yours.",
    ch2_5: 'Thank you! I promise not a penny gets lost. Unless it gets stuck in my spikes.',
    ch2_6: 'Tip: open the "Team" tab and hire Spike — he boosts your tap power.',

    ch3_title: 'Someone Is Stealing!',
    ch3_0: 'The shop grew, and the whole town started talking about it. But along with customers, someone else showed up.',
    ch3_1: 'Capy! A pack of cookies vanished from the counter. All I saw was a striped tail!',
    ch3_2: 'A striped tail? That looks like...',
    ch3_3: "Hehe! Nothing personal, just business. I'm Shnyr, the sneakiest raccoon in town!",
    ch3_4: 'You took my cookies! Give them back right now!',
    ch3_5: "Oh, they're almost... um... eaten. Tag, you can't catch me!",
    ch3_6: "He's gone! Oh well, next time we'll be ready.",
    ch3_7: "Shnyr is sly, but doesn't seem mean. He'll be back, so keep your eyes open!",

    ch4_title: 'The Strange Watch',
    ch4_0: 'While sorting old junk in the storeroom, Capy found something strange.',
    ch4_1: 'A pocket watch! Old, but pretty. The gold is dark and the glass is a bit cracked.',
    ch4_2: 'Oh, it ticks... but the hands go... backwards?',
    ch4_3: 'Must be broken. My grandpa said: a watch that ticks backwards is either broken or magic.',
    ch4_4: "Magic? Ha-ha! Still, I'll keep it. It's so pretty.",
    ch4_5: "The watch gave a soft tick in Capy's pocket, as if it were smiling.",

    ch5_title: 'Supermarket',
    ch5_0: 'The shop grew into a real supermarket. The whole town talked about Capy and her "Everything for a Penny", and new friends came to join the team.',
    ch5_1: "Capy! I'm Bodie, a beaver builder. Heard you're expanding. Need help with planks?",
    ch5_2: "And I'm Zoe! A shop assistant! Oh, what windows... I could sell snow in winter!",
    ch5_3: "Hoo. I'm Sonia, the accountant. Someone has to count these piles of coins before they roll away.",
    ch5_4: "And I'm Tonya. Security. Slow, but reliable.",
    ch5_5: "Friends, come in! I don't even know how to thank you!",
    ch5_6: "Thank me? I'm first in line for a bonus.",
    ch5_7: 'The team is growing. Hire new animals in the "Team" tab!',

    ch6_title: 'Shnyr in Trouble',
    ch6_0: 'One rainy evening Capy heard a strange sound by the back door.',
    ch6_1: 'Is someone crying? Shnyr, is that you?',
    ch6_2: "I... I'm not crying. It's just rain. On my face. Only on my face.",
    ch6_3: "Why do you steal, Shnyr? Don't you have a home?",
    ch6_4: "Home? I live in an old crate behind the bakery. And I have no friends. None.",
    ch6_5: 'If someone just said "hi" to me for no reason... But everyone shouts: "Catch the raccoon!"',
    ch6_6: "Hi, Shnyr. For no reason. Come in, we have hot tea and buns.",
    ch6_7: "Really? I... um... won't steal anymore. Well, only very rarely. Kidding!",
    ch6_8: 'From then on Shnyr was no longer a thief. He was a friend.',

    ch7_title: 'The Shopping Mall',
    ch7_0: 'Time passed. The little stall became a shop, then a supermarket, and now...',
    ch7_1: 'A real shopping mall rose on the street, with a glass roof, a cinema and the smell of fresh pastry.',
    ch7_2: 'I did it... "Capy\'s Shopping Mall". From a single coin!',
    ch7_3: 'You did it, we did it, and I got a bonus. A good day.',
    ch7_4: 'It is more fun with you than stealing. Although stealing was fun too.',
    ch7_5: "Thank you all. I couldn't have done it without you.",
    ch7_6: "Suddenly something ticked loudly in Capy's pocket.",
    ch7_7: 'My watch?.. It came alive!',

    ch8_title: 'Finale: The Watch Ticks',
    ch8_0: 'The golden watch slowly rose from the pocket and floated in the air. Its hands began to spin backwards.',
    ch8_1: "Hello, Capy. I have waited a long time. A very long time.",
    ch8_2: 'You can talk?!',
    ch8_3: 'I am the Watch of Time. The one who can turn back minutes.',
    ch8_4: 'You built a wonderful mall. But think: what if you knew everything you know now?',
    ch8_5: 'Start over? But I already...',
    ch8_6: 'Not to lose, but to build wiser. Friends will stay. Knowledge will stay. Coins will not.',
    ch8_7: 'Wiser... That sounds nice. I will think about it.',
    ch8_8: 'When you are ready, wind me up. I am here, ticking.',
    ch8_9: 'Time travel awaits Capy. (It will open in one of the next updates.)',

/* =====================================================================
   СТАН ГРИ (весь стан — в одному об'єкті state)

function createDefaultState() {
  return {
    lang: null,                        // 'uk' | 'en'; null — ще не обрано
    coins: CONFIG.START_COINS,
    totalEarned: CONFIG.START_COINS,
    taps: 0,
    tapPower: CONFIG.START_TAP_POWER,
    cps: 0,                            // дохід за секунду (рахується з відділів)
    shopLevel: 1,                      // 1 = крамничка ... 6 = торговий центр
    depts: DEPARTMENTS.map(() => 0),   // скільки штук кожного відділу куплено
    team: TEAM.map(() => 0),           // рівень кожного звірятка: 0 — не найняте, 1…10
    story: { done: 0, shnyrFriend: false, finale: false },   // done — скільки глав прочитано
    // Події: час (мс від 1970 р.) наступного розпродажу / неприємності та активні бусти
    events: { nextSale: 0, saleUntil: 0, nextTrouble: 0, incomeBoostUntil: 0, incomeBoostMult: 1, tapBoostUntil: 0, tapBoostMult: 1 },
    wheel: { lastSpin: 0, streak: 0 },                       // колесо фортуни
    stats: { raccoonsCaught: 0, raccoonsLost: 0, wheelSpins: 0, timeTravels: 0, puddlesFixed: 0, deptsBought: 0, milestones: 0, teamMaxLevel: 0, maxLevel: 1, holidaysSeen: 0, jackpots: 0 },
    settings: { musicVol: 0.6, sfxVol: 0.8, muted: false, animations: true, numFmt: 'short' },  // звук 0…1; анімації; формат чисел
    // Подорож у часі: кристали, епоха, покращення майстерні, знайомі звірята
    crystals: 0, crystalsTotal: 0, epoch: 0, runStartEarned: 0,
    ws: WORKSHOP.map(() => 0),
    teamKnown: TEAM.map(() => 0),
    ach: ACHIEVEMENTS.map(() => 0),     // 1 — досягнення отримано
    tutorialDone: false,
    buyMode: 1,                        // 1 | 10 | 100 | 'max'
    pendingOffline: 0,                 // офлайн-заробіток, який ще не забрали
    tab: 'shop',
    playTime: 0,                       // секунд у грі
    savedAt: 0
  };
}
const state = createDefaultState();

/* ---------- Відділи й дохід ---------- */

// Скільки віх уже пройдено при такій кількості
function milestonesReached(count) {
  return CONFIG.MILESTONES.filter(m => count >= m).length;
}
function nextMilestone(count) {
  const m = CONFIG.MILESTONES.find(x => count < x);
  return m === undefined ? null : m;
}
function levelMult(level = state.shopLevel) {
  return Math.pow(CONFIG.LEVEL_MULT, level - 1);
}
/* ---------- Бонуси команди ---------- */
function teamLevelOf(id) {
  const i = TEAM.findIndex(m => m.id === id);
  return i < 0 ? 0 : state.team[i];
}
// Сума бонусів одного типу від усіх найнятих звіряток (значення × рівень), з обмеженням cap
function teamBonus(type, field = 'per') {
  let sum = 0;
  TEAM.forEach((m, i) => {
    if (m.bonus.type !== type || state.team[i] <= 0) return;
    let v = m.bonus[field] * state.team[i];
    if (field === 'per' && m.bonus.cap !== undefined) v = Math.min(v, m.bonus.cap);
    sum += v;
  });
  return sum;
}
// Множник доходу відділу i від звіряток (Зоя, Михась, Мурзик, Жужа)
function teamDeptMult(i) {
  let mult = 1;
  TEAM.forEach((m, k) => {
    if (m.bonus.type === 'deptIncome' && state.team[k] > 0 && m.bonus.depts.includes(i)) mult *= 1 + m.bonus.per * state.team[k];
  });
  return mult;
}
function teamGlobalMult() { return 1 + teamBonus('global'); }
// Рівень покращення майстерні (за кристали)
function wsLevel(id) { const i = WORKSHOP.findIndex(w => w.id === id); return i < 0 ? 0 : state.ws[i]; }
function crystalMult() { return 1 + CONFIG.CRYSTAL_INCOME_BONUS * state.crystalsTotal; }
function costMult() { return (1 - teamBonus('deptCost')) * (1 - 0.03 * wsLevel('cheaperDepts')); }              // Тома: відділи дешевші
function expandCostMult() { return 1 - teamBonus('expandCost'); }       // Бодя: розширення дешевші
function offlineRate() { return Math.min(1, CONFIG.OFFLINE_RATE + teamBonus('offline', 'rate') + 0.1 * wsLevel('offlineRate')); }          // Соня
function offlineMaxHours() { return CONFIG.OFFLINE_MAX_HOURS + teamBonus('offline', 'hours') + 4 * wsLevel('offlineHours'); }
// Для наступних етапів: шанс появи єнота (Тоня), сила свят (Пао), швидкість ремонту (Кря)
function thiefChanceMult() { return (1 - teamBonus('thief')) * (1 - 0.1 * wsLevel('thiefLess')); }
function eventPowerMult() { return 1 + teamBonus('event'); }
function fixSpeedMult() { return 1 + teamBonus('fix'); }

// Дохід одної штуки відділу (з віхами, рівнем магазину й бонусом звіряток)
function deptIncomeEach(i) {
  const d = DEPARTMENTS[i];
  return d.baseIncome * Math.pow(CONFIG.MILESTONE_MULT, milestonesReached(state.depts[i])) * levelMult() * teamDeptMult(i) *
    (1 + holidayDeptBonus(i) * eventPowerMult());
}
// Тимчасові множники: розпродаж, чорна п'ятниця, свято, бусти з колеса, протікання даху (Пао підсилює свята й розпродажі)
function tempIncomeMult() {
  const now = Date.now(), power = eventPowerMult();
  let m = 1;
  if (theme.blackFriday) m *= 1 + (CONFIG.BLACK_FRIDAY_MULT - 1) * power;
  else if (state.events.saleUntil > now) m *= 1 + (CONFIG.SALE_MULT - 1) * power;
  m *= 1 + holidayGlobalBonus() * power;
  if (state.events.incomeBoostUntil > now) m *= state.events.incomeBoostMult;
  if (trouble && trouble.type === 'leak') m *= 1 - CONFIG.LEAK_INCOME_PENALTY;
  return m;
}
function tapBoostMult() { return state.events.tapBoostUntil > Date.now() ? state.events.tapBoostMult : 1; }
// Перерахунок похідних величин
function recalcIncome() {
  let sum = 0;
  DEPARTMENTS.forEach((d, i) => { sum += state.depts[i] * deptIncomeEach(i); });
  state.cps = sum * teamGlobalMult() * tempIncomeMult() * crystalMult();
}
// Скільки монеток дає один тап: база × рівень магазину + частка доходу за секунду, ще × бонус Голки.
// Тож тап росте разом з доходом: 1 → десятки → сотні → тисячі → мільйони…
function tapValue() {
  const base = state.tapPower * levelMult() + state.cps * CONFIG.TAP_CPS_SHARE;
  return base * (1 + teamBonus('tap')) * (1 + 0.5 * wsLevel('tapPower')) * tapBoostMult();
}
function isDeptUnlocked(i) {
  return DEPARTMENTS[i].level <= state.shopLevel;
}

// Ціна n штук відділу i, якщо вже куплено count
function deptCost(i, n, count = state.depts[i]) {
  const r = CONFIG.COST_GROWTH;
  return DEPARTMENTS[i].baseCost * costMult() * Math.pow(r, count) * (Math.pow(r, n) - 1) / (r - 1);
}
// Скільки штук можна купити на всі наявні монетки
function maxAffordable(i, coins = state.coins) {
  const r = CONFIG.COST_GROWTH;
  const first = DEPARTMENTS[i].baseCost * costMult() * Math.pow(r, state.depts[i]);
  if (!(coins >= first)) return 0;
  let n = Math.floor(Math.log(1 + coins * (r - 1) / first) / Math.log(r));
  if (!isFinite(n)) return 0;
  n = Math.min(n, 100000);
  while (n > 0 && deptCost(i, n) > coins) n--;
  while (n < 100000 && deptCost(i, n + 1) <= coins) n++;
  return n;
}
// Скільки штук покаже кнопка зараз (для МАКС — скільки реально можна купити, мінімум 1)
function plannedBuy(i) {
  if (state.buyMode === 'max') return Math.max(1, maxAffordable(i));
  return state.buyMode;
}

/* ---------- Розширення магазину ---------- */
function nextLevelDef() {
  return state.shopLevel < LEVELS.length ? LEVELS[state.shopLevel] : null;
}
function requirementsMet(def) {
  return def.requires.every(r => state.depts[r.dept] >= r.count);
}
function expandCost(def) { return def.cost * expandCostMult(); }

/* ---------- Команда: найм і прокачка ---------- */
function isTeamUnlocked(i) { return TEAM[i].level <= state.shopLevel; }
// Ціна переходу звірятка на рівень lvl (lvl = 1 — найм)
function teamCost(i, lvl) {
  const known = lvl === 1 && state.teamKnown[i] ? CONFIG.TEAM_KNOWN_DISCOUNT : 1;   // знайоме звірятко наймати дешевше
  return TEAM[i].baseCost * Math.pow(CONFIG.TEAM_LEVEL_COST_GROWTH, lvl - 1) * known * (1 - 0.05 * wsLevel('cheaperTeam'));
}

   ЗБЕРЕЖЕННЯ

let storageOk = true;

// Міграції старих збережень: ключ N — функція, що перетворює версію N у N+1.
// Додаючи нові поля в state, нічого ламати не треба: відсутні поля беруться зі значень за замовчуванням.
const SAVE_MIGRATIONS = {
  // версія 1 (етап 1) → 2 (етап 2): з'явилися відділи, офлайн-заробіток та режим покупки
  1: (data) => {
    if (data.state && !Array.isArray(data.state.depts)) data.state.depts = DEPARTMENTS.map(() => 0);
    return data;
  },
  // версія 2 (етап 2) → 3 (етап 3): з'явилася команда звіряток
  2: (data) => {
    if (data.state && !Array.isArray(data.state.team)) data.state.team = TEAM.map(() => 0);
    return data;
  },
  // версія 3 (етап 3) → 4 (етап 4): з'явився сюжет. Глави, умови яких гравець уже виконав,
  // вважаємо прочитаними — щоб вони не посипалися всі одразу (їх можна перечитати у вкладці «Історія»)
  // версія 4 (етап 4) → 5 (етап 5): з'явилися події, колесо й статистика — нові поля беруться зі значень за замовчуванням
  4: (data) => data,
  // версія 5 (етап 5) → 6 (етап 6): з'явилися налаштування звуку — беруться зі значень за замовчуванням
  5: (data) => data,
  // версія 6 (етап 6) → 7 (етап 7): гравець, що вже грає, туторіал не бачить; уже найнятих звіряток вважаємо знайомими
  6: (data) => {
    const s = data.state;
    if (s) {
      s.tutorialDone = true;
      if (Array.isArray(s.team)) s.teamKnown = s.team.map(v => (v > 0 ? 1 : 0));
    }
    return data;
  },
  3: (data) => {
    const s = data.state;
    if (s && !s.story) {
      let done = 0;
      while (done < CHAPTERS.length && triggerMet(CHAPTERS[done].trigger, s)) done++;
      s.story = { done, shnyrFriend: done >= 6, finale: done >= 8 };
    }
    return data;
  }
};

function migrateSave(data) {
  let v = Number(data.v) || 1;
  while (v < CONFIG.SAVE_VERSION) {
    const step = SAVE_MIGRATIONS[v];
    if (step) data = step(data);
    v++;
  }
  data.v = CONFIG.SAVE_VERSION;
  return data;
}

// Переносимо в target лише ті поля з src, що існують у target і мають той самий тип
function mergeInto(target, src) {
  if (!src || typeof src !== 'object') return;
  for (const key of Object.keys(target)) {
    if (!(key in src)) continue;
    const a = target[key], b = src[key];
    if (key === 'buyMode') {
      if (CONFIG.BUY_MODES.includes(b)) target[key] = b;
    } else if (a && typeof a === 'object' && !Array.isArray(a)) {
      mergeInto(a, b);
    } else if (Array.isArray(a)) {
      if (Array.isArray(b)) {
        // довжину масиву лишаємо за новим станом, значення беремо зі збереження
        for (let i = 0; i < a.length; i++) if (typeof b[i] === 'number' && isFinite(b[i]) && b[i] >= 0) a[i] = Math.floor(b[i]);
      }
    } else if (typeof a === 'number') {
      if (typeof b === 'number' && isFinite(b)) target[key] = b;
    } else if (a === null) {
      if (typeof b === 'string') target[key] = b;
    } else if (typeof a === typeof b) {
      target[key] = b;
    }
  }
}

function saveGame() {
  if (savingDisabled) return;
  try {
    state.savedAt = Date.now();
    localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify({ v: CONFIG.SAVE_VERSION, state }));
    if (!storageOk) { storageOk = true; updateSaveWarning(); }
  } catch (e) {
    if (storageOk) { storageOk = false; updateSaveWarning(); }
  }
}

function loadGame() {
  let raw = null;
  try {
    raw = localStorage.getItem(CONFIG.SAVE_KEY);
  } catch (e) {
    storageOk = false;
    return false;
  }
  if (!raw) return false;
  try {
    const data = migrateSave(JSON.parse(raw));
    mergeInto(state, data.state);
    state.shopLevel = Math.max(1, Math.min(LEVELS.length, Math.floor(state.shopLevel)));
    return true;
  } catch (e) {
    // Пошкоджене збереження: відкладаємо копію вбік і починаємо з нуля
    try { localStorage.setItem(CONFIG.SAVE_KEY + '_broken', raw); } catch (e2) { /* нічого */ }
    return false;
  }
}

function t(key, ...args) {
  const dict = translations[state.lang] || translations.en;
  let str = dict[key];
  if (str === undefined) str = translations.en[key];
  if (str === undefined) return key;
  return str.replace(/\{(\d+)\}/g, (_, i) => (args[i] !== undefined ? args[i] : ''));
}

// Суфікс розряду: 0..4 — зі словника мови, далі aa, ab, ac, ... az, ba ...
function tierSuffix(tier, fmt) {
  if (tier < fmt.suffixes.length) return fmt.suffixes[tier];
  const idx = tier - fmt.suffixes.length;
  const first = Math.floor(idx / 26);
  if (first >= 26) return null;
  return String.fromCharCode(97 + first) + String.fromCharCode(97 + (idx % 26));
}

// 1500 → «1,5 тис.» / «1.5K». maxDecimals — скільки знаків після коми показувати для чисел < 1000
function formatNumber(value, lang, maxDecimals = 0) {
  const fmt = NUMBER_FORMAT[lang] || NUMBER_FORMAT.en;
  if (!isFinite(value)) return '∞';
  const sign = value < 0 ? '-' : '';
  let n = Math.abs(value);
  const mode = (state.settings && state.settings.numFmt) || 'short';
  if (n >= 1000 && mode === 'sci') {            // 1.5e6
    const e = Math.floor(Math.log10(n));
    return sign + String(parseFloat((n / Math.pow(10, e)).toFixed(2))).replace('.', fmt.decimal) + 'e' + e;
  }
  if (n >= 1000 && n < 1e15 && mode === 'full') {   // 1 500 000
    return sign + Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, lang === 'uk' ? ' ' : ',');
  }

  if (n < 1000) {
    const s = String(parseFloat(n.toFixed(maxDecimals)));
    if (parseFloat(s) < 1000) return sign + s.replace('.', fmt.decimal);
  }

  let tier = 0;
  while (n >= 1000) { n /= 1000; tier++; }
  const decimalsFor = x => (x < 10 ? 2 : x < 100 ? 1 : 0);
  let rounded = parseFloat(n.toFixed(decimalsFor(n)));
  if (rounded >= 1000) { rounded = 1; tier++; }   // 999,96 тис. → 1 млн
  const suffix = tierSuffix(tier, fmt);
  if (suffix === null) return sign + n.toExponential(2);
  return sign + String(rounded).replace('.', fmt.decimal) + fmt.space + suffix;
}
function fmt(n, dec) { return formatNumber(n, state.lang, dec || 0); }

const spriteCache = new Map();

// Перетворює спрайт-масив рядків на маленький canvas (кешується)
function getSpriteCanvas(name, variant) {
  const key = name + '|' + (variant || '');
  if (spriteCache.has(key)) return spriteCache.get(key);
  const spr = SPRITES[name];
  const over = (variant && spr.variants && spr.variants[variant]) || {};
  const rows = spr.rows;
  const w = rows[0].length, h = rows.length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    if (row.length !== w) console.warn('Спрайт «' + name + '»: рядок ' + y + ' має довжину ' + row.length + ', а має бути ' + w);
    for (let x = 0; x < w; x++) {
      const ch = row[x];
      if (ch === '.' || ch === ' ' || ch === undefined) continue;
      const color = over[ch] || PALETTE[ch];
      if (!color) { console.warn('Спрайт «' + name + '»: невідомий колір «' + ch + '»'); continue; }
      g.fillStyle = color;
      g.fillRect(x, y, 1, 1);
    }
  });
  spriteCache.set(key, c);
  return c;
}

// Малює canvas із масштабуванням відносно нижнього центру.
// opts: flip (дзеркало), sx / sy (розтяг), alpha
function drawCanvasSprite(ctx, c, x, y, opts = {}) {
  const sx = opts.sx || 1, sy = opts.sy || 1;
  const w = c.width, h = c.height;
  const dw = Math.max(1, Math.round(w * sx));
  const dh = Math.max(1, Math.round(h * sy));
  const dx = Math.round(x + (w - dw) / 2);
  const dy = Math.round(y + (h - dh));
  if (opts.alpha !== undefined && opts.alpha < 1) ctx.globalAlpha = Math.max(0, opts.alpha);
  if (opts.flip) {
    ctx.save();
    ctx.translate(dx + dw, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(c, 0, dy, dw, dh);
    ctx.restore();
  } else {
    ctx.drawImage(c, dx, dy, dw, dh);
  }
  ctx.globalAlpha = 1;
}

// Головна функція малювання спрайта за назвою (x, y — лівий верхній кут)
function drawSprite(ctx, name, x, y, opts = {}) {
  drawCanvasSprite(ctx, getSpriteCanvas(name, opts.variant), x, y, opts);
}

// Допоміжні примітиви в кольорах палітри
function R(g, x, y, w, h, ch) {
  g.fillStyle = PALETTE[ch];
  g.fillRect(x, y, w, h);
}
function disc(g, cx, cy, r, ch) {
  g.fillStyle = PALETTE[ch];
  for (let dy = -r; dy <= r; dy++) {
    const half = Math.round(Math.sqrt(r * r + 0.5 - dy * dy));
    g.fillRect(cx - half, cy + dy, half * 2 + 1, 1);
  }
}
function hash2(x, y) { return (((x * 73856093) ^ (y * 19349663)) >>> 0); }
function newLayer() {
  const c = document.createElement('canvas');
  c.width = CONFIG.SCENE_W; c.height = CONFIG.SCENE_H;
  return { c, g: c.getContext('2d') };
}

/* ---------- Небо (статичний шар) ---------- */
function buildSkyLayer() {
  const { c, g } = newLayer();
  const W = CONFIG.SCENE_W;
  const [c1, c2, c3] = currentEpoch().sky;      // три кольори неба залежать від епохи
  R(g, 0, 0, W, 34, c1);
  for (let y = 34; y < 40; y++) for (let x = 0; x < W; x++) R(g, x, y, 1, 1, (x + y) % 2 ? c1 : c2);
  R(g, 0, 40, W, 30, c2);
  for (let y = 70; y < 76; y++) for (let x = 0; x < W; x++) R(g, x, y, 1, 1, (x + y) % 2 ? c2 : c3);
  R(g, 0, 76, W, 60, c3);
  // сонечко
  g.globalAlpha = 0.5; disc(g, 276, 26, 13, 'w'); g.globalAlpha = 1;
  disc(g, 276, 26, 9, 'y');
  disc(g, 276, 26, 6, 'w');
  return c;
}

/* ---------- Будиночок на задньому плані ---------- */
function drawHouse(g, spec) {
  const { x, w, h, wall, roof } = spec;
  const top = LAYOUT.horizonY - h;
  R(g, x, top, w, h, wall);
  g.globalAlpha = 0.12; R(g, x + w - 4, top, 4, h, 'd'); g.globalAlpha = 1;
  // дах — трапеція
  const rh = 8;
  for (let i = 0; i < rh; i++) {
    const inset = rh - 1 - i;
    R(g, x - 3 + inset, top - rh + i, w + 6 - 2 * inset, 1, roof);
  }
  g.globalAlpha = 0.25; R(g, x - 3, top - 1, w + 6, 1, 'd'); g.globalAlpha = 1;
  // вікна
  const cols = Math.max(1, Math.floor((w - 4) / 13));
  const rowsN = Math.max(1, Math.floor((h - 16) / 15));
  const space = (w - 4) / cols;
  for (let r = 0; r < rowsN; r++) {
    for (let cI = 0; cI < cols; cI++) {
      const wx = Math.round(x + 2 + cI * space + (space - 7) / 2);
      const wy = top + 5 + r * 15;
      R(g, wx, wy, 7, 9, 'd');
      R(g, wx + 1, wy + 1, 5, 7, ((cI + r + x) % 3 === 0) ? 'y' : 's');
      R(g, wx + 1, wy + 1, 2, 2, 'S');
      R(g, wx + 3, wy + 1, 1, 7, 'd');
      R(g, wx - 1, wy + 9, 9, 1, 'b');
    }
  }
  // двері
  const dx = Math.round(x + w / 2 - 4);
  R(g, dx, LAYOUT.horizonY - 13, 8, 13, 'd');
  R(g, dx + 1, LAYOUT.horizonY - 12, 6, 12, 'b');
  R(g, dx + 5, LAYOUT.horizonY - 7, 1, 1, 'h');
}

/* ---------- Лампа, ящики, кущ ---------- */
function drawLamp(g, x) {
  R(g, x, 94, 2, 40, 'd');
  R(g, x - 2, 130, 6, 4, 'd');
  R(g, x - 4, 92, 10, 2, 'd');
  R(g, x - 3, 85, 8, 2, 'd');
  R(g, x - 3, 87, 8, 7, 'd');
  R(g, x - 2, 88, 6, 5, 'y');
  R(g, x - 1, 89, 2, 2, 'w');
}
function drawCrates(g, x) {
  R(g, x, 122, 16, 12, 'b');
  R(g, x, 122, 16, 1, 'l');
  R(g, x, 133, 16, 1, 'd');
  R(g, x, 122, 1, 12, 'd'); R(g, x + 15, 122, 1, 12, 'd');
  R(g, x, 127, 16, 1, 'd');
  R(g, x + 7, 122, 2, 12, 'd');
  R(g, x + 2, 119, 3, 3, 'r');
  R(g, x + 6, 118, 3, 4, 'o');
  R(g, x + 10, 119, 3, 3, 'g');
}
function drawBush(g, x, y) {
  disc(g, x, y, 6, 'g');
  disc(g, x - 5, y + 2, 4, 'g');
  disc(g, x + 5, y + 2, 4, 'g');
  disc(g, x - 2, y - 2, 2, 'm');
  R(g, x + 3, y, 1, 1, 'p'); R(g, x - 5, y + 3, 1, 1, 'q');
}

/* ---------- Земля: пагорби, будинки, тротуар, бруківка (статичний шар) ---------- */
function buildGroundLayer() {
  const { c, g } = newLayer();
  const W = CONFIG.SCENE_W, H = CONFIG.SCENE_H;

  // далекі пагорби
  for (let x = 0; x < W; x++) {
    const top = Math.round(98 + 7 * Math.sin(x / 41) + 4 * Math.sin(x / 17 + 2));
    R(g, x, top, 1, LAYOUT.horizonY - top, 'm');
    if (top + 1 < LAYOUT.horizonY) R(g, x, top, 1, 1, 'g');
  }
  // будиночки
  const eh = currentEpoch().houses;      // у деяких епохах будинки мають інші кольори
  HOUSES.forEach((h, i) => drawHouse(g, eh ? Object.assign({}, h, { wall: eh.walls[i % eh.walls.length], roof: eh.roofs[i % eh.roofs.length] }) : h));
  drawBush(g, 40, 121);
  drawBush(g, 296, 121);
  // легка димка, щоб фон «відсунувся»
  g.globalAlpha = 0.16; R(g, 0, 60, W, LAYOUT.horizonY - 60, 'W'); g.globalAlpha = 1;

  // тротуар
  R(g, 0, LAYOUT.horizonY, W, LAYOUT.curbY - LAYOUT.horizonY, 'E');
  R(g, 0, LAYOUT.horizonY, W, 1, 'e');
  for (let x = 6; x < W; x += 20) R(g, x, LAYOUT.horizonY + 1, 1, 9, 'e');
  R(g, 0, LAYOUT.curbY, W, 2, 'e');
  R(g, 0, LAYOUT.curbY, W, 1, 'w');
  R(g, 0, LAYOUT.streetTop, W, 1, 'd');

  // бруківка
  R(g, 0, LAYOUT.streetTop + 1, W, H - LAYOUT.streetTop - 1, 'e');
  for (let row = 0; row < 8; row++) {
    const y = LAYOUT.streetTop + 2 + row * 6;
    const off = (row % 2) * 6;
    for (let x = -12 + off; x < W; x += 12) {
      const hsh = hash2(x + 99, row) % 5;
      const col = hsh === 0 ? 'W' : 'E';
      R(g, x + 1, y, 10, 5, col);
      R(g, x + 2, y, 3, 1, 'w');
      R(g, x + 1, y + 4, 10, 1, 'e');
    }
  }
  g.globalAlpha = 0.1; R(g, 0, 160, W, 20, 'd'); g.globalAlpha = 1;
  return c;
}

/* ---------- Речі біля магазину (залежать від ширини будівлі) ---------- */
function buildPropsLayer() {
  const { c, g } = newLayer();
  const left = shop.x - 12;
  const right = Math.max(262, shop.x + shop.w + 12);
  drawCrates(g, left - 20);
  drawLamp(g, left);
  drawLamp(g, right);
  return c;
}

/* =====================================================================
   ФАСАД МАГАЗИНУ (малюється з прямокутників; росте з рівнем)
   ===================================================================== */

// Чим більше куплено відділу, тим повніша вітрина: 0 — порожньо, 1–3 — поступово більше
function tierOf(count) { return count <= 0 ? 0 : count < 10 ? 1 : count < 50 ? 2 : 3; }

// Один предмет у вітрині. x — ліва межа, yb — лінія полиці (предмет стоїть над нею)
function drawItem(g, kind, x, yb, k) {
  const cols = ['p', 'q', 'o', 'h', 'm', 'u'];
  const c = cols[k % 6];
  switch (kind) {
    case 'trinkets':
      R(g, x, yb - 3, 3, 3, k % 2 ? 'r' : 'h'); R(g, x, yb - 3, 3, 1, 'w'); break;
    case 'sweets':
      R(g, x, yb - 2, 3, 2, c); R(g, x + 1, yb - 3, 1, 1, c); break;
    case 'stationery':
      R(g, x, yb - 6, 1, 6, c); R(g, x, yb - 7, 1, 1, 'y'); R(g, x + 2, yb - 4, 2, 4, 'n'); R(g, x + 2, yb - 4, 2, 1, 'w'); break;
    case 'toys':
      if (k % 2) { R(g, x, yb - 3, 3, 3, c); R(g, x, yb - 3, 1, 1, 'w'); }
      else { R(g, x, yb - 4, 3, 4, 'l'); R(g, x, yb - 5, 1, 1, 'l'); R(g, x + 2, yb - 5, 1, 1, 'l'); R(g, x + 1, yb - 3, 1, 1, 'c'); }
      break;
    case 'cleaning':
      R(g, x, yb - 5, 2, 5, c); R(g, x, yb - 6, 2, 1, 'r'); R(g, x + 3, yb - 4, 2, 4, 's'); break;
    case 'produce':
      R(g, x, yb - 3, 3, 3, ['r', 'o', 'g', 'y', 'r', 'g'][k % 6]); R(g, x + 1, yb - 4, 1, 1, 'G'); break;
    case 'bakery':
      R(g, x, yb - 3, 4, 3, 'c'); R(g, x + 1, yb - 4, 2, 1, 'c'); R(g, x + 1, yb - 2, 2, 1, 'l'); break;
    case 'clothes':
      R(g, x, yb - 5, 4, 4, c); R(g, x + 1, yb - 5, 2, 1, 'w'); R(g, x + 1, yb - 6, 2, 1, 'd'); break;
    case 'shoes':
      R(g, x, yb - 2, 4, 2, c); R(g, x, yb - 3, 2, 1, c); R(g, x, yb - 1, 4, 1, 'd'); break;
    case 'electronics':
      R(g, x, yb - 5, 4, 4, 'd'); R(g, x + 1, yb - 4, 2, 2, k % 2 ? 's' : 'y'); R(g, x + 1, yb - 1, 2, 1, 'e'); break;
    case 'foodcourt':
      if (k % 2) { R(g, x, yb - 4, 1, 4, 'y'); R(g, x + 1, yb - 5, 1, 5, 'y'); R(g, x + 2, yb - 4, 1, 4, 'y'); }
      else { R(g, x, yb - 1, 4, 1, 'c'); R(g, x, yb - 2, 4, 1, 'g'); R(g, x, yb - 3, 4, 1, 'l'); R(g, x, yb - 4, 4, 1, 'c'); }
      break;
    case 'cinema':
      R(g, x, yb - 7, 3, 7, ['u', 'r', 'n'][k % 3]); R(g, x + 1, yb - 5, 1, 1, 'y'); break;
  }
}

// Вітрина відділу: слот x, y, w, h; tier — наскільки заповнена
function drawDisplay(g, x, y, w, h, kind, tier) {
  if (tier <= 0) return;
  const n = [0, 2, 3, 6][tier];
  const low = y + h - 3, high = y + 7;
  R(g, x, low, w, 1, 'b');
  if (n > 3) R(g, x, high, w, 1, 'b');
  for (let i = 0; i < n; i++) {
    drawItem(g, kind, x + 1 + (i % 3) * 5, i < 3 ? low : high, i);
  }
  if (tier === 3) { R(g, x + w - 3, y + 1, 1, 1, 'w'); R(g, x + 2, y + 2, 1, 1, 'w'); }
}

// Вітрина-«еркер» на два відділи (34×18)
function drawBay(g, x, y, bayNo, tiers) {
  R(g, x, y, 34, 18, 'b');
  R(g, x + 1, y + 1, 32, 16, 's');
  R(g, x + 2, y + 2, 6, 1, 'S'); R(g, x + 2, y + 3, 1, 4, 'S');
  for (let s = 0; s < 2; s++) {
    const dept = bayNo * 2 + s;
    if (dept < DEPARTMENTS.length) drawDisplay(g, x + 1 + s * 17, y + 1, s ? 16 : 15, 16, DEPARTMENTS[dept].display, tiers[dept]);
  }
  R(g, x + 16, y + 1, 1, 16, 'b');
  R(g, x - 1, y + 18, 36, 2, 'b');
  R(g, x - 1, y + 18, 36, 1, 'l');
}
function drawWin(g, x, y) {
  R(g, x, y, 14, 18, 'b');
  R(g, x + 1, y + 1, 12, 16, 's');
  R(g, x + 2, y + 2, 3, 1, 'S');
  R(g, x + 6, y + 1, 1, 16, 'b');
  R(g, x + 1, y + 8, 12, 1, 'b');
  R(g, x - 1, y + 18, 16, 2, 'b');
  R(g, x - 1, y + 18, 16, 1, 'l');
}

// Двері (y — верх, висота 23). type 0..4 — від дерев'яних до атріуму з ескалатором
function drawDoor(g, type, x, y) {
  const w = DOOR_WIDTHS[type], h = 23;
  switch (type) {
    case 0:
      R(g, x, y, w, h, 'd'); R(g, x + 1, y + 1, w - 2, h - 1, 'b');
      R(g, x + 3, y + 3, w - 6, 8, 's'); R(g, x + 4, y + 4, 4, 1, 'S');
      R(g, x + 3, y + 13, w - 6, 8, 'l'); R(g, x + 4, y + 14, w - 8, 6, 'b');
      R(g, x + w - 5, y + 15, 2, 2, 'h'); break;
    case 1:
      R(g, x, y, w, h, 'n'); R(g, x + 1, y + 1, w - 2, h - 1, 's');
      R(g, x + w / 2 - 1, y + 1, 2, h - 1, 'n');
      R(g, x + 3, y + 3, 5, 1, 'S'); R(g, x + 3, y + 4, 1, 6, 'S');
      R(g, x + w / 2 - 3, y + 11, 1, 4, 'w'); R(g, x + w / 2 + 2, y + 11, 1, 4, 'w'); break;
    case 2:
      R(g, x, y, w, h, 'd'); R(g, x + 1, y + 1, w - 2, h - 1, 's');
      R(g, x + w / 2 - 1, y + 1, 2, h - 1, 'd');
      R(g, x + 3, y + 3, 6, 1, 'S'); R(g, x + 3, y + 4, 1, 8, 'S');
      R(g, x + 1, y + 1, w - 2, 3, 'r');
      R(g, x + w / 2 - 4, y + 12, 2, 4, 'e'); R(g, x + w / 2 + 2, y + 12, 2, 4, 'e'); break;
    case 3:
      R(g, x, y, w, h, 'h'); R(g, x + 1, y + 1, w - 2, h - 1, 'd');
      R(g, x + 3, y + 3, w - 6, h - 3, 'b');
      R(g, x + w / 2 - 1, y + 3, 2, h - 3, 'd');
      R(g, x + 4, y + 5, w / 2 - 6, 6, 's'); R(g, x + w / 2 + 2, y + 5, w / 2 - 6, 6, 's');
      R(g, x + 4, y + 13, w / 2 - 6, 8, 'l'); R(g, x + w / 2 + 2, y + 13, w / 2 - 6, 8, 'l');
      R(g, x + w / 2 - 3, y + 14, 1, 3, 'h'); R(g, x + w / 2 + 2, y + 14, 1, 3, 'h'); break;
    case 4:
      R(g, x, y, w, h, 'n'); R(g, x + 1, y + 1, w - 2, h - 1, 's');
      R(g, x + 3, y + 2, 5, 1, 'S');
      // ескалатор: нахилена стрічка зі сходинками
      for (let i = 0; i < 28; i++) {
        const ex = x + 3 + i, ey = y + h - 2 - Math.floor(i * 0.7);
        R(g, ex, ey, 1, 2, i % 3 ? 'E' : 'e');
        R(g, ex, ey - 4, 1, 1, 'd');
      }
      R(g, x + w / 2 - 1, y + 1, 2, 5, 'n'); break;
  }
}

// Розкладає елементи рядка по ширині рівномірно; повертає x кожного
function placeRow(innerX, innerW, widths) {
  const sum = widths.reduce((a, b) => a + b, 0);
  const gap = Math.floor((innerW - sum) / (widths.length + 1));
  let x = innerX + gap;
  return widths.map(w => { const px = x; x += w + gap; return px; });
}

// Дах: стилі 0..5 (див. SHOP_LOOK)
function drawRoof(g, style, w, top) {
  const cx = w >> 1;
  switch (style) {
    case 0:
      R(g, 0, 1, w, 6, 'b'); R(g, 0, 0, w, 1, 'd'); R(g, 0, 1, w, 1, 'l'); R(g, 0, 6, w, 1, 'd');
      for (let x = 0; x < w; x += 4) { R(g, x, 3, 1, 1, 'd'); R(g, x + 2, 5, 1, 1, 'd'); }
      break;
    case 1:
      for (let i = 0; i < top; i++) { const half = 4 * (i + 1); R(g, cx - half, i, half * 2, 1, 'r'); R(g, cx - half, i, 2, 1, 'd'); R(g, cx + half - 2, i, 2, 1, 'd'); }
      R(g, w - 26, 0, 8, top + 2, 'b'); R(g, w - 27, 0, 10, 2, 'd');
      R(g, 0, top, w, 7, 'r'); R(g, 0, top, w, 1, 'o'); R(g, 0, top + 6, w, 1, 'd');
      for (let x = 0; x < w; x += 4) { R(g, x, top + 3, 1, 1, 'd'); R(g, x + 2, top + 5, 1, 1, 'd'); }
      break;
    case 2:
      R(g, 0, 0, w, 7, 'n'); R(g, 0, 0, w, 1, 'w'); R(g, 0, 6, w, 1, 'd');
      for (let x = 2; x < w - 3; x += 6) R(g, x, 3, 3, 1, 'S');
      break;
    case 3:
      R(g, 8, 0, 16, top, 'e'); R(g, 10, 1, 12, 2, 'E'); R(g, w - 30, 1, 18, top - 1, 'e'); R(g, w - 28, 2, 14, 2, 'E');
      R(g, 0, top, w, 7, 'e'); R(g, 0, top, w, 1, 'E'); R(g, 0, top + 6, w, 1, 'd');
      for (let x = 4; x < w - 4; x += 8) R(g, x, top + 3, 4, 1, 'r');
      break;
    case 4:
      R(g, cx, 0, 1, top, 'd'); R(g, cx + 1, 1, 7, 4, 'r'); R(g, cx + 1, 1, 7, 1, 'p');
      R(g, 0, top, w, 7, 'h'); R(g, 0, top, w, 1, 'y'); R(g, 0, top + 6, w, 1, 'd');
      for (let x = 0; x < w; x += 4) R(g, x, top + 3, 2, 2, 'o');
      break;
    case 5: {
      const rx = 74;
      for (let x = cx - rx; x < cx + rx; x++) {
        const k = Math.sqrt(Math.max(0, 1 - Math.pow((x - cx) / rx, 2)));
        const y = top - Math.round(11 * k);
        R(g, x, y, 1, top - y, ((x - cx) % 12 === 0) ? 'n' : 'S');
        R(g, x, y, 1, 1, 'w');
      }
      R(g, 0, top, w, 7, 'n'); R(g, 0, top, w, 1, 'S'); R(g, 0, top + 6, w, 1, 'd');
      R(g, 6, 0, 1, top, 'd'); R(g, 7, 1, 7, 4, 'p');
      R(g, w - 7, 0, 1, top, 'd'); R(g, w - 14, 1, 7, 4, 'h');
      break;
    }
  }
}

// Будує спрайт магазину рівня level. Повертає canvas і геометрію (вивіска, двері)
function buildShopCanvas(level, tiers) {
  const look = SHOP_LOOK[level - 1];
  const w = look.w;
  const up = look.upper.length;
  const yB = look.top + 25;          // тут закінчується вивіска
  const yG = yB + 26 * up;           // тут починається нижній поверх (навіс)
  const h = yG + 39;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');

  drawRoof(g, look.roof, w, look.top);

  // вивіска (текст накладається HTML-елементом, щоб був чіткий шрифт)
  R(g, 5, look.top + 8, w - 10, 17, 'd');
  R(g, 6, look.top + 9, w - 12, 15, 'h');
  R(g, 7, look.top + 10, w - 14, 13, currentEpoch().signFill || look.signFill);

  // стіни та бічні стовпи
  R(g, 4, yB, w - 8, h - yB - 6, look.wall);
  for (let y = yB + 4; y < h - 6; y += 4) R(g, 4, y, w - 8, 1, look.line);
  R(g, 4, yB, 3, h - yB - 6, 'b'); R(g, 4, yB, 1, h - yB - 6, 'l'); R(g, 6, yB, 1, h - yB - 6, 'd');
  R(g, w - 7, yB, 3, h - yB - 6, 'b'); R(g, w - 7, yB, 1, h - yB - 6, 'l'); R(g, w - 5, yB, 1, h - yB - 6, 'd');

  const innerX = 7, innerW = w - 14;
  let bayNo = 0;

  // нижній поверх: [вітрина, двері, вітрина] (на рівні 1 — лише одна вітрина)
  const doorW = DOOR_WIDTHS[look.door];
  const groundItems = level === 1 ? [34, doorW] : [34, doorW, 34];
  const gx = placeRow(innerX, innerW, groundItems);
  let doorX = 0;
  groundItems.forEach((iw, i) => {
    if (iw === doorW && i === (level === 1 ? 1 : 1)) { doorX = gx[i]; drawDoor(g, look.door, gx[i], yG + 10); }
    else drawBay(g, gx[i], yG + 12, bayNo++, tiers);
  });

  // верхні поверхи знизу вгору
  look.upper.forEach((row, k) => {
    const y0 = yG - 26 * (k + 1);
    const widths = row.map(kind => (kind === 'bay' ? 34 : 14));
    const xs = placeRow(innerX, innerW, widths);
    row.forEach((kind, i) => {
      if (kind === 'bay') drawBay(g, xs[i], y0 + 4, bayNo++, tiers);
      else drawWin(g, xs[i], y0 + 4);
    });
    R(g, 4, y0 + 25, w - 8, 1, 'd');      // пояс між поверхами
    R(g, 4, y0 + 24, w - 8, 1, 'l');
  });

  // навіс у смужку з зубчиками
  const [a1, a2] = look.awning;
  for (let x = 0; x < w; x++) R(g, x, yG, 1, 8, (Math.floor(x / 6) % 2) ? a2 : a1);
  R(g, 0, yG, w, 1, 'd');
  for (let sx = 0; sx < w; sx += 6) {
    const col = (Math.floor(sx / 6) % 2) ? a2 : a1;
    R(g, sx, yG + 8, 6, 1, col);
    R(g, sx + 1, yG + 9, 4, 1, col);
    R(g, sx + 2, yG + 10, 2, 1, col);
  }
  g.globalAlpha = 0.18; R(g, 4, yG + 11, w - 8, 2, 'd'); g.globalAlpha = 1;

  // основа
  R(g, 0, h - 6, w, 6, 'e');
  R(g, 0, h - 6, w, 1, 'E');
  R(g, 0, h - 1, w, 1, 'd');
  for (let x = 12; x < w; x += 14) R(g, x, h - 5, 1, 4, 'd');

  return {
    canvas: c, w, h,
    sign: { x: 7, y: look.top + 10, w: w - 14, h: 13 },
    door: { x: doorX, w: doorW }
  };
}

// Перебудовує спрайт магазину, якщо змінився рівень або наповненість вітрин
function rebuildShop(force) {
  const tiers = state.depts.map(tierOf);
  const sig = state.shopLevel + '|' + tiers.slice(0, state.shopLevel * 2).join('');
  if (!force && shop && shop.sig === sig) return false;
  const levelChanged = !shop || shop.level !== state.shopLevel;
  const geo = buildShopCanvas(state.shopLevel, tiers);
  shop = Object.assign(geo, {
    sig, level: state.shopLevel,
    x: Math.round(LAYOUT.centerX - geo.w / 2),
    y: LAYOUT.curbY - geo.h
  });
  if (levelChanged) {
    propsLayer = buildPropsLayer();
    placeShopOverlay();
    updateSignText();
  }
  return levelChanged;
}

// Розміщує HTML-вивіску поверх спрайта магазину (у відсотках — не залежить від масштабу)
function placeShopOverlay() {
  const W = CONFIG.SCENE_W, H = CONFIG.SCENE_H;
  const o = ui.shopOverlay.style;
  o.left = (shop.x / W * 100) + '%';
  o.top = (shop.y / H * 100) + '%';
  o.width = (shop.w / W * 100) + '%';
  o.height = (shop.h / H * 100) + '%';
  const sg = ui.sign.style;
  sg.left = (shop.sign.x / shop.w * 100) + '%';
  sg.top = (shop.sign.y / shop.h * 100) + '%';
  sg.width = (shop.sign.w / shop.w * 100) + '%';
  sg.height = (shop.sign.h / shop.h * 100) + '%';
}

function updateSignText() {
  ui.signText.textContent = t('sign_' + state.shopLevel);
  fitSign();
}

// Підбирає найбільший цілий множник, щоб пікселі лишалися чіткими.
// На телефоні сцена «наближена» до магазину: показуємо лише середину вулиці — так вивіска читається.
function layoutScene() {
  const W = CONFIG.SCENE_W, H = CONFIG.SCENE_H;
  const dpr = window.devicePixelRatio || 1;
  const mobile = mobileMQ.matches;
  const cropW = mobile && shop ? Math.min(W, Math.max(176, (shop.w + 40) & ~1)) : W;
  const cropX = (W - cropW) >> 1;
  viewCrop = { x: cropX, w: cropW };
  const cs = getComputedStyle(ui.stage);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const availW = ui.stage.clientWidth - padX;
  // на телефоні сцена займає не більше ~44% висоти, решту віддаємо панелі
  const availH = mobile ? window.innerHeight * 0.44 - padY : ui.stage.clientHeight - padY;
  const k = Math.max(1, Math.floor(Math.min(availW * dpr / cropW, availH * dpr / H)));
  sceneUnit = k / dpr;
  ui.scene.style.width = (cropW * sceneUnit) + 'px';
  ui.scene.style.height = (H * sceneUnit) + 'px';
  ui.scene.style.setProperty('--u', sceneUnit + 'px');
  ui.world.style.width = (W * sceneUnit) + 'px';
  ui.world.style.height = (H * sceneUnit) + 'px';
  ui.world.style.marginLeft = (-cropX * sceneUnit) + 'px';
  fitSign();
}

// Підбирає розмір шрифту, щоб напис вмістився на вивісці (в один або два рядки)
function fitSign() {
  const el = ui.sign, span = ui.signText;
  let size = 9;
  el.style.fontSize = (size * sceneUnit) + 'px';
  while (size > 4 && (span.offsetHeight > el.clientHeight + 1 || span.scrollWidth > el.clientWidth + 1)) {
    size -= 0.5;
    el.style.fontSize = (size * sceneUnit) + 'px';
  }
}

// Текст бонусу звірятка на рівні lvl
function bonusText(i, lvl) {
  const b = TEAM[i].bonus;
  const pct = v => Math.round(v * 100);
  switch (b.type) {
    case 'tap': return t('bonus_tap', fmt(1 + b.per * lvl, 2));
    case 'expandCost': return t('bonus_expandCost', pct(Math.min(b.per * lvl, b.cap)));
    case 'offline': return t('bonus_offline', pct(CONFIG.OFFLINE_RATE + b.rate * lvl), CONFIG.OFFLINE_MAX_HOURS + b.hours * lvl);
    case 'thief': return t('bonus_thief', pct(Math.min(b.per * lvl, b.cap)));
    case 'deptIncome': return t('bonus_deptIncome', b.depts.map(d => t('dept_' + DEPARTMENTS[d].id)).join(', '), fmt(1 + b.per * lvl, 2));
    case 'global': return t('bonus_global', fmt(1 + b.per * lvl, 2));
    case 'event': return t('bonus_event', pct(b.per * lvl));
    case 'fix': return t('bonus_fix', pct(b.per * lvl));
    case 'deptCost': return t('bonus_deptCost', pct(Math.min(b.per * lvl, b.cap)));
  }
  return '';
}

// Чи є зараз що купити (для мигаючої точки на вкладці «Відділи»)
function hasAffordableAction() {
  for (let i = 0; i < DEPARTMENTS.length; i++) {
    if (isDeptUnlocked(i) && state.coins >= deptCost(i, 1)) return true;
  }
  const next = nextLevelDef();
  return !!(next && requirementsMet(next) && state.coins >= expandCost(next));
}
// Чи можна зараз найняти або прокачати когось із команди
function hasTeamAction() {
  return TEAM.some((m, i) => isTeamUnlocked(i) && state.team[i] < CONFIG.TEAM_MAX_LEVEL && state.coins >= teamCost(i, state.team[i] + 1));
}

function updateTeamUI() {
  const alertTab = ui.tabs.querySelector('[data-tab="team"]');
  if (alertTab) alertTab.classList.toggle('alert', hasTeamAction() && state.tab !== 'team');
  if (ui.paneTeam.hidden) return;
  TEAM.forEach((m, i) => {
    const el = teamEls[i];
    const unlocked = isTeamUnlocked(i);
    el.card.hidden = !unlocked;
    if (!unlocked) return;
    const lvl = state.team[i];
    el.card.classList.toggle('unhired', lvl === 0);
    setText(el.name, t('team_' + m.id), 'tn' + i);
    setText(el.role, t('team_' + m.id + '_role'), 'tr' + i);
    setText(el.trait, t('team_' + m.id + '_trait'), 'tt' + i);
    setText(el.lvl, lvl === 0 ? '' : t('teamLevel', lvl, CONFIG.TEAM_MAX_LEVEL), 'tl' + i + '_' + lvl);
    if (lvl === 0) {
      setText(el.now, t('teamGives', bonusText(i, 1)), 'tw' + i);
      setText(el.next, '', 'tx' + i);
    } else {
      setText(el.now, t('teamNow', bonusText(i, lvl)), 'tw' + i + '_' + lvl);
      setText(el.next, lvl < CONFIG.TEAM_MAX_LEVEL ? t('teamNext', bonusText(i, lvl + 1)) : '', 'tx' + i + '_' + lvl);
    }
    if (lvl >= CONFIG.TEAM_MAX_LEVEL) {
      setText(el.btn, t('teamMax'), 'tb' + i);
      el.btn.disabled = true;
    } else {
      const cost = teamCost(i, lvl + 1);
      setText(el.btn, t(lvl === 0 ? 'teamHire' : 'teamUpgrade', fmt(cost)), 'tb' + i);
      el.btn.disabled = state.coins < cost;
    }
  });
  const nextLocked = TEAM.find((m, i) => !isTeamUnlocked(i));
  teamLockedEl.hidden = !nextLocked;
  if (nextLocked) setText(teamLockedEl, t('lockedTeam', t('levelName_' + nextLocked.level)), 'tlocked');
}

function updateDepartmentsUI() {
  const alertTab = ui.tabs.querySelector('[data-tab="departments"]');
  if (alertTab) alertTab.classList.toggle('alert', hasAffordableAction() && state.tab !== 'departments');
  if (ui.paneDepts.hidden) return;

  // режими покупки
  ui.buyModes.querySelectorAll('.buy-mode').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === String(state.buyMode))));

  // картка розширення
  const next = nextLevelDef();
  if (!next) {
    ui.expandTitle.textContent = t('levelName_' + state.shopLevel);
    setText(ui.expandNote, t('expandMax'), 'expandNote');
    ui.expandReqs.innerHTML = '';
    uiCache.reqSig = '';
    ui.expandBtn.hidden = true;
  } else {
    ui.expandBtn.hidden = false;
    const nextLevel = state.shopLevel + 1;
    setText(ui.expandTitle, t('expandTitle', t('levelName_' + nextLevel)), 'expandTitle');
    setText(ui.expandNote, t('expandNote'), 'expandNote');
    const sig = nextLevel + '|' + state.lang + '|' + next.requires.map(r => Math.min(state.depts[r.dept], r.count)).join(',');
    if (uiCache.reqSig !== sig) {
      uiCache.reqSig = sig;
      ui.expandReqs.innerHTML = '';
      next.requires.forEach(r => {
        const row = document.createElement('div');
        const have = state.depts[r.dept];
        row.className = 'req' + (have >= r.count ? ' ok' : '');
        const name = document.createElement('span');
        name.textContent = DEPARTMENTS[r.dept].icon + ' ' + t('dept_' + DEPARTMENTS[r.dept].id);
        const val = document.createElement('b');
        val.textContent = (have >= r.count ? '✓ ' : '') + Math.min(have, r.count) + ' / ' + r.count;
        row.append(name, val);
        ui.expandReqs.appendChild(row);
      });
    }
    setText(ui.expandBtn, t('expandBtn', fmt(expandCost(next))), 'expandBtn');
    ui.expandBtn.disabled = !(requirementsMet(next) && state.coins >= expandCost(next));
  }

  // картки відділів
  DEPARTMENTS.forEach((d, i) => {
    const el = deptEls[i];
    const unlocked = isDeptUnlocked(i);
    el.card.hidden = !unlocked;
    if (!unlocked) return;
    const count = state.depts[i];
    const each = deptIncomeEach(i);
    setText(el.name, t('dept_' + d.id), 'dn' + i);
    setText(el.count, '×' + fmt(count), 'dc' + i);
    setText(el.each, t('deptEach', fmt(each, 1)), 'de' + i);
    setText(el.total, t('deptTotal', fmt(each * count, 1)), 'dt' + i);
    const nm = nextMilestone(count);
    if (nm === null) {
      el.bar.style.width = '100%';
      setText(el.msText, t('msDone'), 'dm' + i);
    } else {
      const prev = CONFIG.MILESTONES.filter(m => m <= count).pop() || 0;
      el.bar.style.width = ((count - prev) / (nm - prev) * 100) + '%';
      setText(el.msText, t('msNext', count, nm), 'dm' + i);
    }
    const n = plannedBuy(i);
    const cost = deptCost(i, n);
    setText(el.buy, t('buyLabel', fmt(n), fmt(cost)), 'db' + i);
    el.buy.disabled = state.coins < cost;
  });

  // підказка про наступні відділи
  const nextLocked = DEPARTMENTS.find((d, i) => !isDeptUnlocked(i));
  deptLockedEl.hidden = !nextLocked;
  if (nextLocked) setText(deptLockedEl, t('lockedDepts', t('levelName_' + nextLocked.level)), 'locked');
}

/* ---------- Тости ---------- */
function showToast(text, kind, icon) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  if (icon) { el.appendChild(icon); const tx = document.createElement('span'); tx.textContent = text; el.appendChild(tx); }   // icon — маленький canvas (значок досягнення)
  else el.textContent = text;
  el.style.setProperty('--life', CONFIG.TOAST_SECONDS + 's');
  el.addEventListener('animationend', e => { if (e.animationName === 'toastOut') el.remove(); });
  ui.toasts.appendChild(el);
  while (ui.toasts.childElementCount > CONFIG.MAX_TOASTS) ui.toasts.firstChild.remove();
}

/* =====================================================================
   ПОКУПКИ: відділи й розширення
   ===================================================================== */

function buyDept(i) {
  if (!isDeptUnlocked(i)) return;
  const n = plannedBuy(i);
  const cost = deptCost(i, n);
  if (!(state.coins >= cost)) return;
  const before = state.depts[i];
  state.coins -= cost;
  state.depts[i] += n;
  state.stats.deptsBought += n;
  CONFIG.MILESTONES.forEach(m => {
    if (before < m && state.depts[i] >= m) { showToast(t('milestoneToast', t('dept_' + DEPARTMENTS[i].id), m), 'good'); playSfx('milestone'); state.stats.milestones++; }
  });
  recalcIncome();
  rebuildShop();
  playSfx('buy');
  updateUI();
}

function expandShop() {
  const next = nextLevelDef();
  if (!next || !requirementsMet(next) || state.coins < expandCost(next)) return;
  const old = { canvas: shop.canvas, x: shop.x, y: shop.y, w: shop.w, h: shop.h };
  state.coins -= expandCost(next);
  state.shopLevel += 1;
  recalcIncome();
  rebuildShop(true);
  startBuild(old);
  playSfx('build');
  updateMusic();
  layoutScene();
  updateUI();
  saveGame();
}

/* =====================================================================
   ОФЛАЙН-ЗАРОБІТОК
   ===================================================================== */

// Рахує, скільки магазин заробив за seconds секунд відсутності, і кладе в «непозбране»
function addOfflineEarnings(seconds) {
  if (!(seconds >= CONFIG.OFFLINE_MIN_SECONDS) || state.cps <= 0) return;
  const capped = Math.min(seconds, offlineMaxHours() * 3600);
  const earned = state.cps * capped * offlineRate();
  if (earned >= 1) {
    state.pendingOffline += earned;
    showOfflineModal();
  }
}
function refreshOfflineModal() {
  ui.modalBig.textContent = t('offlineCoins', fmt(Math.floor(state.pendingOffline)));
}
function showOfflineModal() {
  if (state.pendingOffline < 1) return;
  ui.modalTitle.textContent = t('offlineTitle');
  ui.modalText.textContent = t('offlineText');
  ui.modalBtn.textContent = t('offlineBtn');
  refreshOfflineModal();
  ui.modal.hidden = false;
  ui.modalBtn.focus({ preventScroll: true });
}
function claimOffline() {
  const gain = state.pendingOffline;
  state.coins += gain;
  state.totalEarned += gain;
  state.pendingOffline = 0;
  playSfx('coins');
  ui.modal.hidden = true;
  updateUI();
  saveGame();
}

/* =====================================================================
   АНІМАЦІЇ ТА ЕФЕКТИ
   ===================================================================== */

const shopAnim = { squash: 0, vel: 0 };          // пружинка стискання магазину
const capyAnim = { blinkIn: 3, blinkLeft: 0 };   // кліпання
const fx = { coins: [], sparks: [], dust: [] };
const clouds = CLOUDS.map(c => ({ ...c }));
let build = null;                                 // триває будівництво нового рівня
const customers = [];
let customerTimer = 1;

function rand(a, b) { return a + Math.random() * (b - a); }

// Масштаб магазину для поточного стискання (використовується і в canvas, і для вивіски)
function getShopScale() {
  const sq = Math.max(-0.5, Math.min(0.5, shopAnim.squash));
  const sx = 1 + 0.25 * sq, sy = 1 - 0.4 * sq;
  // як і в drawCanvasSprite, округлюємо до цілих пікселів, щоб вивіска збігалася зі спрайтом
  return { sx: Math.max(1, Math.round(shop.w * sx)) / shop.w, sy: Math.max(1, Math.round(shop.h * sy)) / shop.h };
}

/* ---------- Будівництво: риштування і пил ---------- */
function startBuild(old) {
  build = { t: 0, dur: CONFIG.BUILD_SECONDS, old, dustTimer: 0, burst: false };
  ui.shopOverlay.style.visibility = 'hidden';
}
function finishBuild() {
  build = null;
  ui.shopOverlay.style.visibility = '';
  shopAnim.vel = 6;
  playSfx('levelup');
  showToast(t('buildDone', t('levelName_' + state.shopLevel)), 'big');
  const opened = DEPARTMENTS.filter(d => d.level === state.shopLevel).map(d => t('dept_' + d.id));
  if (opened.length) showToast(t('newDepts', opened.join(', ')), 'good');
}
function spawnDust(x, y, n) {
  if (!animOn()) return;
  for (let i = 0; i < n; i++) {
    fx.dust.push({ x: x + rand(-3, 3), y: y + rand(-2, 2), r: rand(2, 4), vx: rand(-14, 14), vy: rand(-18, -4), age: 0, life: rand(0.5, 0.9) });
  }
  while (fx.dust.length > CONFIG.MAX_DUST) fx.dust.shift();
}
function updateBuild(dt) {
  build.t += dt;
  const p = build.t / build.dur;
  build.dustTimer -= dt;
  if (build.dustTimer <= 0 && p < 0.95) {
    build.dustTimer = 0.07;
    const r = buildReveal(p);
    spawnDust(shop.x + rand(0, shop.w), LAYOUT.curbY + rand(-2, 4), 1);
    if (r > 0 && r < 1) spawnDust(shop.x + rand(0, shop.w), shop.y + shop.h * (1 - r), 1);
  }
  if (!build.burst && p >= 0.88) {
    build.burst = true;
    for (let i = 0; i < 14; i++) spawnDust(shop.x + (i / 13) * shop.w, LAYOUT.curbY, 1);
  }
  if (build.t >= build.dur) finishBuild();
}
// Яка частка нової будівлі вже «виросла» (0..1)
function buildReveal(p) {
  const r = Math.max(0, Math.min(1, (p - 0.2) / 0.65));
  return r * r * (3 - 2 * r);
}
// Риштування навколо прямокутника: стовпи й дошки
function drawScaffold(x, y, w, h, alpha) {
  ctx.globalAlpha = alpha;
  const x0 = x - 3, x1 = x + w + 1;
  const poles = Math.max(2, Math.round((x1 - x0) / 20));
  for (let i = 0; i <= poles; i++) {
    const px = Math.round(x0 + (x1 - x0) * i / poles);
    R(ctx, px, y - 4, 2, h + 4, 'b');
    R(ctx, px, y - 4, 1, h + 4, 'l');
  }
  for (let py = LAYOUT.curbY - 14; py > y - 2; py -= 22) {
    R(ctx, x0, py, x1 - x0 + 2, 2, 'l');
    R(ctx, x0, py + 2, x1 - x0 + 2, 1, 'd');
  }
  ctx.globalAlpha = 1;
}

/* ---------- Команда на сцені ---------- */
const actors = [];               // звірятка, що працюють на вулиці
const bubbleEls = {};            // активні бульбашки з фразами (за ключем)
let chatterTimer = 20;

// Де стоїть звірятко: Голка — біля дверей, решта — на фіксованих місцях
function actorHome(m) {
  const s = m.spot;
  return s.x === null ? shop.x + shop.door.x + shop.door.w / 2 + s.dx : s.x;
}
// Узгоджує список звіряток на сцені зі станом (хто найнятий — той на вулиці)
function syncActors() {
  TEAM.forEach((m, i) => {
    const has = state.team[i] > 0;
    const idx = actors.findIndex(a => a.i === i);
    if (has && idx < 0) actors.push({ i, x: actorHome(m), y: m.spot.y, dir: 1, t: rand(0, 10), hop: 0, moving: false });
    else if (!has && idx >= 0) actors.splice(idx, 1);
  });
}
function updateActors(dt) {
  actors.forEach(a => {
    const s = TEAM[a.i].spot;
    a.t += dt;
    a.hop = Math.max(0, a.hop - dt * 4);
    if (s.move === 'patrol') {
      a.moving = true;
      a.x += a.dir * 14 * dt;
      if (a.x >= s.x2) { a.x = s.x2; a.dir = -1; } else if (a.x <= s.x) { a.x = s.x; a.dir = 1; }
    } else {
      a.moving = false;
      a.x = actorHome(TEAM[a.i]);
    }
  });
  // час від часу хтось сам щось каже
  chatterTimer -= dt;
  if (chatterTimer <= 0) {
    chatterTimer = rand(CONFIG.CHATTER_MIN, CONFIG.CHATTER_MAX);
    if (actors.length) { const a = actors[Math.floor(Math.random() * actors.length)]; actorSay(a); }
  }
}

// Предмет у лапках звірятка (малюється поверх спрайта). t — час, dir — куди йде
function drawTeamProp(prop, x, y, t, dir) {
  const ph = Math.floor(t * 3) % 2;
  switch (prop) {
    case 'register':     // прилавок з касою
      R(ctx, x - 11, y - 7, 22, 7, 'b'); R(ctx, x - 11, y - 7, 22, 1, 'l'); R(ctx, x - 11, y - 1, 22, 1, 'd');
      R(ctx, x - 8, y - 11, 7, 4, 'e'); R(ctx, x - 7, y - 10, 5, 2, 'g'); R(ctx, x + 3, y - 9, 4, 2, 'h');
      if (Math.floor(t * 1.2) % 3 === 0) R(ctx, x + 4, y - 12 - ph, 2, 2, 'y');
      break;
    case 'hammer': {     // молоток і дошка
      const up = Math.floor(t * 3) % 2 === 0;
      R(ctx, x + 7, y - 2, 13, 2, 'l'); R(ctx, x + 7, y - 1, 13, 1, 'd');
      if (up) { R(ctx, x + 11, y - 15, 1, 8, 'd'); R(ctx, x + 9, y - 17, 5, 3, 'e'); }
      else { R(ctx, x + 11, y - 9, 1, 7, 'd'); R(ctx, x + 9, y - 4, 5, 3, 'e'); R(ctx, x + 15, y - 4, 1, 1, 'y'); }
      break;
    }
    case 'tray':         // таця з цукерками
      R(ctx, x - 9, y - 8, 18, 2, 'b'); R(ctx, x - 9, y - 8, 18, 1, 'l');
      ['p', 'h', 'm', 'q'].forEach((c, k) => R(ctx, x - 7 + k * 4, y - 11 - ((k + ph) % 2), 3, 3, c));
      break;
    case 'baton':        // кийок охоронниці
      R(ctx, x + 9, y - 10, 2, 10, 'd'); R(ctx, x + 9, y - 10, 2, 2, 'h');
      break;
    case 'box':          // ящик
      R(ctx, x - 7, y - 11, 14, 8, 'c'); R(ctx, x - 7, y - 11, 14, 1, 'l'); R(ctx, x - 7, y - 4, 14, 1, 'd');
      R(ctx, x - 7, y - 11, 1, 8, 'd'); R(ctx, x + 6, y - 11, 1, 8, 'd'); R(ctx, x - 1, y - 11, 2, 8, 'b');
      break;
    case 'ledger':       // бухгалтерська книга
      R(ctx, x - 6, y - 8, 12, 6, 'w'); R(ctx, x - 6, y - 8, 12, 1, 'd'); R(ctx, x - 6, y - 3, 12, 1, 'd'); R(ctx, x, y - 8, 1, 6, 'd');
      R(ctx, x - 5, y - 6, 4, 1, 'e'); R(ctx, x + 2, y - 6 + ph, 3, 1, 'e');
      break;
    case 'broom': {      // віник
      const bx = x + 9 * dir;
      R(ctx, bx, y - 13, 1, 12, 'b'); R(ctx, bx - 2 + ph, y - 3, 5, 3, 'h'); R(ctx, bx - 2 + ph, y - 1, 5, 1, 'o');
      break;
    }
    case 'dress':        // сукня на вішаку
      R(ctx, x + 8, y - 14, 1, 3, 'd'); R(ctx, x + 6, y - 11, 5, 6, ph ? 'p' : 'u'); R(ctx, x + 5, y - 5, 7, 2, ph ? 'p' : 'u');
      break;
    case 'clipboard':    // планшет з папером
      R(ctx, x + 6, y - 12, 7, 9, 'l'); R(ctx, x + 7, y - 11, 5, 7, 'w');
      R(ctx, x + 8, y - 10 + ph, 3, 1, 'e'); R(ctx, x + 8, y - 8, 3, 1, 'e'); R(ctx, x + 8, y - 6, 2, 1, 'e');
      break;
    case 'megaphone':    // гучномовець
      R(ctx, x + 7, y - 12, 3, 4, 'p'); R(ctx, x + 10, y - 14, 3, 8, 'p'); R(ctx, x + 10, y - 14, 1, 8, 'q');
      if (ph) { R(ctx, x + 14, y - 12, 1, 1, 'w'); R(ctx, x + 16, y - 10, 1, 1, 'w'); R(ctx, x + 14, y - 8, 1, 1, 'w'); }
      else { R(ctx, x + 15, y - 11, 1, 1, 'w'); R(ctx, x + 17, y - 9, 1, 1, 'w'); }
      break;
    case 'tablet':       // планшет
      R(ctx, x - 5, y - 9, 10, 7, 'd'); R(ctx, x - 4, y - 8, 8, 5, ph ? 's' : 'S'); R(ctx, x - 2, y - 6, 1, 1, 'n');
      break;
    case 'cart': {       // візок
      const cx = x + 11 * dir;
      R(ctx, cx - 5, y - 8, 10, 5, 'e'); R(ctx, cx - 5, y - 8, 10, 1, 'E');
      R(ctx, cx - 4, y - 11, 3, 3, 'r'); R(ctx, cx, y - 11, 3, 3, 'g');
      R(ctx, cx - 4, y - 2, 2, 2, 'd'); R(ctx, cx + 2, y - 2, 2, 2, 'd');
      break;
    }
  }
}

function drawActor(a) {
  const m = TEAM[a.i];
  const x = Math.round(a.x), y = a.y;
  const waddle = a.moving ? Math.floor(a.t * 5) % 2 : 0;
  const idleBob = !a.moving && Math.sin(a.t * 2.4 + a.i) > 0.7 ? 1 : 0;
  const hopY = Math.round(Math.sin(Math.min(1, a.hop) * Math.PI) * 4);
  let flip = a.moving ? waddle === 1 : false;
  if (m.id === 'tonya') flip = Math.floor(a.t / 3) % 2 === 1;   // охоронниця виглядає то вліво, то вправо
  ctx.globalAlpha = 0.22; R(ctx, x - 6, y, 12, 2, 'd'); ctx.globalAlpha = 1;
  drawSprite(ctx, 'team_' + m.id, x - 8, y - 16 - waddle - idleBob - hopY, { flip });
  if (hasHats()) drawHat(x, y - 13 - waddle - idleBob - hopY);
  drawTeamProp(m.spot.prop, x, y - waddle - hopY, a.t, a.dir);
}

function hitActor(p) {
  let best = null;
  actors.forEach(a => {
    if (Math.abs(p.x - a.x) <= 10 && p.y >= a.y - 19 && p.y <= a.y + 3 && (!best || a.y > best.y)) best = a;
  });
  return best;
}
function hitCapy(p) {
  const c = LAYOUT.capy;
  return p.x >= c.x && p.x <= c.x + 24 && p.y >= c.footY - 24 && p.y <= c.footY;
}

// Бульбашка з фразою над головою (key — щоб у одного персонажа була лише одна)
function showBubble(key, text, x, y) {

  clearTimeout(el._timer);
