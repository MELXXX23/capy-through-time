function windowHidden(r, trees) {
  const base = LAYOUT.horizonY + 8;
  if (shop && r[0] + r[2] > shop.x - 28 && r[0] < shop.x + shop.w + 28 && r[1] + r[3] > shop.y - 4) return true;      // будинки за магазином не дають відблиску на нього
  return trees.some(tr => r[0] + r[2] > tr.x - 17 && r[0] < tr.x + 17 && r[1] + r[3] > base - 54);
}

// Додаткові будиночки з боків для широкого екрана (різні розміри й кольори; однакові при кожному запуску)
function extraHouses() {
  const walls = ['q', 'y', 'm', 'p', 'c', 'w', 'y', 'm'], roofs = ['r', 'b', 'n', 'b', 'r', 'n'];
  const make = (i) => {
    const hs = hash2(i * 7 + 3, 11);
    return { w: 44 + hs % 14, h: 54 + (hs >>> 4) % 20, wall: walls[hs % walls.length], roof: roofs[(hs >>> 3) % roofs.length], gap: 1 + (hs >>> 9) % 4 };
  };
  const list = [];
  let x = -4;                                    // ліворуч від ядра (крайній будинок ядра починається з −4)
  for (let i = 0; x > -view.offX - 40; i++) {
    const hs = make(i);
    x -= hs.w + hs.gap + 1;
    list.push({ x, w: hs.w, h: hs.h, wall: hs.wall, roof: hs.roof });
  }
  x = 346;                                       // праворуч (крайній будинок ядра закінчується на 346)
  for (let i = 20; x < CONFIG.SCENE_W + view.offX + 4; i++) {
    const hs = make(i);
    x += hs.gap + 1;
    list.push({ x, w: hs.w, h: hs.h, wall: hs.wall, roof: hs.roof });
    x += hs.w;
  }
  return list;
}

// Шар освітлених вікон будинків (вночі вмикається поверх затемнення)
function buildLitLayer(rects) {
  const { c, g } = newLayer();
  rects.forEach(r => {
    if (hash2(r[0] + 5, r[1] + 9) % 4 === 0) return;      // частина вікон лишається темною
    const hall = buildSeason === 'halloween';
    R(g, r[0], r[1], r[2], r[3], hall ? 'h' : 'y');
    R(g, r[0], r[1] + r[3] - 2, r[2], 2, hall ? 'o' : 'h');
  });
  return c;
}

/* ---------- Дерева (пора року змінює їхній вигляд) ---------- */
// Де садити дерева: посередині вільних проміжків між ліхтарями, магазином і краями вулиці (щоб ліхтарі їх не затуляли)
function treeSpots(x0, W) {
  const blocks = lampPositions().map(lx => [lx - 8, lx + 10]);
  if (shop) blocks.push([shop.x - 2, shop.x + shop.w + 2]);
  blocks.sort((a, b) => a[0] - b[0]);
  const list = [];
  let prev = x0;
  const gap = (a, b, i) => {
    const room = b - a;
    if (room < 34) return;
    const n = room >= 110 ? 2 : 1;
    for (let k = 1; k <= n; k++) {
      const hs = hash2(Math.round(a) + 31 + k, 5);
      list.push({ x: Math.round(a + room * k / (n + 1)), v: (hs >>> 5) % 3 });
    }
  };
  blocks.forEach((bl, i) => { gap(prev, bl[0], i); prev = Math.max(prev, bl[1]); });
  gap(prev, x0 + W, blocks.length);
  return list;
}
function lineG(g, x0, y0, x1, y1, c) {      // лінія з пікселів (Брезенхем)
  let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy;
  for (;;) {
    R(g, x0, y0, 1, 1, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function drawStreetTree(g, x, v, season) {
  const base = LAYOUT.horizonY + 8;
  if (season === 'winter') { drawBareTree(g, x, v, season); return; }
  // кольори: [основа, тінь, світло, контур, цяточки]
  const pal = {
    spring: ['q', 'p', 'w', 'b', ['p', 'p', 'w', 'q', 'm']],
    summer: ['g', 'G', 'm', 'G', ['m', 'G', 'y']],
    autumn: ['o', 'r', 'h', 'b', ['h', 'y', 'r', 'h']],
    halloween: ['u', 'n', 'p', 'k', ['o', 'o', 'y', 'p']]
  }[season];
  // ствол із корінням і корою
  R(g, x - 3, base - 18, 6, 18, 'd'); R(g, x - 2, base - 18, 4, 18, 'b'); R(g, x - 2, base - 18, 1, 18, 'l');
  for (let k = 0; k < 5; k++) R(g, x - 1 + (k % 2), base - 16 + k * 3, 1, 2, 'd');
  R(g, x - 6, base - 2, 12, 3, 'd'); R(g, x - 5, base - 2, 10, 2, 'b');
  // крона з великих куль
  const cy = base - 34;
  const discs = [[0, -2, 12], [-10, 5, 9], [10, 5, 9], [0, 7, 11], [-5, -9, 8], [6, -8, 8]];
  const inside = (px, py) => discs.some(d => { const dx = px - (x + d[0]), dy = py - (cy + d[1]); return dx * dx + dy * dy <= d[2] * d[2] + 1; });
  discs.forEach(d => disc(g, x + d[0], cy + d[1], d[2] + 1, pal[3]));
  discs.forEach(d => disc(g, x + d[0], cy + d[1], d[2], pal[0]));
  // освітлення: тінь знизу-праворуч, світло зверху-ліворуч, дрібна фактура листя
  for (let py = cy - 20; py <= cy + 20; py++) for (let px = x - 22; px <= x + 22; px++) {
    if (!inside(px, py)) continue;
    const sh = (px - x) * 0.45 + (py - cy) * 0.9;
    const n = hash2(px * 3 + 1, py * 5 + 7) % 11;
    if (sh > 8 || (sh > 4 && n < 3)) R(g, px, py, 1, 1, pal[1]);
    else if (sh < -9 || (sh < -4 && n < 2)) R(g, px, py, 1, 1, pal[2]);
    else if (n === 0) R(g, px, py, 1, 1, pal[1]);
  }
  // цвіт навесні (густо), яскраві плями влітку, жовте листя восени
  const dots = season === 'spring' ? 46 : 22;
  for (let k = 0; k < dots; k++) {
    const a = (hash2(x + k, 3) % 628) / 100, rr = hash2(k, x + 9) % 13;
    const px = x + Math.round(Math.cos(a) * rr * 1.25), py = cy + 2 + Math.round(Math.sin(a) * rr * 1.1);
    if (!inside(px, py)) continue;
    const c = pal[4][k % pal[4].length];
    R(g, px, py, season === 'spring' ? 2 : 1, season === 'spring' ? 2 : 1, c);
  }
  if (season === 'halloween') treeHalloweenDecor(g, x, cy);
  // на землі: пелюстки навесні, опале листя восени
  if (season === 'spring' || season === 'autumn') {
    const gp = season === 'spring' ? ['q', 'p', 'w'] : ['o', 'h', 'r'];
    for (let k = 0; k < 14; k++) R(g, x - 14 + (hash2(k, x) % 28), base + 1 + (hash2(x, k) % 2), 2, 1, gp[k % 3]);
  }
}
// Хелловін: на дереві висять гарбузи-ліхтарики, привиди й гірлянда з вогників
function treeHalloweenDecor(g, x, cy) {
  const pump = (px, py) => { R(g, px - 2, py, 5, 4, 'd'); R(g, px - 1, py + 1, 3, 2, 'o'); R(g, px, py + 1, 1, 1, 'y'); R(g, px - 2, py + 1, 1, 2, 'o'); R(g, px + 2, py + 1, 1, 2, 'o'); R(g, px, py - 1, 1, 1, 'g'); };
  const ghost = (px, py) => { R(g, px - 2, py, 5, 6, 'd'); R(g, px - 1, py + 1, 3, 4, 'w'); R(g, px - 1, py + 2, 1, 1, 'k'); R(g, px + 1, py + 2, 1, 1, 'k'); R(g, px - 1, py + 5, 1, 1, 'w'); R(g, px + 1, py + 5, 1, 1, 'w'); };
  [[-9, 12, 6], [0, 18, 9], [9, 12, 6]].forEach(p => { R(g, x + p[0], cy + p[1], 1, p[2], 'd'); pump(x + p[0], cy + p[1] + p[2]); });      // гарбузи на мотузках
  [[-15, 9, 5], [14, 10, 4]].forEach(p => { R(g, x + p[0], cy + p[1], 1, p[2], 'd'); ghost(x + p[0], cy + p[1] + p[2]); });                  // привиди на мотузках
  for (let gx = x - 12; gx <= x + 12; gx++) {                                                                                                 // гірлянда
    const sag = Math.round(4 * Math.sin((gx - x + 12) / 24 * Math.PI));
    R(g, gx, cy + 9 + sag, 1, 1, 'd');
    if ((gx - x) % 4 === 0) R(g, gx, cy + 10 + sag, 2, 2, ['o', 'y', 'p'][(gx - x + 12) / 4 % 3 | 0]);
  }
}
// Зимове дерево: пишні гілки з багатьма відгалуженнями, на яких лежить сніг
function drawBareTree(g, x, v, season) {
  const base = LAYOUT.horizonY + 8, top = base - 20;
  R(g, x - 3, top, 6, 20, 'd'); R(g, x - 2, top, 4, 20, 'b'); R(g, x - 2, top, 1, 20, 'l');
  R(g, x - 6, base - 2, 12, 3, 'd'); R(g, x - 5, base - 2, 10, 2, 'b');
  const seed = x * 7 + v * 13;
  const branch = (bx, by, ang, len, depth) => {
    const ex = Math.round(bx + Math.sin(ang) * len), ey = Math.round(by - Math.cos(ang) * len);
    lineG(g, bx, by, ex, ey, depth <= 1 ? 'd' : 'b');
    if (depth <= 1) lineG(g, bx + 1, by, ex + 1, ey, 'd');                                         // товсті гілки
    const midx = Math.round((bx + ex) / 2), midy = Math.round((by + ey) / 2);
    if (depth <= 2 && Math.abs(Math.sin(ang)) > 0.35) R(g, midx - 1, midy - 1, 3, 1, 'w');           // сніг лежить на похилих гілках
    if (depth >= 3) { R(g, ex - 1, ey - 1, 3, 1, 'w'); return; }                                    // кінчик гілочки зі сніжком
    const kids = depth === 0 ? 3 : 2;
    for (let k = 0; k < kids; k++) {
      const h = hash2(seed + depth * 31 + k * 7, bx + by);
      const da = (k - (kids - 1) / 2) * (0.75 + (h % 30) / 100) + ((h >>> 5) % 20 - 10) / 60;
      branch(ex, ey, ang + da, len * (0.66 + (h % 12) / 100), depth + 1);
    }
  };
  // п'ять головних гілок від верхівки стовбура
  [-1.1, -0.55, 0, 0.55, 1.1].forEach((a, i) => branch(x + (i % 2 ? 1 : 0), top + (i === 2 ? 0 : 3 + (i % 2) * 3), a, i === 2 ? 15 : 12, 0));
  R(g, x - 3, top - 1, 7, 1, 'w'); R(g, x - 9, base - 1, 18, 3, 'w'); R(g, x - 6, base - 3, 12, 2, 'w');
}

/* ---------- Хелловін: гірлянда й скелет на будинку ---------- */
function skeletonG(g, sx, sy, c, dx, dy) {
  const X = sx + dx, Y = sy + dy;
  R(g, X + 2, Y - 3, 1, 3, c);                        // мотузка
  R(g, X + 1, Y, 3, 1, c); R(g, X, Y + 1, 5, 2, c); R(g, X + 1, Y + 3, 3, 1, c);       // череп
  R(g, X + 2, Y + 4, 1, 6, c);                        // хребет
  R(g, X + 1, Y + 5, 3, 1, c); R(g, X + 1, Y + 7, 3, 1, c);                            // ребра
  R(g, X, Y + 5, 1, 3, c); R(g, X + 4, Y + 5, 1, 3, c);                                // руки
  R(g, X + 1, Y + 10, 1, 4, c); R(g, X + 3, Y + 10, 1, 4, c);                          // ноги
}
function drawHalloweenHouse(g, spec) {
  const { x, w } = spec, top = LAYOUT.horizonY - spec.h;
  // гірлянда з помаранчевих і фіолетових вогників під дахом
  for (let gx = x + 1; gx < x + w - 1; gx++) {
    const sag = Math.round(2 * Math.sin((gx - x) / (w - 2) * Math.PI));
    R(g, gx, top + 1 + sag, 1, 1, 'd');
    if ((gx - x) % 4 === 2) R(g, gx, top + 2 + sag, 2, 2, ['o', 'u', 'y'][((gx - x) >> 2) % 3]);
  }
  // скелет, що висить на мотузці (не на кожному будинку)
  if (hash2(x + 3, 9) % 2 === 0 && spec.h >= 40) {
    const sx = x + w - 7, sy = top + 6;
    [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(o => skeletonG(g, sx, sy, 'd', o[0], o[1]));
    skeletonG(g, sx, sy, 'w', 0, 0);
    R(g, sx + 1, sy + 1, 1, 1, 'k'); R(g, sx + 3, sy + 1, 1, 1, 'k');            // очі
  }
}

/* ---------- Речі біля магазину (залежать від ширини будівлі) ---------- */
function buildPropsLayer() {
  const { c, g } = newLayer();
  lampXs = lampPositions();
  lampXs.forEach(x => drawLamp(g, x));
  return c;
}

// Чим більше куплено відділу, тим повніша вітрина: 0 — порожньо, 1–3 — поступово більше
function tierOf(count) { return count <= 0 ? 0 : count < 10 ? 1 : count < 50 ? 2 : 3; }

// Один предмет у вітрині. x — ліва межа, yb — лінія полиці (предмет стоїть над нею)
function drawItem(g, kind, x, yb, k) {
  const cols = ['p', 'q', 'o', 'h', 'm', 'u'];
  const c = cols[k % 6];
  switch (kind) {
    case 'trinkets':
      R(g, x, yb - 3, 3, 3, k % 2 ? 'r' : 'h'); R(g, x, yb - 3, 3, 1, 'w'); break;
    case 'sweets':
      R(g, x, yb - 2, 3, 2, c); R(g, x + 1, yb - 3, 1, 1, c); break;
    case 'stationery':
      R(g, x, yb - 6, 1, 6, c); R(g, x, yb - 7, 1, 1, 'y'); R(g, x + 2, yb - 4, 2, 4, 'n'); R(g, x + 2, yb - 4, 2, 1, 'w'); break;
    case 'toys':
      if (k % 2) { R(g, x, yb - 3, 3, 3, c); R(g, x, yb - 3, 1, 1, 'w'); }
      else { R(g, x, yb - 4, 3, 4, 'l'); R(g, x, yb - 5, 1, 1, 'l'); R(g, x + 2, yb - 5, 1, 1, 'l'); R(g, x + 1, yb - 3, 1, 1, 'c'); }
      break;
    case 'cleaning':
      R(g, x, yb - 5, 2, 5, c); R(g, x, yb - 6, 2, 1, 'r'); R(g, x + 3, yb - 4, 2, 4, 's'); break;
    case 'produce':
      R(g, x, yb - 3, 3, 3, ['r', 'o', 'g', 'y', 'r', 'g'][k % 6]); R(g, x + 1, yb - 4, 1, 1, 'G'); break;
    case 'bakery':
      R(g, x, yb - 3, 4, 3, 'c'); R(g, x + 1, yb - 4, 2, 1, 'c'); R(g, x + 1, yb - 2, 2, 1, 'l'); break;
    case 'clothes':
      R(g, x, yb - 5, 4, 4, c); R(g, x + 1, yb - 5, 2, 1, 'w'); R(g, x + 1, yb - 6, 2, 1, 'd'); break;
    case 'shoes':
      R(g, x, yb - 2, 4, 2, c); R(g, x, yb - 3, 2, 1, c); R(g, x, yb - 1, 4, 1, 'd'); break;
    case 'electronics':
      R(g, x, yb - 5, 4, 4, 'd'); R(g, x + 1, yb - 4, 2, 2, k % 2 ? 's' : 'y'); R(g, x + 1, yb - 1, 2, 1, 'e'); break;
    case 'foodcourt':
      if (k % 2) { R(g, x, yb - 4, 1, 4, 'y'); R(g, x + 1, yb - 5, 1, 5, 'y'); R(g, x + 2, yb - 4, 1, 4, 'y'); }
      else { R(g, x, yb - 1, 4, 1, 'c'); R(g, x, yb - 2, 4, 1, 'g'); R(g, x, yb - 3, 4, 1, 'l'); R(g, x, yb - 4, 4, 1, 'c'); }
      break;

      R(g, x, yb - 7, 3, 7, ['u', 'r', 'n'][k % 3]); R(g, x + 1, yb - 5, 1, 1, 'y'); break;
  }
}

// Вітрина відділу: слот x, y, w, h; tier — наскільки заповнена
function drawDisplay(g, x, y, w, h, kind, tier) {
  if (tier <= 0) return;

// Стелаж на два відділи (34×19) із кольоровою шапкою; y — верх рамки

// Розкладає елементи рядка по ширині рівномірно; повертає x кожного
function placeRow(innerX, innerW, widths) {
  const sum = widths.reduce((a, b) => a + b, 0);
  const gap = Math.floor((innerW - sum) / (widths.length + 1));
  let x = innerX + gap;
  return widths.map(w => { const px = x; x += w + gap; return px; });
}

// Сніг на даху: верхні два пікселі кожного стовпчика даху стають білими (тонкі стовпчики — прапори, антени — не чіпаємо)

  const g = c.getContext('2d');
  const W = c.width, img = g.getImageData(0, 0, W, maxY), d = img.data;
  const has = (x, y) => x >= 0 && x < W && d[(y * W + x) * 4 + 3] > 0;
  for (let x = 0; x < W; x++) {
    let y0 = -1;
    for (let y = 0; y < maxY; y++) if (has(x, y)) { y0 = y; break; }
    if (y0 < 0 || (!has(x - 1, y0) && !has(x + 1, y0))) continue;

// Перебудовує спрайт магазину, якщо змінився рівень або наповненість вітрин
function rebuildShop(force) {
  const tiers = state.depts.map(tierOf);
  const sig = state.shopLevel + '|' + tiers.slice(0, state.shopLevel * 2).join('') + '|' + seasonNow() + '|' + (state.epoch % EPOCH_SHOP.length);
  if (!force && shop && shop.sig === sig) return false;
  const levelChanged = !shop || shop.level !== state.shopLevel;
  if (levelChanged && shop) ejectInside();
  const geo = buildShopCanvas(state.shopLevel, tiers);
  shop = Object.assign(geo, {
    sig, level: state.shopLevel, doorOpen: shop ? (shop.doorOpen || 0) : 0,
    x: Math.round(LAYOUT.centerX - geo.w / 2),
    y: LAYOUT.curbY - geo.h
  });
  if (levelChanged) {
    if (layoutReady) { groundLayer = buildGroundLayer(); seedBenches(); }       // ліхтарі зсунулись — вікна будинків, дерева й лавки теж
    propsLayer = buildPropsLayer();
    placeShopOverlay();
    updateSignText();
  }
  return levelChanged;
}

// Розміщує HTML-вивіску поверх спрайта магазину (у відсотках — не залежить від масштабу)
function placeShopOverlay() {
  const o = ui.shopOverlay.style;
  o.left = pctX(shop.x) + '%';
  o.top = pctY(shop.y) + '%';
  o.width = (shop.w / view.w * 100) + '%';
  o.height = (shop.h / view.h * 100) + '%';
  const sg = ui.sign.style;
  sg.left = (shop.sign.x / shop.w * 100) + '%';
  sg.top = (shop.sign.y / shop.h * 100) + '%';
  sg.width = (shop.sign.w / shop.w * 100) + '%';
  sg.height = (shop.sign.h / shop.h * 100) + '%';
}

function updateSignText() {
  ui.signText.textContent = t('sign_' + state.shopLevel);
  fitSign();
}

// Підбирає найбільший цілий множник, щоб пікселі лишалися чіткими.
// ПК: сцена на весь вільний простір — на широкому екрані додаються будинки, ліхтарі й бруківка з боків, а на високому — небо зверху.
// Телефон: сцена «наближена» до магазину (так вивіска читається), а вся вулиця ширша за екран — її можна гортати пальцем.
const cam = { pan: 0 };                // зсув камери на телефоні (пікселів сцени) відносно центру вулиці
let layoutReady = false;
function layoutScene() {
  const W0 = CONFIG.SCENE_W, H0 = CONFIG.SCENE_H;
  const dpr = window.devicePixelRatio || 1;
  const mobile = mobileMQ.matches;
  const cs = getComputedStyle(ui.stage);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const availW = ui.stage.clientWidth - padX;
  // на телефоні з відкритим меню сцена займає не більше ~44% висоти, решту віддаємо панелі
  const availH = ui.stage.clientHeight - padY;
  const EB = (mobile && state.settings.panelOpen) ? 0 : CONFIG.EXTRA_BOTTOM;     // додаткова бруківка знизу
  const needY = shop ? Math.max(0, shop.h + 6 - LAYOUT.curbY) : 0;               // скільки неба над «ядром» потрібно високому магазину
  const H1 = H0 + EB + needY;
  let k, offX, cropW;
  if (mobile) {
    offX = CONFIG.MOBILE_PAD;
    const want = shop ? Math.min(W0, Math.max(176, (shop.w + 40) & ~1)) : W0;      // скільки вулиці хочемо показати
    k = Math.max(1, Math.floor(Math.min(availW * dpr / (want * 0.9), availH * dpr / H1)));   // можна обрізати до 10%, щоб збільшити масштаб
    cropW = Math.min(want, Math.floor(availW * dpr / k));
  } else {
    k = Math.max(1, Math.floor(Math.min(availW * dpr / CONFIG.MIN_VIEW_W, availH * dpr / H1)));
    const visW = Math.min(CONFIG.MAX_VIEW_W, availW * dpr / k);                     // скільки пікселів сцени вміщується в ширину (дробове)
    offX = Math.max(0, Math.ceil((visW - W0) / 2));
    cropW = Math.min(W0 + 2 * offX, visW);
  }
  // Усю висоту займає сцена: зайві рядки діляться між небом зверху (більшість) і бруківкою знизу
  const unit = k / dpr;
  const E = Math.max(0, Math.ceil(availH / unit) - H1);
  const botExtra = Math.min(Math.round(E * 0.4), 70);
  const offY = Math.min(CONFIG.MAX_OFF_Y, E - botExtra) + needY;
  const extraB = EB + botExtra;
  const changed = !layoutReady || offX !== view.offX || offY !== view.offY || extraB !== view.extraB;
  view.offX = offX; view.offY = offY; view.extraB = extraB; view.w = W0 + 2 * offX; view.h = H0 + extraB + offY;
  if (changed) {
    layoutReady = true;
    ui.view.width = view.w; ui.view.height = view.h;
    ctx.imageSmoothingEnabled = false;
    rebuildAllLayers();
  }
  viewCrop = { x: 0, w: cropW };
  sceneUnit = unit;
  const sceneH = Math.min(view.h * unit, availH);
  ui.scene.style.width = (cropW * sceneUnit) + 'px';
  ui.scene.style.height = sceneH + 'px';
  ui.world.style.marginTop = (-(view.h * unit - sceneH)) + 'px';                   // зайве небо зверху обрізається, бруківка знизу видна повністю
  ui.scene.style.setProperty('--u', sceneUnit + 'px');
  ui.scene.classList.toggle('pannable', mobile && cropW < view.w);
  ui.world.style.width = (view.w * sceneUnit) + 'px';
  ui.world.style.height = (view.h * sceneUnit) + 'px';
  applyCamera();
  if (shop) placeShopOverlay();
  fitSign();
}
// Камера: на телефоні показує частину вулиці (за замовчуванням — середину), на ПК видно все
function applyCamera() {
  const base = view.offX + (CONFIG.SCENE_W - viewCrop.w) / 2;
  const x = Math.max(0, Math.min(view.w - viewCrop.w, base + cam.pan));
  cam.pan = x - base;
  viewCrop.x = x;
  ui.world.style.marginLeft = (-x * sceneUnit) + 'px';
}
// Перебудовує всі шари під поточний розмір полотна
function rebuildAllLayers() {
  skyLayer = buildSkyLayer();
  groundLayer = buildGroundLayer();
  if (shop) propsLayer = buildPropsLayer();
  buildSkyStars();
  seedClouds();
  seedBirds();
  seedEpochFx();
  seedBenches();
  resetEpochFx();
  resetThemeFx();
}

// Меню справа (на телефоні — внизу): стрілка згортає його, і вся гра стає на екран
function applyPanel() {
  const open = state.settings.panelOpen;
  ui.app.classList.toggle('panel-closed', !open);
  ui.panelToggle.setAttribute('aria-expanded', String(open));
  updatePanelToggle();
  layoutScene();
}
// Підпис стрілки й червона точка, якщо за згорнутим меню є що купити
function updatePanelToggle() {
  const open = state.settings.panelOpen;
  const label = t(open ? 'panelHide' : 'panelShow');
  if (uiCache.panelLabel !== label) {
    uiCache.panelLabel = label;
    ui.panelToggle.setAttribute('aria-label', label);
    ui.panelToggle.title = label;
  }
  ui.panelToggle.classList.toggle('alert', !open && (hasAffordableAction() || hasTeamAction()));
}

// Підбирає розмір шрифту, щоб напис вмістився на вивісці (в один або два рядки)
function fitSign() {
  const el = ui.sign, span = ui.signText;
  let size = 9;
  el.style.fontSize = (size * sceneUnit) + 'px';
  while (size > 4 && (span.offsetHeight > el.clientHeight + 1 || span.scrollWidth > el.clientWidth + 1)) {
    size -= 0.5;
    el.style.fontSize = (size * sceneUnit) + 'px';
  }
}

function detectLanguage() {
  const l = (navigator.language || (navigator.languages && navigator.languages[0]) || 'en').toLowerCase();
  return l.startsWith('uk') ? 'uk' : 'en';
}

function setText(el, text, cacheKey) {
  if (uiCache[cacheKey] === text) return;
  uiCache[cacheKey] = text;
  el.textContent = text;
}

function buildTabs() {
  ui.tabs.innerHTML = '';
  TABS.forEach(tab => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab btn ' + (TABS_PRIMARY.includes(tab.id) ? 'primary' : 'secondary') + (tab.ready ? '' : ' soon');
    b.dataset.tab = tab.id;
    b.setAttribute('role', 'tab');
    b.innerHTML = '<span class="tab-icon"></span><span class="tab-name"></span>';
    b.querySelector('.tab-icon').textContent = tab.icon;
    b.addEventListener('click', () => onTabClick(tab.id));
    ui.tabs.appendChild(b);
  });
  const more = document.createElement('button');          // «⋯» — друга частина вкладок (лише на телефоні)
  more.type = 'button'; more.className = 'tabmore btn'; more.textContent = '⋯';
  more.addEventListener('click', () => ui.app.classList.toggle('more-open'));
  ui.tabs.appendChild(more);
  ui.tabMore = more;
}
const TABS_PRIMARY = ['shop', 'departments', 'team', 'story'];
// На телефоні вміст вкладки виїжджає над смужкою іконок; повторний дотик до тієї ж вкладки його ховає
function setSheet(open) {
  ui.app.classList.toggle('sheet-open', open);
  if (!open) ui.app.classList.remove('more-open');
}
function onTabClick(id) {
  if (mobileMQ.matches) {
    if (ui.app.classList.contains('sheet-open') && state.tab === id) { setSheet(false); return; }
    showTab(id);
    setSheet(true);
    if (TABS_PRIMARY.includes(id)) ui.app.classList.remove('more-open');
    return;
  }
  showTab(id);
}

function showTab(id) {
  const tab = TABS.find(x => x.id === id) || TABS[0];
  state.tab = tab.id;
  ui.tabs.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab.id)));
  TABS.forEach(x => { const el = document.getElementById('pane-' + x.id); if (el) el.hidden = x.id !== tab.id; });
  ui.paneSoon.hidden = tab.ready;
  if (!tab.ready) ui.soonTitle.textContent = tab.icon + ' ' + t('tab_' + tab.id);
  updateUI();
}

// Режими покупки ×1 / ×10 / ×100 / МАКС
function buildBuyModes() {
  ui.buyModes.innerHTML = '';
  CONFIG.BUY_MODES.forEach(mode => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'buy-mode btn';
    b.dataset.mode = String(mode);
    b.addEventListener('click', () => { state.buyMode = mode; updateUI(); });
    ui.buyModes.appendChild(b);
  });
}

// Картки відділів (створюються один раз, далі оновлюється лише текст)
function buildDeptCards() {
  ui.deptList.innerHTML = '';
  DEPARTMENTS.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'card dept';
    card.innerHTML =
      '<div class="dept-head"><span class="dept-icon"></span><span class="dept-name"></span><span class="dept-count"></span></div>' +
      '<div class="dept-income"><div class="each"></div><div class="total"></div></div>' +
      '<div class="ms"><div class="ms-bar"><i></i></div><span class="ms-text"></span></div>' +
      '<button type="button" class="btn wide buy"></button>';
    card.querySelector('.dept-icon').textContent = d.icon;
    card.querySelector('.buy').addEventListener('click', () => buyDept(i));
    ui.deptList.appendChild(card);
    deptEls[i] = {
      card,
      name: card.querySelector('.dept-name'), count: card.querySelector('.dept-count'),
      each: card.querySelector('.each'), total: card.querySelector('.total'),
      bar: card.querySelector('.ms-bar i'), msText: card.querySelector('.ms-text'),
      buy: card.querySelector('.buy')
    };
  });
  deptLockedEl = document.createElement('div');
  deptLockedEl.className = 'card dept locked';
  ui.deptList.appendChild(deptLockedEl);
}

// Картки звіряток (створюються один раз; портрет — той самий спрайт, що й на сцені)
function buildTeamCards() {
  ui.teamList.innerHTML = '';
  TEAM.forEach((m, i) => {
    const card = document.createElement('div');
    card.className = 'card team-card';
    card.innerHTML =
      '<canvas class="portrait" width="16" height="16" aria-hidden="true"></canvas>' +
      '<div class="info"><div class="t-name"></div><div class="t-role"></div><div class="t-trait"></div>' +
      '<div class="t-lvl"></div><div class="t-now"></div><div class="t-next"></div>' +
      '<button type="button" class="btn wide go"></button></div>';
    const cv = card.querySelector('.portrait');
    const pc = cv.getContext('2d');
    pc.imageSmoothingEnabled = false;
    pc.drawImage(getSpriteCanvas('team_' + m.id), 0, 0);
    card.querySelector('button').addEventListener('click', () => hireOrUpgrade(i));
    ui.teamList.appendChild(card);
    teamEls[i] = {
      card, name: card.querySelector('.t-name'), role: card.querySelector('.t-role'), trait: card.querySelector('.t-trait'),
      lvl: card.querySelector('.t-lvl'), now: card.querySelector('.t-now'), next: card.querySelector('.t-next'),
      btn: card.querySelector('button')
    };
  });
  teamLockedEl = document.createElement('div');
  teamLockedEl.className = 'card dept locked';
  ui.teamList.appendChild(teamLockedEl);
}

// Текст бонусу звірятка на рівні lvl
function bonusText(i, lvl) {
  const b = TEAM[i].bonus;
  const pct = v => Math.round(v * 100);
  switch (b.type) {
    case 'tap': return t('bonus_tap', fmt(1 + b.per * lvl, 2));
    case 'expandCost': return t('bonus_expandCost', pct(Math.min(b.per * lvl, b.cap)));
    case 'offline': return t('bonus_offline', pct(CONFIG.OFFLINE_RATE + b.rate * lvl), CONFIG.OFFLINE_MAX_HOURS + b.hours * lvl);
    case 'thief': return t('bonus_thief', pct(Math.min(b.per * lvl, b.cap)));
    case 'deptIncome': return t('bonus_deptIncome', b.depts.map(d => t('dept_' + DEPARTMENTS[d].id)).join(', '), fmt(1 + b.per * lvl, 2));
    case 'global': return t('bonus_global', fmt(1 + b.per * lvl, 2));
    case 'event': return t('bonus_event', pct(b.per * lvl));
    case 'fix': return t('bonus_fix', pct(b.per * lvl));
    case 'deptCost': return t('bonus_deptCost', pct(Math.min(b.per * lvl, b.cap)));
  }
  return '';
}

// Підставляє тексти поточної мови в усі елементи з data-i18n
function applyTranslations() {
  document.documentElement.lang = state.lang;
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  ui.tabs.querySelectorAll('.tab').forEach(b => { b.querySelector('.tab-name').textContent = t('tab_' + b.dataset.tab); b.title = t('tab_' + b.dataset.tab); b.setAttribute('aria-label', t('tab_' + b.dataset.tab)); });
  if (ui.tabMore) ui.tabMore.setAttribute('aria-label', t('tabMore'));
  const tab = TABS.find(x => x.id === state.tab);
  if (tab && !tab.ready) ui.soonTitle.textContent = tab.icon + ' ' + t('tab_' + tab.id);
  DEPARTMENTS.forEach((d, i) => { deptEls[i].name.textContent = t('dept_' + d.id); });
  ui.buyModes.querySelectorAll('.buy-mode').forEach(b => {
    b.textContent = b.dataset.mode === 'max' ? t('buyMax') : '×' + b.dataset.mode;
  });
  ui.modalTitle.textContent = t('offlineTitle');
  ui.modalText.textContent = t('offlineText');
  ui.modalBtn.textContent = t('offlineBtn');
  if (shop) updateSignText();
  ui.dlgSkip.textContent = t('storySkip');
  updateSoundUI();
  refreshDialogLanguage();
  for (const k in uiCache) delete uiCache[k];
  updateUI();
  if (!ui.modal.hidden) refreshOfflineModal();
}

function setLanguage(id) {
  if (!translations[id] || state.lang === id) return;
  state.lang = id;
  applyTranslations();
  saveGame();
}

function updateSaveWarning() {
  ui.saveWarn.hidden = storageOk;
}

// Оновлює лічильник і панель (тільки якщо текст змінився)
function updateUI() {
  setText(ui.coinCount, fmt(Math.floor(state.coins)), 'coins');
  setText(ui.cps, t('perSecond', fmt(state.cps, 1)), 'cps');

  // вкладка «Магазин»
  setText(ui.shopName, t('levelName_' + state.shopLevel), 'shopName');
  setText(ui.shopLevelLabel, t('shopLevelLabel', state.shopLevel, LEVELS.length), 'level');
  setText(ui.statTapPower, fmt(tapValue(), 1), 'tapPower');
  setText(ui.statLevelMult, '×' + fmt(levelMult()), 'levelMult');
  setText(ui.statTaps, fmt(state.taps), 'taps');
  setText(ui.statEarned, fmt(Math.floor(state.totalEarned)), 'earned');

  updateDepartmentsUI();
  updateTeamUI();
  updateStoryUI();
  updateProgressionUI();
  updatePanelToggle();
}

// Чи є зараз що купити (для мигаючої точки на вкладці «Відділи»)
function hasAffordableAction() {
  for (let i = 0; i < DEPARTMENTS.length; i++) {
    if (isDeptUnlocked(i) && state.coins >= deptCost(i, 1)) return true;
  }
  const next = nextLevelDef();
  return !!(next && requirementsMet(next) && state.coins >= expandCost(next));
}
// Чи можна зараз найняти або прокачати когось із команди
function hasTeamAction() {
  return TEAM.some((m, i) => isTeamUnlocked(i) && state.team[i] < CONFIG.TEAM_MAX_LEVEL && state.coins >= teamCost(i, state.team[i] + 1));
}

function updateTeamUI() {
  const alertTab = ui.tabs.querySelector('[data-tab="team"]');
  if (alertTab) alertTab.classList.toggle('alert', hasTeamAction() && state.tab !== 'team');
  if (ui.paneTeam.hidden) return;
  TEAM.forEach((m, i) => {
    const el = teamEls[i];
    const unlocked = isTeamUnlocked(i);
    el.card.hidden = !unlocked;
    if (!unlocked) return;
    const lvl = state.team[i];
    el.card.classList.toggle('unhired', lvl === 0);
    setText(el.name, t('team_' + m.id), 'tn' + i);
    setText(el.role, t('team_' + m.id + '_role'), 'tr' + i);
    setText(el.trait, t('team_' + m.id + '_trait'), 'tt' + i);
    setText(el.lvl, lvl === 0 ? '' : t('teamLevel', lvl, CONFIG.TEAM_MAX_LEVEL), 'tl' + i + '_' + lvl);
    if (lvl === 0) {
      setText(el.now, t('teamGives', bonusText(i, 1)), 'tw' + i);
      setText(el.next, '', 'tx' + i);
    } else {
      setText(el.now, t('teamNow', bonusText(i, lvl)), 'tw' + i + '_' + lvl);
      setText(el.next, lvl < CONFIG.TEAM_MAX_LEVEL ? t('teamNext', bonusText(i, lvl + 1)) : '', 'tx' + i + '_' + lvl);
    }
    if (lvl >= CONFIG.TEAM_MAX_LEVEL) {
      setText(el.btn, t('teamMax'), 'tb' + i);
      el.btn.disabled = true;
    } else {
      const cost = teamCost(i, lvl + 1);
      setText(el.btn, t(lvl === 0 ? 'teamHire' : 'teamUpgrade', fmt(cost)), 'tb' + i);
      el.btn.disabled = state.coins < cost;
    }
  });
  const nextLocked = TEAM.find((m, i) => !isTeamUnlocked(i) && !m.needs);
  teamLockedEl.hidden = !nextLocked;
  if (nextLocked) setText(teamLockedEl, t('lockedTeam', t('levelName_' + nextLocked.level)), 'tlocked');
}

function updateDepartmentsUI() {
  const alertTab = ui.tabs.querySelector('[data-tab="departments"]');
  if (alertTab) alertTab.classList.toggle('alert', hasAffordableAction() && state.tab !== 'departments');
  if (ui.paneDepts.hidden) return;

  // режими покупки
  ui.buyModes.querySelectorAll('.buy-mode').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === String(state.buyMode))));

  // картка розширення
  const next = nextLevelDef();
  if (!next) {
    ui.expandTitle.textContent = t('levelName_' + state.shopLevel);
    setText(ui.expandNote, t('expandMax'), 'expandNote');
    ui.expandReqs.innerHTML = '';
    uiCache.reqSig = '';
    ui.expandBtn.hidden = true;
  } else {
    ui.expandBtn.hidden = false;
    const nextLevel = state.shopLevel + 1;
    setText(ui.expandTitle, t('expandTitle', t('levelName_' + nextLevel)), 'expandTitle');
    setText(ui.expandNote, t('expandNote'), 'expandNote');
    const sig = nextLevel + '|' + state.lang + '|' + next.requires.map(r => Math.min(state.depts[r.dept], r.count)).join(',');
    if (uiCache.reqSig !== sig) {
      uiCache.reqSig = sig;
      ui.expandReqs.innerHTML = '';
      next.requires.forEach(r => {
        const row = document.createElement('div');
        const have = state.depts[r.dept];
        row.className = 'req' + (have >= r.count ? ' ok' : '');
        const name = document.createElement('span');
        name.textContent = DEPARTMENTS[r.dept].icon + ' ' + t('dept_' + DEPARTMENTS[r.dept].id);
        const val = document.createElement('b');
        val.textContent = (have >= r.count ? '✓ ' : '') + Math.min(have, r.count) + ' / ' + r.count;
        row.append(name, val);
        ui.expandReqs.appendChild(row);
      });
    }
    setText(ui.expandBtn, t('expandBtn', fmt(expandCost(next))), 'expandBtn');
    ui.expandBtn.disabled = !(requirementsMet(next) && state.coins >= expandCost(next));
  }

  // картки відділів
  DEPARTMENTS.forEach((d, i) => {
    const el = deptEls[i];
    const unlocked = isDeptUnlocked(i);
    el.card.hidden = !unlocked;
    if (!unlocked) return;
    const count = state.depts[i];
    const each = deptIncomeEach(i);
    setText(el.name, t('dept_' + d.id), 'dn' + i);
    setText(el.count, '×' + fmt(count), 'dc' + i);
    setText(el.each, t('deptEach', fmt(each, 1)), 'de' + i);
    setText(el.total, t('deptTotal', fmt(each * count, 1)), 'dt' + i);
    const nm = nextMilestone(count);
    if (nm === null) {
      el.bar.style.width = '100%';
      setText(el.msText, t('msDone'), 'dm' + i);
    } else {
      const prev = CONFIG.MILESTONES.filter(m => m <= count).pop() || 0;
      el.bar.style.width = ((count - prev) / (nm - prev) * 100) + '%';
      setText(el.msText, t('msNext', count, nm), 'dm' + i);
    }
    const n = plannedBuy(i);
    const cost = deptCost(i, n);
    setText(el.buy, t('buyLabel', fmt(n), fmt(cost)), 'db' + i);
    el.buy.disabled = state.coins < cost;
  });

  // підказка про наступні відділи
  const nextLocked = DEPARTMENTS.find((d, i) => !isDeptUnlocked(i));
  deptLockedEl.hidden = !nextLocked;
  if (nextLocked) setText(deptLockedEl, t('lockedDepts', t('levelName_' + nextLocked.level)), 'locked');
}

/* ---------- Тости ---------- */
function showToast(text, kind, icon) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  if (icon) { el.appendChild(icon); const tx = document.createElement('span'); tx.textContent = text; el.appendChild(tx); }   // icon — маленький canvas (значок досягнення)
  else el.textContent = text;
  el.style.setProperty('--life', CONFIG.TOAST_SECONDS + 's');
  el.addEventListener('animationend', e => { if (e.animationName === 'toastOut') el.remove(); });
  ui.toasts.appendChild(el);
  while (ui.toasts.childElementCount > CONFIG.MAX_TOASTS) ui.toasts.firstChild.remove();
}

/* =====================================================================
   ПОКУПКИ: відділи й розширення
   ===================================================================== */

function buyDept(i) {
  if (!isDeptUnlocked(i)) return;
  const n = plannedBuy(i);
  const cost = deptCost(i, n);
  if (!(state.coins >= cost)) return;
  const before = state.depts[i];
  state.coins -= cost;
  state.depts[i] += n;
  state.stats.deptsBought += n;
  CONFIG.MILESTONES.forEach(m => {
    if (before < m && state.depts[i] >= m) { showToast(t('milestoneToast', t('dept_' + DEPARTMENTS[i].id), m), 'good'); playSfx('milestone'); state.stats.milestones++; }
  });
  recalcIncome();
  rebuildShop();
  playSfx('buy');
  updateUI();
}

function expandShop() {
  const next = nextLevelDef();
  if (!next || !requirementsMet(next) || state.coins < expandCost(next)) return;
  const old = { canvas: shop.canvas, x: shop.x, y: shop.y, w: shop.w, h: shop.h };
  state.coins -= expandCost(next);
  state.shopLevel += 1;
  recalcIncome();
  rebuildShop(true);
  startBuild(old);
  playSfx('build');
  updateMusic();
  layoutScene();
  updateUI();
  saveGame();
}

// Рахує, скільки магазин заробив за seconds секунд відсутності, і кладе в «непозбране»
function addOfflineEarnings(seconds) {
  if (!(seconds >= CONFIG.OFFLINE_MIN_SECONDS) || state.cps <= 0) return;
  const capped = Math.min(seconds, offlineMaxHours() * 3600);
  const earned = state.cps * capped * offlineRate();
  if (earned >= 1) {
    state.pendingOffline += earned;
    showOfflineModal();
  }
}
function refreshOfflineModal() {
  ui.modalBig.textContent = t('offlineCoins', fmt(Math.floor(state.pendingOffline)));
}
function showOfflineModal() {
  if (state.pendingOffline < 1) return;
  ui.modalTitle.textContent = t('offlineTitle');
  ui.modalText.textContent = t('offlineText');
  ui.modalBtn.textContent = t('offlineBtn');
  refreshOfflineModal();
  ui.modal.hidden = false;
  ui.modalBtn.focus({ preventScroll: true });
}
function claimOffline() {
  const gain = state.pendingOffline;
  state.coins += gain;
  state.totalEarned += gain;
  state.pendingOffline = 0;
  playSfx('coins');
  ui.modal.hidden = true;
  updateUI();
  saveGame();
}

const shopAnim = { squash: 0, vel: 0 };          // пружинка стискання магазину
const capyAnim = { blinkIn: 3, blinkLeft: 0 };   // кліпання
const fx = { coins: [], sparks: [], dust: [] };
const clouds = CLOUDS.map(c => ({ ...c }));
// Хмаринки розсипаються по всій ширині й висоті неба (на великому екрані їх більше)
// Погода: восени йде сильний дощ, навесні — короткі легкі дощики (влітку й узимку дощу нема)
const weather = { rain: 0, target: 0, timer: 30 };
const raindrops = [];
function updateWeather(dt) {
  const season = theme.season;
  if (!animOn() || (season !== 'autumn' && season !== 'spring')) weather.target = 0;
  else {
    weather.timer -= dt;
    if (weather.timer <= 0) {
      if (weather.target > 0) { weather.target = 0; weather.timer = season === 'autumn' ? rand(90, 200) : rand(160, 320); }
      else { weather.target = season === 'autumn' ? 1 : 0.5; weather.timer = rand(30, 70); }
    }
  }
  weather.rain += (weather.target - weather.rain) * Math.min(1, dt * 0.6);
  if (weather.rain < 0.02) { raindrops.length = 0; return; }
  const want = Math.round(weather.rain * 120 * (view.w * view.h) / (320 * 180));
  while (raindrops.length < want) raindrops.push({ x: rand(worldL(), worldR() + 30), y: rand(-view.offY, worldB()), vy: rand(130, 175) });
  while (raindrops.length > want) raindrops.pop();
  raindrops.forEach(d => {
    d.y += d.vy * dt; d.x -= 20 * dt;
    if (d.y > worldB()) { d.y = -view.offY - rand(0, 20); d.x = rand(worldL(), worldR() + 30); }
  });
}
function drawRain() {
  if (!raindrops.length) return;
  ctx.globalAlpha = 0.85;
  raindrops.forEach(d => { R(ctx, Math.round(d.x), Math.round(d.y), 1, 3, 'S'); R(ctx, Math.round(d.x) + 1, Math.round(d.y) + 3, 1, 1, 's'); });

}

// Птахи: зграї-«клини» і поодинокі вдень (вночі їх нема; на Хелловін замість них кажани)
const BIRDS_BY_SEASON = { spring: 9, summer: 6, autumn: 10, winter: 4, halloween: 0 };
const birds = [];
function seedBirds() {
  birds.length = 0;
  const total = Math.round((BIRDS_BY_SEASON[theme.season] !== undefined ? BIRDS_BY_SEASON[theme.season] : 6) * Math.max(1, view.w / 320));
  const offs = [[0, 0], [-7, 3], [-7, -3], [-14, 6], [-14, -6], [-21, 9]];
  let made = 0;
  while (made < total) {
    const size = Math.min(total - made, 1 + Math.floor(rand(0, 6)));
    const dir = Math.random() < 0.5 ? -1 : 1, vx = rand(16, 30) * dir;
    const fx = rand(worldL(), worldR()), fy = rand(8 - view.offY, 64);
    for (let k = 0; k < size; k++) birds.push({ x: fx + offs[k][0] * -dir, y: fy + offs[k][1], vx, ph: rand(0, 6.3), bob: rand(0, 6.3), wing: rand(5, 7.5) });
    made += size;
  }
}
function updateBirds(dt) {
  if (!animOn()) return;
  birds.forEach(b => {
    b.x += b.vx * dt;
    if (b.vx > 0 && b.x > worldR() + 24) b.x = worldL() - 24;
    else if (b.vx < 0 && b.x < worldL() - 24) b.x = worldR() + 24;
  });
}
function drawBirds() {
  const vis = 1 - Math.min(1, sky.night * 1.5);
  if (vis <= 0.05 || !birds.length) return;
  ctx.globalAlpha = vis;
  birds.forEach(b => {
    const x = Math.round(b.x), y = Math.round(b.y + Math.sin(animClock * 1.3 + b.bob) * 2);
    const up = animOn() ? Math.floor(animClock * b.wing + b.ph) % 2 === 0 : true;
    R(ctx, x - 1, y, 3, 1, 'd'); R(ctx, x + (b.vx > 0 ? 2 : -2), y, 1, 1, 'd');           // тіло й голівка
    if (up) { R(ctx, x - 4, y - 2, 3, 1, 'd'); R(ctx, x + 2, y - 2, 3, 1, 'd'); R(ctx, x - 5, y - 3, 1, 1, 'd'); R(ctx, x + 5, y - 3, 1, 1, 'd'); }
    else { R(ctx, x - 4, y + 1, 3, 1, 'd'); R(ctx, x + 2, y + 1, 3, 1, 'd'); R(ctx, x - 5, y + 2, 1, 1, 'd'); R(ctx, x + 5, y + 2, 1, 1, 'd'); }
  });
  ctx.globalAlpha = 1;
}

// Хмар по сезонах: влітку мало, навесні помірно, восени й узимку багато й сірі, на Хелловін темні
const CLOUD_BY_SEASON = { spring: [1.0, 'white'], summer: [0.35, 'white'], autumn: [1.8, 'grey'], winter: [1.5, 'light'], halloween: [1.4, 'dark'] };
function seedClouds() {
  clouds.length = 0;
  const cfg = CLOUD_BY_SEASON[theme.season] || [1, 'white'];
  const base = CLOUDS.length + Math.floor((view.w - 320) / 80) + Math.floor(view.offY / 45);
  const n = Math.max(2, Math.round(base * cfg[0]));
  for (let i = 0; i < n; i++) {
    const b = CLOUDS[i % CLOUDS.length];
    const v = cfg[1] === 'white' ? (theme.season === 'spring' && i % 4 === 3 ? 'light' : '') : cfg[1] === 'grey' ? (i % 4 === 3 ? 'light' : 'grey') : cfg[1] === 'light' ? (i % 2 ? 'light' : '') : 'dark';
    clouds.push({ x: rand(worldL(), worldR()), y: rand(4 - view.offY, 46), speed: b.speed * rand(0.8, 1.3), v, big: cfg[0] > 1.2 && i % 3 === 0 });
  }
}
let build = null;                                 // триває будівництво нового рівня
const customers = [];
let customerTimer = 1;

function rand(a, b) { return a + Math.random() * (b - a); }

// Масштаб магазину для поточного стискання (використовується і в canvas, і для вивіски)
function getShopScale() {
  const sq = Math.max(-0.5, Math.min(0.5, shopAnim.squash));
  const sx = 1 + 0.25 * sq, sy = 1 - 0.4 * sq;
  // як і в drawCanvasSprite, округлюємо до цілих пікселів, щоб вивіска збігалася зі спрайтом
  return { sx: Math.max(1, Math.round(shop.w * sx)) / shop.w, sy: Math.max(1, Math.round(shop.h * sy)) / shop.h };
}

/* ---------- Будівництво: риштування і пил ---------- */
function startBuild(old) {
  ejectInside();
  build = { t: 0, dur: CONFIG.BUILD_SECONDS, old, dustTimer: 0, burst: false };
  ui.shopOverlay.style.visibility = 'hidden';
}
function finishBuild() {
  build = null;
  ui.shopOverlay.style.visibility = '';
  shopAnim.vel = 6;
  playSfx('levelup');
  showToast(t('buildDone', t('levelName_' + state.shopLevel)), 'big');
  const opened = DEPARTMENTS.filter(d => d.level === state.shopLevel).map(d => t('dept_' + d.id));
  if (opened.length) showToast(t('newDepts', opened.join(', ')), 'good');
}
function spawnDust(x, y, n) {
  if (!animOn()) return;
  for (let i = 0; i < n; i++) {
    fx.dust.push({ x: x + rand(-3, 3), y: y + rand(-2, 2), r: rand(2, 4), vx: rand(-14, 14), vy: rand(-18, -4), age: 0, life: rand(0.5, 0.9) });
  }
  while (fx.dust.length > CONFIG.MAX_DUST) fx.dust.shift();
}
function updateBuild(dt) {
  build.t += dt;
  const p = build.t / build.dur;
  build.dustTimer -= dt;
  if (build.dustTimer <= 0 && p < 0.95) {
    build.dustTimer = 0.07;
    const r = buildReveal(p);
    spawnDust(shop.x + rand(0, shop.w), LAYOUT.curbY + rand(-2, 4), 1);
    if (r > 0 && r < 1) spawnDust(shop.x + rand(0, shop.w), shop.y + shop.h * (1 - r), 1);
  }
  if (!build.burst && p >= 0.88) {
    build.burst = true;
    for (let i = 0; i < 14; i++) spawnDust(shop.x + (i / 13) * shop.w, LAYOUT.curbY, 1);
  }
  if (build.t >= build.dur) finishBuild();
}
// Яка частка нової будівлі вже «виросла» (0..1)
function buildReveal(p) {
  const r = Math.max(0, Math.min(1, (p - 0.2) / 0.65));
  return r * r * (3 - 2 * r);
}
// Риштування навколо прямокутника: стовпи й дошки
function drawScaffold(x, y, w, h, alpha) {
  ctx.globalAlpha = alpha;
  const x0 = x - 3, x1 = x + w + 1;
  const poles = Math.max(2, Math.round((x1 - x0) / 20));
  for (let i = 0; i <= poles; i++) {
    const px = Math.round(x0 + (x1 - x0) * i / poles);
    R(ctx, px, y - 4, 2, h + 4, 'b');
    R(ctx, px, y - 4, 1, h + 4, 'l');
  }
  for (let py = LAYOUT.curbY - 14; py > y - 2; py -= 22) {
    R(ctx, x0, py, x1 - x0 + 2, 2, 'l');
    R(ctx, x0, py + 2, x1 - x0 + 2, 1, 'd');
  }
  ctx.globalAlpha = 1;
}

/* ---------- Команда на сцені ---------- */
const actors = [];               // звірятка, що працюють на вулиці
const bubbleEls = {};            // активні бульбашки з фразами (за ключем)
let chatterTimer = 20;

// Де стоїть звірятко: Голка — біля дверей, решта — на фіксованих місцях
function actorHome(m) {
  const s = m.spot;
  if (s.x === null) return shop.x + shop.door.x + shop.door.w / 2 + s.dx;
  // решта звіряток розставлені по всій ширині вулиці (f — частка ширини); на широкому екрані відстані більші
  const sc = Math.max(1, Math.min(1.3, (view.w - 36) / 284));
  return LAYOUT.centerX + (s.f - 0.5) * 284 * sc;
}
// Узгоджує список звіряток на сцені зі станом (хто найнятий — той на вулиці)
function syncActors() {
  TEAM.forEach((m, i) => {
    const has = state.team[i] > 0;
    const idx = actors.findIndex(a => a.i === i);
    if (has && idx < 0) actors.push({ i, x: actorHome(m), y: m.spot.y, dir: 1, t: rand(0, 10), hop: 0, moving: false, rest: 0, restIn: rand(CONFIG.SUMMER_REST_MIN, CONFIG.SUMMER_REST_MAX) });
    else if (!has && idx >= 0) actors.splice(idx, 1);
  });
}
function updateActors(dt) {
  actors.forEach(a => {
    const s = TEAM[a.i].spot;
    a.t += dt;
    a.hop = Math.max(0, a.hop - dt * 4);
    // влітку звірятка час від часу зупиняються перепочити й попити водички
    if (theme.season === 'summer' && animOn()) {
      if (a.rest > 0) { a.rest -= dt; if (a.rest <= 0) a.restIn = rand(CONFIG.SUMMER_REST_MIN, CONFIG.SUMMER_REST_MAX); }
      else {
        a.restIn -= dt;
        if (a.restIn <= 0) {
          a.rest = CONFIG.SUMMER_REST_SECONDS;
          if (Math.random() < 0.6 && Object.keys(bubbleEls).length < 1) showBubble('t' + a.i, t('summerSay_' + Math.floor(Math.random() * 5)), a.x, a.y - 19, () => ({ x: a.x, y: a.y - 19 }));
        }
      }
    } else a.rest = 0;
    if (a.rest > 0) { a.moving = false; return; }
    if (s.x === null) { a.moving = false; a.x = actorHome(TEAM[a.i]); return; }         // касир стоїть біля каси
    if (!a.mode) { a.mode = 'idle'; a.wait = rand(0.3, 3); a.speed = rand(11, 22); }
    const bottom = roadFloor();
    if (a.mode === 'sit') {                            // сидить на лавочці
      a.moving = false;
      a.sitT -= dt;
      if (a.sitT <= 0) { if (a.bench) a.bench.slots[a.slot].who = null; a.bench = null; a.mode = 'idle'; a.wait = rand(1, 3); a.y = Math.min(bottom, a.y + 6); }
      return;
    }
    if (a.y > bottom) a.y = bottom;
    if (a.mode === 'idle') {                           // стоїть і розглядається
      a.moving = false;
      a.wait -= dt;
      if (a.wait > 0) return;
      a.speed = rand(11, 22);
      const slots = [];
      benches.forEach(bn => bn.slots.forEach((sl, k) => { if (sl.who === null) slots.push([bn, k]); }));
      if (slots.length && Math.random() < 0.22) {      // іноді йде посидіти на лавочці
        const pick = slots[Math.floor(Math.random() * slots.length)];
        pick[0].slots[pick[1]].who = a.i; a.bench = pick[0]; a.slot = pick[1];
        a.mode = 'toBench'; a.tx = pick[0].x + pick[0].slots[pick[1]].dx; a.ty = pick[0].y + 3;
      } else { pickWanderTarget(a); a.mode = 'walk'; }
      return;
    }
    // іде до цілі (випадкова точка вулиці або лавочка)
    const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy), step = a.speed * dt;
    if (d <= step) {
      a.x = a.tx; a.y = a.ty; a.moving = false;
      if (a.mode === 'toBench' && a.bench) {
        a.mode = 'sit'; a.sitT = rand(9, 16); a.y = a.bench.y - 3; a.dir = a.x < LAYOUT.centerX ? 1 : -1;
        if (Object.keys(bubbleEls).length < 1) showBubble('t' + a.i, t('team_' + TEAM[a.i].id + '_sit_' + Math.floor(Math.random() * 2)), a.x, a.y - 19, () => ({ x: a.x, y: a.y - 19 }));
      } else { a.mode = 'idle'; a.wait = rand(1, 5); }
    } else {
      a.x += dx / d * step; a.y += dy / d * step; a.moving = true;
      if (Math.abs(dx) > 0.5) a.dir = dx > 0 ? 1 : -1;
    }
  });
  // час від часу хтось сам щось каже
  chatterTimer -= dt;
  if (chatterTimer <= 0) {
    chatterTimer = rand(CONFIG.CHATTER_MIN, CONFIG.CHATTER_MAX);
    if (actors.length && Object.keys(bubbleEls).length < 1) { const a = actors[Math.floor(Math.random() * actors.length)]; actorSay(a); }
  }
}

// Випадкова точка, куди піти: недалеко від свого місця, але подалі від інших звіряток
function pickWanderTarget(a) {
  const home = actorHome(TEAM[a.i]);
  let best = null, bestD = -1;
  for (let k = 0; k < 6; k++) {
    const tx = Math.max(worldL() + 14, Math.min(worldR() - 14, home + rand(-85, 85)));
    const ty = rand(LAYOUT.streetTop + 8, roadFloor());
    let md = 1e9;
    actors.forEach(o => {
      if (o === a) return;
      const walking = o.mode === 'walk' || o.mode === 'toBench';
      md = Math.min(md, Math.hypot(tx - (walking ? o.tx : o.x), (ty - (walking ? o.ty : o.y)) * 1.6));
    });
    if (md > bestD) { bestD = md; best = [tx, ty]; }
  }
  a.tx = best[0]; a.ty = best[1];
}

// Предмет у лапках звірятка (малюється поверх спрайта). t — час, dir — куди йде
function drawTeamProp(prop, x, y, t, dir) {
  const ph = Math.floor(t * 3) % 2;
  switch (prop) {
    case 'register':     // прилавок з касою
      R(ctx, x - 11, y - 7, 22, 7, 'b'); R(ctx, x - 11, y - 7, 22, 1, 'l'); R(ctx, x - 11, y - 1, 22, 1, 'd');
      R(ctx, x - 8, y - 11, 7, 4, 'e'); R(ctx, x - 7, y - 10, 5, 2, 'g'); R(ctx, x + 3, y - 9, 4, 2, 'h');
      if (Math.floor(t * 1.2) % 3 === 0) R(ctx, x + 4, y - 12 - ph, 2, 2, 'y');
      break;
    case 'hammer': {     // молоток і дошка
      const up = Math.floor(t * 3) % 2 === 0;
      R(ctx, x + 7, y - 2, 13, 2, 'l'); R(ctx, x + 7, y - 1, 13, 1, 'd');
      if (up) { R(ctx, x + 11, y - 15, 1, 8, 'd'); R(ctx, x + 9, y - 17, 5, 3, 'e'); }
      else { R(ctx, x + 11, y - 9, 1, 7, 'd'); R(ctx, x + 9, y - 4, 5, 3, 'e'); R(ctx, x + 15, y - 4, 1, 1, 'y'); }
      break;
    }
    case 'tray':         // таця з цукерками
      R(ctx, x - 9, y - 8, 18, 2, 'b'); R(ctx, x - 9, y - 8, 18, 1, 'l');
      ['p', 'h', 'm', 'q'].forEach((c, k) => R(ctx, x - 7 + k * 4, y - 11 - ((k + ph) % 2), 3, 3, c));
      break;
    case 'baton':        // кийок охоронниці
      R(ctx, x + 9, y - 10, 2, 10, 'd'); R(ctx, x + 9, y - 10, 2, 2, 'h');
      break;
    case 'box':          // ящик

function hireOrUpgrade(i) {
  const lvl = state.team[i];
  if (!isTeamUnlocked(i) || lvl >= CONFIG.TEAM_MAX_LEVEL) return;
  const cost = teamCost(i, lvl + 1);
  if (!(state.coins >= cost)) return;
  state.coins -= cost;
  state.team[i] = lvl + 1;
  state.teamKnown[i] = 1;
  state.stats.teamMaxLevel = Math.max(state.stats.teamMaxLevel, lvl + 1);
  recalcIncome();
  const name = t('team_' + TEAM[i].id);

/* ---------- Покупці ---------- */
function customerTarget() {
  if (state.cps <= 0) return 1;
  return Math.min(CONFIG.MAX_CUSTOMERS, 2 + Math.floor(Math.log10(state.cps + 1) * 1.5));
}
function spawnCustomer() {
  const fromLeft = Math.random() < 0.5;
  const lane = rand(LAYOUT.lane.min, Math.max(LAYOUT.lane.min + 4, roadFloor()));
  const goesShopping = Math.random() < 0.7;
  const c = {
    type: CUSTOMER_TYPES[Math.floor(Math.random() * CUSTOMER_TYPES.length)],
    x: fromLeft ? worldL() - 14 : worldR() + 14,
    y: lane, lane,
    dir: fromLeft ? 1 : -1,
    speed: rand(16, 26),
    anim: rand(0, 2),
    mode: goesShopping ? 'toDoor' : 'pass',
    doorX: shop.x + shop.door.x + shop.door.w / 2 + rand(-4, 4),
    passTo: fromLeft ? worldR() + 16 : worldL() - 16,
    alpha: 1, t: 0, stay: 0,
    bag: null
  };
  customers.push(c);
}
function updateCustomers(dt) {
  customerTimer -= dt;
  if (customerTimer <= 0) {
    customerTimer = rand(1.2, 3.2);
    if (customers.length < customerTarget()) spawnCustomer();
  }
  for (let i = customers.length - 1; i >= 0; i--) {
    const c = customers[i];
    c.anim += dt;
    const step = c.speed * dt;
    switch (c.mode) {
      case 'pass':
        c.x += c.dir * step;
        if ((c.dir > 0 && c.x >= c.passTo) || (c.dir < 0 && c.x <= c.passTo)) customers.splice(i, 1);
        break;
      case 'toDoor': {
        const dx = c.doorX - c.x;
        if (Math.abs(dx) <= step) { c.x = c.doorX; c.mode = 'toEntrance'; }
        else { c.dir = Math.sign(dx); c.x += c.dir * step; }
        break;
      }
      case 'toEntrance':
        c.y -= step * 0.8;
        if (c.y <= LAYOUT.curbY + 5) { c.y = LAYOUT.curbY + 5; c.mode = 'entering'; c.t = 0; }
        break;
      case 'entering': {                                  // заходить у відчинені розсувні двері
        const dr = doorWorld();
        c.x += (dr.cx - c.x) * Math.min(1, dt * 4);
        c.y -= step * 0.8;
        if (c.y <= LAYOUT.curbY - 1) c.inside = true;
        if (c.y <= dr.baseY) { c.y = dr.baseY; c.mode = 'inside'; c.f = 0; c.esc = null; c.plan = planVisit(); c.dwell = 0; }
        break;
      }
      case 'inside': updateInside(c, dt); break;
      case 'exiting':
        c.y += step * 0.8;
        if (c.y >= LAYOUT.curbY + 1) c.inside = false;
        if (c.y >= c.lane) { c.y = c.lane; c.mode = 'pass'; c.alpha = 1; c.inside = false; }
        break;
    }
  }
  // автоматичні двері роз'їжджаються, коли хтось підходить або виходить
  if (shop && shop.door) {
    const dr = doorWorld();
    const want = customers.some(c => (c.mode === 'toEntrance' || c.mode === 'entering' || c.mode === 'exiting' || (c.mode === 'inside' && c.f === 0 && !c.esc)) &&
      Math.abs(c.x - dr.cx) < 34 && c.y > dr.baseY - 6 && c.y < LAYOUT.curbY + 14);
    shop.doorOpen = (shop.doorOpen || 0) + ((want ? 1 : 0) - (shop.doorOpen || 0)) * Math.min(1, dt * 7);
  }
}
// Де в світі двері магазину (центр) і підлога першого поверху
function doorWorld() { return { cx: shop.x + shop.door.x + shop.door.w / 2, baseY: shop.y + shop.floors[0].fy }; }
// План візиту: 1–3 зупинки біля стелажів (часто на верхніх поверхах), наприкінці — вихід через двері
function planVisit() {
  const F = shop.floors.length, stops = [], dr = doorWorld();
  const n = 1 + Math.floor(Math.random() * Math.min(3, F + 1));
  for (let i = 0; i < n; i++) {
    let f = Math.random() < 0.35 ? 0 : Math.floor(Math.random() * F);
    if (F > 1 && i === 0 && Math.random() < 0.6) f = 1 + Math.floor(Math.random() * (F - 1));
    const sh = shop.floors[f].shelves;
    stops.push({ f, x: shop.x + sh[Math.floor(Math.random() * sh.length)] + rand(-8, 8), t: rand(1.2, 3) });
  }
  stops.push({ f: 0, x: dr.cx + rand(-5, 5), exit: true });
  return stops;
}
// Рух усередині: до стелажа, на інший поверх ескалатором, до виходу
function updateInside(c, dt) {
  const step = c.speed * dt;
  if (c.esc) {                                                  // їде ескалатором
    const e = shop.escalators[c.esc.k], len = Math.hypot(e.run, e.rise);
    c.esc.u += c.esc.dir * (c.speed * 0.9 * dt) / len;
    c.moving = false;
    c.dir = c.esc.dir * (e.xHigh > e.xLow ? 1 : -1);
    if (c.esc.u >= 1) { c.f = e.hi; c.esc = null; c.x = shop.x + e.xHigh; c.y = shop.y + e.yHigh; return; }
    if (c.esc.u <= 0) { c.f = e.lo; c.esc = null; c.x = shop.x + e.xLow; c.y = shop.y + e.yLow; return; }
    c.x = shop.x + e.xLow + (e.xHigh - e.xLow) * c.esc.u;
    c.y = shop.y + e.yLow - e.rise * c.esc.u;
    return;
  }
  const stop = c.plan[0];
  c.y = shop.y + shop.floors[c.f].fy;
  if (!stop) { c.mode = 'exiting'; return; }
  if (c.f !== stop.f) {                                         // треба на інший поверх — іде до ескалатора
    const upDir = stop.f > c.f ? 1 : -1, e = shop.escalators[upDir > 0 ? c.f : c.f - 1];
    const ex = shop.x + (upDir > 0 ? e.xLow : e.xHigh), dx = ex - c.x;
    if (Math.abs(dx) <= step) { c.x = ex; c.esc = { k: e.k, dir: upDir, u: upDir > 0 ? 0 : 1 }; }
    else { c.x += Math.sign(dx) * step; c.dir = Math.sign(dx); c.moving = true; }
    return;
  }
  const dx = stop.x - c.x;
  if (Math.abs(dx) > step) { c.x += Math.sign(dx) * step; c.dir = Math.sign(dx); c.moving = true; return; }
  c.x = stop.x; c.moving = false;
  if (stop.exit) {                                              // виходить із покупками
    c.mode = 'exiting'; c.t = 0;
    c.bag = BAG_COLORS[Math.floor(Math.random() * BAG_COLORS.length)];
    c.dir = Math.random() < 0.5 ? 1 : -1;
    c.passTo = c.dir > 0 ? worldR() + 16 : worldL() - 16;
    return;
  }
  c.dwell += dt;
  if (c.dwell >= stop.t) { c.plan.shift(); c.dwell = 0; }
}
// Коли магазин перебудовується, усі, хто всередині, виходять надвір
function ejectInside() {
  if (!shop || !shop.door) return;
  const dr = doorWorld();
  customers.forEach(c => {
    if (!(c.inside || c.mode === 'inside' || c.mode === 'entering')) return;
    c.inside = false; c.mode = 'exiting'; c.x = dr.cx; c.y = LAYOUT.curbY + 2; c.alpha = 1; c.esc = null;
    c.bag = BAG_COLORS[Math.floor(Math.random() * BAG_COLORS.length)];
    c.dir = Math.random() < 0.5 ? 1 : -1;
    c.passTo = c.dir > 0 ? worldR() + 16 : worldL() - 16;
  });
}
function drawCustomer(c) {

}

function updateAnimations(dt) {
  // пружина: стискання → повернення з легким відскоком
  const steps = Math.max(1, Math.ceil(dt / 0.01));
  const h = dt / steps;
  for (let i = 0; i < steps; i++) {
    shopAnim.vel += (-420 * shopAnim.squash - 16 * shopAnim.vel) * h;
    shopAnim.squash += shopAnim.vel * h;
  }
  if (Math.abs(shopAnim.squash) < 0.001 && Math.abs(shopAnim.vel) < 0.01) { shopAnim.squash = 0; shopAnim.vel = 0; }

  // Капі кліпає
  if (capyAnim.blinkLeft > 0) {
    capyAnim.blinkLeft -= dt;
  } else {
    capyAnim.blinkIn -= dt;
    if (capyAnim.blinkIn <= 0) { capyAnim.blinkLeft = 0.14; capyAnim.blinkIn = rand(2.5, 5.5); }
  }

  // хмаринки пливуть
  clouds.forEach(c => {
    c.x += c.speed * dt;
    if (c.x > worldR() + 4) c.x = worldL() - 28;
  });

  if (build) updateBuild(dt);
  updateCustomers(dt);
  updateActors(dt);
  updateCameos(dt);
  updateGuests(dt);

  // монетки: політ, гравітація, зникання
  for (let i = fx.coins.length - 1; i >= 0; i--) {
    const p = fx.coins[i];
    p.age += dt;
    p.vy += 320 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.age >= p.life) fx.coins.splice(i, 1);
  }
  for (let i = fx.sparks.length - 1; i >= 0; i--) {
    const p = fx.sparks[i];
    p.age += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.age >= p.life) fx.sparks.splice(i, 1);
  }
  for (let i = fx.dust.length - 1; i >= 0; i--) {
    const p = fx.dust[i];
    p.age += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.age >= p.life) fx.dust.splice(i, 1);
  }
}

// «C#5» → частота в герцах
function noteFreq(name) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(name);
  if (!m) return 0;
  let n = NOTE_INDEX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  n += (Number(m[3]) + 1) * 12;               // номер MIDI
  return 440 * Math.pow(2, (n - 69) / 12);
}

// Розбирає мелодії з масивів нот у списки подій
function parseMusic() {
  Object.keys(MUSIC).forEach(id => {
    const def = MUSIC[id];
    const channels = def.channels.map(ch => {
      const text = Array.isArray(ch.pattern) ? ch.pattern.join(' ') : ch.pattern;
      let step = 0;
      const events = text.trim().split(/\s+/).map(tok => {
        const [name, len] = tok.split(':');
        const e = { step, len: parseInt(len, 10) || 1, tok: name };
        step += e.len;
        return e;
      });
      return { wave: ch.wave, vol: ch.vol, events, total: step };
    });
    const total = channels[0].total;
    channels.forEach(c => { if (c.total !== total) console.warn('Музика «' + id + '»: канал має ' + c.total + ' кроків замість ' + total); });
    MUSIC_PARSED[id] = { bpm: def.bpm, channels, total };
  });
}

/* ---------- Запуск і гучність ---------- */
// Браузери дозволяють звук лише після першого дотику — тому створюємо контекст у відповідь на жест
function initAudio() {
  if (audio.ctx) { resumeAudio(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const ac = new AC();
    audio.ctx = ac;
    const comp = ac.createDynamicsCompressor();
    audio.master = ac.createGain();
    audio.musicGain = ac.createGain();
    audio.sfxGain = ac.createGain();
    audio.musicGain.connect(audio.master);
    audio.sfxGain.connect(audio.master);
    audio.master.connect(comp);
    comp.connect(ac.destination);
    // білий шум для ударних (1 секунда, перевикористовується)
    const buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    audio.noiseBuf = buf;
    applyVolumes(true);
    audio.timer = setInterval(tickMusic, 40);
    resumeAudio();
    updateMusic();
  } catch (e) {
    audio.ctx = null;
  }
}
// «Будить» звук на телефонах: iPhone і Android засинають, поки не було дотику; resume() треба викликати прямо в обробнику дотику.
// Тихий порожній звук допомагає iOS остаточно «розблокувати» аудіо.
function unlockSilent() {
  try {
    const ac = audio.ctx, src = ac.createBufferSource();
    src.buffer = ac.createBuffer(1, 1, 22050);
    src.connect(ac.destination);
    src.start(0);
  } catch (e) { /* нічого */ }
}
function resumeAudio() {
  const ac = audio.ctx;
  if (!ac || document.hidden) return;
  if (ac.state !== 'running') {
    const p = ac.resume();
    if (p && p.then) p.then(unlockSilent, () => {});
  }
  unlockSilent();
}
function applyVolumes(instant) {
  if (!audio.ctx) return;
  const s = state.settings;
  const m = s.muted ? 0 : s.musicVol * 0.55, f = s.muted ? 0 : s.sfxVol * 0.9;
  const now = audio.ctx.currentTime;
  if (instant) { audio.musicGain.gain.value = m; audio.sfxGain.gain.value = f; return; }
  audio.musicGain.gain.setTargetAtTime(m, now, 0.05);
  audio.sfxGain.gain.setTargetAtTime(f, now, 0.05);
}

/* ---------- Інструменти ---------- */
// Одна нота з простою обвідною (щоб не клацало)
function tone(dest, wave, f0, t0, dur, vol, f1) {
  const ac = audio.ctx;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = wave;
  osc.frequency.setValueAtTime(f0, t0);
  if (f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.006);
  g.gain.setValueAtTime(vol, t0 + Math.max(0.007, dur * 0.65));
  g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(dest);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}
// Сплеск шуму крізь фільтр — ударні, плюскіт, цокіт молотка
function noiseHit(dest, t0, dur, vol, filterType, freq) {
  const ac = audio.ctx;
  const src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = audio.noiseBuf;
  flt.type = filterType; flt.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(flt); flt.connect(g); g.connect(dest);
  src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.02);
}
function drum(dest, kind, t0, vol) {
  if (kind === 'k') tone(dest, 'triangle', 150, t0, 0.13, vol * 1.6, 45);
  else if (kind === 's') noiseHit(dest, t0, 0.12, vol, 'bandpass', 1800);
  else if (kind === 'h') noiseHit(dest, t0, 0.05, vol * 0.7, 'highpass', 7000);
}

/* ---------- Музика ---------- */
function desiredTrack() {
  if (theme.holiday && theme.holiday.music && MUSIC[theme.holiday.music]) return theme.holiday.music;
  if (theme.season === 'halloween' && MUSIC.halloween) return 'halloween';
  const st = MUSIC_STYLES[state.settings.musicStyle] || MUSIC_STYLES[0];
  return st.levels[Math.min(st.levels.length, state.shopLevel) - 1] + '#' + (state.epoch % EPOCH_MUSIC.length);
}
// Перемикає мелодію плавно: стара стихає, нова наростає
function updateMusic() {
  if (!audio.ctx) return;
  const id = desiredTrack();
  if (audio.track && audio.track.id === id) return;
  const ac = audio.ctx, now = ac.currentTime;
  if (audio.track) {
    const old = audio.track;
    old.stopped = true;
    old.gain.gain.cancelScheduledValues(now);
    old.gain.gain.setTargetAtTime(0, now, 0.15);
    setTimeout(() => { try { old.gain.disconnect(); } catch (e) { /* нічого */ } }, 1600);
  }
  const gain = ac.createGain();
  gain.gain.value = 0;
  gain.gain.setTargetAtTime(1, now + 0.1, 0.25);
  gain.connect(audio.musicGain);
  const def = trackDef(id);
  audio.track = { id, def, gain, start: now + 0.15, pos: def.channels.map(() => ({ idx: 0, loop: 0 })), stopped: false };
}
// Планувальник: заздалегідь ставить у чергу ноти, що зазвучать найближчими 0,25 с
function tickMusic() {
  const ac = audio.ctx, tr = audio.track;
  if (!ac || !tr || tr.stopped || ac.state !== 'running') return;
  const stepDur = 60 / tr.def.bpm / 4;
  const horizon = ac.currentTime + 0.25;
  tr.def.channels.forEach((ch, c) => {
    const p = tr.pos[c];
    for (let guard = 0; guard < 64; guard++) {
      const ev = ch.events[p.idx];
      const t = tr.start + (p.loop * ch.total + ev.step) * stepDur;
      if (t > horizon) break;
      if (t > ac.currentTime - 0.05 && ev.tok !== '.') {
        if (ch.wave === 'noise') drum(tr.gain, ev.tok, t, ch.vol);
        else tone(tr.gain, ch.wave, noteFreq(ev.tok), t, ev.len * stepDur * 0.92, ch.vol);
      }
      p.idx++;
      if (p.idx >= ch.events.length) { p.idx = 0; p.loop++; }
    }
  });
}

/* ---------- Звукові ефекти ---------- */
// мелодія з пар [нота, тривалість]
function melody(wave, notes, vol, gap = 0) {
  const ac = audio.ctx;
  let t = ac.currentTime + 0.01;
  notes.forEach(([n, d]) => {
    if (n !== '.') tone(audio.sfxGain, wave, typeof n === 'number' ? n : noteFreq(n), t, d * 0.95, vol);
    t += d + gap;
  });
}
const SFX_TAP_VARIANTS = [['E6', 'B6'], ['G6', 'C7'], ['D6', 'A6'], ['F#6', 'C#7'], ['A5', 'E6']];

    melody('square', [[v[0], 0.04], [v[1], 0.07]], 0.22);

    melody('triangle', [['C4', 0.1], ['E4', 0.1], ['G4', 0.1], ['C5', 0.22], ['G4', 0.1], ['C5', 0.1], ['E5', 0.1], ['G5', 0.55]], 0.35);

  },

  hit() {

  },
  caught() {

    for (let i = 0; i < 6; i++) tone(audio.sfxGain, 'square', 1500 + i * 130, audio.ctx.currentTime + 0.5 + i * 0.05, 0.04, 0.12);
  },
  lose()      { melody('triangle', [['G4', 0.15], ['F4', 0.15], ['D#4', 0.15], ['C4', 0.45]], 0.5); },
  leak() {    // кап-кап

function playSfx(name, ...args) {
  const ac = audio.ctx;
  if (!ac || ac.state !== 'running' || state.settings.muted || state.settings.sfxVol <= 0) return;
  try { SFX[name](...args); } catch (e) { /* звук ніколи не має ламати гру */ }
}
// Висота «друкування» залежить від того, хто говорить
function speakerPitch(sp) {
  let h = 0;
  for (let i = 0; i < sp.length; i++) h += sp.charCodeAt(i);
  return sp === 'narr' ? 330 : 360 + (h % 7) * 55;
}

      for (let a = 0; a < 6.28; a += 0.12) R(g, Math.round(16 + Math.cos(a) * 15), Math.round(16 + Math.sin(a) * 5 + Math.cos(a) * 3), 1, 1, 'n');

      break;
    default:                                           // неонова блискавка в колі

/* ---------- Кристали і подорож ---------- */
// Кристали за подорож: floor(√(зароблено за цей забіг / X)), плюс бонус майстерні
function prestigeGain() {
  const run = Math.max(0, state.totalEarned - state.runStartEarned);
  return Math.floor(Math.sqrt(run / CONFIG.CRYSTAL_DIVISOR) * (1 + 0.1 * wsLevel('crystalGain')));
}
function startLevel() { return Math.min(LEVELS.length, 1 + wsLevel('headStart')); }

function askTimeTravel() {
  const gain = prestigeGain();
  if (!state.story.finale || gain < 1) return;
  askConfirm(t('warpConfirmTitle'), t('warpConfirmText', gain), t('warpConfirmYes'), startWarp);
}
function startWarp() {
  if (warp) return;
  warp = { t: 0, applied: false };
  ui.timeWarp.hidden = false;
  ui.timeWarp.style.opacity = '0';
  document.body.classList.add('warping');
  closeWheel();
  playSfx('warp');
}
function updateWarp(dt) {
  if (!warp) return;
  warp.t += dt;
  const k = warp.t / CONFIG.WARP_SECONDS;
  ui.timeWarp.style.opacity = String(k < 0.25 ? k / 0.25 : k < 0.75 ? 1 : Math.max(0, (1 - k) / 0.25));
  ui.warpClock.style.transform = 'rotate(' + (-k * 1260) + 'deg) scale(' + (1 + Math.sin(k * Math.PI) * 1.2) + ')';
  if (!warp.applied && k >= 0.5) { warp.applied = true; applyTimeTravel(); }
  if (k >= 1) {
    warp = null;
    ui.timeWarp.hidden = true;
    document.body.classList.remove('warping');
    // новий сюжетний фрагмент епохи
    const storyNo = ((state.epoch - 1) % EPOCHS.length) + 1, label = (state.epoch % EPOCHS.length) + 1;
    playEpochIntro(state.epoch, () => { if (!state.story.guests[storyNo - 1]) startDialogue(storyNo, false, 'ep', label); });      // історія — лише вперше, далі тільки заставка
  }
}
// Власне скидання: лишаються кристали, досягнення, статистика, прочитані глави й покращення майстерні
function applyTimeTravel() {
  const gain = prestigeGain();
  state.crystals += gain;
  state.crystalsTotal += gain;
  state.stats.timeTravels++;
  state.stats.maxLevel = Math.max(state.stats.maxLevel, state.shopLevel);
  state.epoch++;
  state.team.forEach((lv, i) => { if (lv > 0) state.teamKnown[i] = 1; });      // звірятка лишаються знайомими
  state.coins = CONFIG.START_COINS;
  state.depts = DEPARTMENTS.map(() => 0);
  state.team = TEAM.map(() => 0);
  state.shopLevel = startLevel();
  state.runStartEarned = state.totalEarned;
  state.events.incomeBoostUntil = 0; state.events.tapBoostUntil = 0;
  trouble = null; puddles.length = 0; sackDrop = null;
  build = null; ui.shopOverlay.style.visibility = '';
  actors.length = 0;
  customers.length = 0;
  recalcIncome();
  rebuildEpochLayers();
  resetEpochFx();
  rebuildShop(true);
  syncActors();
  syncGuests();
  layoutScene();
  updateMusic();
  updateUI();
  checkAchievements();
  saveGame();
}

// Код збереження: «CTT7:» + текст у base64 — його можна скопіювати на інший пристрій
function makeExportCode() {
  const json = JSON.stringify({ v: CONFIG.SAVE_VERSION, state });
  return 'CTT' + CONFIG.SAVE_VERSION + ':' + btoa(unescape(encodeURIComponent(json)));
}
function parseImportCode(text) {
  const m = /^CTT\d+:([A-Za-z0-9+/=]+)$/.exec(text.replace(/\s+/g, ''));
  if (!m) throw new Error('format');
  const data = migrateSave(JSON.parse(decodeURIComponent(escape(atob(m[1])))));
  if (!data.state || typeof data.state !== 'object') throw new Error('state');
  return data;
}
// Коротко про те, що лежить у збереженні (щоб перед перенесенням було видно, чи це справді твій прогрес)
function saveSummary(st) {
  const lvl = Math.max(1, Math.min(LEVELS.length, Math.floor(st.shopLevel || 1)));
  const depts = (st.depts || []).reduce((a, b) => a + (b || 0), 0);
  const team = (st.team || []).filter(v => v > 0).length;
  return t('saveSummary', t('levelName_' + lvl), fmt(depts), team, fmt(st.crystalsTotal || 0), fmt(Math.floor(st.totalEarned || 0)));
}
function showExport() {
  ui.exportBox.value = makeExportCode();
  ui.exportBox.select();
  ui.exportInfo.textContent = saveSummary(state);
}
function importSave() {
  let data;
  try { data = parseImportCode(ui.importBox.value); } catch (e) { showToast(t('importFail'), 'bad'); return; }
  askConfirm(t('importTitle'), t('importText') + '\n\n' + saveSummary(data.state), t('importYes'), () => {
    const fresh = createDefaultState();
    mergeInto(fresh, data.state);
    Object.assign(state, fresh);
    saveGame();
    if (!storageOk) { showToast(t('importNoStorage'), 'bad'); return; }
    savingDisabled = true;
    location.reload();
  });
}
function hardReset() {
  savingDisabled = true;

}

// Поточна тема сцени: яке свято зараз і які прикраси вмикати
const theme = { key: null, season: 'spring', layerSeason: null, holiday: null, blackFriday: false, decor: new Set(), skyTint: null, lights: ['r', 'y', 'g', 'n', 'p'] };
const snow = [];             // сніжинки
const bats = [];             // кажани
const puddles = [];          // калюжі від протікання даху
let trouble = null;          // неприємність, що триває: { type: 'leak' | 'thief', ... }
let sackDrop = null;         // мішок, який кинув Шнирь після поразки

let wheelAnim = null;        // обертання колеса: { t, dur, from, to }
let wheelAngle = 0;
let wheelTexture = null;
let wheelWasReady = null;

/* ---------- Свята ---------- */
function inRange(d, from, to) {
  const v = (d.getMonth() + 1) * 100 + d.getDate();
  const a = from[0] * 100 + from[1], b = to[0] * 100 + to[1];
  return a <= b ? (v >= a && v <= b) : (v >= a || v <= b);   // діапазон може перетинати новий рік
}
function isBlackFriday(d) { return d.getMonth() === 10 && d.getDay() === 5 && d.getDate() + 7 > 30; }
function forcedHoliday() {
  try { return new URLSearchParams(location.search).get('holiday'); } catch (e) { return null; }
}
// Оновлює тему за датою пристрою (або за ?holiday=...). Повертає true, якщо тема змінилась
function updateTheme() {
  const now = new Date(), forced = forcedHoliday();
  let holiday = null, bf = false;
  if (forced === 'blackfriday') bf = true;
  else if (forced) holiday = HOLIDAYS.find(h => h.id === forced) || null;
  else { holiday = HOLIDAYS.find(h => inRange(now, h.from, h.to)) || null; bf = isBlackFriday(now); }
  const season = seasonNow();
  const auto = state.settings.season === 'auto';
  const key = (holiday ? holiday.id : '') + '|' + bf + '|' + (state.epoch % EPOCHS.length) + '|' + season;
  if (theme.key === key) return false;
  theme.key = key;
  if (holiday) state.stats.holidaysSeen |= (1 << HOLIDAYS.indexOf(holiday));
  if (bf) state.stats.holidaysSeen |= 1 << 15;
  theme.holiday = holiday;
  theme.blackFriday = bf;
  // прикраси свята за датою малюємо лише в режимі «Авто»; якщо пору року обрано вручну — діють її прикраси
  const seasonDecor = { winter: ['snow'], halloween: ['pumpkins', 'bats', 'witchhats'], autumn: ['autumnleaves'], spring: ['petals'], summer: ['heat'] }[season] || [];
  theme.decor = new Set([...(auto && holiday ? holiday.decor : []), ...seasonDecor, ...(bf ? BLACK_FRIDAY.decor : [])]);
  theme.skyTint = bf ? BLACK_FRIDAY.skyTint : (auto && holiday && holiday.skyTint) || (season === 'halloween' ? { color: 'n', alpha: 0.5 } : currentEpoch().tint);
  theme.lights = bf ? BLACK_FRIDAY.lights : ((holiday && auto && holiday.lights) || (season === 'halloween' ? ['o', 'u'] : ['r', 'y', 'g', 'n', 'p']));
  theme.season = season;
  if (theme.layerSeason !== season) {
    theme.layerSeason = season;
    weather.target = 0; weather.timer = rand(12, 35);
    if (layoutReady) { groundLayer = buildGroundLayer(); seedClouds(); seedBirds(); seedBenches(); if (shop) rebuildShop(true); }
  }   // дерева, сніг на дахах, прикраси Хелловіну
  resetEpochFx();
  resetThemeFx();
  return true;
}
// Сніг і кажани розсипаються по всій ширині світу
function resetThemeFx() {
  snow.length = 0; bats.length = 0;
  const area = (view.w * view.h) / (320 * 180);
  if (theme.decor.has('snow') && animOn()) for (let i = 0; i < Math.round(CONFIG.SNOW_FLAKES * area); i++) snow.push({ x: rand(worldL(), worldR()), y: rand(-view.offY, worldB()), vy: rand(10, 26), ph: rand(0, 6.3), big: Math.random() < 0.25 });
  if (theme.decor.has('bats') && animOn()) for (let i = 0; i < Math.round(CONFIG.BATS * Math.max(1, view.w / 320)); i++) bats.push({ x: rand(worldL(), worldR()), y: rand(14 - view.offY, 70), vx: rand(14, 26) * (Math.random() < 0.5 ? -1 : 1), ph: rand(0, 6.3) });
}
function holidayGlobalBonus() { return theme.holiday && theme.holiday.bonus.global ? theme.holiday.bonus.global : 0; }
function holidayDeptBonus(i) { return (theme.holiday && theme.holiday.bonus.depts && theme.holiday.bonus.depts[i]) || 0; }
function secondsToMidnight() {
  const n = new Date();
  return Math.max(0, (new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1) - n) / 1000);
}
function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return h > 0 ? h + ':' + p(m) + ':' + p(s) : m + ':' + p(s);
}

/* ---------- Розпродажі ---------- */
function scheduleSale(now) { state.events.nextSale = now + rand(CONFIG.SALE_MIN_MINUTES, CONFIG.SALE_MAX_MINUTES) * 60000 * (1 - 0.1 * wsLevel('salesFreq')); }

/* ---------- Неприємності ---------- */
function scheduleTrouble(now) { state.events.nextTrouble = now + rand(CONFIG.TROUBLE_MIN_MINUTES, CONFIG.TROUBLE_MAX_MINUTES) * 60000; }
function startTrouble(now) {
  scheduleTrouble(now);
