// --- Протікання даху ---
function startLeak() {
  trouble = { type: 'leak', kriaTimer: 0 };
  puddles.length = 0;
  const minX = visL() + 24, maxX = visR() - 24;
  for (let tries = 0; puddles.length < CONFIG.LEAK_PUDDLES && tries < 100; tries++) {
    const p = { x: Math.round(rand(minX, maxX)), y: Math.round(rand(150, worldB() - 6)), age: rand(0, 3) };
    if (puddles.every(q => Math.abs(q.x - p.x) > 26 || Math.abs(q.y - p.y) > 9)) puddles.push(p);
  }
  recalcIncome();
  playSfx('leak');
  showToast(t('leakStart'), 'bad');
}
function removePuddle(i) {
  const p = puddles.splice(i, 1)[0];
  state.stats.puddlesFixed++;
  playSfx('splash');
  for (let k = 0; k < 6; k++) fx.sparks.push({ x: p.x, y: p.y, vx: rand(-40, 40), vy: rand(-60, -20), age: 0, life: rand(0.3, 0.5), col: k % 2 ? 's' : 'S' });
  if (!puddles.length) {
    trouble = null;
    recalcIncome();
    showToast(t('leakFixed'), 'good');
  }
  updateUI();
}

// --- Єнот Шнирь: міні-гра «Впіймай єнота» ---
function startRaccoon() {
  const minX = visL() + 24, maxX = visR() - 24;
  const side = Math.random() < 0.5 ? minX : maxX;
  trouble = { type: 'thief', state: 'run', t: 0, hits: 0, x: side, y: rand(148, worldB() - 8), vx: 0, vy: 0, dirT: 0, flash: 0, hop: 0, exitDir: 1 };
  showBubble('shnyr', t('shnyrSay_' + Math.floor(Math.random() * 3)), trouble.x, trouble.y - 19);
  playSfx('raccoon');
  showToast(t('raccoonStart'), 'bad');
}
function hitRaccoon() {
  const r = trouble;
  r.hits++; r.flash = 0.35; r.hop = 1;
  playSfx('hit');
  for (let k = 0; k < 6; k++) fx.sparks.push({ x: r.x, y: r.y - 8, vx: rand(-60, 60), vy: rand(-70, 10), age: 0, life: rand(0.25, 0.4), col: k % 2 ? 'y' : 'w' });
  showBubble('shnyr', t('shnyrOuch_' + Math.floor(Math.random() * 3)), r.x, r.y - 19);
  r.dirT = 0;     // одразу змінює напрям
  if (r.hits >= CONFIG.RACCOON_HITS) winRaccoon();
}
function winRaccoon() {
  const r = trouble;
  const reward = Math.floor(Math.max(tapValue() * 10, state.cps * CONFIG.RACCOON_REWARD_MINUTES * 60));
  state.coins += reward; state.totalEarned += reward;
  state.stats.raccoonsCaught++;
  for (let k = 0; k < 12; k++) fx.coins.push({ x: r.x + rand(-8, 8), y: r.y - 10, vx: rand(-60, 60), vy: rand(-140, -60), age: 0, life: rand(0.8, 1.2), spin: rand(0, 4) });
  sackDrop = { x: r.x + 6, y: r.y, t: 0 };
  r.state = 'exit'; r.exitDir = r.x < 160 ? -1 : 1; r.hasSack = false;
  playSfx('caught');
  showToast(t('raccoonWin', fmt(reward)), 'big');
  updateUI();
}
function loseRaccoon() {
  const r = trouble;
  const steal = state.story.shnyrFriend ? 0 : Math.floor(Math.min(state.coins * CONFIG.RACCOON_STEAL_SHARE * (1 - 0.2 * wsLevel('thiefLess')), state.cps * CONFIG.RACCOON_STEAL_MAX_MINUTES * 60));
  if (steal >= 1) {
    state.coins -= steal;
    state.stats.raccoonsLost++;
    playSfx('lose');
    showToast(t('raccoonLose', fmt(steal)), 'bad');
  } else {
    showToast(t('raccoonFriend'), 'good');
  }
  r.state = 'exit'; r.exitDir = r.x < 160 ? -1 : 1; r.hasSack = true;
  updateUI();
}
function updateTrouble(dt) {
  if (sackDrop) { sackDrop.t += dt; if (sackDrop.t > 3) sackDrop = null; }
  if (!trouble) return;
  puddles.forEach(p => { p.age += dt; });
  if (trouble.type === 'leak') {
    // Качка Кря сама прибирає калюжі
    if (teamLevelOf('kria') > 0 && puddles.length) {
      trouble.kriaTimer += dt;
      if (trouble.kriaTimer >= CONFIG.KRIA_CLEAN_SECONDS / fixSpeedMult()) {
        trouble.kriaTimer = 0;
        const a = actors.find(x => TEAM[x.i].id === 'kria');
        if (a) { a.hop = 1; showBubble('t' + a.i, t('kriaMop'), a.x, a.y - 19, () => ({ x: a.x, y: a.y - 19 })); }
        removePuddle(Math.floor(Math.random() * puddles.length));
      }
    }
    return;
  }
  const r = trouble;
  r.t += dt;
  r.flash = Math.max(0, r.flash - dt);
  r.hop = Math.max(0, r.hop - dt * 4);
  if (r.state === 'run') {
    r.dirT -= dt;
    if (r.dirT <= 0) {
      r.dirT = rand(0.5, 1.1);
      const a = rand(0, Math.PI * 2), sp = 55 + r.hits * 16;
      r.vx = Math.cos(a) * sp; r.vy = Math.sin(a) * sp * 0.5;
    }
    r.x += r.vx * dt; r.y += r.vy * dt;
    const minX = visL() + 14, maxX = visR() - 14;
    if (r.x < minX) { r.x = minX; r.vx = Math.abs(r.vx); }
    if (r.x > maxX) { r.x = maxX; r.vx = -Math.abs(r.vx); }
    if (r.y < 146) { r.y = 146; r.vy = Math.abs(r.vy); }
    if (r.y > worldB() - 6) { r.y = worldB() - 6; r.vy = -Math.abs(r.vy); }
    if (r.hits < CONFIG.RACCOON_HITS && r.t >= CONFIG.RACCOON_SECONDS) loseRaccoon();
  } else {   // тікає за межі екрана
    r.x += r.exitDir * 120 * dt;
    r.vx = r.exitDir * 120;
    if (r.x < worldL() - 24 || r.x > worldR() + 24) { trouble = null; }
  }
}
// Тап по калюжі чи єнотові; true — тап «з'їдено» і по магазину не рахується
function handleEventTap(p) {
  if (!trouble) return false;
  if (trouble.type === 'thief' && trouble.state === 'run') {
    if (Math.abs(p.x - trouble.x) <= 13 && p.y >= trouble.y - 20 && p.y <= trouble.y + 5) { hitRaccoon(); return true; }
  } else if (trouble.type === 'leak') {
    for (let i = 0; i < puddles.length; i++) {
      if (Math.abs(p.x - puddles[i].x) <= 13 && Math.abs(p.y - puddles[i].y) <= 9) { removePuddle(i); return true; }
    }
  }
  return false;
}

/* ---------- Малювання подій і прикрас ---------- */
function drawPuddle(p) {
  for (let dy = -3; dy <= 3; dy++) {
    const half = Math.round(10 * Math.sqrt(Math.max(0, 1 - Math.pow(dy / 3.6, 2))));
    R(ctx, p.x - half, p.y + dy, half * 2 + 1, 1, dy === -3 ? 'S' : 's');
  }
  R(ctx, p.x - 5, p.y - 1, 3, 1, 'S');
  const rr = Math.floor((p.age * 7) % 8);
  if (rr > 1) { R(ctx, p.x - rr, p.y, 1, 1, 'w'); R(ctx, p.x + rr, p.y, 1, 1, 'w'); }
  const dropPhase = (p.age * 34) % 30;                    // крапля з даху
  if (dropPhase < 24) R(ctx, p.x, Math.round(p.y - 28 + dropPhase), 1, 3, 'S');
}
function drawRaccoon() {
  const r = trouble;
  if (r.flash > 0 && Math.floor(r.flash * 20) % 2) return;

  const h = Math.sin((state.dayPhase - 0.25) * Math.PI * 2);      // висота сонця: 1 — полудень, −1 — північ
  const n = Math.max(0, Math.min(1, 0.3 - h * 1.5));
  sky.night = n * n * (3 - 2 * n);
  sky.dusk = Math.max(0, 1 - Math.abs(h - 0.05) / 0.3);          // сутінки: схід і захід
  sky.lamp = Math.max(0, Math.min(1, (sky.night - 0.25) / 0.4));  // ліхтарі вмикаються, коли вже темно
  sky.h = h;
}

/* ---------- Хелловін: привиди ---------- */
let ghostHunt = null;            // триває полювання: { t, dur, caught, total, ghosts }
let nextGhostAt = 0;             // коли почнеться наступне полювання (мс); 0 — ще не заплановано
const windowGhosts = [];         // привиди, що на мить блимають у вікнах будинків
let windowGhostTimer = 3;

function startGhostHunt() {
  const l = visL() + 16, r = visR() - 16;
  ghostHunt = { t: 0, dur: CONFIG.GHOST_SECONDS, caught: 0, total: CONFIG.GHOST_COUNT, ghosts: [] };
  for (let i = 0; i < CONFIG.GHOST_COUNT; i++) {
    ghostHunt.ghosts.push({ x: rand(l, r), y: rand(132, worldB() - 8), vx: rand(12, 26) * (Math.random() < 0.5 ? -1 : 1), ph: rand(0, 6.3), alive: true, born: i * 0.9 });
  }
  playSfx('raccoon');
  showToast(t('ghostStart'), 'big');
}
function endGhostHunt() {
  const h = ghostHunt;
  ghostHunt = null;
  nextGhostAt = Date.now() + rand(CONFIG.GHOST_HUNT_MIN_SECONDS, CONFIG.GHOST_HUNT_MAX_SECONDS) * 1000;
  showToast(h.caught ? t('ghostEnd', h.caught, state.ghosts) : t('ghostEndNone'), h.caught ? 'good' : 'bad');
  saveGame();
  updateUI();
}
function updateGhostHunt(dt) {
  // привиди, що блимають у вікнах (лише на Хелловін)
  if (theme.season !== 'halloween' || !houseGlass || !houseGlass.length || !animOn()) windowGhosts.length = 0;
  else {
    windowGhostTimer -= dt;
    if (windowGhostTimer <= 0) {
      windowGhostTimer = rand(2.5, 6);
      const seen = houseGlass.filter(r => r[0] > visL() && r[0] < visR());
      if (seen.length) { const r = seen[Math.floor(Math.random() * seen.length)]; windowGhosts.push({ x: r[0], y: r[1], t: 0, dur: rand(0.6, 1.1) }); }
    }
    for (let i = windowGhosts.length - 1; i >= 0; i--) { windowGhosts[i].t += dt; if (windowGhosts[i].t >= windowGhosts[i].dur) windowGhosts.splice(i, 1); }
  }
  if (!ghostHunt) return;
  const h = ghostHunt;
  h.t += dt;
  const l = visL() + 10, r = visR() - 10;
  h.ghosts.forEach(g => {
    if (!g.alive || h.t < g.born) return;
    g.x += g.vx * dt; g.ph += dt * 2.2;
    if (g.x < l) { g.x = l; g.vx = Math.abs(g.vx); } else if (g.x > r) { g.x = r; g.vx = -Math.abs(g.vx); }
  });
  if (h.t >= h.dur || h.ghosts.every(g => !g.alive)) endGhostHunt();
}
function ghostY(g) { return g.y + Math.sin(g.ph) * 6; }
// Тап по привидові: ловимо його (повертає true, якщо влучили)
function hitGhost(p) {
  if (!ghostHunt) return false;
  const h = ghostHunt;
  for (const g of h.ghosts) {
    if (!g.alive || h.t < g.born) continue;
    const gy = ghostY(g);
    if (Math.abs(p.x - g.x) <= 9 && p.y >= gy - 16 && p.y <= gy + 4) {
      g.alive = false;
      h.caught++;
      state.ghosts = Math.min(CONFIG.GHOST_MAX, state.ghosts + 1);
      state.stats.ghostsCaught++;
      for (let i = 0; i < 8; i++) { const a = rand(0, Math.PI * 2), sp = rand(30, 70); fx.sparks.push({ x: g.x, y: gy - 6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, age: 0, life: rand(0.3, 0.5), col: i % 2 ? 'w' : 'S' }); }
      spawnFloater(g.x, gy - 14, '+1');
      playSfx('upgrade');
      updateUI();
      return true;
    }
  }

}
function drawGhostHunt() {
  if (ghostHunt) {
    const h = ghostHunt, fade = Math.min(1, (h.dur - h.t) / 2);     // в кінці полювання привиди тануть
    h.ghosts.forEach(g => {

      const x = Math.round(g.x), y = Math.round(ghostY(g));

    ctx.globalAlpha = a; drawSprite(ctx, 'ghost_s', w.x, w.y);
  });
  ctx.globalAlpha = 1;
}

function updateMail(dt) {
  const now = Date.now(), ev = state.events;

  const quiet = !dialog.active && !epochIntro.active && !build && ui.modal.hidden && ui.wheelModal.hidden && ui.letterModal.hidden;
  if (mail.state === 'idle') {
    if (now >= ev.nextMail && quiet) {
      ev.nextMail = now + CONFIG.MAIL_MINUTES * 60000;

  } else if (mail.state === 'stopped') {
    if (mail.t > 3.2 && !ev.mailPending) { ev.mailPending = 1; saveGame(); playSfx('pip'); }
    if (mail.t > 4.2) { mail.state = 'leaving'; mail.t = 0; }
  } else if (mail.state === 'leaving') {

/* ---------- Колесо фортуни ---------- */
function wheelCooldownMs() { return (WHEEL_HOURS_BY_LEVEL[wsLevel('wheelFast')] || CONFIG.WHEEL_COOLDOWN_HOURS) * 3600000; }
function wheelReady(now = Date.now()) { return now - state.wheel.lastSpin >= wheelCooldownMs(); }
// Серія днів: якщо крутили менше ніж 48 годин тому — серія продовжується
function projectedStreak(now = Date.now()) {
  return (state.wheel.lastSpin && now - state.wheel.lastSpin < Math.max(wheelCooldownMs() * 2, CONFIG.WHEEL_COOLDOWN_HOURS * 2 * 3600000)) ? state.wheel.streak + 1 : 1;
}
function streakMult(streak) { return 1 + CONFIG.WHEEL_STREAK_STEP * (Math.min(streak, CONFIG.WHEEL_STREAK_MAX_DAYS) - 1); }

// Маленькі піксельні значки на секторах
function drawWheelIcon(g, kind, cx, cy) {
  const cc = EPOCH_COIN_COLORS[state.epoch % EPOCH_COIN_COLORS.length];
  const coin = (x, y) => { disc(g, x, y, 4, 'd'); disc(g, x, y, 3, cc[0]); R(g, x - 1, y - 2, 2, 1, cc[1]); };
  switch (kind) {
    case 'gem': { const rows = SPRITES[gemSprite()].rows; rows.forEach((row, ry) => { for (let rx = 0; rx < 8; rx++) if (row[rx] !== '.') R(g, cx - 4 + rx, cy - 4 + ry, 1, 1, row[rx]); }); break; }
    case 'coin1': coin(cx, cy); break;
    case 'coin2': coin(cx - 4, cy + 2); coin(cx + 4, cy - 2); break;
    case 'coin3': coin(cx - 5, cy + 3); coin(cx + 5, cy + 3); coin(cx, cy - 3); break;
    case 'up':
      for (let i = 0; i < 6; i++) { R(g, cx - i - 1, cy - 7 + i, 2 * i + 3, 1, 'd'); R(g, cx - i, cy - 7 + i, 2 * i + 1, 1, 'w'); }
      R(g, cx - 3, cy - 1, 7, 8, 'd'); R(g, cx - 2, cy - 1, 5, 7, 'w'); break;
    case 'tap':
      for (let i = 0; i < 9; i++) { R(g, cx - 4, cy - 7 + i, Math.min(i + 2, 7), 1, 'd'); R(g, cx - 3, cy - 7 + i, Math.max(1, Math.min(i, 5)), 1, 'w'); }
      R(g, cx - 1, cy + 1, 3, 7, 'd'); R(g, cx, cy + 1, 1, 6, 'w'); break;
    case 'star': {
      const star = ['.....y.....', '....yyy....', '....yyy....', 'yyyyyyyyyyy', '.yyyyyyyyy.', '..yyyyyyy..', '..yyyyyyy..', '.yyyy.yyyy.', '.yyy...yyy.', 'yy.......yy'];
      const draw = (ox, oy, col) => star.forEach((row, ry) => { for (let rx = 0; rx < row.length; rx++) if (row[rx] === 'y') R(g, cx - 5 + rx + ox, cy - 5 + ry + oy, 1, 1, col); });
      [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([ox, oy]) => draw(ox, oy, 'd'));   // контур
      draw(0, 0, 'w'); draw(0, 1, 'h');
      break;
    }
  }
}
function buildWheelTexture() {
  const S = 128, c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');
  const cx = 64, cy = 64, step = Math.PI / 4;
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy, r = Math.sqrt(dx * dx + dy * dy);
      if (r > 62) continue;
      let col;
      if (r >= 59) col = 'd';
      else if (r < 9) col = r >= 7 ? 'd' : 'h';
      else {
        let a = Math.atan2(dx, -dy); if (a < 0) a += Math.PI * 2;
        const sec = Math.floor(a / step), frac = a / step - sec;
        const edge = Math.min(frac, 1 - frac) * step * r;
        col = edge < 0.9 ? 'd' : (r >= 55.5 && r < 57 ? ((Math.floor(a / step * 3) % 2) ? 'w' : 'y') : WHEEL_SECTORS[sec].color);
      }
      R(g, x, y, 1, 1, col);
    }
  }
  WHEEL_SECTORS.forEach((s, i) => {
    const a = (i + 0.5) * step;
    drawWheelIcon(g, s.icon, Math.round(cx + Math.sin(a) * 36), Math.round(cy - Math.cos(a) * 36));
  });

}
function drawWheel() {
  const g = ui.wheelCanvas.getContext('2d');

  g.clearRect(0, 0, 128, 140);
  g.save();
  g.translate(64, 76);
  g.rotate(wheelAngle);
  g.drawImage(wheelTexture, -64, -64);
  g.restore();
  // стрілка-вказівник зверху
  for (let i = 0; i < 12; i++) { R(g, 64 - (12 - i) , 2 + i, (12 - i) * 2, 1, 'd'); if (i > 1) R(g, 64 - (12 - i) + 2, 2 + i, (12 - i) * 2 - 4, 1, 'r'); }
}
function updateWheelUI() {

function openWheel() {

function spinWheel(extra) {
  const now = Date.now();

  if (extra) { if (state.ghosts < CONFIG.GHOST_RESPIN_COST) return; state.ghosts -= CONFIG.GHOST_RESPIN_COST; }   // додатковий оберт за кристали привидів
  else if (!wheelReady(now)) return;

  for (; idx < WHEEL_SECTORS.length - 1; idx++) { roll -= weight(WHEEL_SECTORS[idx]); if (roll < 0) break; }
  const s = WHEEL_SECTORS[idx];
  if (!extra) { state.wheel.streak = projectedStreak(now); state.wheel.lastSpin = now; }   // додатковий оберт не чіпає чергу й серію днів

  let text;
  if (s.kind === 'coins' || s.kind === 'jackpot') {
    const gain = Math.floor((state.cps * s.seconds + s.flat * levelMult()) * mult);
    state.coins += gain; state.totalEarned += gain;
    text = t(s.kind === 'jackpot' ? 'prize_jackpot' : 'prize_coins', fmt(gain));
    if (s.kind === 'jackpot') state.stats.jackpots++;
  } else if (s.kind === 'crystal') {
    const gem = Math.max(1, Math.floor(mult));
    state.crystals += gem; state.crystalsTotal += gem;
    text = t('prize_crystal', gem);
  } else if (s.kind === 'income') {
    state.events.incomeBoostUntil = now + s.minutes * 60000; state.events.incomeBoostMult = s.mult;
    text = t('prize_income', s.mult, s.minutes);
  } else {
    state.events.tapBoostUntil = now + s.minutes * 60000; state.events.tapBoostMult = s.mult;
    text = t('prize_tap', s.mult, s.minutes);
  }

  const step = Math.PI / 4;
  const jitter = rand(-0.35, 0.35) * step;
  const from = wheelAngle % (Math.PI * 2);
  const to = Math.PI * 2 * 5 + (Math.PI * 2 - (idx + 0.5) * step) + jitter;
  wheelAnim = { t: 0, dur: CONFIG.WHEEL_SPIN_SECONDS, from, to, text, jackpot: s.kind === 'jackpot' };

  updateUI();

}
function updateWheel(dt) {

  if (Math.floor(wheelAngle / (Math.PI / 4)) !== prevSector && performance.now() - audio.lastTick > 40) { audio.lastTick = performance.now(); playSfx('wheelTick'); }
  if (!ui.wheelModal.hidden) drawWheel();

/* ---------- Головний цикл подій ---------- */
function updateEvents(dt) {
  updateWheel(dt);
  updateTrouble(dt);
  updateGhostHunt(dt);
  updateWeather(dt);
  updateMail(dt);
  updateBirds(dt);
  updateEpochFeatures(dt);
  updateShootingStar(dt);
  updateDecorFx(dt);
  updateEpochFx(dt);
  eventTimer -= dt;
  if (eventTimer > 0) return;
  eventTimer = 0.25;
  const now = Date.now();
  let changed = false;
  if (updateTheme()) changed = true;
  updateMusic();
  // зміна активних бустів → перерахунок доходу
  const sig = [state.events.saleUntil > now, state.events.incomeBoostUntil > now, state.events.tapBoostUntil > now].join();
  if (sig !== uiCache.eventSig) { uiCache.eventSig = sig; changed = true; }
  if (changed) recalcIncome();
  if (!theme.blackFriday && now >= state.events.nextSale) startSale(now);
  const quiet = !trouble && !ghostHunt && !dialog.active && !epochIntro.active && !build && ui.modal.hidden && ui.wheelModal.hidden;
  if (theme.season !== 'halloween') nextGhostAt = 0;
  else if (quiet && state.story.done >= 2) {          // на Хелловін раз на кілька хвилин вилітають привиди
    if (!nextGhostAt) nextGhostAt = now + rand(25, 50) * 1000;
    else if (now >= nextGhostAt) startGhostHunt();
  }
  if (quiet && state.story.done >= 3 && now >= state.events.nextTrouble) startTrouble(now);
  // колесо стало готовим
  const ready = wheelReady(now);
  if (wheelWasReady === false && ready) showToast(t('wheelReady'), 'big');
  wheelWasReady = ready;
  ui.wheelOpen.classList.toggle('ready', ready);
  updateBoostsUI();
  updateBanner();
  updateWheelUI();
  achTimer += 0.25;
  if (achTimer >= 1) { achTimer = 0; checkAchievements(); }
}

}

// Запускає главу n (kind 'ch'), фрагмент епохи (kind 'ep') або туторіал (kind 'tut').
// replay — перечитування з вкладки «Історія» (без наслідків для гри); labelNo — номер, що пишеться в заголовку
function startDialogue(n, replay = false, kind = 'ch', labelNo = n) {
  const def = kind === 'ch' ? CHAPTERS[n - 1] : kind === 'ep' ? EPOCH_STORIES[n - 1] : TUTORIAL;
  if (!def || dialog.active) return;
  dialog.active = true;
  dialog.kind = kind;
  dialog.chapter = n;
  dialog.labelNo = labelNo;
  dialog.replay = replay;
  dialog.page = 0;
  const prefix = kind === 'tut' ? 'tut' + n : kind + n;
  dialog.choosing = false;
  if (kind === 'ep') {
    // історія епохи: вступ → вибір Капі (жарт чи серйозно) → відповідь → завершення. При перечитуванні вибір береться зі збереженого
    const stored = replay ? state.story.choices[n - 1] : 0;
    dialog.pages = [{ speaker: 'title' }, ...def.pre.map((sp, k) => ({ speaker: sp, key: 'ep' + n + '_' + k })),
      ...(stored > 0 ? choicePages(n, def, stored) : [{ speaker: 'capy', choice: true }]),
      ...def.post.map((sp, j) => ({ speaker: sp, key: 'ep' + n + '_' + (def.pre.length + j) }))];
  } else dialog.pages = [...(kind === 'tut' ? [] : [{ speaker: 'title' }]), ...def.lines.map((sp, k) => ({ speaker: sp, key: prefix + '_' + k }))];
  ui.dlgSkip.textContent = t('storySkip');
  ui.dialog.hidden = false;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  showDialogPage();
}

// Тап / клік: показати весь текст одразу, а якщо він уже повний — перейти далі
function advanceDialog() {
  if (!dialog.active || dialog.choosing) return;
  if (dialog.shown < dialog.text.length) { dialog.shown = dialog.text.length; renderDialogText(); return; }
  dialog.page++;
  if (dialog.page >= dialog.pages.length) endDialogue(); else showDialogPage();
}

function endDialogue() {
  if (!dialog.active) return;
  const n = dialog.chapter, replay = dialog.replay, kind = dialog.kind;
  dialog.active = false;
  dialog.choosing = false;
  ui.dlgChoices.hidden = true;
  ui.dialog.hidden = true;
  if (replay) return;
  if (kind === 'tut') { state.tutorialDone = true; storyTimer = 1; saveGame(); return; }
  if (kind === 'ep') {
    const st = state.story;
    if (!st.guests[n - 1]) { st.guests[n - 1] = Math.max(...st.guests) + 1; syncGuests(n - 1); }       // гість лишається жити в місті
    if (n === 7 && !st.shnyrJoined) { st.shnyrJoined = true; showToast(t('shnyrJoined'), 'big'); }   // у Неоновій епосі Шнирь стає другом і працівником
    storyTimer = 1; updateUI(); saveGame(); return;
  }
  state.story.done = Math.max(state.story.done, n);
  if (n === 3) spawnCameo('npc_shnyr');          // Шнирь тікає з печивом
  if (n === 6) state.story.shnyrFriend = true;
  if (n === 8) state.story.finale = true;         // відкриває подорож у часі (етап 7)
  storyTimer = 1.5;
  updateUI();
  saveGame();
}

// «Друкарська машинка»
function updateDialog(dt) {
  if (!dialog.active || dialog.shown >= dialog.text.length) return;
  const before = Math.floor(dialog.shown);
  dialog.shown = Math.min(dialog.text.length, dialog.shown + dt * CONFIG.DIALOG_CHARS_PER_SEC);
  const after = Math.floor(dialog.shown);
  if (after > before && dialog.text[after - 1] && dialog.text[after - 1].trim() && after % 2 === 0) playSfx('typing', speakerPitch(dialog.pages[dialog.page].speaker));
  renderDialogText();
}

// Мова змінилась посеред діалогу — оновлюємо поточну репліку
function refreshDialogLanguage() {
  if (!dialog.active) return;
  const ratio = dialog.text.length ? dialog.shown / dialog.text.length : 0;
  const p = dialog.pages[dialog.page];
  dialog.text = p.choice ? t('choiceTitle') : pageText(p);
  dialog.shown = ratio >= 1 || p.choice ? dialog.text.length : Math.floor(ratio * dialog.text.length);
  if (p.choice) buildChoiceButtons();
  ui.dlgName.textContent = speakerName(p.speaker);
  ui.dlgSkip.textContent = t('storySkip');
  renderDialogText();
}

// Чи настав час для наступної глави
// Лічильник ночей після торгового центру: на третю ніч годинник «оживає» (глава 8)
let nightAcc = 0;
function countNights(dt, prevPhase) {
  if (state.shopLevel < 6 || state.story.done < 7 || state.story.nights >= 3) return;
  let passed = false;
  if (dayNightOn()) { const p = state.dayPhase; passed = prevPhase < 0.72 && p >= 0.72; }          // настає вечір
  else { nightAcc += dt; if (nightAcc >= CONFIG.DAY_SECONDS) { nightAcc = 0; passed = true; } }    // без зміни дня й ночі — раз на 5 хвилин
  if (!passed) return;
  state.story.nights++;
  if (state.story.nights < 3) showToast(t('nightHint_' + state.story.nights), 'big');
  saveGame();
}
function checkStory(dt) {
  storyTimer -= dt;
  if (storyTimer > 0) return;
  storyTimer = CONFIG.STORY_CHECK_SECONDS;
  if (dialog.active || build || !ui.modal.hidden || warp || epochIntro.active) return;
  if (state.epochIntroSeen < state.epoch) { playEpochIntro(state.epoch); return; }               // нова епоха: спершу заставка
  if (state.story.done >= 1 && !state.tutorialDone) { startDialogue(1, false, 'tut'); return; }   // коротке навчання після першої глави
  if (state.story.done >= 4 && state.tutorialDone && !state.story.guests[8]) { startDialogue(9, false, 'ep', 1); return; }       // гість першої епохи
  const next = state.story.done;
  if (next >= CHAPTERS.length) return;
  if (triggerMet(CHAPTERS[next].trigger, state)) startDialogue(next + 1);
}

// Вкладка «Історія»: відкриті глави з кнопкою «Читати»
function updateStoryUI() {
  if (ui.paneStory.hidden) return;
  const sig = state.story.done + '|' + state.lang + '|' + state.stats.timeTravels + '|' + state.story.guests[8];
  if (uiCache.storySig === sig) return;
  uiCache.storySig = sig;
  ui.storyList.innerHTML = '';
  for (let n = 1; n <= state.story.done; n++) {
    const card = document.createElement('div');
    card.className = 'card chapter-card';
    const num = document.createElement('div'); num.className = 'num'; num.textContent = n;
    const title = document.createElement('div'); title.className = 'title'; title.textContent = t('ch' + n + '_title');
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn'; btn.textContent = t('storyRead');
    btn.addEventListener('click', () => startDialogue(n, true));
    card.append(num, title, btn);
    ui.storyList.appendChild(card);
  }
  // фрагменти епох (відкриваються подорожами в часі)
  const epEntries = [];
  if (state.story.guests[8] > 0) epEntries.push(9);                                   // історія першої епохи (П'єтро)
  for (let k = 1; k <= Math.min(EPOCHS.length, state.stats.timeTravels); k++) epEntries.push(k);
  for (const k of epEntries) {
    const label = k === 9 ? 1 : (k % EPOCHS.length) + 1;
    const card = document.createElement('div');
    card.className = 'card chapter-card';
    const num = document.createElement('div'); num.className = 'num'; num.textContent = '⏳';
    const title = document.createElement('div'); title.className = 'title'; title.textContent = t('epochLabel', label) + ': ' + t('ep' + k + '_title');
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn'; btn.textContent = t('storyRead');
    btn.addEventListener('click', () => startDialogue(k, true, 'ep', label));
    card.append(num, title, btn);
    ui.storyList.appendChild(card);
  }
  if (state.story.done < CHAPTERS.length) {
    const lock = document.createElement('div');
    lock.className = 'card dept locked';
    lock.textContent = t('storyLocked');
    ui.storyList.appendChild(lock);
  }
}

/* ---------- Гості епох: після історії лишаються ходити містом ---------- */
const guestWalkers = [];
const GUESTS_MAX = 4;             // скільки гостей одночасно гуляє (найновіші)
// Узгоджує гостей на вулиці зі збереженням; arrive — номер гостя, що тільки-но прийшов (заходить зліва)
function syncGuests(arrive) {
  const met = state.story.guests.map((o, k) => [o, k]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, GUESTS_MAX).map(x => x[1]);
  for (let i = guestWalkers.length - 1; i >= 0; i--) if (!met.includes(guestWalkers[i].k)) guestWalkers.splice(i, 1);
  met.forEach(k => {
    if (guestWalkers.some(g => g.k === k)) return;
    guestWalkers.push({ k, id: GUEST_IDS[k], x: arrive === k ? worldL() - 12 : rand(worldL() + 20, worldR() - 20), y: rand(LAYOUT.streetTop + 10, roadFloor()),
      dir: 1, t: rand(0, 10), mode: 'idle', wait: rand(0.3, 2), speed: rand(12, 20), moving: false, tx: 0, ty: 0, sayIn: rand(15, 40) });
  });
}
function updateGuests(dt) {
  guestWalkers.forEach(g => {
    g.t += dt;
    g.y = Math.min(g.y, roadFloor());
    if (g.mode === 'idle') {
      g.moving = false; g.wait -= dt;
      if (g.wait <= 0) { g.tx = Math.max(worldL() + 14, Math.min(worldR() - 14, g.x + rand(-90, 90))); g.ty = rand(LAYOUT.streetTop + 8, roadFloor()); g.speed = rand(12, 20); g.mode = 'walk'; }
    } else {
      const dx = g.tx - g.x, dy = g.ty - g.y, d = Math.hypot(dx, dy), step = g.speed * dt;
      if (d <= step) { g.x = g.tx; g.y = g.ty; g.mode = 'idle'; g.wait = rand(1, 5); g.moving = false; }
      else { g.x += dx / d * step; g.y += dy / d * step; g.moving = true; if (Math.abs(dx) > 0.5) g.dir = dx > 0 ? 1 : -1; }
    }
    g.sayIn -= dt;
    if (g.sayIn <= 0) { g.sayIn = rand(35, 70); if (Object.keys(bubbleEls).length < 1 && animOn()) guestSay(g); }
  });
}
function guestSay(g) {
  showBubble('g' + g.k, t('guestSay_' + g.id + '_' + Math.floor(Math.random() * 3)), g.x, g.y - 19, () => ({ x: g.x, y: g.y - 19 }));
}
function hitGuest(p) {
  let best = null;
  guestWalkers.forEach(g => { if (Math.abs(p.x - g.x) <= 10 && p.y >= g.y - 19 && p.y <= g.y + 3 && (!best || g.y > best.y)) best = g; });
  return best;
}
function drawGuest(g) {
  const x = Math.round(g.x), y = Math.round(g.y), step = g.moving ? Math.floor(g.t * 5) % 2 : 0;
  ctx.globalAlpha = 0.22; R(ctx, x - 6, y, 12, 2, 'd'); ctx.globalAlpha = 1;
  drawSprite(ctx, 'npc_' + g.id, x - 8, y - 16 - step, { flip: step === 1 });
  if (hasHats()) drawHat(x, y - 13 - step, 20 + g.k);
  if (hasScarves()) drawScarf(x, y - 16 - step, g.k);
}

/* ---------- Камео: гість пробігає вулицею ---------- */
function spawnCameo(sprite) {
  cameos.push({ sprite, x: worldL() - 12, y: 168, vx: 62, t: 0 });
}
function updateCameos(dt) {
  for (let i = cameos.length - 1; i >= 0; i--) {
    const c = cameos[i];
    c.t += dt;
    c.x += c.vx * dt;
    if (c.x > worldR() + 16) cameos.splice(i, 1);
  }
}
function drawCameo(c) {
  const step = Math.floor(c.t * 8) % 2;
  const x = Math.round(c.x), y = c.y;
  ctx.globalAlpha = 0.22; R(ctx, x - 6, y, 12, 2, 'd'); ctx.globalAlpha = 1;
  drawSprite(ctx, c.sprite, x - 8, y - 16 - step, { flip: step === 1 });
  R(ctx, x + 6, y - 9 - step, 4, 4, 'c'); R(ctx, x + 7, y - 8 - step, 1, 1, 'd'); R(ctx, x + 8, y - 7 - step, 1, 1, 'd');   // печиво
}

/* =====================================================================
   ТАП ПО МАГАЗИНУ
   ===================================================================== */

function doTap(x, y) {
  const gain = tapValue();
  state.coins += gain;
  state.totalEarned += gain;
  state.taps += 1;
  if (animOn()) shopAnim.vel = 7;        // поштовх пружині — магазин сплющується
  playSfx('tap');
  spawnTapEffects(x, y);
  spawnFloater(x + rand(-8, 8), y - 6, '+' + fmt(gain, 1));
  updateUI();
}

// Координати події → координати сцени («ядро» 320×180; ліворуч від нього x < 0, над ним y < 0)
function toScenePoint(clientX, clientY) {
  const r = ui.world.getBoundingClientRect();
  return { x: (clientX - r.left) / r.width * view.w - view.offX, y: (clientY - r.top) / r.height * view.h - view.offY };
}

function hitShop(p) {
  const pad = 4;
  return p.x >= shop.x - pad && p.x <= shop.x + shop.w + pad && p.y >= shop.y - pad && p.y <= shop.y + shop.h + pad;
}

function setupInput() {
  const sceneTap = e => {
    if (ui.app.classList.contains('sheet-open')) setSheet(false);          // телефон: дотик до гри ховає меню
    const p = toScenePoint(e.clientX, e.clientY);
    if (handleEventTap(p)) return;              // калюжа або єнот
    if (hitGhost(p)) return;                    // привид (Хелловін)
    if (hitMail(p)) return;                     // конверт біля поштової скриньки
    const actor = hitActor(p);                  // звірятка стоять попереду магазину — тап по ним каже фразу
    if (actor) { actor.hop = 1; actorSay(actor); if (hitShop(p)) doTap(p.x, p.y); return; }   // і тап по магазину теж рахується
    const guest = hitGuest(p);                  // гість епохи теж щось каже
    if (guest) { guestSay(guest); if (hitShop(p)) doTap(p.x, p.y); return; }
    if (hitCapy(p)) { capySay(); if (hitShop(p)) doTap(p.x, p.y); return; }
    if (hitShop(p)) doTap(p.x, p.y);
  };
  // На телефоні вулицю можна гортати пальцем: тап рахується при відпусканні, якщо палець не рушав
  const drags = new Map();
  ui.scene.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (!ui.scene.classList.contains('pannable')) { sceneTap(e); return; }
    drags.set(e.pointerId, { x: e.clientX, pan: cam.pan, moved: false });
    try { ui.scene.setPointerCapture(e.pointerId); } catch (err) { /* нічого */ }
  });
  ui.scene.addEventListener('pointermove', e => {
    const d = drags.get(e.pointerId);
    if (!d) return;
    const dx = e.clientX - d.x;
    if (!d.moved && Math.abs(dx) > 9) d.moved = true;
    if (d.moved) { cam.pan = d.pan - dx / sceneUnit; applyCamera(); }
  });
  const endDrag = (e, cancelled) => {
    const d = drags.get(e.pointerId);
    if (!d) return;
    drags.delete(e.pointerId);
    if (!d.moved && !cancelled) sceneTap(e);
  };
  ui.scene.addEventListener('pointerup', e => endDrag(e, false));
  ui.scene.addEventListener('pointercancel', e => endDrag(e, true));
  ui.panelToggle.addEventListener('click', () => { state.settings.panelOpen = !state.settings.panelOpen; applyPanel(); saveGame(); });
  // з клавіатури: Enter або пробіл тапають по магазину
  ui.scene.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) {
      e.preventDefault();
      doTap(shop.x + shop.w / 2 + rand(-12, 12), shop.y + shop.h * 0.55);
    }
  });
  ui.scene.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());   // без pinch-зуму в Safari
  // діалог: клік/тап — далі; Enter, пробіл, → теж; кнопка «Пропустити главу»
  ui.dialog.addEventListener('click', advanceDialog);
  ui.dlgSkip.addEventListener('click', e => { e.stopPropagation(); endDialogue(); });
  ui.epochIntro.addEventListener('click', () => { if (epochIntro.active && performance.now() - epochIntro.startedAt > 1500) { epochIntro.timers.forEach(clearTimeout); epochIntro.timers = []; ui.epochIntro.classList.add('out'); epochIntro.timers.push(setTimeout(finishEpochIntro, 600)); } });
  document.addEventListener('keydown', e => {
    if (!dialog.active || e.target === ui.dlgSkip) return;
    if (dialog.choosing && (e.key === '1' || e.key === '2')) { chooseOption(+e.key); return; }
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); advanceDialog(); }
  });
  ui.expandBtn.addEventListener('click', expandShop);
  ui.modalBtn.addEventListener('click', claimOffline);
}

   МАЛЮВАННЯ КАДРУ

function render(time) {
  drawSkyScreen(time);
  ctx.save();
  ctx.translate(view.offX, view.offY);          // далі все малюється в координатах «ядра» сцени
  drawEpochBack();
  drawDecorBack();
  clouds.forEach(c => drawSprite(ctx, 'cloud', c.x, c.y, { variant: c.v, sx: c.big ? 1.8 : 1, sy: c.big ? 1.4 : 1 }));
  drawBirds();
  drawEpochSky(time);
  ctx.drawImage(groundLayer, -view.offX, -view.offY);
  drawDecorDusk();
  ctx.drawImage(propsLayer, -view.offX, -view.offY);
  drawEpochMid(time);

  // магазин: тінь + спрайт зі стисканням (або будівництво)
  ctx.globalAlpha = 0.22; R(ctx, shop.x - 2, LAYOUT.curbY + 1, shop.w + 4, 3, 'd'); ctx.globalAlpha = 1;
  if (build) {
    renderBuild();
  } else {
    const sc = getShopScale();
    drawShopLayered(sc);
    // вивіска слідує за стисканням
    ui.shopOverlay.style.transform = (sc.sx === 1 && sc.sy === 1) ? 'none' : 'scale(' + sc.sx + ',' + sc.sy + ')';
  }

  drawDecorGround();
  puddles.forEach(drawPuddle);
  if (sackDrop) drawSackDrop();

  // Капі та покупці — від дальніх до ближніх (за положенням ніг)
  const cp = LAYOUT.capy;
  const items = customers.filter(c => !c.inside).map(c => ({ y: c.y, draw: () => drawCustomer(c) }));       // ті, хто всередині, малюються разом з магазином
  actors.forEach(a => items.push({ y: a.y, draw: () => drawActor(a) }));
  cameos.forEach(c => items.push({ y: c.y, draw: () => drawCameo(c) }));
  guestWalkers.forEach(g => items.push({ y: g.y, draw: () => drawGuest(g) }));
  if (trouble && trouble.type === 'thief') items.push({ y: trouble.y, draw: drawRaccoon });
  benches.forEach(b => { items.push({ y: b.y - 6, draw: () => drawBenchBack(b) }); items.push({ y: b.y - 1, draw: () => drawBenchFront(b) }); });
  if (view.extraB >= 30 || state.events.mailPending || mail.state !== 'idle') items.push({ y: mailRoadY() - 1, draw: drawMailBox });
  if (mail.state !== 'idle') items.push({ y: mailRoadY(), draw: drawMailTruck });
  items.push({
    y: cp.footY,
    draw: () => {
      const breath = (Math.sin(time * 2.2) + 1) / 2;
      ctx.globalAlpha = 0.22; R(ctx, cp.x + 2, cp.footY, 24, 2, 'd'); ctx.globalAlpha = 1;
      drawSprite(ctx, capySprite(), cp.x, cp.footY - 24, {
        flip: cp.flip,
        sy: 1 + 0.045 * breath,
        variant: capyAnim.blinkLeft > 0 ? 'blink' : ''
      });
      if (hasHats()) drawHat(cp.x + 6, cp.footY - 18, 9);
      if (hasScarves()) {                    // шарфик Капі
        R(ctx, cp.x + 8, cp.footY - 16, 5, 5, 'r'); R(ctx, cp.x + 8, cp.footY - 14, 5, 1, 'w');
        R(ctx, cp.x + 10, cp.footY - 11, 3, 6, 'r'); R(ctx, cp.x + 10, cp.footY - 9, 3, 1, 'w'); R(ctx, cp.x + 10, cp.footY - 6, 3, 1, 'w');
      }
    }
  });
  items.sort((a, b) => a.y - b.y).forEach(it => it.draw());

  // пил від будівництва
  fx.dust.forEach(p => {
    const k = p.age / p.life;
    ctx.globalAlpha = 0.7 * (1 - k);
    disc(ctx, Math.round(p.x), Math.round(p.y), Math.round(p.r * (0.6 + k)), k < 0.5 ? 'w' : 'E');
  });
  ctx.globalAlpha = 1;

  drawRain();
  drawNightShade();
  drawNightLights();
  drawGhostHunt();

  // монетки
  fx.coins.forEach(p => {
    const fade = 1 - Math.max(0, (p.age - p.life * 0.6) / (p.life * 0.4));
    const spin = [1, 0.6, 0.25, 0.6][Math.floor(p.age * 12 + p.spin) % 4];
    drawSprite(ctx, coinSprite(), p.x - 4, p.y - 4, { sx: spin, alpha: fade });
  });
  // іскорки
  fx.sparks.forEach(p => {
    ctx.globalAlpha = 1 - p.age / p.life;
    R(ctx, Math.round(p.x), Math.round(p.y), 2, 2, p.col);
  });
  ctx.globalAlpha = 1;
  drawSnow();
  drawEpochFront();
  ctx.restore();
}

// Будівництво: спершу старий магазин у риштуванні, потім новий «виростає» знизу вгору
// Магазин-«розріз»: інтер'єр, покупці всередині, скляний фасад, розсувні двері (все зі стисканням при тапі)
function drawShopLayered(sc) {
  const w = shop.w, h = shop.h;
  const dw = Math.max(1, Math.round(w * sc.sx)), dh = Math.max(1, Math.round(h * sc.sy));
  const dx = Math.round(shop.x + (w - dw) / 2), dy = Math.round(shop.y + (h - dh));
  ctx.drawImage(shop.back, dx, dy, dw, dh);
  ctx.save();
  ctx.translate(dx, dy); ctx.scale(dw / w, dh / h); ctx.translate(-shop.x, -shop.y);     // далі малюємо у світових координатах
  ctx.beginPath(); ctx.rect(shop.x + 8, shop.y + shop.yB, w - 16, h - shop.yB); ctx.clip();
  customers.filter(c => c.inside).sort((p, q) => p.y - q.y).forEach(drawCustomer);
  ctx.restore();
  ctx.drawImage(shop.front, dx, dy, dw, dh);
  ctx.save();
  ctx.translate(dx, dy); ctx.scale(dw / w, dh / h);
  drawDoorLeaves(ctx, shop.door, shop.doorOpen || 0);
  ctx.restore();
}
function renderBuild() {
  const p = build.t / build.dur;
  const r = buildReveal(p);
  const shake = p < 0.2 ? Math.round(Math.sin(build.t * 60)) : 0;
  if (p < 0.2) {
    const o = build.old;
    drawCanvasSprite(ctx, o.canvas, o.x + shake, o.y, {});
    drawScaffold(o.x, o.y, o.w, o.h, Math.min(1, p / 0.12));
  } else {
    const shownH = Math.max(1, Math.round(shop.h * r));
    ctx.save();
    ctx.beginPath();
    ctx.rect(shop.x, shop.y + shop.h - shownH, shop.w, shownH);
    ctx.clip();
    ctx.drawImage(shop.canvas, shop.x, shop.y);
    ctx.restore();
    const scAlpha = p < 0.85 ? 1 : Math.max(0, 1 - (p - 0.85) / 0.15);
    if (scAlpha > 0) drawScaffold(shop.x, shop.y + shop.h - shownH, shop.w, shownH, scAlpha);
  }
}

/* =====================================================================
   ІГРОВИЙ ЦИКЛ
   ===================================================================== */

let lastFrame = performance.now();
let saveTimer = 0;
let uiTimer = 0;
let animClock = 0;

function frame(now) {
  const dt = Math.min(CONFIG.MAX_DT, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  animClock += dt;

  // дохід
  if (state.cps > 0) {
    const gain = state.cps * dt;
    state.coins += gain;
    state.totalEarned += gain;
  }
  // автотапи з майстерні часу: тапають по магазину самі
  const autoTaps = wsLevel('autoTap');
  if (autoTaps > 0) {
    const gain = tapValue() * autoTaps * dt;
    state.coins += gain;
    state.totalEarned += gain;
    autoTapAcc += dt * autoTaps;
    if (autoTapAcc >= 1) { autoTapAcc = 0; if (animOn()) shopAnim.vel = Math.max(shopAnim.vel, 3); }
  }
  state.playTime += dt;
  const prevPhase = state.dayPhase;
  if (dayNightOn()) state.dayPhase = (state.dayPhase + dt / CONFIG.DAY_SECONDS) % 1;
  countNights(dt, prevPhase);
  updateSkyState();

  updateAnimations(dt);
  updateBubbles();
  updateDialog(dt);
  checkStory(dt);
  updateEvents(dt);
  updateWarp(dt);
  render(animClock);

  uiTimer += dt;
  if (uiTimer >= CONFIG.UI_REFRESH_SECONDS) { uiTimer = 0; updateUI(); }

  saveTimer += dt;
  if (saveTimer >= CONFIG.AUTOSAVE_SECONDS) { saveTimer = 0; saveGame(); }

  requestAnimationFrame(frame);
}

/* =====================================================================
   ЗАПУСК
   ===================================================================== */

let hiddenAt = 0;

function init() {
  const hadSave = loadGame();
  const awaySeconds = hadSave && state.savedAt > 0 ? (Date.now() - state.savedAt) / 1000 : 0;
  if (!translations[state.lang]) state.lang = detectLanguage();
  if (!TABS.some(x => x.id === state.tab)) state.tab = 'shop';
  recalcIncome();

  // графіка
  skyLayer = buildSkyLayer();
  groundLayer = buildGroundLayer();
  rebuildShop(true);
  refreshCoinIcon();
  drawCapiPortrait();

  // інтерфейс
  buildTabs();
  buildBuyModes();
  buildDeptCards();
  buildTeamCards();
  setupProgression();
  syncActors();
  syncGuests();
  showTab(state.tab);
  applyTranslations();
  updateSaveWarning();
  setupInput();
  applyPanel();                           // згортає або розгортає меню й розставляє сцену (layoutScene)
  if (mobileMQ.matches && !state.settings.panHintSeen) { state.settings.panHintSeen = true; showToast(t('panHint'), 'good'); }

  // масштаб і шрифт
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(layoutScene).observe(ui.stage);
  window.addEventListener('resize', layoutScene);
  if (mobileMQ.addEventListener) mobileMQ.addEventListener('change', layoutScene);
  if (document.fonts) {
    document.fonts.ready.then(fitSign);
    document.fonts.addEventListener('loadingdone', fitSign);
  }

  // збереження при закритті / згортанні сторінки; повернення на вкладку = офлайн-заробіток
  window.addEventListener('beforeunload', saveGame);
  window.addEventListener('pagehide', saveGame);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      hiddenAt = Date.now();
      saveGame();
    } else {
      lastFrame = performance.now();
      if (hiddenAt) { addOfflineEarnings((Date.now() - hiddenAt) / 1000); hiddenAt = 0; }
    }
  });

  setupSound();
  initEvents();
  recalcIncome();
  addOfflineEarnings(awaySeconds);
  showOfflineModal();     // якщо з минулого разу лишилися незабрані монетки
  if (!hadSave) saveGame();
  requestAnimationFrame(t0 => { lastFrame = t0; requestAnimationFrame(frame); });
}

init();
</script>
